<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Product</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
/* The Inbox's product page (handlers/inboxpub.js itemPage / itemAct): opened from a product card in the chat
   ("Details"). Buy keeps the interest (To chase) and places a cash-on-delivery order linked to that chat. */
@font-face{font-family:"Noto Sans Bengali";src:url(fonts/NotoSansBengali-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Noto Sans Bengali";src:url(fonts/NotoSansBengali-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--bg:#f5f6fa;--card:#fff;--ink:#14172a;--mute:#5f6476;--line:#e3e5ee;--acc:#5b5bd6;--accbg:#eeeefc;--ok:#1d8a5c;--okbg:#e5f5ed;--bad:#c2332d;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#171a23;--ink:#eef0f6;--mute:#9aa0b2;--line:#2a2f3c;--acc:#8b8cf2;--accbg:#22233c;--ok:#4cc38a;--okbg:#14291f;--bad:#f2706a;--badbg:#341a19}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
body{padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.top b{font-size:17px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.pic{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:contain}
.pic .no{color:var(--mute);font-size:40px}
h1{font-size:22px;line-height:1.3;margin:14px 0 4px}
.sku{color:var(--mute);font-size:13px}
.price{font-size:26px;font-weight:800;margin:6px 0}
.av{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--okbg);color:var(--ok)}.av.no{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;font-size:15px}
.card b{display:block;margin-bottom:4px}
.card p{margin:0;color:var(--mute);white-space:pre-wrap}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.more a{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:var(--ink);text-decoration:none;font-size:14px}
.more a div{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center}.more a img{width:100%;height:100%;object-fit:contain}
.more a span{display:block;padding:8px 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more a em{display:block;padding:0 10px 10px;font-style:normal;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
button.buy{flex:1;font:inherit;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
button.buy:disabled{opacity:.5;cursor:default}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px}
.qty button{font:inherit;font-size:20px;width:44px;height:48px;border:0;background:none;color:var(--ink);cursor:pointer}.qty span{min-width:26px;text-align:center;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet form{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:10px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:4px}
textarea{min-height:76px;resize:vertical}
.areas{display:flex;gap:8px;margin:4px 0 12px}.areas label{flex:1;margin:0;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);font-size:14px;cursor:pointer}
.areas input{width:auto;margin:0 6px 0 0}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:6px 0 12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px}
.done{text-align:center;padding:10px 0}.done .big{font-size:44px}.done a{color:var(--acc);font-weight:700}
.msg{text-align:center;color:var(--mute);padding:40px 10px}
</style>
</head>
<body>
<main id="m"><p class="msg">…</p></main>
<div class="bar" id="bar" style="display:none"><div><div class="qty"><button type="button" id="qm" aria-label="-">−</button><span id="qn">1</span><button type="button" id="qp" aria-label="+">+</button></div><button class="buy" id="buy" type="button"></button></div></div>
<div class="sheet" id="sheet"><form id="f" autocomplete="on"></form></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var API = (q.get('api') || 'https://oqzcuuytytqadqjlwdsh.supabase.co/functions/v1/erp').replace(/\/+$/, '');
  var C = q.get('c') || '', SKU = q.get('sku') || '';
  var URL0 = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'inbox=item&c=' + encodeURIComponent(C);
  var L = null, D = null, qty = 1, intentSent = false;
  try { L = localStorage.getItem('itemLang'); } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tk(n) { return '৳' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
  var T = {
    bn: { lang: 'English', buy: 'কিনুন', na: 'এখন নেই', yes: 'স্টকে আছে', no: 'এখন নেই', del: 'ডেলিভারি', inside: 'ঢাকার ভেতরে', outside: 'ঢাকার বাইরে', days: 'দিন', pay: 'পেমেন্ট', ret: 'রিটার্ন ও এক্সচেঞ্জ', about: 'বিস্তারিত', more: 'আরও দেখুন',
      form: 'অর্ডার করুন', name: 'আপনার নাম', phone: 'মোবাইল নম্বর (১১ সংখ্যা)', addr: 'সম্পূর্ণ ঠিকানা', area: 'কোথায় যাবে', total: 'মোট (ক্যাশ অন ডেলিভারি)', place: 'অর্ডার নিশ্চিত করুন', cancel: 'বাতিল', thanks: 'ধন্যবাদ! অর্ডার নেওয়া হয়েছে', see: 'অর্ডারের অবস্থা দেখুন', chat: 'চ্যাটে আমাদের জানানো হয়েছে।', none: 'এই পেজটি পাওয়া যাচ্ছে না।', askChat: 'অর্ডার করতে চ্যাটে লিখুন।' },
    en: { lang: 'বাংলা', buy: 'Buy now', na: 'Not available', yes: 'In stock', no: 'Not available now', del: 'Delivery', inside: 'Inside Dhaka', outside: 'Outside Dhaka', days: 'days', pay: 'Payment', ret: 'Returns and exchange', about: 'Details', more: 'More to see',
      form: 'Place your order', name: 'Your name', phone: 'Mobile number (11 digits)', addr: 'Full address', area: 'Where to', total: 'Total (cash on delivery)', place: 'Confirm the order', cancel: 'Cancel', thanks: 'Thank you! Your order is placed', see: 'See your order', chat: 'We have the order in the chat too.', none: 'This page is not available.', askChat: 'Write to us in the chat to order.' } };
  function t() { return T[L || (D && D.lang) || 'bn']; }
  function area() { var a = document.querySelector('input[name=area]:checked'); return a ? a.value : 'inside'; }
  function total() { return qty * D.product.price + (area() === 'outside' ? D.delivery.outside : D.delivery.inside); }
  function paint() {
    var x = D.product, tt = t(), d = D.delivery;
    document.documentElement.lang = L || D.lang || 'bn';
    var h = '<div class="top"><b>' + esc(D.shop.name) + '</b><button class="lang" id="lg" type="button">' + tt.lang + '</button></div>' +
      '<div class="pic">' + (x.image ? '<img src="' + esc(x.image) + '" alt="' + esc(x.name) + '">' : '<span class="no">📦</span>') + '</div>' +
      '<h1>' + esc(x.name) + '</h1><div class="sku">' + esc([x.brand, x.sku].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="price">' + tk(x.price) + '</div><span class="av' + (x.available ? '' : ' no') + '">' + (x.available ? tt.yes : tt.no) + '</span>';
    if (x.about) h += '<div class="card"><b>' + tt.about + '</b><p>' + esc(x.about) + '</p></div>';
    h += '<div class="card"><b>' + tt.del + '</b><p>' + tt.inside + ': ' + tk(d.inside) + (d.daysIn ? ' · ' + esc(d.daysIn) + ' ' + tt.days : '') + '\n' + tt.outside + ': ' + tk(d.outside) + (d.daysOut ? ' · ' + esc(d.daysOut) + ' ' + tt.days : '') + (d.rule ? '\n' + esc(d.rule) : '') + '</p></div>';
    if (D.payment) h += '<div class="card"><b>' + tt.pay + '</b><p>' + esc(D.payment) + '</p></div>';
    if (D.returns) h += '<div class="card"><b>' + tt.ret + '</b><p>' + esc(D.returns) + '</p></div>';
    if (D.more.length) h += '<div class="card" style="background:none;border:0;padding:0"><b>' + tt.more + '</b><div class="more">' + D.more.map(function (y) {
      return '<a href="?c=' + encodeURIComponent(C) + '&sku=' + encodeURIComponent(y.sku) + (q.get('api') ? '&api=' + encodeURIComponent(q.get('api')) : '') + '"><div>' + (y.image ? '<img src="' + esc(y.image) + '" alt="" loading="lazy">' : '📦') + '</div><span>' + esc(y.name) + '</span><em>' + tk(y.price) + '</em></a>'; }).join('') + '</div></div>';
    document.getElementById('m').innerHTML = h;
    document.getElementById('lg').onclick = function () { L = (L || D.lang || 'bn') === 'bn' ? 'en' : 'bn'; try { localStorage.setItem('itemLang', L); } catch (e) {} paint(); };
    var bar = document.getElementById('bar'), b = document.getElementById('buy');
    bar.style.display = '';
    b.textContent = !D.orders ? tt.askChat : x.available && x.price > 0 ? tt.buy : tt.na;
    b.disabled = !D.orders || !(x.available && x.price > 0);
    document.getElementById('qn').textContent = qty;
  }
  function post(body) { return fetch(URL0, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function openForm() {
    var tt = t(), f = document.getElementById('f');
    if (!intentSent) { intentSent = true; post({ a: 'intent', sku: SKU }).catch(function () {}); }
    f.innerHTML = '<h2>' + tt.form + '</h2><label>' + tt.name + '<input name="name" required value="' + esc(D.you.name) + '" autocomplete="name"></label>' +
      '<label>' + tt.phone + '<input name="phone" required inputmode="tel" value="' + esc(D.you.phone) + '" autocomplete="tel"></label>' +
      '<label>' + tt.addr + '<textarea name="address" required autocomplete="street-address"></textarea></label>' +
      '<label style="margin-bottom:0">' + tt.area + '</label><div class="areas"><label><input type="radio" name="area" value="inside" checked>' + tt.inside + ' ' + tk(D.delivery.inside) + '</label><label><input type="radio" name="area" value="outside">' + tt.outside + ' ' + tk(D.delivery.outside) + '</label></div>' +
      '<div class="sum"><span>' + esc(D.product.name).slice(0, 40) + ' × ' + qty + '</span></div><div class="sum"><span>' + tt.total + '</span><span id="tot">' + tk(total()) + '</span></div>' +
      '<div class="err" id="err"></div><button class="buy" type="submit" style="width:100%">' + tt.place + '</button>' +
      '<button type="button" id="cx" style="width:100%;margin-top:8px;font:inherit;padding:12px;border:0;background:none;color:var(--mute);cursor:pointer">' + tt.cancel + '</button>';
    document.getElementById('sheet').classList.add('on');
    f.onchange = function () { document.getElementById('tot').textContent = tk(total()); };
    document.getElementById('cx').onclick = function () { document.getElementById('sheet').classList.remove('on'); };
    f.onsubmit = function (e) {
      e.preventDefault();
      var fd = new FormData(f), btn = f.querySelector('button[type=submit]'); btn.disabled = true;
      post({ a: 'buy', sku: SKU, qty: qty, name: fd.get('name'), phone: fd.get('phone'), address: fd.get('address'), area: area() }).then(function (r) {
        if (!r || !r.ok) { btn.disabled = false; document.getElementById('err').textContent = (r && r.error) || 'Error'; return; }
        f.innerHTML = '<div class="done"><div class="big">✅</div><h2>' + tt.thanks + '</h2><p><b>' + esc(r.no) + '</b> · ' + tk(r.total) + '</p><p class="sku">' + tt.chat + '</p>' + (r.page ? '<p><a href="' + esc(r.page) + '">' + tt.see + ' →</a></p>' : '') + '</div>';
        document.getElementById('buy').disabled = true;
      }).catch(function () { btn.disabled = false; document.getElementById('err').textContent = 'Network error'; });
    };
  }
  document.getElementById('buy').onclick = function () { if (D) openForm(); };
  document.getElementById('qm').onclick = function () { if (qty > 1) { qty--; document.getElementById('qn').textContent = qty; } };
  document.getElementById('qp').onclick = function () { if (qty < 50) { qty++; document.getElementById('qn').textContent = qty; } };
  document.getElementById('sheet').onclick = function (e) { if (e.target.id === 'sheet') e.target.classList.remove('on'); };
  fetch(URL0 + '&sku=' + encodeURIComponent(SKU)).then(function (r) { return r.json(); }).then(function (r) {
    if (!r || !r.ok) { document.getElementById('m').innerHTML = '<p class="msg">' + T[L || 'bn'].none + '</p>'; return; }
    D = r; document.title = r.product.name + ' — ' + r.shop.name; paint();
  }).catch(function () { document.getElementById('m').innerHTML = '<p class="msg">' + T[L || 'bn'].none + '</p>'; });
})();
</script>
</body>
</html>
