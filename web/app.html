<script>
// =====================================================================
// phase 2: record pages (an invoice, a customer), search, sales paging
// =====================================================================
var INVP = { no: '', data: null, err: null };
var CUSP = { key: '', data: null, err: null };
var SALES_PAGE = 100;

function openInvoicePage(no) { go('sales', no); }
function openCustomerPage(phone, name) {
  var d = String(phone || '').replace(/\D/g, '');
  var key = d.length >= 10 ? d.slice(-10) : (String(name || '').trim() ? 'n:' + String(name).trim().toLowerCase() : '');
  if (!key) { toast('This sale has no customer name or phone to open.', true); return; }
  go('customers', key);
}

function loadInvoicePage(quiet) {
  var no = INVP.no; if (!no) return;
  if (!quiet) { INVP.data = null; INVP.err = null; }
  srv('erpInvoice', [{ invoiceNo: no }], function (r) {
    if (INVP.no !== no) return;
    INVP.data = r; INVP.err = null; if (VIEW === 'sales') repaint();
  }, function (e) {
    if (INVP.no !== no) return;
    INVP.err = (e && e.message) ? e.message : String(e); if (VIEW === 'sales') repaint();
  });
}
function loadCustomerPage(quiet) {
  var key = CUSP.key; if (!key) return;
  if (!quiet) { CUSP.data = null; CUSP.err = null; }
  srv('erpCustomerPage', [{ key: key }], function (r) {
    if (CUSP.key !== key) return;
    CUSP.data = r; CUSP.err = null; if (VIEW === 'customers') repaint();
  }, function (e) {
    if (CUSP.key !== key) return;
    CUSP.err = (e && e.message) ? e.message : String(e); if (VIEW === 'customers') repaint();
  });
}
/** After anything is saved, the open page is read again so it never shows old figures. */
function pagesAfterWrite() {
  if (VIEW === 'sales' && INVP.no) loadInvoicePage(true);
  if (VIEW === 'customers' && CUSP.key) loadCustomerPage(true);
  if (VIEW === 'products' && PRODP.sku) loadProductPage(true);
}

function pageIsManager() { return !!(ME && (ME.role === 'manager' || ME.role === 'shareholder' || ME.role === 'owner')); }
function moneyRow(label, value, cls) { return '<dt>' + label + '</dt><dd' + (cls ? ' class="' + cls + '"' : '') + '>' + value + '</dd>'; }

function invoicePageHtml() {
  var back = '<button class="backlink" type="button" data-back="sales">&larr; All sales</button>';
  if (INVP.err) return '<section>' + back + '<div class="note err"><div class="ico">✕</div><div><strong>Could not open ' + esc(INVP.no) + '.</strong><br>' + esc(INVP.err) + '</div></div></section>';
  if (!INVP.data) return '<section>' + back + '<div class="loading">Opening ' + esc(INVP.no) + '&hellip;</div></section>';
  var d = INVP.data, cur = OPT ? OPT.currency : 'BDT', mgr = pageIsManager();
  var state = d.cancelled ? '<span class="pill out">Cancelled</span>'
    : (d.owed > 0 ? '<span class="pill out">' + esc(cur) + ' ' + fmt(d.owed) + ' due</span>' : '<span class="pill ok">✓ Paid</span>') +
      (d.allBack ? ' <span class="pill low">all returned</span>' : d.returnedQty ? ' <span class="pill low">' + fmt(d.returnedQty) + ' returned</span>' : '');
  var acts = '<button class="btn" type="button" data-spdf="' + esc(d.id) + '">Open PDF</button>';
  if (mgr && !d.cancelled) {
    if (d.owed > 0 && (d.phone || d.customer)) acts += '<button class="btn primary" type="button" data-spay="' + esc(d.phone) + '" data-spayname="' + esc(d.customer) + '">Receive payment</button>';
    if (d.courier && !d.parcel && !d.webOrder) acts += '<button class="btn" type="button" data-send="' + esc(d.id) + '">Send parcel</button>';
    if (!d.allBack) acts += '<button class="btn" type="button" data-sret="' + esc(d.id) + '">Return</button>';
    acts += '<button class="btn" type="button" data-sfix="' + esc(d.id) + '">Fix details</button>';
    if (!d.returnedQty && !(d.parcel && d.parcel.consignment)) acts += '<button class="btn danger" type="button" data-scancel="' + esc(d.id) + '" data-scust="' + esc(d.customer) + '" data-spaid="' + esc(d.paid) + '">Cancel sale</button>';
  }
  var wa = (typeof waLink === 'function' && d.phone) ? waLink(d.phone, '') : '';
  var h = '<section>' + back + '<div class="pagehead"><div><h2>' + esc(d.id) + '</h2><div class="meta">' + esc(d.when) + ' &nbsp; ' + state + '</div></div>' +
    '<div class="acts">' + acts + '</div></div>' +
    '<div class="grid g-half">' +
    '<div class="card"><h2>Customer</h2><dl class="kv" style="margin-top:10px">' +
      moneyRow('Name', (d.customer || d.phone) ? '<button class="linkbtn" type="button" data-opencust="' + esc(d.phone) + '" data-opencustname="' + esc(d.customer) + '">' + esc(d.customer || 'Walk-in') + '</button>' : 'Walk-in') +
      moneyRow('Phone', d.phone ? '<a href="tel:' + esc(d.phone) + '">' + esc(d.phone) + '</a>' + (wa ? ' &middot; <a href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') : '—') +
      moneyRow('Address', esc(d.address || '—')) +
      moneyRow('Delivery', esc(d.delivery || '—')) +
      moneyRow('Paid by', esc(d.method || '—')) +
      (d.webOrder ? moneyRow('Website order', '#' + esc(d.webOrder)) : '') +
      (d.note && d.note !== 'Invoice submission' ? moneyRow('Note', esc(d.note)) : '') +
    '</dl></div>' +
    '<div class="card"><h2>Money</h2><dl class="kv" style="margin-top:10px">' +
      moneyRow('Goods', fmt(d.subtotal)) +
      (d.discount ? moneyRow('Discount', '− ' + fmt(d.discount)) : '') +
      (d.deliveryCharge ? moneyRow('Delivery charge', fmt(d.deliveryCharge)) : '') +
      '<div class="rule"></div>' +
      moneyRow('<strong>Total</strong>', '<strong>' + esc(cur) + ' ' + fmt(d.grand) + '</strong>') +
      (d.returnedValue ? moneyRow('Goods returned', '− ' + fmt(d.returnedValue)) : '') +
      moneyRow('Received', fmt(Math.max(0, d.paid - d.returnedValue))) +
      '<div class="rule"></div>' +
      moneyRow('Still owed', d.owed > 0 ? '<span style="color:var(--critical)">' + esc(cur) + ' ' + fmt(d.owed) + '</span>' : '<span style="color:var(--good)">Nothing</span>', 'big') +
    '</dl></div></div></section>';

  h += '<section><div class="card"><h2>Products</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Discount</th><th class="num">Total</th><th class="num">Returned</th></tr></thead><tbody>' +
    d.lines.map(function (l) {
      return '<tr><td class="nm">' + esc(l.product || l.sku) + '<br><span class="sku">' + esc(l.sku) + '</span></td><td class="num">' + fmt(l.qty) + '</td><td class="num">' + fmt(l.price) + '</td>' +
        '<td class="num">' + (l.discount ? '− ' + fmt(l.discount) : '—') + '</td><td class="num"><strong>' + fmt(l.total) + '</strong></td>' +
        '<td class="num">' + (l.returned ? '<span class="pill low">' + fmt(l.returned) + ' back</span>' : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div></div></section>';

  h += '<section><div class="card"><h2>Payments</h2>';
  if (!d.payments.length) h += '<div class="empty">Nothing received yet.</div>';
  else h += '<div class="scroll" style="margin-top:8px"><table><thead><tr><th>When</th><th>What</th><th>Note</th><th>By</th><th class="num">Amount</th></tr></thead><tbody>' +
    d.payments.map(function (p) {
      return '<tr><td style="white-space:nowrap">' + esc(p.when) + '</td><td class="nm">' + esc(p.label) + '</td><td>' + esc(p.note || '—') + '</td><td>' + esc(p.by || '—') + '</td>' +
        '<td class="num"><strong' + (p.amount < 0 ? ' style="color:var(--critical)"' : '') + '>' + (p.amount < 0 ? '− ' : '') + fmt(Math.abs(p.amount)) + '</strong></td></tr>';
    }).join('') + '</tbody></table></div>';
  h += '</div></section>';

  if (d.returns.length) h += '<section><div class="card"><h2>Returns</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>When</th><th>Product</th><th class="num">Qty</th><th>Condition</th><th class="num">Value</th><th>Money</th><th>Why</th></tr></thead><tbody>' +
    d.returns.map(function (r) {
      return '<tr><td style="white-space:nowrap">' + esc(r.when) + '<br><span class="sku">' + esc(r.id) + '</span></td><td class="nm">' + esc(r.product) + '</td><td class="num">' + fmt(r.qty) + '</td>' +
        '<td>' + (r.condition === 'damaged' ? '<span class="pill out">damaged</span>' : '<span class="pill ok">back in stock</span>') + '</td><td class="num">' + fmt(r.value) + '</td><td>' + esc(r.money) + '</td><td>' + esc(r.reason) + '</td></tr>';
    }).join('') + '</tbody></table></div></div></section>';

  if (d.parcel || d.courier) h += '<section><div class="card"><h2>Parcel</h2>' + (d.parcel
    ? '<dl class="kv" style="margin-top:10px">' +
        moneyRow(d.parcel.consignment ? 'Consignment number' : 'Parcel', d.parcel.consignment ? '<strong>' + esc(d.parcel.consignment) + '</strong>' : 'set aside — no parcel') +
        moneyRow('Entered', esc(d.parcel.when) + (d.parcel.by ? ' &middot; ' + esc(d.parcel.by) : '')) +
        (d.parcel.consignment ? moneyRow('Rider collects', esc(cur) + ' ' + fmt(d.parcel.cod)) : '') +
        (d.parcel.byHand ? moneyRow('How', 'entered by hand, not through the ERP') : '') + '</dl>'
    : '<div class="empty">' + (d.webOrder ? 'The website books this parcel.' : 'Not sent yet.') + '</div>') + '</div></section>';

  if (d.changes.length) h += '<section><div class="card"><h2>Changes</h2><div class="scroll" style="margin-top:8px"><table><thead><tr><th>When</th><th>What</th><th>Was</th><th>Now</th><th>By</th></tr></thead><tbody>' +
    d.changes.map(function (c) {
      return '<tr><td style="white-space:nowrap">' + esc(c.when) + '</td><td class="nm">' + esc(c.field) + '</td><td>' + esc(c.was || '—') + '</td><td>' + esc(c.now || '—') + '</td><td>' + esc(c.by || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div></div></section>';
  return h;
}

function customerPageHtml() {
  var back = '<button class="backlink" type="button" data-back="customers">&larr; All customers</button>';
  if (CUSP.err) return '<section>' + back + '<div class="note err"><div class="ico">✕</div><div><strong>Could not open that customer.</strong><br>' + esc(CUSP.err) + '</div></div></section>';
  if (!CUSP.data) return '<section>' + back + '<div class="loading">Opening the customer&hellip;</div></section>';
  var c = CUSP.data, cur = OPT ? OPT.currency : 'BDT', mgr = pageIsManager();
  var wa = (typeof waLink === 'function' && c.phone) ? waLink(c.phone, '') : '';
  var acts = '<button class="btn primary" type="button" id="cp_inv">New invoice</button>' +
    '<button class="btn" type="button" data-stmt="1" data-sphone="' + esc(c.phone) + '" data-sname="' + esc(c.name) + '">Statement</button>' +
    (mgr ? '<button class="btn" type="button" data-cdue="1" data-cphone="' + esc(c.phone) + '" data-cname="' + esc(c.name) + '">' + (c.balance > 0 ? 'Receive payment' : 'Account') + '</button>' : '') +
    (c.onList && c.row ? '<button class="btn" type="button" data-cedit="' + esc(c.row) + '">Edit</button>' : '');
  var h = '<section>' + back + '<div class="pagehead"><div><h2>' + esc(c.name || c.phone || 'Customer') + '</h2><div class="meta">' +
      (c.phone ? '<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' + (wa ? ' &middot; <a href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') : 'no phone') +
      (c.type ? ' &middot; ' + esc(c.type) : '') + (c.status ? ' &middot; ' + esc(c.status) : '') + (c.since ? ' &middot; since ' + esc(c.since) : '') +
      (c.address ? '<br>' + esc(c.address) : '') + (c.email ? '<br>' + esc(c.email) : '') + '</div></div>' +
    '<div class="acts">' + acts + '</div></div>' +
    (typeof customerFormHtml === 'function' && CUST_FORM ? customerFormHtml() : '') +
    '<div class="grid g-kpi">' +
      kpiT('Owes you', cur, fmt(c.balance), '<span class="delta">' + (c.balance > 0 ? 'on unpaid invoices' : 'nothing outstanding') + '</span>', c.balance > 0 ? 'bad' : 'good') +
      kpiT('Held in advance', cur, fmt(c.credit), '<span class="delta">for goods not yet given</span>', c.credit > 0 ? 'accent' : '') +
      kpiT('Bought', cur, fmt(c.spent), '<span class="delta">' + fmt(c.orders) + ' order(s) · ' + fmt(c.units) + ' unit(s) · after returns</span>') +
      kpiT('Average order', cur, fmt(c.average), '<span class="delta">' + (c.lastOrder ? 'last on ' + esc(c.lastOrder) + (c.daysSince ? ' · ' + fmt(c.daysSince) + ' days ago' : ' · today') : 'has not bought yet') + '</span>') +
    '</div></section>';

  h += '<section><div class="card"><h2>Invoices</h2>';
  if (!c.invoices.length) h += '<div class="empty">No invoice yet.</div>';
  else h += '<div class="scroll tall" style="margin-top:8px"><table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Units</th><th class="num">Total</th><th class="num">Returned</th><th class="num">Due</th><th>Delivery</th></tr></thead><tbody>' +
    c.invoices.map(function (i) {
      return '<tr><td class="nm"><button class="linkbtn" type="button" data-openinv="' + esc(i.id) + '">' + esc(i.id) + '</button></td><td>' + esc(i.date) + '</td><td class="num">' + fmt(i.units) + '</td>' +
        '<td class="num">' + fmt(i.total) + '</td><td class="num">' + (i.returned ? '− ' + fmt(i.returned) : '—') + '</td>' +
        '<td class="num">' + (i.due ? '<span class="pill out">' + fmt(i.due) + '</span>' : '<span class="pill ok">paid</span>') + '</td><td>' + esc(i.delivery || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>' + (c.moreInvoices ? '<div class="sub" style="margin-top:8px">' + fmt(c.moreInvoices) + ' older invoice(s) not shown.</div>' : '');
  h += '</div></section>';

  h += '<section><div class="card"><h2>Payments</h2>';
  if (!c.payments.length) h += '<div class="empty">Nothing received yet.</div>';
  else h += '<div class="scroll tall" style="margin-top:8px"><table><thead><tr><th>Date</th><th>What</th><th>Invoice</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>' +
    c.payments.map(function (p) {
      return '<tr><td style="white-space:nowrap">' + esc(p.when) + '</td><td class="nm">' + esc(p.label) + '</td>' +
        '<td>' + (p.invoice ? '<button class="linkbtn" type="button" data-openinv="' + esc(p.invoice) + '">' + esc(p.invoice) + '</button>' : '<span class="sku">on account</span>') + '</td><td>' + esc(p.note || '—') + '</td>' +
        '<td class="num"><strong' + (p.amount < 0 ? ' style="color:var(--critical)"' : '') + '>' + (p.amount < 0 ? '− ' : '') + fmt(Math.abs(p.amount)) + '</strong></td></tr>';
    }).join('') + '</tbody></table></div>';
  return h + '</div></section>';
}

function salesPagerHtml() {
  if (!SALES || SALES.matched <= SALES_PAGE) return '';
  var off = SALES.offset || 0, to = Math.min(SALES.matched, off + SALES.shown);
  return '<div class="pager"><span>' + fmt(off + 1) + '–' + fmt(to) + ' of ' + fmt(SALES.matched) + '</span>' +
    '<button class="btn small" type="button" id="sl_prev"' + (off <= 0 ? ' disabled' : '') + '>&larr; Newer</button>' +
    '<button class="btn small" type="button" id="sl_next"' + (to >= SALES.matched ? ' disabled' : '') + '>Older &rarr;</button></div>';
}

/** Buttons that the record pages and lists share: open an invoice, open a customer, go back. */
function wirePages() {
  var v = el('view');
  function each(sel, fn) { var n = v.querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn); }
  each('[data-openinv]', function () { openInvoicePage(this.getAttribute('data-openinv')); });
  each('[data-opencust]', function () { openCustomerPage(this.getAttribute('data-opencust'), this.getAttribute('data-opencustname')); });
  each('[data-back]', function () { go(this.getAttribute('data-back')); });
  var pv = el('sl_prev'), nx = el('sl_next');
  function page(d) { SALES_F.offset = Math.max(0, (SALES_F.offset || 0) + d * SALES_PAGE); SALES = null; repaint(); loadSales(); window.scrollTo(0, 0); }
  if (pv) pv.addEventListener('click', function () { page(-1); });
  if (nx) nx.addEventListener('click', function () { page(1); });
  var ci = el('cp_inv');
  if (ci && CUSP.data) ci.addEventListener('click', function () {
    FORM.name = CUSP.data.name; FORM.phone = CUSP.data.phone; FORM.address = CUSP.data.address;
    go('invoice');
  });
}

// ---------------------------------------------------------------- search
var GS = { q: '', res: null, timer: null, seq: 0 };
function gsHtml() {
  var r = GS.res; if (!r) return '<div class="empty">Searching&hellip;</div>';
  var cur = OPT ? OPT.currency : 'BDT', h = '';
  if (r.invoices.length) h += '<div class="gs-h">Invoices</div>' + r.invoices.map(function (i) {
    return '<button type="button" data-gs="inv" data-v="' + esc(i.id) + '"><span><strong>' + esc(i.id) + '</strong> &nbsp;' + esc(i.customer || 'Walk-in') + '</span><small>' + esc(i.date) + ' · ' + fmt(i.total) + '</small></button>'; }).join('');
  if (r.customers.length) h += '<div class="gs-h">Customers</div>' + r.customers.map(function (c) {
    return '<button type="button" data-gs="cust" data-v="' + esc(c.phone) + '" data-n="' + esc(c.name) + '"><span><strong>' + esc(c.name || '—') + '</strong> &nbsp;' + esc(c.phone) + '</span><small>' + fmt(c.orders) + ' order(s)</small></button>'; }).join('');
  if (r.products.length) h += '<div class="gs-h">Products</div>' + r.products.map(function (p) {
    return '<button type="button" data-gs="prod" data-v="' + esc(p.sku) + '"><span><strong>' + esc(p.name) + '</strong> &nbsp;' + esc(p.sku) + '</span><small>' + fmt(p.stock) + ' in stock · ' + esc(cur) + ' ' + fmt(p.sell) + '</small></button>'; }).join('');
  return h || '<div class="empty">Nothing matches &ldquo;' + esc(r.q) + '&rdquo;.</div>';
}
function gsClose(clear) {
  var out = el('gs_out'); if (out) { out.hidden = true; out.innerHTML = ''; }
  var tb = document.querySelector('.topbar'); if (tb) tb.classList.remove('searching');
  if (clear) { var q = el('gs_q'); if (q) q.value = ''; GS.q = ''; GS.res = null; }
}
function gsPick(b) {
  var t = b.getAttribute('data-gs'), v = b.getAttribute('data-v');
  gsClose(true);
  if (t === 'inv') openInvoicePage(v);
  else if (t === 'cust') openCustomerPage(v, b.getAttribute('data-n'));
  else openProductPage(v);
}
(function () {
  var q = document.getElementById('gs_q'), out = document.getElementById('gs_out'), btn = document.getElementById('gs_btn');
  if (!q || !out) return;
  function run() {
    var text = q.value.trim(); GS.q = text;
    if (text.length < 2) { out.hidden = true; return; }
    var my = ++GS.seq; GS.res = null; out.hidden = false; out.innerHTML = gsHtml();
    srv('erpSearch', [{ q: text }], function (r) { if (my !== GS.seq) return; GS.res = r; out.innerHTML = gsHtml(); },
        function (e) { if (my !== GS.seq) return; out.innerHTML = '<div class="empty">' + esc(e && e.message ? e.message : e) + '</div>'; });
  }
  q.addEventListener('input', function () { clearTimeout(GS.timer); GS.timer = setTimeout(run, 250); });
  q.addEventListener('focus', function () { if (GS.res && q.value.trim().length >= 2) { out.hidden = false; out.innerHTML = gsHtml(); } });
  q.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { gsClose(true); q.blur(); }
    if (ev.key === 'Enter') { var first = out.querySelector('button[data-gs]'); if (first && !out.hidden) gsPick(first); }
  });
  out.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-gs]'); if (b) gsPick(b); });
  document.addEventListener('mousedown', function (ev) { if (!ev.target.closest('.gsearch') && !ev.target.closest('#gs_btn')) gsClose(false); });
  if (btn) btn.addEventListener('click', function () {
    var tb = document.querySelector('.topbar'); tb.classList.toggle('searching');
    if (tb.classList.contains('searching')) { try { q.focus(); } catch (e) {} } else gsClose(false);
  });
  // "/" jumps to the search box, as long as nothing is being typed elsewhere
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== '/' || ev.ctrlKey || ev.metaKey || ev.altKey || !ME) return;
    var t = ev.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    ev.preventDefault(); var tb = document.querySelector('.topbar'); tb.classList.add('searching'); try { q.focus(); } catch (e) {}
  });
})();

// New invoice: typing a SKU exactly and pressing Enter puts it on the invoice
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || !ev.target || ev.target.id !== 'isearch' || !CAT) return;
  var text = ev.target.value.trim().toLowerCase(); if (!text) return;
  var live = ((typeof INV_FROM !== 'undefined' && INV_FROM && POOLCAT[INV_FROM]) || CAT).filter(function (p) { return String(p.status).toLowerCase() !== 'discontinued'; });
  var hit = live.filter(function (p) { return String(p.sku).toLowerCase() === text; })[0];
  if (!hit) {
    var some = live.filter(function (p) { return (p.name + ' ' + p.sku + ' ' + p.brand + ' ' + p.color).toLowerCase().indexOf(text) >= 0; });
    if (some.length === 1) hit = some[0];
  }
  if (!hit) return;
  ev.preventDefault();
  if (!(hit.stock > 0)) { toast(esc(hit.name) + ' is out of stock.', true); return; }
  if (!(hit.sell > 0)) { toast(esc(hit.name) + ' has no price yet.', true); return; }
  addToCart(hit.sku);
  repaint();
  setTimeout(function () { var s = el('isearch'); if (s) { s.value = ''; s.focus(); } }, 0);
});
</script>
<style>
/* ---------- phase 3: product page, stock tabs, stock count ---------- */
.tabs { display:flex; gap:4px; flex-wrap:wrap; padding:4px; background:var(--surface); border:1px solid var(--ring); border-radius:12px; margin-bottom:16px; }
.tabs button { flex:1 1 auto; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink-2); background:none; border:none; border-radius:9px;
  padding:9px 14px; cursor:pointer; min-height:40px; white-space:nowrap; }
.tabs button[aria-selected="true"] { background:var(--series-1); color:#fff; }
.tabs .tb-c { display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:9px; background:rgba(127,127,127,.25); font-size:11px; line-height:18px; }
.mbars { display:flex; align-items:flex-end; gap:6px; height:120px; margin-top:12px; }
.mbars > div { flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.mbars .b { width:100%; max-width:38px; background:var(--series-1); border-radius:5px 5px 0 0; min-height:2px; }
.mbars .v { font-size:11px; font-weight:600; color:var(--ink-2); margin-bottom:3px; font-variant-numeric:tabular-nums; }
.mbars .l { font-size:10.5px; color:var(--muted); margin-top:5px; white-space:nowrap; }
.cnt-diff { font-weight:700; font-variant-numeric:tabular-nums; }
.cnt-diff.up { color:var(--good); } .cnt-diff.down { color:var(--critical); }
@media (max-width:640px) { .tabs button { padding:9px 8px; font-size:12.5px; flex:1 1 45%; } .mbars .l { font-size:9px; } }
</style>
<script>
// =====================================================================
// phase 3: one product's page, Stock entry in tabs, the stock count
// =====================================================================
var PRODP = { sku: '', data: null, err: null };
var STOCK_TAB = 'receive';
var COUNT = { q: '', cat: '', vals: {}, note: '', busy: false, only: false };

function openProductPage(sku) { go('products', sku); }
function loadProductPage(quiet) {
  var sku = PRODP.sku; if (!sku) return;
  if (!quiet) { PRODP.data = null; PRODP.err = null; }
  srv('erpProductPage', [{ sku: sku }], function (r) {
    if (PRODP.sku !== sku) return;
    PRODP.data = r; PRODP.err = null; if (VIEW === 'products') repaint();
  }, function (e) {
    if (PRODP.sku !== sku) return;
    PRODP.err = (e && e.message) ? e.message : String(e); if (VIEW === 'products') repaint();
  });
}
// product names anywhere open the product page (the table is redrawn on its own while searching)
document.addEventListener('click', function (ev) {
  var b = ev.target.closest && ev.target.closest('[data-openprod]');
  if (b) { ev.preventDefault(); openProductPage(b.getAttribute('data-openprod')); }
});

function productPageHtml() {
  var back = '<button class="backlink" type="button" data-back="products">&larr; All products</button>';
  if (PRODP.err) return '<section>' + back + '<div class="note err"><div class="ico">✕</div><div><strong>Could not open that product.</strong><br>' + esc(PRODP.err) + '</div></div></section>';
  if (!PRODP.data) return '<section>' + back + '<div class="loading">Opening the product&hellip;</div></section>';
  var p = PRODP.data, cur = OPT ? OPT.currency : 'BDT', mgr = pageIsManager();
  var gone = String(p.status).toLowerCase() === 'discontinued';
  var acts = '';
  if (p.stock > 0 && p.sell > 0 && !gone) acts += '<button class="btn primary" type="button" data-add="' + esc(p.sku) + '">Add to invoice</button>';
  if (mgr) {
    acts += '<button class="btn" type="button" data-edit="' + esc(p.sku) + '">Edit</button>' +
      '<button class="btn" type="button" id="pp_recv">Receive</button><button class="btn" type="button" id="pp_adj">Adjust</button>' +
      (gone ? '<button class="btn" type="button" data-active="' + esc(p.sku) + '">Reactivate</button>'
            : (p.stock <= 0 ? '<button class="btn danger" type="button" data-disc="' + esc(p.sku) + '">Discontinue</button>' : ''));
  }
  var bits = [p.sku, p.category, p.brand, p.type, p.color].filter(function (x) { return x; }).map(esc).join(' &middot; ');
  var h = '<section>' + back + '<div class="pagehead"><div><h2>' + esc(p.name) + '</h2><div class="meta">' + bits + ' &nbsp; ' +
      (gone ? '<span class="pill">Discontinued</span>' : stateBadge(p.state)) +
      (p.bin ? '<br>Kept at ' + esc(p.bin) : '') + (p.supplier ? (p.bin ? ' &middot; ' : '<br>') + 'Supplier: ' + esc(p.supplier) : '') + '</div></div>' +
    '<div class="acts">' + acts + '</div></div>' +
    ((PRODUCT_FORM && !PRODUCT_FORM.returnTo) ? productFormHtml() : '') +
    '<div class="grid g-kpi">' +
      kpiT('In stock', '', fmt(p.stock) + ' <span class="cur">' + esc(p.unit) + '</span>', '<span class="delta">worth ' + esc(cur) + ' ' + fmt(p.stockValueRetail) + ' at the selling price' + (p.canSeeMoney && p.cost ? ' · ' + fmt(p.stockValueCost) + ' at cost' : '') + '</span>', p.stock <= 0 ? 'bad' : '') +
      kpiT('Sells', '', fmt(p.perMonth) + ' <span class="cur">a month</span>', '<span class="delta">' + fmt(p.sold90) + ' in 90 days · ' + fmt(p.sold) + ' ever' + (p.lastSoldDays === null ? '' : ' · last sold ' + (p.lastSoldDays ? fmt(p.lastSoldDays) + ' days ago' : 'today')) + '</span>') +
      kpiT('Lasts', '', p.cover === null ? '—' : fmt(p.cover) + ' <span class="cur">days</span>', '<span class="delta">reorder at ' + fmt(p.reorder) + (p.suggested && p.suggested !== p.reorder ? ' · sales say ' + fmt(p.suggested) : '') + ' · ' + fmt(p.lead) + ' days to arrive</span>', (p.cover !== null && p.cover <= 14) ? 'warn' : '') +
      kpiT('Price', cur, fmt(p.sell), '<span class="delta">' + (p.wholesale ? 'wholesale ' + fmt(p.wholesale) : 'no wholesale price') +
        (p.canSeeMoney ? ' · cost ' + (p.cost ? fmt(p.cost) : 'not set') + (p.margin !== null && p.margin !== undefined ? ' · ' + p.margin + '% margin' : '') : '') + '</span>', (p.canSeeMoney && p.margin !== null && p.margin < 0) ? 'bad' : '') +
    '</div></section>';

  var max = 1; p.months.forEach(function (m) { if (m.units > max) max = m.units; });
  h += '<section><div class="grid g-half"><div class="card"><h2>Sold, month by month</h2><div class="sub">Units, last 12 months.</div><div class="mbars">' +
    p.months.map(function (m) {
      return '<div title="' + esc(m.label + ': ' + fmt(m.units) + ' unit(s), ' + cur + ' ' + fmt(m.value)) + '"><span class="v">' + (m.units ? fmt(m.units) : '') + '</span>' +
        '<span class="b" style="height:' + Math.max(0, Math.round(Math.max(0, m.units) / max * 84)) + '%;' + (m.units ? '' : 'opacity:.25;') + '"></span><span class="l">' + esc(m.label.split(' ')[0]) + '</span></div>';
    }).join('') + '</div></div>' +
    '<div class="card"><h2>On the way</h2>' + (p.onOrder && p.onOrder.length
      ? '<div class="list" style="margin-top:8px">' + p.onOrder.map(function (o) {
          return '<div><span>' + esc(o.po) + '<span class="sku">' + esc(o.supplier || 'no supplier named') + ' · ordered ' + esc(o.ordered) + (o.by ? ' · by ' + esc(o.by) : '') + '</span></span><b>' + fmt(o.left) + '</b></div>'; }).join('') + '</div>'
      : '<div class="empty">Nothing on order.</div>') +
      '<h2 style="margin-top:16px">Price' + (p.canSeeMoney ? ' and cost' : '') + ' changes</h2>' + (p.changes.length
      ? '<div class="list" style="margin-top:8px">' + p.changes.slice(0, 12).map(function (c) {
          return '<div><span>' + esc(c.field) + '<span class="sku">' + esc(c.when) + (c.by ? ' · ' + esc(c.by) : '') + '</span></span><b>' + esc(c.was) + ' &rarr; ' + esc(c.now) + '</b></div>'; }).join('') + '</div>'
      : '<div class="empty">No change recorded yet.</div>') +
    '</div></div></section>';

  h += '<section><div class="card"><h2>Stock movements</h2><div class="sub">Everything that came in or went out, newest first. ' + fmt(p.totalIn) + ' in, ' + fmt(p.totalOut) + ' out.</div>';
  if (!p.ledger.length) h += '<div class="empty">Nothing has moved yet.</div>';
  else h += '<div class="scroll tall"><table><thead><tr><th>When</th><th>What</th><th class="num">Qty</th><th class="num">Left after</th><th class="num">Price</th><th>Reference</th><th>By</th></tr></thead><tbody>' +
    p.ledger.map(function (m) {
      return '<tr><td style="white-space:nowrap">' + esc(m.when) + '</td><td class="nm">' + esc(m.what) + (m.note ? '<br><span class="sku">' + esc(m.note) + '</span>' : '') + '</td>' +
        '<td class="num"><strong style="color:var(' + (m.dir === 'IN' ? '--good' : '--critical') + ')">' + (m.dir === 'IN' ? '+' : '−') + fmt(m.qty) + '</strong></td>' +
        '<td class="num">' + fmt(m.after) + '</td><td class="num">' + (m.price === null ? '—' : fmt(m.price)) + '</td>' +
        '<td>' + (m.invoice ? '<button class="linkbtn" type="button" data-openinv="' + esc(m.invoice) + '">' + esc(m.invoice) + '</button>' : esc(m.ref || '—')) + (m.supplier ? '<br><span class="sku">' + esc(m.supplier) + '</span>' : '') + '</td>' +
        '<td>' + esc(m.by || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>' + (p.moreLedger ? '<div class="sub" style="margin-top:8px">' + fmt(p.moreLedger) + ' older movement(s) not shown.</div>' : '');
  h += '</div></section>';

  h += '<section><div class="card"><h2>Latest sales</h2>';
  if (!p.sales.length) h += '<div class="empty">Not sold yet.</div>';
  else h += '<div class="scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead><tbody>' +
    p.sales.map(function (x) {
      return '<tr><td class="nm"><button class="linkbtn" type="button" data-openinv="' + esc(x.invoice) + '">' + esc(x.invoice) + '</button></td><td>' + esc(x.date) + '</td><td>' + esc(x.customer || 'Walk-in') + '</td>' +
        '<td class="num">' + fmt(x.qty) + '</td><td class="num">' + fmt(x.price) + '</td><td class="num"><strong>' + fmt(x.total) + '</strong></td></tr>';
    }).join('') + '</tbody></table></div>';
  return h + '</div></section>';
}

function wireProductPage() {
  if (VIEW !== 'products' || !PRODP.sku || !PRODP.data) return;
  var r = el('pp_recv'), a = el('pp_adj'), p = PRODP.data;
  if (r) r.addEventListener('click', function () {
    var c = (CAT || []).filter(function (x) { return x.sku === p.sku; })[0];
    if (c && !RECV.lines.some(function (l) { return l.sku === p.sku; })) RECV.lines.push({ sku: p.sku, name: p.name, qty: 1, stock: c.stock });
    STOCK_TAB = 'receive'; go('stock');
  });
  if (a) a.addEventListener('click', function () { ADJ.sku = p.sku; STOCK_TAB = 'count'; go('stock'); });
}

// ------------------------------------------------------------ stock tabs
function stockTabsHtml() {
  var toSend = PO && PO.orders ? PO.orders.length : 0, need = PLAN && PLAN.count ? PLAN.count : 0;
  var tabs = [['receive', 'Receive'], ['count', 'Count &amp; adjust'], ['orders', 'Supplier orders' + (toSend ? '<span class="tb-c">' + fmt(toSend) + '</span>' : '')],
              ['plan', 'To order' + (need ? '<span class="tb-c">' + fmt(need) + '</span>' : '')]];
  return '<div class="tabs" role="tablist">' + tabs.map(function (t) {
    return '<button type="button" role="tab" data-stab="' + t[0] + '" aria-selected="' + (STOCK_TAB === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
}

// ------------------------------------------------------------ stock count
function countRows() {
  var q = COUNT.q.trim().toLowerCase();
  return (CAT || []).filter(function (p) {
    if (String(p.status).toLowerCase() === 'discontinued' && !(p.stock > 0)) return false;
    if (COUNT.cat && p.cat !== COUNT.cat) return false;
    if (COUNT.only && COUNT.vals[p.sku] === undefined) return false;
    if (q && (p.name + ' ' + p.sku + ' ' + p.brand + ' ' + p.color).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function countTyped() {
  var n = 0, diff = 0;
  Object.keys(COUNT.vals).forEach(function (sku) {
    var v = COUNT.vals[sku]; if (v === '' || v === undefined) return;
    n++; var p = (CAT || []).filter(function (x) { return x.sku === sku; })[0];
    if (p && Number(v) !== Number(p.stock)) diff++;
  });
  return { n: n, diff: diff };
}
function stockCountHtml() {
  var cats = {}; (CAT || []).forEach(function (p) { if (p.cat) cats[p.cat] = 1; });
  var rows = countRows(), t = countTyped();
  var h = '<section><div class="card"><h2>Stock count</h2><div class="sub">Count what is really on the shelf and type the number. Where it differs from the books, saving corrects the books and writes down why. Leave a box empty for anything you did not count.</div>' +
    '<div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px">' +
    '<div style="flex:2 1 200px"><label class="f" for="ct_q">Find</label><input class="i" id="ct_q" type="search" placeholder="Name, SKU, brand or colour" value="' + esc(COUNT.q) + '"></div>' +
    '<div style="flex:1 1 150px"><label class="f" for="ct_cat">Category</label><select class="i" id="ct_cat"><option value="">All categories</option>' +
      Object.keys(cats).sort().map(function (c) { return '<option' + (COUNT.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
    '<label class="chk" style="padding-bottom:9px"><input type="checkbox" id="ct_only"' + (COUNT.only ? ' checked' : '') + '> Only what I have typed</label></div>';
  if (!rows.length) h += '<div class="empty">No product matches.</div>';
  else h += '<div class="scroll tall"><table><thead><tr><th>Product</th><th class="num">Books say</th><th class="num">Counted</th><th class="num">Difference</th></tr></thead><tbody id="ct_body">' +
    rows.slice(0, 400).map(function (p) {
      var v = COUNT.vals[p.sku], has = v !== undefined && v !== '', d = has ? Number(v) - Number(p.stock) : 0;
      return '<tr><td class="nm">' + esc(p.name) + '<br><span class="sku">' + esc(p.sku) + (p.color ? ' · ' + esc(p.color) : '') + '</span></td><td class="num">' + fmt(p.stock) + '</td>' +
        '<td class="num"><input class="i qty" type="number" min="0" step="1" inputmode="numeric" data-ct="' + esc(p.sku) + '" value="' + (has ? esc(v) : '') + '" placeholder="—"></td>' +
        '<td class="num"><span class="cnt-diff ' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '" data-ctd="' + esc(p.sku) + '">' + (has ? (d === 0 ? '✓' : (d > 0 ? '+' : '−') + fmt(Math.abs(d))) : '') + '</span></td></tr>';
    }).join('') + '</tbody></table></div>' + (rows.length > 400 ? '<div class="sub" style="margin-top:8px">Showing 400 — narrow the search to see the rest.</div>' : '');
  h += '<div class="row" style="margin-top:12px;gap:8px;align-items:flex-end;flex-wrap:wrap">' +
    '<div style="flex:1 1 220px"><label class="f" for="ct_note">Note <span class="sku">(optional)</span></label><input class="i" id="ct_note" maxlength="200" placeholder="e.g. month-end count, shelf B" value="' + esc(COUNT.note) + '"></div>' +
    '<span class="sub" id="ct_sum" style="padding-bottom:10px">' + fmt(t.n) + ' counted · ' + fmt(t.diff) + ' differ</span>' +
    '<button class="btn" type="button" id="ct_clear"' + (t.n ? '' : ' disabled') + '>Clear</button>' +
    '<button class="btn primary" type="button" id="ct_save"' + (t.n && !COUNT.busy ? '' : ' disabled') + '>' + (COUNT.busy ? 'Saving…' : 'Save the count') + '</button></div>';
  return h + '</div></section>';
}

function wireStockExtra() {
  if (VIEW !== 'stock') return;
  var v = el('view'), tabs = v.querySelectorAll('button[data-stab]');
  for (var i = 0; i < tabs.length; i++) tabs[i].addEventListener('click', function () { STOCK_TAB = this.getAttribute('data-stab'); repaint(); });
  var place = el('po_place'); if (place) place.addEventListener('click', function () { STOCK_TAB = 'orders'; setTimeout(repaint, 0); });

  var q = el('ct_q'), cat = el('ct_cat'), only = el('ct_only'), note = el('ct_note');
  if (q) q.addEventListener('input', function () { COUNT.q = q.value; var pos = q.selectionStart; repaint(); var n = el('ct_q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } });
  if (cat) cat.addEventListener('change', function () { COUNT.cat = cat.value; repaint(); });
  if (only) only.addEventListener('change', function () { COUNT.only = only.checked; repaint(); });
  if (note) note.addEventListener('input', function () { COUNT.note = note.value; });
  var boxes = v.querySelectorAll('input[data-ct]');
  for (var b = 0; b < boxes.length; b++) boxes[b].addEventListener('input', function () {
    var sku = this.getAttribute('data-ct'), raw = this.value.trim();
    if (raw === '') delete COUNT.vals[sku]; else COUNT.vals[sku] = raw;
    var p = (CAT || []).filter(function (x) { return x.sku === sku; })[0], cell = v.querySelector('[data-ctd="' + sku.replace(/"/g, '\\"') + '"]');
    if (cell && p) {
      var d = Number(raw) - Number(p.stock);
      cell.textContent = raw === '' ? '' : (d === 0 ? '✓' : (d > 0 ? '+' : '−') + fmt(Math.abs(d)));
      cell.className = 'cnt-diff ' + (raw === '' ? '' : d > 0 ? 'up' : d < 0 ? 'down' : '');
    }
    var t = countTyped(), sum = el('ct_sum'), sv = el('ct_save'), cl = el('ct_clear');
    if (sum) sum.textContent = fmt(t.n) + ' counted · ' + fmt(t.diff) + ' differ';
    if (sv) sv.disabled = !t.n || COUNT.busy; if (cl) cl.disabled = !t.n;
  });
  var clr = el('ct_clear');
  if (clr) clr.addEventListener('click', async function () {
    if (!(await uiConfirm('Clear everything you have typed in this count?\n\nNothing has been saved yet.'))) return;
    COUNT.vals = {}; repaint();
  });
  var save = el('ct_save');
  if (save) save.addEventListener('click', async function () {
    var lines = [], bad = '';
    Object.keys(COUNT.vals).forEach(function (sku) {
      var n = Number(COUNT.vals[sku]);
      if (!isFinite(n) || n < 0 || Math.round(n) !== n) bad = sku;
      lines.push({ sku: sku, counted: n });
    });
    if (bad) { toast('The count for ' + esc(bad) + ' must be a whole number, 0 or more.', true); return; }
    var t = countTyped();
    if (!(await uiConfirm('Save this stock count?\n\n' + t.n + ' product(s) counted. ' + (t.diff ? t.diff + ' differ from the books and will be corrected to what you counted.' : 'All of them agree with the books, so nothing changes.')))) return;
    COUNT.busy = true; repaint();
    srv('erpStockCount', [{ lines: lines, note: COUNT.note }], function (r) {
      COUNT = { q: '', cat: '', vals: {}, note: '', busy: false, only: false };
      toast('<strong>Count saved.</strong> ' + fmt(r.checked) + ' checked · ' + fmt(r.same) + ' agreed · ' + fmt(r.changed) + ' corrected' +
        (r.opening ? ' · ' + fmt(r.opening) + ' entered as opening stock' : '') + (r.up ? ' · +' + fmt(r.up) + ' in' : '') + (r.down ? ' · −' + fmt(r.down) + ' missing' : ''), false, 12000);
      CAT = null; D = null; PLAN = null; repaint(); loadAll();
    }, function (e) { COUNT.busy = false; toast(esc(e && e.message ? e.message : e), true, 14000); repaint(); });
  });
}
</script>
<style>
/* ---------- phase 4: money screens ---------- */
.catchips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 8px; }

</style>
<script>
// =====================================================================
// phase 4: dashboard links, the month behind the P&L, receipts and own
// expense categories, and the Partnership tab
// =====================================================================
function downloadText(name, text, mime) {
  var b = new Blob(['﻿' + text], { type: mime || 'text/csv' }), u = URL.createObjectURL(b);
  var a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
}
function p4Each(sel, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn); }
function p4Err(e) { return esc(e && e.message ? e.message : e); }

// ------------------------------------------------------------ dashboard
/** A dashboard card opens the list behind it, already filtered. */
function dashFilter(f) {
  if (f === 'out') lvPreset('products', ['active', 'out']);
  if (f === 'plan') STOCK_TAB = 'plan';
  if (f === 'due' || f === 'tosend') lvPreset('invoices', [f]);
}
function topBars(rows) {
  if (!rows || !rows.length) return '<div class="empty">Nothing sold yet this month.</div>';
  var max = Math.max.apply(null, rows.map(function (r) { return r.units; })) || 1, link = navOn('products');
  return '<div class="rank">' + rows.map(function (r) {
    var w = Math.max(1.5, (r.units / max) * 100);
    return '<div title="' + esc(r.name + ' · ' + fmt(r.units) + ' units') + '"><span class="nm">' +
      (link && r.sku ? '<button class="linkbtn" type="button" style="color:inherit;font-weight:inherit" data-openprod="' + esc(r.sku) + '">' + esc(r.name) + '</button>' : esc(r.name)) + '</span>' +
      '<span class="tr"><i style="width:' + w.toFixed(1) + '%"></i></span><b>' + fmt(r.units) + '</b></div>';
  }).join('') + '</div>';
}

// ------------------------------------------------------------ profit and loss
var PNL_N = 6, PNL_TO = '';
var PNLM = { month: '', data: null, err: null };
function pnlBarHtml() {
  var to = PNL ? PNL.to : '', last = PNL ? PNL.thisMonth : '';
  return '<div class="row" style="align-items:center;gap:8px;margin:10px 0 12px;flex-wrap:wrap">' +
    '<button class="btn small" type="button" id="pnl_prev"' + (PNL ? '' : ' disabled') + '>&larr; Earlier</button>' +
    '<button class="btn small" type="button" id="pnl_next"' + (PNL && to < last ? '' : ' disabled') + '>Later &rarr;</button>' +
    '<button class="chip' + (PNL_N === 6 ? ' on' : '') + '" type="button" data-pnln="6">6 months</button>' +
    '<button class="chip' + (PNL_N === 12 ? ' on' : '') + '" type="button" data-pnln="12">12 months</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn small" type="button" id="pnl_csv"' + (PNL ? '' : ' disabled') + '>Download (Excel / CSV)</button></div>';
}
function pnlCsv() {
  var M = PNL.months, q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Profit & loss'].concat(M.map(function (m) { return m.month + (m.current ? ' (so far)' : ''); }))];
  function add(label, fn) { rows.push([label].concat(M.map(fn))); }
  add('Sales, after discounts', function (m) { return m.sales; });
  add('Returns', function (m) { return -m.returns; });
  add('Net sales', function (m) { return m.netSales; });
  add('Cost of goods sold', function (m) { return -m.cost; });
  add('Gross profit', function (m) { return m.gross; });
  add('Gross margin %', function (m) { return m.grossMargin; });
  add('Delivery charged to customers', function (m) { return m.delivery; });
  add('Courier collected more than invoiced', function (m) { return m.courierExtra; });
  add('Courier collected less (written off)', function (m) { return -m.courierShort; });
  add('Courier: delivery + COD fee', function (m) { return -m.courier; });
  PNL.categories.forEach(function (c) { add(c, function (m) { return -(m.byCat[c] || 0); }); });
  add('Total operating expenses', function (m) { return -m.expenses; });
  add('Net profit', function (m) { return m.net; });
  add('Net margin %', function (m) { return m.netMargin; });
  downloadText('Profit and loss ' + M[0].month + ' to ' + M[M.length - 1].month + '.csv', rows.map(function (r) { return r.map(q).join(','); }).join('\r\n'));
}
function loadPnlMonth() {
  var m = PNLM.month; if (!m) return;
  srv('erpPnlMonth', [{ month: m }], function (r) { if (PNLM.month !== m) return; PNLM.data = r; PNLM.err = null; if (VIEW === 'profit') repaint(); },
      function (e) { if (PNLM.month !== m) return; PNLM.err = e && e.message ? e.message : String(e); if (VIEW === 'profit') repaint(); });
}
function pnlMonthHtml() {
  if (!PNLM.month) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section id="pnlm"><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">' + esc(capMonth(PNLM.month)) + ' — invoice by invoice</h2>' +
    '<button class="btn small" type="button" id="pnlm_close">Close</button></div>';
  if (PNLM.err) return h + '<div class="note err" style="margin-top:10px"><div class="ico">✕</div><div>' + esc(PNLM.err) + '</div></div></div></section>';
  if (!PNLM.data) return h + '<div class="loading">Reading the month&hellip;</div></div></section>';
  var d = PNLM.data, t = d.totals;
  h += '<div class="sub">What stands behind the figures above. Sold ' + esc(cur) + ' ' + fmt(t.sales) + ' · returns ' + fmt(t.returns) + ' · goods cost ' + fmt(t.cost) +
    ' · gross profit <strong>' + fmt(t.profit) + '</strong> · delivery charged ' + fmt(t.delivery) + '.</div>';
  if (!d.invoices.length) h += '<div class="empty">Nothing was sold in this month.</div>';
  else h += '<div class="scroll tall"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="num">Net sale</th><th class="num">Goods cost</th><th class="num">Profit</th></tr></thead><tbody>' +
    d.invoices.map(function (x) {
      return '<tr><td class="nm">' + (x.isReturn ? esc(x.id) : '<button class="linkbtn" type="button" data-openinv="' + esc(x.id) + '">' + esc(x.id) + '</button>') + '</td>' +
        '<td>' + esc(x.date) + '</td><td>' + esc(x.customer || 'Walk-in') + '</td><td class="num">' + fmt(x.net) + '</td>' +
        '<td class="num">' + fmt(x.cost) + (x.uncosted ? ' <span class="pill low">no cost</span>' : '') + '</td>' +
        '<td class="num"><strong' + (x.profit < 0 ? ' style="color:var(--critical)"' : '') + '>' + fmt(x.profit) + '</strong></td></tr>';
    }).join('') + '</tbody></table></div>' + (d.more ? '<div class="sub" style="margin-top:8px">' + fmt(d.more) + ' more not shown.</div>' : '');
  h += '<div class="row" style="margin-top:12px;gap:8px;align-items:center;flex-wrap:wrap"><span class="sub" style="margin:0">Expenses ' + esc(cur) + ' ' + fmt(d.expenseTotal) +
    (d.expenses.length ? ': ' + d.expenses.map(function (c) { return esc(c.name) + ' ' + fmt(c.amount); }).join(' · ') : '') + '</span>' +
    (navOn('expenses') ? '<button class="btn small" type="button" id="pnlm_exp">Open expenses for this month</button>' : '') + '</div>';
  return h + '</div></section>';
}

// ------------------------------------------------------------ expenses: receipts and own categories
var EXP_RC = '';        // the entry a receipt is being chosen for
var EXP_CAT_OPEN = false;
function expReceiptBtns(r, gone) {
  return (r.receipt ? '<button class="btn small" type="button" data-exrcv="' + esc(r.id) + '">Receipt</button> ' : '') +
    (gone ? '' : '<button class="btn small" type="button" data-exrca="' + esc(r.id) + '">' + (r.receipt ? 'Replace' : 'Attach receipt') + '</button> ');
}
function expCatsHtml() {
  if (!ME || ME.role !== 'owner' || !EXP) return '';
  var names = { fixed: 'Fixed', recurring: 'Recurring', oneoff: 'One-off' }, c = EXP.categories || {};
  var h = '<section><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Categories</h2>' +
    '<button class="btn small" type="button" id="exc_toggle">' + (EXP_CAT_OPEN ? 'Done' : 'Change the lists') + '</button></div>' +
    '<div class="sub">The categories offered in each section. Taking one off a list does not change what is already written.</div>';
  if (!EXP_CAT_OPEN) return h + '</div></section>';
  Object.keys(names).forEach(function (k) {
    h += '<div style="margin-top:10px"><strong>' + names[k] + '</strong><div class="catchips">' + (c[k] || []).map(function (v) {
      return '<span>' + esc(v) + '<button type="button" title="Take off the list" data-excdel="' + esc(k) + '" data-v="' + esc(v) + '">&times;</button></span>'; }).join('') + '</div>' +
      '<div class="row" style="gap:6px"><input class="i" style="flex:1 1 180px;max-width:280px" maxlength="40" placeholder="New category" data-excnew="' + esc(k) + '">' +
      '<button class="btn small" type="button" data-excadd="' + esc(k) + '">Add</button></div></div>';
  });
  return h + '</div></section>';
}
/** A phone photo is far bigger than a receipt needs: shrink it before it is sent. */
function shrinkImage(file, done, bad) {
  var img = new Image(), u = URL.createObjectURL(file);
  img.onload = function () {
    var max = 1600, w = img.naturalWidth, hh = img.naturalHeight, k = Math.min(1, max / Math.max(w, hh));
    var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    done(c.toDataURL('image/jpeg', 0.82).split(',')[1], 'image/jpeg');
  };
  img.onerror = function () { URL.revokeObjectURL(u); bad('That photo could not be read.'); };
  img.src = u;
}
function expSendReceipt(file) {
  var id = EXP_RC; EXP_RC = '';
  if (!id || !file) return;
  function send(data, mime) {
    toast('Saving the receipt…');
    srv('erpExpenseReceipt', [{ id: id, file: { data: data, mime: mime } }], function (e) {
      EXP = e; EXP_MONTH = e.month; toast('Receipt kept with the entry.'); if (VIEW === 'expenses') repaint();
    }, function (x) { toast(p4Err(x), true, 12000); });
  }
  if (/^image\//.test(file.type)) return shrinkImage(file, send, function (m) { toast(esc(m), true); });
  if (file.type !== 'application/pdf') { toast('A receipt is a photo or a PDF.', true); return; }
  if (file.size > 3 * 1024 * 1024) { toast('That file is over 3 MB.', true); return; }
  var rd = new FileReader();
  rd.onload = function () { send(String(rd.result).split(',')[1], 'application/pdf'); };
  rd.onerror = function () { toast('That file could not be read.', true); };
  rd.readAsDataURL(file);
}

// ------------------------------------------------------------ partnership
var CAP_TAB = 'capital';
var PART = null, PART_ERR = null, PART_BUSY = false, PART_MONTH = '';
var PART_EN = { kind: 'capital_in', partner: '', to: '', amount: '', date: '', category: '', note: '' };
var PART_NEW = { name: '', displayName: '', tier: 'retail', code: '', joinName: '', joinTier: 'retail' };
var PART_DEAL = { partner: '', side: 'theirs', description: '', qty: '1', amount: '', date: '', note: '' };
var PART_STOCK = null;   // { partner, name, products } - the other side's shelf
/** Inside a joint pool there is one capital system: the pool's book under Partnership. */
function capInPool() { return !!((CAPD && CAPD.isPool) || (PART && PART.isPool)); }
function capTabsHtml() {
  if (capInPool()) return '';
  return '<div class="tabs" role="tablist"><button type="button" role="tab" data-captab="capital" aria-selected="' + (CAP_TAB === 'capital') + '">Capital</button>' +
    '<button type="button" role="tab" data-captab="partner" aria-selected="' + (CAP_TAB === 'partner') + '">Partnership</button></div>';
}
function loadPartner() {
  srv('erpPartnership', [{ month: PART_MONTH }], function (r) { PART = r; PART_ERR = null; PART_BUSY = false; if (r.isPool) PART_MONTH = r.month; if (VIEW === 'capital') repaint(); },
      function (e) { PART_ERR = e && e.message ? e.message : String(e); PART_BUSY = false; if (VIEW === 'capital') repaint(); });
}
function partSave(fn, args, msg, after) {
  if (PART_BUSY) return;
  PART_BUSY = true; repaint();
  srv(fn, args, function (r) {
    PART_BUSY = false;
    if (r && r.isPool !== undefined) { PART = r; if (r.isPool) PART_MONTH = r.month; }
    if (msg) toast(msg, false, 8000);
    if (after) after(r);
    if (VIEW === 'capital') repaint();
  }, function (e) { PART_BUSY = false; toast(p4Err(e), true, 14000); repaint(); });
}
function tierSel(id, val) {
  return '<select class="i" id="' + id + '"><option value="retail"' + (val === 'retail' ? ' selected' : '') + '>Retail price</option><option value="wholesale"' + (val === 'wholesale' ? ' selected' : '') + '>Wholesale price</option></select>';
}
function partnerHtml() {
  if (PART_ERR) return '<section><div class="note err"><div class="ico">✕</div><div><strong>Could not read the partnership.</strong><br>' + esc(PART_ERR) + '</div></div></section>';
  if (!PART) return '<div class="loading">Reading the partnership&hellip;</div>';
  return PART.isPool ? poolHtml() : partnerOwnHtml();
}

/** In your own business: its pools, its partners, deals between the two companies. */
function partnerOwnHtml() {
  var p = PART, ed = p.canEdit, cur = p.currency, h = '';
  h += '<section><div class="card"><h2>Joint pools</h2><div class="sub">A joint pool is stock that you and a partner company own together. It is a business of its own in the menu at the top: ' +
    'switch to it to receive its stock, sell from it and see the settlement. Each side sells at its own price; profit is shared by how much capital each has put in.</div>';
  if (!p.pools.length) h += '<div class="empty">' + esc(p.name) + ' is not in a joint pool yet.</div>';
  else h += '<div class="list">' + p.pools.map(function (x) {
    return '<div><span>' + esc(x.name) + '<span class="sku">' + esc((x.partners || []).join(' + ')) + ' · you sell at the ' + esc(x.tier) + ' price</span></span>' +
      '<button class="btn small primary" type="button" data-poolopen="' + esc(x.id) + '">Open the pool</button></div>'; }).join('') + '</div>';
  if (ed) {
    h += '<div class="grid g-half" style="margin-top:14px"><div><strong>Start a joint pool</strong>' +
      '<div class="fields" style="margin-top:8px"><div style="grid-column:span 2"><label class="f" for="pn_name">Name of the pool</label><input class="i" id="pn_name" maxlength="80" placeholder="e.g. ProtoReen joint stock" value="' + esc(PART_NEW.name) + '"></div>' +

      '<div><label class="f" for="pn_tier">You sell from it at</label>' + tierSel('pn_tier', PART_NEW.tier) + '</div></div>' +
      '<button class="btn primary" type="button" id="pn_create" style="margin-top:10px"' + (PART_BUSY ? ' disabled' : '') + '>Create the pool</button>' +
      '<div class="sub" style="margin-top:6px">You get a code to send to your partner. They sign in to their own business here and join with it.</div></div>' +
      '<div><strong>Join a partner’s pool</strong>' +
      '<div class="fields" style="margin-top:8px"><div style="grid-column:span 2"><label class="f" for="pj_code">Invite code</label><input class="i" id="pj_code" maxlength="12" autocapitalize="characters" placeholder="10 letters and digits" value="' + esc(PART_NEW.code) + '"></div>' +
      '<div><label class="f" for="pj_disp">Your name in it</label><input class="i" id="pj_disp" maxlength="60" placeholder="' + esc(p.name) + '" value="' + esc(PART_NEW.joinName) + '"></div>' +
      '<div><label class="f" for="pj_tier">You sell from it at</label>' + tierSel('pj_tier', PART_NEW.joinTier) + '</div></div>' +
      '<button class="btn" type="button" id="pj_join" style="margin-top:10px"' + (PART_BUSY ? ' disabled' : '') + '>Join</button></div></div>';
  }

  if (p.partners.length) {
    h += '<section><div class="card"><h2>Partners’ stock</h2><div class="sub">What the other company has on its own shelf — names and counts only. Never cost, price or profit.</div><div class="list">' +
      p.partners.map(function (x) {
        return '<div><span>' + esc(x.name) + '<span class="sku">' + esc(x.pool) + (x.sharesStock ? '' : ' · does not show its stock') + '</span></span>' +
          (x.sharesStock ? '<button class="btn small" type="button" data-pstock="' + esc(x.id) + '" data-n="' + esc(x.name) + '">See their stock</button>' : '') + '</div>'; }).join('') + '</div>' +
      (ed ? '<label class="chk" style="margin-top:10px"><input type="checkbox" id="pp_share"' + (p.sharesStock ? ' checked' : '') + '> Partners can see my stock counts</label>' : '');
    if (PART_STOCK) {
      h += '<div style="margin-top:12px"><strong>' + esc(PART_STOCK.name) + '</strong> — ' + fmt(PART_STOCK.products.length) + ' product(s)</div>' +
        (PART_STOCK.products.length ? '<div class="scroll tall" style="margin-top:6px"><table><thead><tr><th>Product</th><th>Category</th><th>Brand</th><th class="num">In stock</th></tr></thead><tbody>' +
          PART_STOCK.products.map(function (s) {
            return '<tr><td class="nm">' + esc(s.name) + '<br><span class="sku">' + esc(s.sku) + (s.color ? ' · ' + esc(s.color) : '') + '</span></td><td>' + esc(s.category || '—') + '</td><td>' + esc(s.brand || '—') + '</td>' +
              '<td class="num"><strong>' + fmt(s.stock) + '</strong> ' + esc(s.unit || '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Nothing on their shelf.</div>');
    }
    h += '</div></section>';

    h += '<section><div class="card"><h2>Sales from each other’s own stock</h2><div class="sub">When one of you sells something from the other’s own shelf (not the pool), write it here at the price you agreed for that deal. ' +
      'The other side confirms it; the one who is owed marks it paid. The owner of the goods takes them out of stock in their own business.</div>';
    if (ed) {
      h += '<div class="row" style="align-items:flex-end;gap:8px;flex-wrap:wrap">' +
        '<div style="flex:1 1 150px"><label class="f" for="pd_partner">Partner</label><select class="i" id="pd_partner">' + p.partners.map(function (x) {
          return '<option value="' + esc(x.id) + '"' + (PART_DEAL.partner === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
        '<div style="flex:1 1 190px"><label class="f" for="pd_side">Who sold whose</label><select class="i" id="pd_side"><option value="theirs"' + (PART_DEAL.side === 'theirs' ? ' selected' : '') + '>I sold their stock — I owe them</option>' +
          '<option value="mine"' + (PART_DEAL.side === 'mine' ? ' selected' : '') + '>They sold my stock — they owe me</option></select></div>' +
        '<div style="flex:2 1 200px"><label class="f" for="pd_what">What</label><input class="i" id="pd_what" maxlength="200" placeholder="e.g. 2 rolls Sunlu PLA+ black" value="' + esc(PART_DEAL.description) + '"></div>' +
        '<div style="flex:1 1 170px"><label class="f" for="pd_sku">Product code <span class="sku">(optional)</span></label><input class="i" id="pd_sku" list="l_pdsku" maxlength="60" placeholder="SKU \u2014 then the stock moves by itself" value="' + esc(PART_DEAL.sku || '') + '">' +

        var acts = '';

          if (d.mineToConfirm) acts += '<button class="btn small primary" type="button" data-pdeal="confirm" data-id="' + esc(d.id) + '">Confirm</button> ';
          if (d.confirmed && d.owedToMe) acts += '<button class="btn small primary" type="button" data-pdeal="paid" data-id="' + esc(d.id) + '">Mark paid</button> ';
          acts += '<button class="btn small" type="button" data-pdeal="cancel" data-id="' + esc(d.id) + '">Cancel</button>';
        }
        return '<tr><td style="white-space:nowrap">' + esc(d.when) + '</td><td class="nm">' + esc(d.what) + '<br><span class="sku">qty ' + fmt(d.qty) + (d.note ? ' · ' + esc(d.note) : '') + '</span></td>' +
          '<td>' + esc(d.other) + '<br><span class="sku">' + (d.owedToMe ? 'they owe you' : 'you owe them') + '</span></td>' +
          '<td class="num"><strong style="color:var(' + (d.owedToMe ? '--good' : '--critical') + ')">' + (d.owedToMe ? '+' : '−') + fmt(d.amount) + '</strong></td><td>' + state + '</td>' +
          '<td class="num" style="white-space:nowrap">' + acts + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '</div></section>';
