var custQ = '';
var custLapse = '';   // '' | '30' | '60' | '90' | '180' | '365' | 'never'
var custSort = 'spent';
var custContact = '';   // '' | 'phone' | 'walkin'
var custOrders = '';    // '' | 'once' | 'repeat'

/** A Bangladeshi mobile is 01 followed by 9 digits. */
function hasMobile(p) {
  var d = String(p || '').replace(/\D/g, '');
  if (d.length === 13 && d.indexOf('880') === 0) d = d.slice(3);
  else if (d.length === 12 && d.indexOf('88') === 0) d = d.slice(2);
  if (d.length === 11 && d.indexOf('01') === 0) return true;
  return (d.length === 10 && d.charAt(0) === '1');
}

/**
 * What actually makes money.
 *
 * Revenue is the number everyone watches and the one that tells you least.
 * This screen is the other half: what was left after what the goods cost,
 * per product and per brand - and then the shelf read the other way round,
 * as cash that is not moving.
 */
/**
 * What the courier did with each parcel.
 *
 * Read only, deliberately. Nothing here clears an invoice: the point of this
 * first step is to watch the matching be right for a few days before a
 * single taka moves on the strength of it.
 */
function courierPanel() {
  var cur = OPT ? OPT.currency : 'BDT';
  if (COURIER_ERR) {
    return '<div class="note err" style="margin-bottom:12px"><div class="ico">✕</div><div>' +
      '<strong>Could not read the courier.</strong><br>' + esc(COURIER_ERR) + '</div></div>';
  }
  if (!COURIER) {
    return '<div class="card" style="margin-bottom:12px"><div class="loading">' +
      'Asking the courier about recent parcels&hellip;</div></div>';
  }

  var h = '<div class="card" style="margin-bottom:14px">' +
    '<h2>Courier</h2><div class="sub">Website orders of the last ' + fmt(COURIER.days) +
    ' days, as Steadfast reports them. Nothing here is marked paid yet.</div>' +
    '<div class="grid g-kpi" style="margin:12px 0">' +
    kpi('Collected for you', cur, fmt(COURIER.collected),
        '<span class="delta">delivered - Steadfast is holding this</span>') +
    kpi('Still moving', cur, fmt(COURIER.waiting),
        '<span class="delta">booked, not yet delivered</span>') +
    kpi('Came back', cur, fmt(COURIER.lost),
        '<span class="delta">returned or cancelled</span>') +
    '</div>';

  h += '<div class="sub" style="margin-bottom:12px">Where each parcel is. An invoice is marked paid when Steadfast pays it out \u2014 that is checked parcel by parcel under <strong>Sales \u2192 Steadfast money</strong>.</div>';

  if (!COURIER.orders.length) {
    return h + '<div class="empty">No website orders in this period.</div></div>';
  }

  h += '<div class="scroll"><table><thead><tr><th>Order</th><th>When</th><th>Customer</th>' +
    '<th class="num">To collect</th><th>Courier says</th><th>In this ERP</th>' +
    '</tr></thead><tbody>';
  COURIER.orders.forEach(function (o) {
    var cls = o.tone === 'ok' ? 'ok' : (o.tone === 'bad' ? 'out' : 'low');
    h += '<tr><td class="nm">' + esc(o.orderNo) +
      (o.consignment ? '<br><span class="sku">' + esc(o.consignment) + '</span>' : '') +
      '</td><td>' + esc(o.when) + '</td>' +
      '<td>' + esc(o.customer || '—') + '<br><span class="sku">' + esc(o.method) + '</span></td>' +
      '<td class="num">' + (o.isCod ? fmt(o.cod) : '<span class="sku">paid online</span>') + '</td>' +
      '<td><span class="pill ' + cls + '">' + esc(o.courierLabel) + '</span></td>' +
      '<td>' + (o.invoiceNo
        ? '<span class="sku">' + esc(o.invoiceNo) + '</span>'
        : courierLinkCell(o)) + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    '<div class="sub" style="margin-top:8px">Delivered means the rider collected the ' +
    'money, not that it has reached your account — Steadfast settles later. ' +
    'As of ' + esc(COURIER.generatedAt) + '.</div></div>';
  return h;
}

/**
 * An order with no invoice tied to it. Either nobody entered it, or somebody
 * typed the invoice by hand and ticked the order off - then the invoice is
 * here but the courier's money cannot find it. Offer the likely invoice(s)
 * and let a person say which one it is.
 */
function courierLinkCell(o) {
  var sg = o.suggest || [];
  if (!o.handled && !sg.length) return '<span class="pill low">not entered</span>';
  var h = '<span class="pill low">' + (o.handled ? 'by hand — not linked' : 'not entered') + '</span>' +
    '<div class="row" style="gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap">';
  if (sg.length) {
    h += '<select class="i" data-link-pick="' + esc(o.orderNo) + '" style="max-width:260px">' +
      sg.map(function (s) {
        return '<option value="' + esc(s.id) + '">' + esc(s.id) + ' · ' + esc(s.when) + ' · ' + esc(s.customer) + ' · ' + fmt(s.total) + '</option>';
      }).join('') + '<option value="">another invoice…</option></select>';
  } else {
    h += '<input class="i" data-link-pick="' + esc(o.orderNo) + '" placeholder="Invoice no." style="max-width:190px">';
  }
  return h + '<button class="btn small" type="button" data-link="' + esc(o.orderNo) + '">Link</button></div>';
}

function wireCourierLinks() {
  var bs = el('view').querySelectorAll('button[data-link]');
  for (var i = 0; i < bs.length; i++) bs[i].addEventListener('click', async function () {
    var btn = this, no = btn.getAttribute('data-link');
    var pick = el('view').querySelector('[data-link-pick="' + no + '"]');
    var inv = pick ? String(pick.value || '').trim() : '';
    if (!inv) inv = String((await uiPrompt('Invoice number for website order ' + no + ':', '')) || '').trim();
    if (!inv) return;
    var o = null;
    for (var k = 0; k < COURIER.orders.length; k++) if (COURIER.orders[k].orderNo === no) o = COURIER.orders[k];
    var s = null;
    for (var j = 0; o && j < (o.suggest || []).length; j++) if (o.suggest[j].id === inv) s = o.suggest[j];
    var gap = (o && s && o.isCod && Math.abs(o.cod - s.total) > 0.5)
      ? '\n\nNote: the courier collected ' + fmt(o.cod) + ' but the invoice total is ' + fmt(s.total) +
        '. Only the invoice total can be marked paid; the rest (usually delivery charge) stays outside the invoice.' : '';
    if (!(await uiConfirm('Tie website order ' + no + ' to invoice ' + inv + '?\n\nNothing on the invoice changes except a note saying it is this website order.' + gap))) return;
    btn.disabled = true; btn.textContent = 'Linking…';
    srv('erpLinkWebOrder', [{ orderNo: no, invoiceNo: inv }], function () {
      toast('Order ' + esc(no) + ' is now tied to ' + esc(inv) + '.', false, 8000);
      COURIER = null; ORDERS = null; loadCourier();
    }, function (e) {
      btn.disabled = false; btn.textContent = 'Link';
      toast(esc(e && e.message ? e.message : e), true, 15000);
    });
  });
}

function wireCourier() {
  wireCourierLinks();
}

function loadCourier() {
  srv('erpCourier', [{ days: 30 }], function (c) {
    COURIER = c; COURIER_ERR = null;
    if (VIEW === 'weborders') repaint();
  }, function (e) {
    COURIER_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'weborders') repaint();
  });
}

/**
 * What this parcel will collect, shown before it is sent.
 *
 * The figure is the invoice's, not the screen's: whatever has already been
 * received - a bank transfer, an advance - is taken off, so a customer who
 * paid into the bank gets a parcel that collects nothing. Nobody types the
 * amount, and nobody has to remember the rule.
 *
 * It is shown rather than assumed because the one real danger is a bank
 * payment that arrived but was never recorded here. Then this panel says
 * "collect 1,621" for a customer who has already paid, and the person
 * reading it can stop.
 */
/**
 * Is this address enough for a rider to find the door?
 *
 * Deliberately crude, and deliberately only a warning. It looks for the two
 * things that actually send a parcel back: nothing to go on at all, and no
 * place-name anywhere in the line. Returns the reason, or '' when it sees
 * nothing to worry about.
 */
var ADDR_PLACES = /mirpur|dhanmondi|uttara|banani|gulshan|mohammad|badda|bashundhara|buet|kuet|ruet|cuet|hall|road|house|flat|floor|goli|lane|bazar|para|nagar|tower|block|sector|savar|tongi|narayanganj|gazipur|chittagong|chattogram|sylhet|khulna|rajshahi|bogra|comilla|cumilla|jessore|barisal|rangpur|dinajpur|tangail|mymensingh|moghbazar|hatirjheel|jigatola|shantinagar|farmgate|mohakhali|motijheel|newmarket|azimpur|lalbagh|keraniganj|ashulia|nikunja|baridhara|wari|khilgaon|rampura|malibagh|shyamoli|kalabagan|agargaon|kazipara|shewrapara|sewrapara|pallabi|kafrul|cantonment|campus|university|college|market|plaza|complex/i;

/** The warning line under the address box - empty when there is nothing to say. */
function addrHintHtml(addr) {
  var w = String(addr || '').trim() ? addressWeak(addr) : '';
  return w ? '<span class="pill low">' + esc(w) + '</span>' : '';
}

function addressWeak(addr) {
  var a = String(addr || '').trim();
  if (!a) return 'There is no address on this invoice.';
  if (a.length < 12) {
    return 'Only "' + a + '" — a rider is unlikely to find that. Add the road, house or area.';
  }
  if (!ADDR_PLACES.test(a) && !/\d/.test(a)) {
    return 'No road, house or area name in this address — check the rider can find it.';
  }
  return '';
}

/** Is this order going out with the courier this ERP posts to? */
function isCourier(delivery) {
  return /steadfast/i.test(String(delivery || ''));
}

/** How many orders are waiting to be sent - shown on the tab itself. */
function sendCount() {
  var n = 0;
  if (SALES && typeof SALES.waiting === 'number') n = SALES.waiting;
  else (ORDERS || []).forEach(function (o) { if (o.postable) n++; });
  var c = el('cSend');
  if (c) c.textContent = n ? String(n) : '';
  return n;
}

function parcelBox() {
  if (!PARCEL) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var p = PARCEL;

  var h = '<div style="position:fixed;inset:0;z-index:9000;display:flex;align-items:center;' +
    'justify-content:center;background:rgba(0,0,0,.55)"><div class="card" ' +
    'style="max-width:520px;width:94%">' +
    '<h2>Send parcel &middot; ' + esc(p.invoiceNo) + '</h2>';

  if (p.loading) {
    return h + '<div class="loading">Reading the invoice&hellip;</div></div></div>';
  }
  if (p.error) {
    h += '<div class="note err" style="margin-bottom:12px"><div class="ico">✕</div><div>' +
      esc(p.error) + '</div></div>' +
      '<button class="btn" type="button" id="pc_close">Close</button></div></div>';
    return h;
  }

  // Where the box goes. Filled from the invoice, but changeable: a customer
  // can ask for one delivery to an office without that becoming their
  // address. Steadfast uses what we send, not what it has on file.
  h += '<div class="row" style="margin-bottom:6px">' +
    '<div style="flex:1 1 200px"><label class="f" for="pc_name">Deliver to</label>' +
    '<input class="i" id="pc_name" value="' + esc(p.customer || '') + '"></div>' +
    '<div style="flex:1 1 140px"><label class="f" for="pc_phone">Phone</label>' +
    '<input class="i" id="pc_phone" value="' + esc(p.phone || '') + '"></div></div>' +
    '<div><label class="f" for="pc_addr">Address</label>' +
    '<input class="i" id="pc_addr" value="' + esc(p.address || '') + '" ' +
    'placeholder="house, road, area, district"></div>' +
    '<div class="sub" style="margin:6px 0 10px">Change these for a one-off delivery — ' +
    'the parcel goes where this says, and the customer&rsquo;s saved address is left alone.</div>';

  h += '<div class="grid g-kpi" style="margin-bottom:12px">' +
    kpi('The rider collects', cur, fmt(p.collect),
        '<span class="delta">' + (p.collect > 0 ? 'cash on delivery' : 'nothing — already paid') +
        '</span>') +
    kpi('Invoice', cur, fmt(p.total),
        '<span class="delta">' + fmt(p.received) + ' already received</span>') +
    '</div>';

  if (!p.hasKeys) {
    h += '<div class="note warn"><div class="ico">!</div><div>This business has no courier ' +
      'keys yet. Settings → Courier.</div></div>';
  }
  if (p.alreadyBooked) {
    h += '<div class="note warn"><div class="ico">!</div><div>A parcel already exists for ' +
      'this invoice (consignment ' + esc(p.alreadyBooked) + ').</div></div>';
  }
  var weak = addressWeak((el('pc_addr') && el('pc_addr').value) || p.address);
  if (weak) {
    h += '<div class="note warn"><div class="ico">!</div><div>' + esc(weak) + '</div></div>';
  }
  if (p.missing && p.missing.length) {
    h += '<div class="note err"><div class="ico">✕</div><div>The courier needs a ' +
      esc(p.missing.join(', a ')) + '. Add it to the invoice first.</div></div>';
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button class="btn primary" type="button" id="pc_go"' +
      ((p.hasKeys && !p.alreadyBooked) ? '' : ' disabled') + '>Send to Steadfast</button> ' +
    '<button class="btn" type="button" id="pc_close">Cancel</button></div>' +
    '</div></div>';
  return h;
}

function openParcel(invoiceNo) {
  PARCEL = { invoiceNo: invoiceNo, loading: true };
  repaint();
  srv('erpParcelPreview', [{ invoiceNo: invoiceNo }], function (p) {
    PARCEL = p; PARCEL.invoiceNo = invoiceNo; repaint();
  }, function (e) {
    PARCEL = { invoiceNo: invoiceNo, error: (e && e.message) ? e.message : String(e) };
    repaint();
  });
}

function wireParcel() {
  var chips = el('view').querySelectorAll('button[data-ifilter]');
  for (var c = 0; c < chips.length; c++) {
    chips[c].addEventListener('click', function () {
      INV_FILTER = this.getAttribute('data-ifilter'); repaint();
    });
  }
  var hs = el('view').querySelectorAll('button[data-handled]');
  for (var h2 = 0; h2 < hs.length; h2++) {
    hs[h2].addEventListener('click', async function () {
      var id = this.getAttribute('data-handled');
      // The number is optional on purpose. With it, the parcel is tracked and
      // a delivered cash-on-delivery clears the invoice. Without it, the order
      // is only taken off the list.
      var cid = (await uiPrompt(
        'Set ' + id + ' aside.\n\n' +
        'If it was booked by hand with Steadfast, type the consignment number so ' +
        'it is still tracked. Otherwise leave this empty.', ''));
      if (cid === null) return;                       // cancelled
      var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
      srv('erpParcelHandled', [{ invoiceNo: id, consignment: cid }], function (res) {
        toast(res.tracked
          ? id + ' is tracked under consignment ' + esc(res.consignment) + '.'
          : id + ' set aside. Nothing was sent to the courier.', false, 9000);
        parcelsChanged();
      }, function (e) {
        btn.disabled = false; btn.textContent = 'Already handled';
        toast(esc(e && e.message ? e.message : e), true, 12000);
      });
    });
  }

  var pbs = el('view').querySelectorAll('button[data-putback]');
  for (var p2 = 0; p2 < pbs.length; p2++) {
    pbs[p2].addEventListener('click', function () {
      var id = this.getAttribute('data-putback');
      var btn = this; btn.disabled = true; btn.textContent = 'Putting back…';
      srv('erpParcelPutBack', [{ invoiceNo: id }], function () {
        toast(id + ' is back on the to-send list.', false, 8000);
        parcelsChanged();
      }, function (e) {
        btn.disabled = false; btn.textContent = 'Put back';
        toast(esc(e && e.message ? e.message : e), true, 12000);
      });
    });
  }

  var opens = el('view').querySelectorAll('button[data-send]');
  for (var i = 0; i < opens.length; i++) {
    opens[i].addEventListener('click', function () {
      openParcel(this.getAttribute('data-send'));
    });
  }
  var close = el('pc_close');
  if (close) close.addEventListener('click', function () { PARCEL = null; repaint(); });

  var go = el('pc_go');
  if (go) go.addEventListener('click', function () {
    go.disabled = true; go.textContent = 'Sending…';
    // the amount goes back with the request: if it changed while this was
    // open, the server refuses rather than sending the wrong figure
    srv('erpBookParcel', [{ invoiceNo: PARCEL.invoiceNo, expect: PARCEL.collect,
                            name: (el('pc_name') || {}).value || '',
                            phone: (el('pc_phone') || {}).value || '',
                            address: (el('pc_addr') || {}).value || '' }],
      function (res) {
        PARCEL = null; repaint();
        COURIER = null;
        parcelDone(res);
        parcelsChanged();
      },
      function (e) {
        go.disabled = false; go.textContent = 'Send to Steadfast';
        toast(esc(e && e.message ? e.message : e), true, 15000);
      });
  });
}

/**
 * What it costs to keep the doors open.
 *
 * Three sections, because three kinds of expense behave differently: fixed
 * ones write themselves in every month, recurring ones wait for this
 * month's figure, and one-off ones are typed as they happen. Each section
 * offers only its own categories. The date and time are taken by the
 * system. Nothing can be deleted - a wrong entry is struck out and stays
 * readable - because these figures are meant to be looked at years from now.
 */
function expCatOptions(list) {
  return (list || []).map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
}

function viewExpenses() {
  var cur = OPT ? OPT.currency : 'BDT';
  if (EXP_ERR) {
    return '<section><div class="note err"><div class="ico">✕</div><div>' +
      '<strong>Could not read the expenses.</strong><br>' + esc(EXP_ERR) + '</div></div></section>';
  }
  if (!EXP) return '<div class="loading">Reading the expenses&hellip;</div>';
  var e = EXP, cats = e.categories || {};

  var h = (e.poolBook ? '<section><div class="note"><div class="ico">i</div><div><strong>This is a joint pool.</strong> Its costs are written in one place: the pool\u2019s book, where each line says which partner paid. ' +
      'This month the book holds ' + esc(cur) + ' ' + fmt(e.poolExpenses || 0) + ' of expenses \u2014 already inside the figures below. ' +
      '<button class="btn small" type="button" id="ex_topool">Open the pool\u2019s book</button></div></div></section>' : '') +
    '<section><div class="row" style="align-items:center;gap:8px;margin-bottom:12px">' +
    '<button class="btn small" type="button" id="ex_prev">&larr; Earlier</button>' +
    '<strong style="min-width:150px;text-align:center">' + esc(e.label) + '</strong>' +
    '<button class="btn small" type="button" id="ex_next"' + (e.isCurrent ? ' disabled' : '') +
      '>Later &rarr;</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn" type="button" id="ex_xls">Download as Excel</button></div>';

  if (e.missing) {
    h += '<div class="note warn" style="margin-bottom:12px"><div class="ico">!</div><div>' +
      '<strong>' + e.missing + ' recurring ' + (e.missing === 1 ? 'bill' : 'bills') +
      ' not entered for ' + esc(e.label) + '.</strong> ' +
      'The totals below leave ' + (e.missing === 1 ? 'it' : 'them') + ' out until you type the amount.' +
      '</div></div>';
  }

  h += '<div class="grid g-kpi" style="margin-bottom:14px">' +
    kpi('Fixed', cur, fmt(e.fixed), '<span class="delta">the same every month</span>') +
    kpi('Recurring', cur, fmt(e.recurring), '<span class="delta">every month, amount changes</span>') +
    kpi('One-off', cur, fmt(e.oneoffTotal), '<span class="delta">only this month</span>') +
    kpi('Total expenses', cur, fmt(e.total),
        '<span class="delta">1st to last day of ' + esc(e.label) + '</span>') +
    kpi('Net profit', cur, fmt(e.net),
        '<span class="delta">' + (e.net >= 0 ? '' : '<span class="down">a loss · </span>') +
        'gross ' + fmt(e.gross) + (e.other ? (e.other > 0 ? ' + ' : ' − ') + fmt(Math.abs(e.other)) + ' delivery and courier' : '') + ' less expenses paid' + (e.fixedUnpaid > 0 ? ' · ' + fmt(e.fixedUnpaid) + ' still to pay' : '') + '</span>') +
    '</div></section>';

  // ---- 1. fixed ----
  h += '<section><div class="card"><h2>1 · Fixed expenses</h2>' +
    '<div class="sub">Same item, same amount. Set once; it waits here every month. ' +
    'When you have actually paid one, press <strong>Paid</strong> — only then does it count as an expense and go in the book, with that day’s date. ' +
    'Use Change amount when it really rises; the months already gone keep the old figure.</div>';
  if (!e.fixedItems.length) {
    h += '<div class="empty">No fixed expenses yet — add the rent and the salaries below.</div>';
  } else {
    h += '<div class="scroll"><table><thead><tr><th>#</th><th>Expense</th><th>Category</th>' +
      '<th class="num">Each month</th><th>Since</th><th>Paid</th><th></th></tr></thead><tbody>';
    e.fixedItems.forEach(function (f) {
      h += '<tr><td>' + f.no + '</td><td class="nm">' + esc(f.name) + '</td><td>' + esc(f.category) + '</td>' +
        '<td class="num"><strong>' + fmt(f.amount) + '</strong></td>' +
        '<td><span class="sku">' + esc(f.since || '—') + '</span></td>' +
        '<td style="white-space:nowrap">' + (e.isFuture ? '<span class="sku">not due yet</span>'
          : f.paid ? '<span class="pill ok">✓ Paid</span> <span class="sku">' + esc(f.paidWhen) + '</span>' : '<span class="pill low">Not paid</span>') + '</td>' +
        '<td class="num" style="white-space:nowrap">' +
        (e.isFuture ? '' : f.paid
          ? '<button class="btn small" type="button" data-fxunpay="' + esc(f.id) + '" data-itname="' + esc(f.name) + '">Undo paid</button> '
          : '<button class="btn small primary" type="button" data-fxpay="' + esc(f.id) + '" data-itname="' + esc(f.name) + '" data-fxamt="' + esc(f.amount) + '">Paid</button> ') +
        '<button class="btn small" type="button" data-fxchange="' + esc(f.id) + '" ' +
          'data-itname="' + esc(f.name) + '" data-fxamt="' + esc(f.amount) + '">Change amount</button> ' +
        '<button class="btn small" type="button" data-itend="' + esc(f.id) + '" ' +
          'data-itname="' + esc(f.name) + '">Stop</button></td></tr>';
    });
    h += '</tbody></table></div>';
    if (!e.isFuture) h += '<div class="sub" style="margin:8px 0 0">' + esc(cur) + ' ' + fmt(e.fixedPaid || 0) + ' paid · <strong>' + esc(cur) + ' ' + fmt(e.fixedUnpaid || 0) +
      ' still to pay</strong>' + (e.fixedUnpaid > 0 ? ' — not counted in the profit until you press Paid. With it, ' + esc(e.label) + ' would stand at ' + esc(cur) + ' ' + fmt(e.netAfterUnpaid) + '.' : '') + '</div>';
  }
  h += '<div class="row" style="margin-top:12px;align-items:flex-end">' +
    '<div style="flex:2 1 180px"><label class="f" for="fx_name">New fixed expense</label>' +
    '<input class="i" id="fx_name" placeholder="Shop rent, a salary…"></div>' +
    '<div style="flex:1 1 150px"><label class="f" for="fx_cat">Category</label>' +
    '<select class="i" id="fx_cat">' + expCatOptions(cats.fixed) + '</select></div>' +
    '<div style="flex:1 1 120px"><label class="f" for="fx_amt">Each month</label>' +
    '<input class="i" id="fx_amt" inputmode="decimal" placeholder="0"></div>' +
    '<div style="flex:0 0 auto"><button class="btn primary" type="button" id="fx_add">Add</button></div>' +
    '</div></div></section>';

  // ---- 2. recurring ----
  h += '<section><div class="card"><h2>2 · Recurring expenses</h2>' +
    '<div class="sub">Same item every month, different amount — the electricity bill. ' +

    h += '<div class="empty">No recurring bills yet — add electricity, ads and the like below.</div>';
  } else {
    h += '<div class="scroll"><table><thead><tr><th>#</th><th>Expense</th><th>Category</th>' +
      '<th class="num">' + esc(e.label) + '</th><th></th><th></th></tr></thead><tbody>';
    e.recurringItems.forEach(function (r) {
      var has = r.amount !== null && r.amount !== undefined;
      h += '<tr><td>' + r.no + '</td><td class="nm">' + esc(r.name) + '</td><td>' + esc(r.category) + '</td>' +
        '<td class="num">' + (e.isFuture ? '' :
          '<input class="i" style="width:120px;text-align:right" inputmode="decimal" ' +
          'data-rcamt="' + esc(r.id) + '" placeholder="0" value="' + (has ? esc(r.amount) : '') + '">') + '</td>' +
        '<td>' + (has ? '<span class="pill ok">entered</span> <span class="sku">' + esc(r.when) + '</span>'
                      : '<span class="pill low">not entered</span>') + '</td>' +
        '<td class="num" style="white-space:nowrap">' + (e.isFuture ? '' :
        '<button class="btn small primary" type="button" data-rcsave="' + esc(r.id) + '" ' +
          'data-itname="' + esc(r.name) + '">' + (has ? 'Correct' : 'Save') + '</button> ') +
        '<button class="btn small" type="button" data-itend="' + esc(r.id) + '" ' +
          'data-itname="' + esc(r.name) + '">Stop</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="row" style="margin-top:12px;align-items:flex-end">' +
    '<div style="flex:2 1 180px"><label class="f" for="rc_name">New recurring expense</label>' +
    '<input class="i" id="rc_name" placeholder="Electricity bill, Facebook ads…"></div>' +
    '<div style="flex:1 1 150px"><label class="f" for="rc_cat">Category</label>' +
    '<select class="i" id="rc_cat">' + expCatOptions(cats.recurring) + '</select></div>' +
    (e.isFuture ? '' :
    '<div style="flex:1 1 120px"><label class="f" for="rc_amt">' + esc(e.label) + ' amount</label>' +
    '<input class="i" id="rc_amt" inputmode="decimal" placeholder="0"></div>') +
    '<div style="flex:0 0 auto"><button class="btn primary" type="button" id="rc_add">Add</button></div>' +
    '</div></div></section>';

  // ---- 3. one-off ----
  h += '<section><div class="card"><h2>3 · One-off expenses</h2>' +
    '<div class="sub">Anything that was not planned. The date and time are recorded by themselves.</div>' +
    (e.isFuture ? '' :
    '<div class="row" style="margin:12px 0 0;align-items:flex-end">' +
    '<div style="flex:2 1 200px"><label class="f" for="ex_what">What for</label>' +
    '<input class="i" id="ex_what" placeholder="Printer repair, packing tape…"></div>' +
    '<div style="flex:1 1 150px"><label class="f" for="ex_cat">Category</label>' +
    '<select class="i" id="ex_cat">' + expCatOptions(cats.oneoff) + '</select></div>' +
    '<div style="flex:1 1 120px"><label class="f" for="ex_amt">Amount</label>' +
    '<input class="i" id="ex_amt" inputmode="decimal" placeholder="0"></div>' +
    ((e.accounts || []).length ? '<div style="flex:1 1 150px"><label class="f" for="ex_acc">Paid from</label><select class="i" id="ex_acc">' + e.accounts.map(function (a) {

    '<div style="flex:0 0 auto"><button class="btn primary" type="button" id="ex_add">Add</button></div>' +
    '</div>') + '</div></section>';

  // ---- everything recorded ----
  h += '<section><div class="card"><h2>Everything recorded in ' + esc(e.label) + '</h2>' +
    '<div class="sub">Newest first. Every entry stays here with the time it was recorded. A fixed expense appears here on the day it is marked paid.</div>';
  if (!e.all.length) {
    h += '<div class="empty">Nothing paid or recorded for ' + esc(e.label) + ' yet.</div>';
  } else {
    h += '<div class="scroll tall"><table><thead><tr><th>Recorded</th><th>What for</th>' +
      '<th>Category</th><th>Kind</th><th class="num">Amount</th><th></th></tr></thead><tbody>';
    e.all.forEach(function (r) {
      var gone = !!r.voided;
      var st = gone ? ' style="opacity:.5;text-decoration:line-through"' : '';
      var kind = r.kind === 'fixed' ? '<span class="pill ok">fixed</span>'
               : r.kind === 'recurring' ? '<span class="pill">recurring</span>' : 'one-off';
      h += '<tr><td' + st + ' style="white-space:nowrap">' + esc(r.when) + '</td>' +

        '</td><td' + st + '>' + esc(r.category) + '</td>' +
        '<td' + st + '>' + kind + '</td>' +
        '<td class="num"' + st + '><strong>' + fmt(r.amount) + '</strong></td>' +
        '<td class="num" style="white-space:nowrap">' + expReceiptBtns(r, gone) + (gone || r.kind === 'fixed' ? ''
          : '<button class="btn small" type="button" data-exvoid="' + esc(r.id) +
            '">Strike out</button>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  if (e.byCategory.length) {
    h += '<div class="sub" style="margin-top:12px">By category: ' +
      e.byCategory.map(function (c) { return esc(c.name) + ' ' + fmt(c.amount); }).join(' · ') +
      '</div>';
  }
  h += '<input type="file" id="ex_file" accept="image/*,application/pdf" hidden></div></section>';
  return h + expCatsHtml();
}

/** yyyy-MM, moved by a number of months. */
function shiftMonth(m, by) {
  var y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) + by;
  while (mo < 1) { mo += 12; y--; }
  while (mo > 12) { mo -= 12; y++; }
  return y + '-' + (mo < 10 ? '0' + mo : '' + mo);
}

function wireCapital() {
  function each(sel, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn); }
  function bad(x) { CAP_BUSY = false; toast(esc(x && x.message ? x.message : x), true, 14000); repaint(); }
  function done(msg) { return function (r) { CAPD = r; CAP_BUSY = false; if (msg) toast(msg, false, 7000); repaint(); }; }
  function keep() {
    var g = function (id) { var x = el(id); return x ? x.value : null; }, v;
    if ((v = g('cs_name')) !== null) { CAP_SH.name = v; CAP_SH.phone = g('cs_phone'); CAP_SH.pct = g('cs_pct'); CAP_SH.private = el('cs_priv').checked; if (el('cs_amt')) CAP_SH.invested = g('cs_amt'); }
    if ((v = g('ci_name')) !== null) { CAP_IN.name = v; CAP_IN.phone = g('ci_phone'); CAP_IN.returnKind = g('ci_kind'); if (el('ci_val')) CAP_IN.returnValue = g('ci_val'); CAP_IN.private = el('ci_priv').checked; if (el('ci_amt')) CAP_IN.invested = g('ci_amt'); }
    if ((v = g('ce_amt')) !== null) { CAP_EN.amount = v; CAP_EN.date = g('ce_date'); CAP_EN.method = g('ce_meth'); CAP_EN.note = g('ce_note'); CAP_EN.type = g('ce_type') || CAP_EN.type; }
  }
  var k = el('ci_kind'); if (k) k.addEventListener('change', function () { keep(); repaint(); });
  var w = el('ce_who');
  if (w) w.addEventListener('change', function () {
    keep(); CAP_EN.holder = w.value;
    var hh = CAPD.holders.filter(function (x) { return x.id === w.value; })[0];
    CAP_EN.type = 'invest'; if (hh && hh.kind === 'investor' && hh.capital > 0) CAP_EN.type = 'ret';
    repaint();
  });
  var ty = el('ce_type'); if (ty) ty.addEventListener('change', function () { keep(); repaint(); });

  var ss = el('cs_save');
  if (ss) ss.addEventListener('click', function () {
    keep();
    var pct = num(CAP_SH.pct);
    if (!CAP_SH.name.trim()) { toast('Type the name.', true); return; }
    if (!(pct > 0 && pct <= 100)) { toast('The share is a percentage above 0 and up to 100.', true); return; }
    CAP_BUSY = true; repaint();
    var was = CAP_SH.id;
    srv('erpCapitalHolderSave', [{ id: CAP_SH.id, kind: 'shareholder', name: CAP_SH.name, phone: CAP_SH.phone, pct: pct, private: CAP_SH.private, invested: was ? 0 : num(CAP_SH.invested) }], function (r) {
      CAP_SH = { id: '', name: '', phone: '', pct: '', private: false }; done(was ? 'Changed.' : 'Shareholder added.')(r);
    }, bad);
  });
  var sc = el('cs_cancel'); if (sc) sc.addEventListener('click', function () { CAP_SH = { id: '', name: '', phone: '', pct: '', private: false }; repaint(); });
  var is = el('ci_save');
  if (is) is.addEventListener('click', function () {
    keep();
    if (!CAP_IN.name.trim()) { toast('Type the name.', true); return; }
    if (CAP_IN.returnKind !== 'none' && !(num(CAP_IN.returnValue) > 0)) { toast('Type what they get each month.', true); return; }
    CAP_BUSY = true; repaint();
    var was = CAP_IN.id;
    srv('erpCapitalHolderSave', [{ id: CAP_IN.id, kind: 'investor', name: CAP_IN.name, phone: CAP_IN.phone, returnKind: CAP_IN.returnKind, returnValue: num(CAP_IN.returnValue), private: CAP_IN.private, invested: was ? 0 : num(CAP_IN.invested) }], function (r) {
      var nm = CAP_IN.name;
      CAP_IN = { id: '', name: '', phone: '', returnKind: 'monthly', returnValue: '', private: false };
      if (!was) { var made = r.holders.filter(function (x) { return x.kind === 'investor' && x.name === nm.trim(); })[0]; if (made) { CAP_EN.holder = made.id; CAP_EN.type = 'invest'; } }
      done(was ? 'Changed.' : 'Investor added.')(r);
    }, bad);
  });
  var ic = el('ci_cancel'); if (ic) ic.addEventListener('click', function () { CAP_IN = { id: '', name: '', phone: '', returnKind: 'monthly', returnValue: '', private: false }; repaint(); });

  each('button[data-capedit]', function () {
    var id = this.getAttribute('data-capedit'), x = CAPD.holders.filter(function (q) { return q.id === id; })[0];
    if (!x) return;
    keep();
    if (x.kind === 'shareholder') CAP_SH = { id: x.id, name: x.name, phone: x.phone, pct: String(x.pct), private: x.private };
    else CAP_IN = { id: x.id, name: x.name, phone: x.phone, returnKind: x.returnKind || 'none', returnValue: String(x.returnValue || ''), private: x.private };
    repaint();
    var box = el(x.kind === 'shareholder' ? 'cs_pct' : 'ci_name'); if (box) { try { box.focus(); box.scrollIntoView({ block: 'center' }); } catch (e) {} }
  });
  each('button[data-capend]', async function () {
    var id = this.getAttribute('data-capend'), undo = this.getAttribute('data-undo') === '1', n = this.getAttribute('data-n');
    if (!(await uiConfirm(undo ? 'Bring ' + n + ' back?' : n + ' is no longer part of it?\n\nFrom this month on they get nothing more. What is already written stays, and their share becomes free.'))) return;
    CAP_BUSY = true;
    srv('erpCapitalHolderEnd', [{ id: id, undo: undo }], done(), bad);
  });
  var add = el('ce_add');
  if (add) add.addEventListener('click', async function () {
    keep();
    if (!CAP_EN.holder) { toast('Choose who.', true); return; }
    var amt = num(CAP_EN.amount);
    if (!(amt > 0)) { toast('Type the amount.', true); return; }
    var hh = CAPD.holders.filter(function (x) { return x.id === CAP_EN.holder; })[0];
    var label = { invest: 'put in', withdraw: 'took back', profit: 'was paid profit of', ret: 'was paid a return of' }[CAP_EN.type] || '';
    if (!(await uiConfirm((hh ? hh.name : '') + ' ' + label + ' ' + CAPD.currency + ' ' + fmt(amt) + (CAP_EN.date ? ' on ' + CAP_EN.date : ' today') + '?' +
        (CAP_EN.type === 'ret' ? '\n\nIt also goes into Expenses.' : '')))) return;
    CAP_BUSY = true; repaint();
    srv('erpCapitalEntryAdd', [{ holder: CAP_EN.holder, type: CAP_EN.type, amount: amt, date: CAP_EN.date, method: capMethodName(CAP_EN.method), account: /^[0-9a-f-]{36}$/.test(CAP_EN.method) ? CAP_EN.method : '', note: CAP_EN.note }], function (r) {
      CAP_EN.amount = ''; CAP_EN.note = ''; CAP_EN.date = ''; EXP = null; D = null; done('Written down.')(r);
    }, bad);
  });
  each('button[data-capvoid]', async function () {
    var id = this.getAttribute('data-capvoid');
    var why = (await uiPrompt('Why is this line being struck out? It stays in the book, crossed through.', ''));
    if (why === null) return;
    if (!why.trim()) { toast('Say why.', true); return; }
    CAP_BUSY = true;
    srv('erpCapitalEntryVoid', [{ id: id, reason: why.trim() }], function (r) { EXP = null; D = null; done('Struck out.')(r); }, bad);
  });
  each('button[data-capclose]', async function () {
    var m = this.getAttribute('data-capclose');
    if (!(await uiConfirm('Close ' + capMonth(m) + '?\n\nIts profit and the shares as they stand today are kept as they are, and nothing can be dated into it (or any month before it) afterwards. The owner can reopen the latest closed month.'))) return;
    CAP_BUSY = true;
    srv('erpCapitalClose', [{ month: m }], function (r) { EXP = null; done(capMonth(m) + ' closed.')(r); }, bad);
  });
  each('button[data-capreopen]', async function () {
    var m = this.getAttribute('data-capreopen');
    var why = (await uiPrompt('Why is ' + capMonth(m) + ' being reopened? Its profit follows the books again until it is closed anew.', ''));
    if (why === null) return;
    if (!why.trim()) { toast('Say why.', true); return; }
    CAP_BUSY = true;
    srv('erpCapitalReopen', [{ month: m, reason: why.trim() }], function (r) { EXP = null; D = null; done(capMonth(m) + ' is open again.')(r); }, bad);
  });
}

function loadExpenses() {
  srv('erpExpenses', [{ month: EXP_MONTH }], function (e) {
    EXP = e; EXP_ERR = null; EXP_MONTH = e.month;
    if (VIEW === 'expenses') repaint();
  }, function (x) {
    EXP_ERR = (x && x.message) ? x.message : String(x);
    if (VIEW === 'expenses') repaint();
  });
}

function wireExpenses() {
  function reload() { EXP = null; repaint(); loadExpenses(); }
  function bad(x) { toast(esc(x && x.message ? x.message : x), true, 12000); }
  // every save answers with the month as it now stands, read back from the
  // sheet - so what is shown is what was really kept
  function show(msg) {
    return function (e) {
      EXP = e; EXP_ERR = null; EXP_MONTH = e.month; D = null;
      if (msg) toast(msg, false, 8000);
      if (VIEW === 'expenses') repaint();
    };
  }
  function each(sel, fn) {
    var n = el('view').querySelectorAll(sel);
    for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn);
  }

  var pv = el('ex_prev'), nx = el('ex_next');
  if (pv) pv.addEventListener('click', function () { EXP_MONTH = shiftMonth(EXP.month, -1); reload(); });
  if (nx) nx.addEventListener('click', function () { EXP_MONTH = shiftMonth(EXP.month, 1); reload(); });

  var add = el('ex_add');
  if (add) add.addEventListener('click', function () {
    var amt = num(el('ex_amt').value), what = (el('ex_what').value || '').trim();
    if (!what) { toast('Say what it was for.', true); return; }
    if (!(amt > 0)) { toast('Enter an amount.', true); return; }
    add.disabled = true; add.textContent = 'Saving…';
    srv('erpExpenseAdd', [{ month: EXP.month, category: el('ex_cat').value,
                            description: what, amount: amt, account: el('ex_acc') ? el('ex_acc').value : '' }], show('Recorded.'),
        function (x) { add.disabled = false; add.textContent = 'Add'; bad(x); });
  });

  var fx = el('fx_add');
  if (fx) fx.addEventListener('click', function () {
    var nm = (el('fx_name').value || '').trim(), amt = num(el('fx_amt').value);
    if (!nm) { toast('Give it a name.', true); return; }
    if (!(amt > 0)) { toast('Enter the monthly amount.', true); return; }
    fx.disabled = true; fx.textContent = 'Saving…';
    srv('erpExpenseItemSave', [{ kind: 'fixed', name: nm, category: el('fx_cat').value,
                                 amount: amt, fromMonth: EXP.month, viewMonth: EXP.month }],
        show('Added. It will be recorded every month from ' + esc(EXP.label) + '.'),
        function (x) { fx.disabled = false; fx.textContent = 'Add'; bad(x); });
  });

  var rc = el('rc_add');
  if (rc) rc.addEventListener('click', function () {
    var nm = (el('rc_name').value || '').trim();
    if (!nm) { toast('Give it a name.', true); return; }
    rc.disabled = true; rc.textContent = 'Saving…';
    srv('erpExpenseItemSave', [{ kind: 'recurring', name: nm, category: el('rc_cat').value,
                                 amount: el('rc_amt') ? num(el('rc_amt').value) : 0,
                                 fromMonth: EXP.month, viewMonth: EXP.month }],
        show('Added. It will be on the list every month - just type that month\'s amount.'),
        function (x) { rc.disabled = false; rc.textContent = 'Add'; bad(x); });
  });

  each('button[data-rcsave]', function () {
    var id = this.getAttribute('data-rcsave'), nm = this.getAttribute('data-itname');
    var box = el('view').querySelector('input[data-rcamt="' + id + '"]');
    var amt = num(box ? box.value : '');
    if (!(amt > 0)) { toast('Type the amount for ' + esc(nm) + '.', true); return; }
    var b = this; b.disabled = true; b.textContent = 'Saving…';
    srv('erpExpenseRecurringSet', [{ itemId: id, amount: amt, month: EXP.month }],
        show(esc(nm) + ': ' + fmt(amt) + ' recorded for ' + esc(EXP.label) + '.'),
        function (x) { b.disabled = false; b.textContent = 'Save'; bad(x); });
  });

  each('button[data-fxchange]', async function () {
    var id = this.getAttribute('data-fxchange'), nm = this.getAttribute('data-itname');
    var v = (await uiPrompt('New monthly amount for "' + nm + '".\n\n' +
      'It applies from ' + EXP.label + ' onward. Earlier months keep the old figure.',
      this.getAttribute('data-fxamt')));
    if (v === null) return;
    var amt = num(v);
    if (!(amt > 0)) { toast('That is not an amount.', true); return; }
    srv('erpExpenseItemSave', [{ id: id, kind: 'fixed', name: nm, amount: amt,
                                 fromMonth: EXP.month, viewMonth: EXP.month }],
        show(esc(nm) + ' is ' + fmt(amt) + ' from ' + esc(EXP.label) + '.'), bad);
  });

  each('button[data-fxpay]', async function () {
    var id = this.getAttribute('data-fxpay'), nm = this.getAttribute('data-itname'), b = this;
    if (!(await uiConfirm('Mark "' + nm + '" as paid for ' + EXP.label + '?\n\n' + (OPT ? OPT.currency : 'BDT') + ' ' + fmt(num(this.getAttribute('data-fxamt'))) +
      ' goes into the book with the date of today.'))) return;
    b.disabled = true; b.textContent = 'Saving…';
    srv('erpExpenseFixedPay', [{ id: id, month: EXP.month }], show(esc(nm) + ' marked as paid.'),
        function (x) { b.disabled = false; b.textContent = 'Paid'; bad(x); });
  });
  each('button[data-fxunpay]', async function () {
    var id = this.getAttribute('data-fxunpay'), nm = this.getAttribute('data-itname');
    if (!(await uiConfirm('"' + nm + '" was not paid after all?\n\nIts entry in the book is struck out, and it shows as not paid again.'))) return;
    srv('erpExpenseFixedPay', [{ id: id, month: EXP.month, undo: true }], show(esc(nm) + ' is back to not paid.'), bad);
  });

  each('button[data-itend]', async function () {
    var id = this.getAttribute('data-itend'), nm = this.getAttribute('data-itname');
    if (!(await uiConfirm('Stop "' + nm + '"?\n\nIt will not appear for ' + EXP.label +
                        ' or after. Earlier months are left as they were.'))) return;
    srv('erpExpenseItemEnd', [{ id: id, fromMonth: EXP.month }], show(esc(nm) + ' stopped.'), bad);
  });

  each('button[data-exvoid]', async function () {
    var id = this.getAttribute('data-exvoid');
    var why = (await uiPrompt('Why is this entry being struck out?\n\n' +
      'It stays on the page, crossed through, with your reason.', ''));
    if (why === null) return;
    if (!why.trim()) { toast('A reason is needed.', true); return; }
    srv('erpExpenseVoid', [{ id: id, reason: why.trim() }], show('Struck out.'), bad);
  });

  var xl = el('ex_xls');
  if (xl) xl.addEventListener('click', function () {
    xl.disabled = true; xl.textContent = 'Building the file…';
    srv('erpExpenseExport', [{ month: EXP.month }], function (r) {
      xl.disabled = false; xl.textContent = 'Download as Excel';
      toast('<a href="' + esc(r.url) +
            '" target="_blank" rel="noopener" download><strong>Save ' + esc(r.name) + '</strong></a>' +
            ' · a copy is also kept in the ERP', false, 30000);
    }, function (x) { xl.disabled = false; xl.textContent = 'Download as Excel'; bad(x); });
  });
}

/**
 * The profit and loss statement: one column per month, the lines every
 * accountant expects, newest month on the right.
 */
var PNL = null, PNL_ERR = null;

function pnlHtml() {
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section><div class="card"><h2>Profit &amp; loss statement</h2>' +
    '<div class="sub">Calendar months. The current month is so far only. Click a month to see the invoices behind it.</div>' + pnlBarHtml();
  if (PNL_ERR) return h + '<div class="note err"><div class="ico">✕</div><div>' + esc(PNL_ERR) + '</div></div></div></section>';
  if (!PNL) return h + '<div class="loading">Adding up the months&hellip;</div></div></section>';
  var M = PNL.months;
  function row(label, key, opt) {
    opt = opt || {};
    return '<tr' + (opt.strong ? ' style="font-weight:700"' : '') + '><td' + (opt.indent ? ' style="padding-left:22px"' : '') + '>' +
      label + '</td>' + M.map(function (m) {
        var v = typeof key === 'function' ? key(m) : m[key];
        var neg = opt.minus && v ? '(' + fmt(v) + ')' : fmt(v);
        return '<td class="num"' + (opt.color && v < 0 ? ' style="color:var(--critical)"' : '') + '>' +
          (v === null ? '—' : (opt.minus ? neg : fmt(v))) + (opt.pct ? '%' : '') + '</td>';
      }).join('') + '</tr>';
  }
  h += '<div class="scroll"><table><thead><tr><th>' + esc(cur) + '</th>' + M.map(function (m) {
    var p = m.month.split('-');
    return '<th class="num"><button class="linkbtn" type="button" data-pnlm="' + esc(m.month) + '">' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1] +
      ' ' + p[0].slice(2) + '</button>' + (m.current ? '<br><span class="sku">so far</span>' : '') + '</th>';
  }).join('') + '</tr></thead><tbody>' +
    row('Sales, after discounts', 'sales') +
    row('Returns', 'returns', { minus: true, indent: true }) +
    row('Net sales', 'netSales', { strong: true }) +
    row('Cost of goods sold', 'cost', { minus: true, indent: true }) +
    row('Gross profit', 'gross', { strong: true, color: true }) +
    row('Gross margin', 'grossMargin', { pct: true, indent: true }) +
    row('Delivery charged to customers', 'delivery', { indent: true }) +
    (M.some(function (m) { return m.courierExtra; }) ? row('Courier collected more than invoiced', 'courierExtra', { indent: true }) : '') +
    (M.some(function (m) { return m.courierShort; }) ? row('Courier collected less (written off)', 'courierShort', { minus: true, indent: true }) : '') +
    row('Courier: delivery + COD fee', 'courier', { minus: true, indent: true });
  PNL.categories.forEach(function (c) {
    h += row(esc(c), function (m) { return m.byCat[c] || 0; }, { minus: true, indent: true });
  });
  h += row('Total operating expenses', 'expenses', { minus: true }) +
    row('Net profit', 'net', { strong: true, color: true }) +
    row('Net margin', 'netMargin', { pct: true, indent: true }) +
    '</tbody></table></div>' +
    '<div class="sub" style="margin-top:8px">Courier cost is what Steadfast kept from its payouts, in the month it paid out.' +
    (M.some(function (m) { return m.uncosted; })
      ? '<br>Some sales have no cost price, so their goods count as free: ' +
        M.map(function (m) { return fmt(m.uncosted); }).join(' · ') + '. Fill them in on Product cost.' : '') +
    '</div></div></section>' + pnlMonthHtml();
  return h;
}

function loadPnl() {
  srv('erpPnl', [{ months: PNL_N, to: PNL_TO }], function (r) { PNL = r; PNL_ERR = null; if (VIEW === 'profit') repaint(); },
      function (e) { PNL_ERR = (e && e.message) ? e.message : String(e); if (VIEW === 'profit') repaint(); });
}

function viewProfit() {
  var cur = OPT ? OPT.currency : 'BDT';
  var h = pnlHtml() + '<section>';

  h += '<div class="row" style="align-items:center;gap:8px;margin-bottom:12px">' +
    '<strong>Product profitability</strong>' +
    [[30, 'Last 30 days'], [90, 'Last 90 days'], [365, 'Last year'], [9999, 'All time']]
      .map(function (w) {
        return '<button class="chip' + (MONEY_DAYS === w[0] ? ' on' : '') +
               '" type="button" data-mwin="' + w[0] + '">' + w[1] + '</button>';
      }).join('') +
    '</div>';

  if (!MONEY) {
    h += '<div class="loading">Working out what was earned&hellip; this reads every ' +
         'sale, so give it a moment.</div></section>';
    return h;
  }

  h += '<div class="grid g-kpi" style="margin-bottom:14px">' +
    kpi('Sold', cur, fmt(MONEY.revenue), '<span class="delta">after discounts</span>') +
    kpi('The goods cost', cur, fmt(MONEY.cost), '<span class="delta">landed cost</span>') +
    kpi('Gross profit', cur, fmt(MONEY.profit),
        '<span class="delta">' + fmt(MONEY.margin) + '% margin</span>') +
    kpi('Asleep on the shelf', cur, fmt(MONEY.deadCash),
        '<span class="delta">' + fmt(MONEY.deadCount) + ' product(s), nothing sold in ' +
        fmt(MONEY.deadAfter) + ' days</span>') +
    '</div>';

  if (MONEY.unknownRevenue > 0) {
    h += '<div class="note warn" style="margin-bottom:12px"><div class="ico">!</div><div>' +
      '<strong>' + esc(cur) + ' ' + fmt(MONEY.unknownRevenue) + ' of these sales have no ' +
      'buying price on record</strong>, so their margin is left out rather than guessed. ' +
      'Fill the gap in the Costs screen and the figure above becomes complete.</div></div>';
  }

  h += moneyTable('Where the profit comes from', MONEY.brands, cur, 'Brand');
  h += moneyTable('By category', MONEY.categories, cur, 'Category');

  // ---- per product ----
  h += '<div class="card" style="margin-top:14px"><h2>Product by product</h2>' +
    '<div class="sub">Best earners first. Margin is blank where no buying price is known.</div>' +
    '<div class="scroll tall"><table><thead><tr><th>Product</th><th>Brand</th>' +
    '<th class="num">Units</th><th class="num">Sold</th><th class="num">Cost</th>' +
    '<th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
  if (!MONEY.products.length) {
    h += '<tr><td colspan="7"><div class="empty">Nothing was sold in this period.</div></td></tr>';
  }
  MONEY.products.forEach(function (p) {
    h += '<tr><td class="nm">' + esc(p.name || p.sku) + '<br><span class="sku">' +
      esc(p.sku) + '</span></td><td>' + esc(p.brand || '—') + '</td>' +
      '<td class="num">' + fmt(p.units) + '</td>' +
      '<td class="num">' + fmt(p.revenue) + '</td>' +
      '<td class="num">' + (p.unknown ? '—' : fmt(p.cost)) + '</td>' +
      '<td class="num"><strong>' + (p.unknown ? '—' : fmt(p.profit)) + '</strong></td>' +
      '<td class="num">' + (p.unknown
        ? '<span class="pill low">no cost</span>'
        : marginPill(p.margin)) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // ---- dead stock ----
  h += '<div class="card" style="margin-top:14px"><h2>Not moving</h2>' +
    '<div class="sub">On the shelf, nothing sold in ' + fmt(MONEY.deadAfter) +
    ' days. This is your money, and it is standing still.</div>';
  if (!MONEY.dead.length) {
    h += '<div class="empty">Everything on the shelf has sold recently.</div>';
  } else {
    h += '<div class="scroll tall"><table><thead><tr><th>Product</th><th>Brand</th>' +
      '<th class="num">On hand</th><th class="num">Cost each</th>' +
      '<th class="num">Cash in it</th><th class="num">Last sold</th></tr></thead><tbody>';
    MONEY.dead.forEach(function (d) {
      h += '<tr><td class="nm">' + esc(d.name || d.sku) + '<br><span class="sku">' +
        esc(d.sku) + '</span></td><td>' + esc(d.brand || '—') + '</td>' +
        '<td class="num">' + fmt(d.stock) + '</td>' +
        '<td class="num">' + fmt(d.unitCost) + '</td>' +
        '<td class="num"><strong>' + fmt(d.tied) + '</strong></td>' +
        '<td class="num">' + (d.lastSoldDays === null
          ? '<span class="pill out">never</span>'
          : fmt(d.lastSoldDays) + 'd') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="sub" style="margin-top:8px">All stock at cost: ' + esc(cur) + ' ' +
    fmt(MONEY.stockCash) + ' &middot; as of ' + esc(MONEY.generatedAt) + '</div>';
  h += '</div></section>';
  return h;
}

/** One rollup table - brands, or categories. */
function moneyTable(title, rows, cur, label) {
  if (!rows || !rows.length) return '';
  var h = '<div class="card" style="margin-top:14px"><h2>' + esc(title) + '</h2>' +
    '<div class="scroll"><table><thead><tr><th>' + esc(label) + '</th>' +
    '<th class="num">Units</th><th class="num">Sold</th><th class="num">Profit</th>' +
    '<th class="num">Margin</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr><td class="nm">' + esc(r.name) + '</td>' +
      '<td class="num">' + fmt(r.units) + '</td>' +
      '<td class="num">' + fmt(r.revenue) + '</td>' +
      '<td class="num"><strong>' + (r.unknown && !r.cost ? '—' : fmt(r.profit)) + '</strong></td>' +
      '<td class="num">' + (r.unknown && !r.cost ? '—' : marginPill(r.margin)) + '</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

/** A margin, coloured by whether it is worth the shelf space. */
function marginPill(m) {
  var cls = m >= 25 ? 'ok' : (m >= 10 ? 'low' : 'out');
  return '<span class="pill ' + cls + '">' + fmt(m) + '%</span>';
}

function wireProfit() {
  var chips = el('view').querySelectorAll('button[data-mwin]');
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener('click', function () {
      MONEY_DAYS = num(this.getAttribute('data-mwin'));
      MONEY = null; repaint(); loadMoney();
    });
  }
}

function loadMoney() {
  srv('erpMoney', [{ days: MONEY_DAYS }], function (m) {
    MONEY = m;
    if (VIEW === 'profit') repaint();
  }, function (e) {
    toast('Could not work out the profit: ' + esc(e && e.message ? e.message : e), true, 12000);
  });
}

function viewCustomers() {
  if (CUSP.key) return dueBoxHtml() + customerPageHtml();
  return dueBoxHtml() + customerFormHtml() + lvHtml('customers') + custMoneyBoxes();
}

/**
 * One customer's account, opened from the Due button.
 *
 * Everything that changes what they owe is here, and each choice says what
 * kind of thing happened - money in, goods back, or a debt forgiven. The
 * three are the same number and completely different facts.
 */
function dueBoxHtml() {
  if (!DUEBOX) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var a = DUEBOX.account;

  var h = '<section><div class="card" style="border-color:var(--series-1)">' +
    '<h2>' + esc(DUEBOX.name || 'Customer') + '</h2>';

  if (!a) {
    h += '<div class="loading">Reading their account&hellip;</div></div></section>';
    return h;
  }

  h += '<div class="grid g-kpi" style="margin-bottom:14px">' +
    kpi('Owed to you', cur, fmt(a.balance),
        '<span class="delta">' + fmt(a.count) + ' unpaid invoice(s)</span>') +
    kpi('Held in advance', cur, fmt(a.credit || 0),
        '<span class="delta">for goods not yet delivered</span>') +
    '</div>';

  if (a.invoices && a.invoices.length) {
    h += '<div class="scroll"><table><thead><tr><th>Invoice</th><th>When</th>' +
      '<th class="num">Total</th><th class="num">Owed</th><th class="num">Age</th>' +
      '</tr></thead><tbody>';
    a.invoices.forEach(function (i) {
      h += '<tr><td class="nm">' + esc(i.id) + '</td><td>' + esc(i.when) + '</td>' +
        '<td class="num">' + fmt(i.grand) + '</td>' +
        '<td class="num"><strong>' + fmt(i.due) + '</strong></td>' +
        '<td class="num">' + dueAge(i.days) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="empty">No unpaid invoices.</div>';
  }

  var reasons = DUEBOX.reasons || [{ id: 'payment', label: 'Payment received' }];
  h += '<div class="row" style="margin-top:14px;align-items:flex-end">' +
    '<div style="flex:1 1 160px"><label class="f" for="db_kind">What happened</label>' +
    '<select class="i" id="db_kind">' +
    reasons.map(function (r) {
      return '<option value="' + esc(r.id) + '">' + esc(r.label) + '</option>';
    }).join('') +
    '<option value="advance">Advance received (for goods not yet given)</option>' +
    '</select></div>' +
    '<div style="flex:1 1 120px"><label class="f" for="db_amt">Amount</label>' +
    '<input class="i" id="db_amt" inputmode="decimal" placeholder="0"></div>' +
    '<div style="flex:1 1 130px"><label class="f" for="db_method">Method</label>' +
    '<select class="i" id="db_method">' +
    ((OPT && OPT.paymentMethods) || ['Cash']).map(function (m) {
      return '<option value="' + esc(m) + '">' + esc(m) + '</option>';
    }).join('') + '</select></div>' +
    '<div style="flex:2 1 200px"><label class="f" for="db_note">Note</label>' +
    '<input class="i" id="db_note" placeholder="why — required unless money came in"></div>' +
    '<div style="flex:0 0 auto;align-self:flex-end">' +
    '<button class="btn primary" type="button" id="db_go">Save</button> ' +
    '<button class="btn" type="button" id="db_close">Close</button></div>' +
    '</div>' +
    '<div class="sub" style="margin-top:8px">' +
    '<strong>Payment received</strong> clears their oldest invoices first. ' +
    '<strong>Reduce the due</strong> is for a discount, a debt given up, or an ' +
    'amount typed too high — they owe less and no money came. ' +
    '<strong>Increase the due</strong> is the opposite: a payment was recorded ' +
    'that never arrived. An <strong>advance</strong> is held on their account ' +
    'and is never spent on older invoices.<br>' +
    'The two that move a debt without money need a note saying why, and neither ' +
    'types over the balance — the payment is put on or taken back, so the ' +
    'history still explains the number.</div>' +
    '</div></section>';
  return h;
}

/**
 * The panel that appears when a sale is saved.
 *
 * It sits above the page rather than inside it, so nothing that redraws the
 * screen can take it away, and it has no timer: it stays until the employee
 * closes it. Leave the tab, come back an hour later, it is still there with
 * the invoice on it - which is the point, because the copy they meant to
 * save is one click inside it.
 */
/** The parcel number, the way it is shown in a list: big, and one tap copies it. */
function cidHtml(cid) {
  return '<span class="cidlab">write on the parcel</span>' +
         '<span class="cid" data-cid="' + esc(cid) + '" title="Click to copy">' + esc(cid) + '</span>';
}

function copyCid(cid, node) {
  function done() { toast('Parcel number ' + esc(cid) + ' copied.'); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cid).then(done, function () {});
      return;
    }
  } catch (e) {}
  try {
    var r = document.createRange(); r.selectNodeContents(node);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    if (document.execCommand('copy')) done();
  } catch (e2) {}
}

document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && t.getAttribute && t.getAttribute('data-cid')) copyCid(t.getAttribute('data-cid'), t);
});

/**
 * Steadfast has taken the parcel. The number it gave has to go on the box
 * by hand, so it is shown large and stays until it is closed - a message
 * that fades after a few seconds is gone before the pen is found.
 */
function parcelDone(res) {
  var old = el('pcdone');

    'align-items:center;justify-content:center;background:rgba(0,0,0,.55)';
  wrap.innerHTML =
    '<div class="card" style="max-width:460px;width:92%;text-align:center">' +
      '<div style="font-size:34px;line-height:1">&#10003;</div>' +
      '<h2 style="margin:6px 0 2px">Parcel booked with Steadfast</h2>' +
      '<div class="sub">Write this number on the parcel</div>' +
      '<div class="cid" data-cid="' + esc(res.consignment) + '" ' +
        'style="font-size:34px;padding:8px 18px;margin:10px 0">' + esc(res.consignment) + '</div>' +
      '<div class="sub" style="margin-bottom:4px">' + esc(res.customer || '') + ' · invoice ' +
        esc(res.invoiceNo) + '</div>' +
      '<div class="sub" style="margin-bottom:14px">Rider collects <strong>' + esc(cur) + ' ' +
        fmt(res.collect) + '</strong>' + (res.changed ? ' · sent to a one-off address' : '') +
        '.<br>The number stays on the sale, under Sales &rarr; Sent. This stays open until you close it.</div>' +
      '<button class="btn primary" type="button" id="pccopy">Copy number</button> ' +

  document.body.appendChild(wrap);
  document.getElementById('pcclose').addEventListener('click', function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);

  });
}

function invoiceDone(res) {
  var old = el('invdone');
  if (old && old.parentNode) old.parentNode.removeChild(old);

  var cur = OPT ? OPT.currency : 'BDT';
  var dl = res.pdfUrl || '';

  var wrap = document.createElement('div');
  wrap.id = 'invdone';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;' +
    'align-items:center;justify-content:center;background:rgba(0,0,0,.55)';
  wrap.innerHTML =
    '<div class="card" style="max-width:460px;width:92%;text-align:center">' +
      '<div style="font-size:34px;line-height:1">&#10003;</div>' +
      '<h2 style="margin:6px 0 2px">Invoice ' + esc(res.invoiceNo) + '</h2>' +
      '<div class="sub" style="margin-bottom:4px">' + esc(cur) + ' ' +
        fmt(res.grandTotal) + (res.thisDue > 0
          ? ' · <strong>' + fmt(res.thisDue) + ' still due</strong>' : ' · paid') +
      '</div>' +
      '<div class="sub" style="margin-bottom:14px">A copy is already saved in ' +
        'the ERP. This stays open until you close it.</div>' +
      (dl ? '<a class="btn primary" id="invdl" href="' + esc(dl) + '" ' +
              'target="_blank" rel="noopener">Save to this computer</a> ' : '') +
      (res.pdfUrl ? '<a class="btn" href="' + esc(res.pdfUrl) + '" target="_blank" ' +
              'rel="noopener">Open PDF</a> ' : '') +
      (isCourier(res.source)
        ? '<button class="btn" type="button" id="invparcel">Send parcel</button> ' : '') +
      '<button class="btn" type="button" id="invnext">Next invoice</button>' +
    '</div>';

  var next = document.getElementById('invnext');
  if (next) next.addEventListener('click', function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  });

  // WhatsApp order is actually decided, with the customer still on the line.
  var parcel = document.getElementById('invparcel');
  if (parcel) parcel.addEventListener('click', function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);

function openDueBox(phone, name) {
  DUEBOX = { phone: phone, name: name, account: null, reasons: null };
  repaint();
  srv('erpCustomerAccount', [{ phone: phone, name: name }], function (res) {
    if (DUEBOX) { DUEBOX.account = res; repaint(); }
  }, function (e) {
    toast(esc(e && e.message ? e.message : e), true, 12000);
    DUEBOX = null; repaint();
  });
  srv('erpPayReasons', [], function (list) {
    if (DUEBOX) { DUEBOX.reasons = list; repaint(); }
  }, function () {});
}

function wireDueBox() {
  var open = el('view').querySelectorAll('button[data-cdue]');
  for (var i = 0; i < open.length; i++) {
    open[i].addEventListener('click', function () {
      openDueBox(this.getAttribute('data-cphone'), this.getAttribute('data-cname'));
    });
  }

  var close = el('db_close');
  if (close) close.addEventListener('click', function () { DUEBOX = null; repaint(); });

  var go = el('db_go');
  if (go) go.addEventListener('click', function () {
    var kind = el('db_kind').value;
    var amount = num(el('db_amt').value);
    var note = (el('db_note').value || '').trim();
    var method = el('db_method').value;
    if (!(amount > 0)) { toast('Enter an amount.', true); return; }
    go.disabled = true; go.textContent = 'Saving…';

    function done(res) {
      go.disabled = false; go.textContent = 'Save';
      if (res && res.dues) { DUES = res.dues; updateDueCount(); }
      openDueBox(DUEBOX.phone, DUEBOX.name);
      toast('Saved.');
    }
    function failed(e) {
      go.disabled = false; go.textContent = 'Save';
      toast(esc(e && e.message ? e.message : e), true, 15000);
    }

    if (kind === 'advance') {
      srv('erpTakeAdvance', [{ phone: DUEBOX.phone, name: DUEBOX.name,
                               amount: amount, method: method, note: note }],
          done, failed);
    } else {
      srv('erpSettleDue', [{ phone: DUEBOX.phone, name: DUEBOX.name,
                             amount: amount, reason: kind, method: method,
                             note: note }], done, failed);
    }
  });
}

/**
 * What this customer owes, or what you are holding for them.
 *
 * Nothing is drawn when both are zero, which is the normal case - a badge on
 * every row would be noise, and the point of this one is that it catches the
 * eye. Both can appear together: money owed on old invoices and money taken
 * for goods not yet delivered are different facts, and netting them would
 * hide one of them.
 */
/**
 * Two short lists above the customers: who owes money, and who has paid
 * for goods they have not had yet. The owe list is the chasing list: oldest
 * due first by default, with when each person was last reminded, a ready
 * WhatsApp message and their full statement one click away. Everyone here
 * is also in the full list below. A list with nobody in it is not drawn.
 */
var OWE_SORT = 'oldest';

function custMoneyBoxes() {
  if (!DUES || !DUES.byKey) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var known = {};
  (CUST || []).forEach(function (c) {
    var k = custKey(c.phone, c.name);
    if (k && !known[k]) known[k] = c;
  });
  var owe = [], adv = [];
  for (var k in DUES.byKey) {
    if (!DUES.byKey.hasOwnProperty(k)) continue;
    var b = DUES.byKey[k], c = known[k] || null;
    var who = { key: k, name: c ? c.name : (k.indexOf('n:') === 0 ? k.slice(2) : ''),
                phone: c ? c.phone : (k.indexOf('n:') === 0 ? '' : '0' + k),
                due: b.due || 0, credit: b.credit || 0, invoices: b.invoices || 0, oldest: b.oldest || 0,
                reminded: b.reminded || null };
    if (who.due > 0) owe.push(who);
    if (who.credit > 0) adv.push(who);
  }
  owe.sort(function (x, y) { return OWE_SORT === 'oldest' ? (y.oldest - x.oldest || y.due - x.due) : (y.due - x.due); });
  adv.sort(function (x, y) { return y.credit - x.credit; });
  var h = '';

  if (owe.length) {
    var total = 0;
    owe.forEach(function (w) { total += w.due; });
    h += '<section><div class="card" style="border:2px solid var(--critical)">' +
      '<div class="row" style="align-items:center;gap:8px"><h2 style="margin:0;flex:1">Customers who owe ' +
      '<span class="bal owed">' + fmt(total) + '</span></h2>' +
      '<button class="chip' + (OWE_SORT === 'oldest' ? ' on' : '') + '" type="button" data-owesort="oldest">Oldest first</button>' +
      '<button class="chip' + (OWE_SORT === 'largest' ? ' on' : '') + '" type="button" data-owesort="largest">Largest first</button></div>' +
      '<div class="sub">' + fmt(owe.length) + ' customer(s). Remind, then record the payment when it comes.</div>' +
      '<div class="scroll"><table><thead><tr><th>Customer</th><th class="num">Owes</th><th class="num">Invoices</th>' +
      '<th class="num">Oldest</th><th>Last reminded</th><th></th></tr></thead><tbody>';
    owe.forEach(function (w) {
      var wa = waLink(w.phone, dueMessage(w, cur));
      h += '<tr><td class="nm">' + esc(w.name || '—') + (w.phone ? '<br><span class="sku">' + esc(w.phone) + '</span>' : '') + '</td>' +
        '<td class="num"><span class="bal owed">' + fmt(w.due) + '</span></td><td class="num">' + fmt(w.invoices) + '</td>' +
        '<td class="num">' + (w.oldest ? fmt(w.oldest) + ' days' : 'today') + '</td>' +
        '<td>' + (w.reminded ? '<span class="pill' + (w.reminded.days < 3 ? ' ok' : '') + '">' + esc(w.reminded.at) +
          (w.reminded.days === 0 ? ' · today' : ' · ' + fmt(w.reminded.days) + 'd ago') + '</span>' : '<span class="pill low">never</span>') + '</td>' +
        '<td class="num" style="white-space:nowrap">' +
        (wa ? '<a class="btn small primary" href="' + esc(wa) + '" target="_blank" rel="noopener" data-remind="' + esc(w.key) +
          '" data-rphone="' + esc(w.phone) + '" data-rname="' + esc(w.name) + '" data-rdue="' + esc(w.due) + '">WhatsApp</a> ' : '') +
        '<button class="btn small" type="button" data-stmt="1" data-sphone="' + esc(w.phone) + '" data-sname="' + esc(w.name) + '">Statement</button> ' +
        '<button class="btn small" type="button" data-cdue="1" data-cphone="' + esc(w.phone) + '" data-cname="' + esc(w.name) + '">Receive payment</button>' +
        '</td></tr>';
    });
    h += '</tbody></table></div></div></section>';
  }

  if (adv.length) {
    var t2 = 0;
    adv.forEach(function (w) { t2 += w.credit; });
    h += '<section><div class="card" style="border:2px solid var(--good)"><h2>Paid in advance <span class="bal adv">' + fmt(t2) + '</span></h2>' +
      '<div class="sub">' + fmt(adv.length) + ' customer(s) · money held for goods not yet delivered</div>' +
      '<div class="scroll"><table><thead><tr><th>Customer</th><th class="num">In advance</th><th></th></tr></thead><tbody>' +
      adv.map(function (w) {
        return '<tr><td class="nm">' + esc(w.name || '—') + (w.phone ? '<br><span class="sku">' + esc(w.phone) + '</span>' : '') + '</td>' +
          '<td class="num"><span class="bal adv">' + fmt(w.credit) + '</span></td><td class="num">' +
          '<button class="btn small" type="button" data-stmt="1" data-sphone="' + esc(w.phone) + '" data-sname="' + esc(w.name) + '">Statement</button> ' +
          '<button class="btn small" type="button" data-cdue="1" data-cphone="' + esc(w.phone) + '" data-cname="' + esc(w.name) + '">Open account</button></td></tr>';
      }).join('') + '</tbody></table></div></div></section>';
  }
  return h;
}

/** A WhatsApp link that opens a chat with the message already typed. */
function waLink(phone, text) {
  var p = String(phone || '').replace(/\D/g, '');
  if (p.length < 10) return '';
  if (p.length === 11 && p.charAt(0) === '0') p = '88' + p;
  else if (p.length === 10) p = '880' + p;
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
}

function dueMessage(w, cur) {
  var biz = (BIZ && BIZ.businesses && BIZ.businesses[0] && BIZ.businesses[0].name) || 'Costareen';
  return 'Assalamu alaikum' + (w.name ? ' ' + w.name : '') + ',\n\n' +
    'This is ' + biz + '. Your balance with us is ' + cur + ' ' + fmt(w.due) +
    (w.invoices > 1 ? ' across ' + w.invoices + ' invoices' : '') +
    (w.oldest ? ', the oldest from ' + w.oldest + ' days ago' : '') + '.\n\n' +
    'Please pay at your convenience by bKash, Bangla QR or cash. If you have already paid, please let us know so we can update our records.\n\nThank you.';
}

/** The statement, in a box over the page, with a PDF and a WhatsApp button. */
function openStatement(phone, name) {
  var old = document.getElementById('stmtbox');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var w = document.createElement('div');
  w.id = 'stmtbox';
  w.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;' +
    'background:rgba(0,0,0,.55);overflow:auto';
  document.body.appendChild(w);
  var days = 90;
  function shut() { if (w.parentNode) w.parentNode.removeChild(w); }
  function load() {
    w.innerHTML = '<div class="card" style="max-width:760px;width:94%"><div class="loading">Reading the account&hellip;</div></div>';
    srv('erpCustomerStatement', [{ phone: phone, name: name, days: days }], draw, function (e) {
      shut(); toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  }
  function draw(s) {
    var cur = OPT ? OPT.currency : 'BDT';
    var msg = 'Assalamu alaikum' + (s.customer ? ' ' + s.customer : '') + ',\n\nYour statement with ' + s.business +
      ' (' + s.from + ' – ' + s.to + '):\n' +
      s.rows.map(function (r) { return r.date + '  ' + r.text + (r.debit ? '  +' + fmt(r.debit) : '') + (r.credit ? '  −' + fmt(r.credit) : ''); }).join('\n') +
      '\n\nBalance due: ' + cur + ' ' + fmt(s.closing) + (s.advance > 0 ? '\nAdvance held for you: ' + cur + ' ' + fmt(s.advance) : '') + '\n\nThank you.';
    var wa = waLink(s.phone, msg);
    w.innerHTML = '<div class="card" style="max-width:760px;width:94%;max-height:92vh;overflow:auto">' +
      '<div class="row" style="align-items:center;gap:8px"><h2 style="margin:0;flex:1">Statement · ' + esc(s.customer || s.phone) + '</h2>' +
      [[90, '3 months'], [365, '1 year'], [3650, 'Everything']].map(function (d) {
        return '<button class="chip' + (days === d[0] ? ' on' : '') + '" type="button" data-stdays="' + d[0] + '">' + d[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sub">' + esc(s.from) + ' to ' + esc(s.to) + (s.phone ? ' · ' + esc(s.phone) : '') + '</div>' +
      '<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Date</th><th>Details</th><th class="num">Charged</th>' +
      '<th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>' +
      '<tr><td></td><td class="sku">Balance brought forward</td><td></td><td></td><td class="num">' + fmt(s.opening) + '</td></tr>' +
      s.rows.map(function (r) {
        return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.text) + (r.ref && r.text.indexOf(r.ref) < 0 ? ' <span class="sku">' + esc(r.ref) + '</span>' : '') +
          '</td><td class="num">' + (r.debit ? fmt(r.debit) : '') + '</td><td class="num">' + (r.credit ? fmt(r.credit) : '') +
          '</td><td class="num">' + fmt(r.balance) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div class="totals" style="margin-top:10px"><div class="due"><span>Balance due</span><span>' + esc(cur) + ' ' + fmt(s.closing) + '</span></div>' +
      (s.advance > 0 ? '<div><span>Advance held</span><span>' + fmt(s.advance) + '</span></div>' : '') + '</div>' +
      (s.open.length ? '<div class="sub" style="margin-top:6px">Unpaid: ' + s.open.map(function (o) {
        return esc(o.id) + ' ' + fmt(o.owed) + ' (' + fmt(o.days) + 'd)'; }).join(' · ') + '</div>' : '') +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="st_close">Close</button>' +
      '<button class="btn" type="button" id="st_pdf">Save as PDF</button>' +
      (wa ? '<a class="btn primary" href="' + esc(wa) + '" target="_blank" rel="noopener">Send on WhatsApp</a>' : '') +
      '</div></div>';
    document.getElementById('st_close').addEventListener('click', shut);
    var chips = w.querySelectorAll('button[data-stdays]');
    for (var i = 0; i < chips.length; i++) chips[i].addEventListener('click', function () { days = Number(this.getAttribute('data-stdays')); load(); });
    var pdf = document.getElementById('st_pdf');
    pdf.addEventListener('click', function () {
      pdf.disabled = true; pdf.textContent = 'Saving…';
      srv('erpStatementPdf', [{ phone: phone, name: name, days: days }], function (r) {
        pdf.disabled = false; pdf.textContent = 'Save as PDF';
        toast('<a href="' + esc(r.url) + '" target="_blank" rel="noopener"><strong>Open ' + esc(r.name) + '</strong></a> · saved in the ERP', false, 30000);
      }, function (e) { pdf.disabled = false; pdf.textContent = 'Save as PDF'; toast(esc(e && e.message ? e.message : e), true, 12000); });
    });
  }
  load();
}

function wireStatements() {
  var st = el('view').querySelectorAll('button[data-stmt]');
  for (var i = 0; i < st.length; i++) st[i].addEventListener('click', function () {
    openStatement(this.getAttribute('data-sphone'), this.getAttribute('data-sname'));
  });
  var so = el('view').querySelectorAll('button[data-owesort]');
  for (var j = 0; j < so.length; j++) so[j].addEventListener('click', function () {
    OWE_SORT = this.getAttribute('data-owesort'); repaint();
  });
  // the link opens WhatsApp by itself; this only writes down that it was sent
  var rm = el('view').querySelectorAll('a[data-remind]');
  for (var k = 0; k < rm.length; k++) rm[k].addEventListener('click', function () {
    var key = this.getAttribute('data-remind');
    srv('erpDueReminded', [{ phone: this.getAttribute('data-rphone'), name: this.getAttribute('data-rname'),
                            due: this.getAttribute('data-rdue') }], function () {

function balBadge(phone, name) {
  if (!DUES || !DUES.byKey) return '';
  var key = custKey(phone, name);
  if (!key) return '';
  var b = DUES.byKey[key];
  if (!b) return '';

  var out = '';
  if (b.due > 0) {
    var when = b.oldest ? ', oldest ' + fmt(b.oldest) + ' days' : '';
    out += '<span class="bal owed" title="Owed to you: ' + esc(OPT ? OPT.currency : 'BDT') +
           ' ' + fmt(b.due) + ' across ' + fmt(b.invoices) + ' unpaid invoice(s)' + when +
           '">' + fmt(b.due) + '</span>';
  }
  if (b.credit > 0) {
    out += '<span class="bal adv" title="Held in advance for goods not yet ' +
           'delivered: ' + esc(OPT ? OPT.currency : 'BDT') + ' ' + fmt(b.credit) +
           '">' + fmt(b.credit) + '</span>';
  }
  return out;
}

/**
 * The phone, reduced to the part that identifies a person.
 *
 * Must match erpCustKey_ on the server exactly, or a customer's own balance
 * will not find them: 01728733979 and +8801728733979 are one person.
 */
function custKey(phone, name) {
  var p = String(phone || '').replace(/\D/g, '');
  if (p.length >= 10) return p.slice(-10);
  var n = String(name || '').trim().toLowerCase();
  return n ? 'n:' + n : '';
}
