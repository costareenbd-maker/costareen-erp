/** One parcel's verdict, as a word a person understands. */
function sfpCheckPill(x) {
  var a = x.check || x.action || '';
  if (a === 'ok') return '<span class="pill ok">✓ matches</span>';
  if (a === 'writeoff') return '<span class="pill low">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' less — written off</span>';
  if (a === 'extra') return '<span class="pill ok">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' more — delivery income</span>';
  if (a === 'review') return '<span class="pill out">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' less — your decision</span>';
  if (a === 'kept') return '<span class="pill low">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' still due</span>';
  if (a === 'settled') return '<span class="sku">closed earlier</span>';
  return '<span class="sku">not checked</span>';
}

/**
 * Every delivered parcel set against its invoice. Steadfast's figure is the
 * true one: small shortfalls are written off, extras are income, and only a
 * large shortfall is put in front of the owner.
 */
function sfpCheckHtml(cur) {
  var c = SFP.recon;
  if (!c) return '';
  var n = c.ok + c.writeoff + c.extra + c.kept + c.review.length;
  var h = '';
  if (c.review.length) {
    h += '<div class="note err" style="margin-bottom:10px"><div class="ico">!</div><div><strong>' + fmt(c.review.length) +
      ' parcel(s): Steadfast collected much less than the invoice.</strong> Over ' + fmt(c.limit) + ' is not written off without you.' +
      '<div class="scroll" style="margin-top:6px"><table><thead><tr><th>Invoice</th><th>Customer</th><th class="num">Invoice expected</th>' +
      '<th class="num">Steadfast collected</th><th class="num">Short</th><th></th></tr></thead><tbody>' + c.review.map(function (r) {
        return '<tr><td>' + esc(r.invoice) + '<br><span class="sku">' + esc(r.consignment) + '</span></td><td>' + esc(r.customer) + '</td><td class="num">' +
          fmt(r.expected) + '</td><td class="num">' + fmt(r.collected) + '</td><td class="num"><strong>' + fmt(r.amount) + '</strong></td>' +
          '<td class="num"><button class="btn small" type="button" data-sfrv="' + esc(r.consignment) + '" data-act="writeoff">Write off</button> ' +
          '<button class="btn small" type="button" data-sfrv="' + esc(r.consignment) + '" data-act="keep">Customer still owes</button></td></tr>';
      }).join('') + '</tbody></table></div></div></div>';
  }
  if (!n) return h;
  h += '<div class="note" style="margin-bottom:10px"><div class="ico">✓</div><div><strong>' + fmt(n) + ' delivered parcel(s) checked against their invoices.</strong> ' +
    fmt(c.ok) + ' matched exactly' +
    (c.writeoff ? ' · ' + fmt(c.writeoff) + ' came up short and were written off (' + esc(cur) + ' ' + fmt(c.writeoffSum) + ')' : '') +
    (c.extra ? ' · ' + fmt(c.extra) + ' brought more than invoiced, counted as delivery income (' + esc(cur) + ' ' + fmt(c.extraSum) + ')' : '') +
    (c.kept ? ' · ' + fmt(c.kept) + ' kept as due' : '') + '. Steadfast’s figure is always the one that stands.';
  if (c.list.length) {
    h += '<details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Show the ones that did not match (' + fmt(c.list.length) + ')</summary>' +
      '<div class="scroll" style="max-height:300px"><table><thead><tr><th>Invoice</th><th>Customer</th><th class="num">Invoice expected</th>' +
      '<th class="num">Steadfast collected</th><th>Result</th></tr></thead><tbody>' + c.list.map(function (r) {
        return '<tr><td>' + esc(r.invoice) + '</td><td>' + esc(r.customer) + '</td><td class="num">' + fmt(r.expected) + '</td><td class="num">' +
          fmt(r.collected) + '</td><td>' + sfpCheckPill(r) + '</td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }
  return h + '</div></div>';
}

function loadSfp() {
  srv('erpSfPayouts', [{}], function (r) { SFP = r; SFP_ERR = null; if (VIEW === 'sales') repaint();
    if (r && r.autoRecorded) { SALES = null; DUES = null; loadSales(); } },
    function (e) { SFP_ERR = (e && e.message) ? e.message : String(e); if (VIEW === 'sales') repaint(); });
}

function wireSfp() {
  var t = el('sfp_toggle');
  if (t) t.addEventListener('click', function () {
    SFP_OPEN = !SFP_OPEN;

    repaint();

  var ls = el('view').querySelectorAll('button[data-sfpl]');
  for (var i = 0; i < ls.length; i++) ls[i].addEventListener('click', function () {

    if (SFP_LINES[id]) { delete SFP_LINES[id]; repaint(); return; }
    srv('erpSfPayoutLines', [{ payoutId: id }], function (r) { SFP_LINES[id] = r.lines; repaint(); },
        function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
  var rv = el('view').querySelectorAll('button[data-sfrv]');
  for (var q = 0; q < rv.length; q++) rv[q].addEventListener('click', async function () {
    var b = this, cid = b.getAttribute('data-sfrv'), act = b.getAttribute('data-act');
    if (!(await uiConfirm(act === 'writeoff'
        ? 'Write off the shortfall on this parcel? The invoice will be closed at what Steadfast collected.'
        : 'Keep the shortfall as due? The customer will show as still owing it.'))) return;
    b.disabled = true;
    srv('erpSfReconDecide', [{ consignment: cid, decision: act }], function () {
      toast(act === 'writeoff' ? 'Written off.' : 'Kept as due.');
      SFP = null; SALES = null; DUES = null; loadSfp(); loadSales();
    }, function (e) { b.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var cf = el('sfp_confirm');
  if (cf) cf.addEventListener('click', function () {
    var ticks = el('view').querySelectorAll('input[data-sfpc]'), ids = [];
    for (var j = 0; j < ticks.length; j++) if (ticks[j].checked) ids.push(ticks[j].getAttribute('data-sfpc'));
    if (!ids.length) { toast('Tick at least one.', true); return; }
    cf.disabled = true; cf.textContent = 'Saving…';
    srv('erpSfConfirmMatches', [{ consignments: ids }], function (r) {
      toast(fmt(r.recorded) + ' invoice(s) marked paid.', false, 8000);
      SFP = null; SALES = null; DUES = null; loadSfp(); loadSales();
    }, function (e) { cf.disabled = false; cf.textContent = 'Mark the ticked ones paid'; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
}

/* =====================================================================
 * QUOTATIONS
 * ---------------------------------------------------------------------
 * A price offer, made on this screen and printed to PDF. Four steps:

 *

 * failed save loses nothing - but that is a browser copy, and the screen
 * never calls it saved until the server has it.
 * ===================================================================== */
var QZ = { boot: null, err: '', sub: 'dash', quote: null, version: 0, dirty: false, step: 1, saving: false,
           list: null, listQ: { search: '', status: 'All' }, assets: {}, restored: false,

  { catalogKey: 'item-003', name: 'Bambu Lab Filament', description: '', kind: 'Product', unit: 'unit', historicalRate: 1700, provenance: 'Original quotation' },

  { catalogKey: 'svc-001', name: '3D printed', description: '', kind: 'Service', unit: 'project', historicalRate: 0, provenance: 'Generic service description' }

/** Totals: the same arithmetic as the server, line for line. */
function qzRound(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
function qzTotals(q) {
  var items = q.items || [];
  var subtotal = qzRound(items.reduce(function (s, i) { return s + qzRound(Number(i.qty) * Number(i.rate)); }, 0));
  var discount = qzRound(Math.min(subtotal, q.discountType === 'Percent' ? subtotal * Number(q.discount) / 100 : Number(q.discount)));
  var tax = qzRound((subtotal - discount) * Number(q.vat) / 100);
  var total = qzRound(subtotal - discount + tax + Number(q.shipping));
  var advance = qzRound(total * Number(q.advance) / 100);
  return { subtotal: subtotal, discount: discount, tax: tax, total: total, advance: advance, balance: qzRound(total - advance) };
}
function qzMoney(n, cur) {
  return (cur || 'BDT') + ' ' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function qzAddDays(date, n) { var d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function qzUuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function qzReadiness(q) {
  var e = [];
  if (!String(q.title || '').trim()) e.push('Project title is required.');

 * ink in it (not transparent, not near-white) and keep a cropped copy for
 * the quotation header. The stored file is never changed, and anything
 * that cannot be measured is simply shown as it is.
 */

/**
 * Cut the empty border off an image and hand back a copy no larger than
 * `maxOut` pixels on its long side. cb(null) when there is nothing to cut
 * or the picture cannot be measured - the caller then shows it as it is.
 * `always` asks for the scaled copy even when no border was found.
 */
function imgTrim(src, maxOut, cb, always) {
  var im = new Image();
  im.onerror = function () { cb(null); };
  im.onload = function () {
    try {
      var W = im.naturalWidth, H = im.naturalHeight;
      if (!W || !H) { cb(null); return; }
      var k = Math.min(1, 400 / Math.max(W, H)), w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var g = cv.getContext('2d'); g.drawImage(im, 0, 0, w, h);
      var px = g.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var p = (y * w + x) * 4;
        if (px[p + 3] < 24 || (px[p] > 242 && px[p + 1] > 242 && px[p + 2] > 242)) continue;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      if (x1 < 0) { cb(null); return; }
      var pad = Math.round(Math.max(w, h) * 0.015);
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
      var whole = (x1 - x0 + 1) > w * 0.94 && (y1 - y0 + 1) > h * 0.94;      // no border worth cutting
      if (whole && !always) { cb(null); return; }
      if (whole) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
      var sx = x0 / k, sy = y0 / k, sw = (x1 - x0 + 1) / k, sh = (y1 - y0 + 1) / k;
      var o = Math.min(1, maxOut / Math.max(sw, sh));
      var out = document.createElement('canvas'); out.width = Math.max(1, Math.round(sw * o)); out.height = Math.max(1, Math.round(sh * o));
      out.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, out.width, out.height);
      cb(out.toDataURL('image/png'));
    } catch (e) { cb(null); }
  };
  im.src = src;
}

/**
 * Lay the blocks out on A4 pages: header and footer repeated, the item
 * heading repeated when a table carries on, a heading never left alone at
 * the bottom of a page. Measured at full size, off screen.
 */
function qzPaginate(q, target) {
  var src = document.createElement('div');
  src.className = 'qz-src';
  src.style.cssText = 'position:fixed;left:-20000px;top:0;width:794px';
  src.innerHTML = qzHeaderHtml(q) + '<div class="doc-blocks">' + qzBlocksHtml(q) + '</div>' + qzFooterHtml(q);
  document.body.appendChild(src);
  target.innerHTML = '';
  var page, body, count = 0;
  function addPage() {
    page = document.createElement('section');
    page.className = 'quote-page ' + String(q.theme || 'Signature').toLowerCase();
    page.style.setProperty('--quote-accent', q.accent || '#dda51c');
    page.style.setProperty('--quote-dark', q.dark || '#303030');
    page.style.setProperty('--quote-font', q.font || 'Arial');
    page.style.fontSize = q.fontSize === 'Compact' ? '13px' : '14px';
    page.appendChild(src.querySelector('.doc-header').cloneNode(true));
    body = document.createElement('div'); body.className = 'doc-body'; page.appendChild(body);
    page.appendChild(src.querySelector('.doc-footer').cloneNode(true));
    target.appendChild(page); count++;
  }
  addPage();
  Array.prototype.slice.call(src.querySelector('.doc-blocks').children).forEach(function (block) {
    var clone = block.cloneNode(true);
    body.appendChild(clone);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
      clone.parentNode.removeChild(clone);
      var prev = body.lastElementChild;
      var carry = prev && (prev.classList.contains('doc-section-label') || prev.classList.contains('doc-table-head')) ? prev : null;
      if (carry) carry.parentNode.removeChild(carry);
      addPage();
      if (carry) body.appendChild(carry);
      else if (clone.classList.contains('doc-row') && !clone.classList.contains('doc-table-head')) {
        body.appendChild(src.querySelector('.doc-table-head').cloneNode(true));
      }
      body.appendChild(clone);
    }
  });
  Array.prototype.slice.call(target.querySelectorAll('.page-number')).forEach(function (n, i) { n.textContent = (i + 1) + ' / ' + count; });
  src.parentNode.removeChild(src);
  return count;
}
function qzRefreshPreview() {
  var host = el('qz_pages'), wrap = el('qz_preview');
  if (!host || !wrap || !QZ.quote) return;
  var n = qzPaginate(QZ.quote, host);
  var scale = Math.min(1, (wrap.clientWidth - 2) / 794);
  host.style.transform = 'scale(' + scale + ')';
  host.style.transformOrigin = 'top left';
  host.parentNode.style.height = Math.ceil(n * 1123 * scale + (n - 1) * 20 * scale) + 'px';
  var cap = el('qz_pagecount');
  if (cap) cap.textContent = n + (n === 1 ? ' page' : ' pages') + ' · A4 · ' + QZ.quote.theme;
  var tot = el('qz_total');
  if (tot) tot.textContent = qzMoney(qzTotals(QZ.quote).total, QZ.quote.currency);
}

function qzDashHtml() {

  if (!L) return h + '<div class="loading">Reading quotations&hellip;</div>';
  var c = L.counts;
  h += '<div class="grid g-kpi" style="margin-bottom:14px">' + kpi('Quotations', '', fmt(c.total), '') + kpi('Draft', '', fmt(c.draft), '') +
    kpi('Ready', '', fmt(c.ready), '') + '</div>';
  h += '<section><div class="card"><div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">' +
    '<div style="flex:1 1 240px"><label class="f" for="qz_q">Search</label><input class="i" id="qz_q" value="' + esc(QZ.listQ.search) + '" placeholder="Reference, customer or title"></div>' +
    '<div><label class="f" for="qz_st">Status</label><select class="i" id="qz_st">' + ['All', 'Draft', 'Ready'].map(function (s) {
      return '<option' + (QZ.listQ.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    '<button class="btn" type="button" id="qz_refresh">Refresh</button><button class="btn primary" type="button" id="qz_newbtn">+ New quotation</button></div>';
  if (!L.rows.length) {
    h += c.total ? '<div class="empty">No quotation matches.</div>'
      : '<div class="empty">No quotations yet.<br><button class="btn primary" type="button" id="qz_newbtn2" style="margin-top:10px">+ New quotation</button></div>';
  } else {
    h += '<div class="scroll tall" style="margin-top:12px"><table><thead><tr><th>Reference</th><th>Customer · title</th><th>Status</th>' +
      '<th class="num">Amount</th><th>Created</th><th>Updated</th><th></th></tr></thead><tbody>' + L.rows.map(function (r) {
        return '<tr><td class="nm">' + esc(r.reference || '—') + '</td><td>' + esc(r.customer || 'General quotation') + '<br><span class="sku">' + esc(r.title) + '</span></td>' +
          '<td><span class="pill' + (r.status === 'Ready' ? ' ok' : '') + '">' + esc(r.status) + '</span></td>' +
          '<td class="num">' + esc(qzMoney(r.total, r.currency)) + '</td><td class="sku">' + esc(String(r.createdAt).slice(0, 16).replace('T', ' ')) +
          '</td><td class="sku">' + esc(String(r.updatedAt).slice(0, 16).replace('T', ' ')) + '</td><td class="num" style="white-space:nowrap">' +
          '<button class="btn small" type="button" data-qzopen="' + esc(r.id) + '">Open</button> ' +
          '<button class="btn small" type="button" data-qzdup="' + esc(r.id) + '">Duplicate</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      (L.matched > L.rows.length ? '<div class="row" style="margin-top:8px;gap:8px">' +
        (L.offset ? '<button class="btn small" type="button" data-qzpage="-100">Previous</button>' : '') +
        (L.offset + L.rows.length < L.matched ? '<button class="btn small" type="button" data-qzpage="100">Next</button>' : '') +
        '<span class="sku">' + fmt(L.offset + 1) + '–' + fmt(L.offset + L.rows.length) + ' of ' + fmt(L.matched) + '</span></div>' : '');
  }
  return h + '</div></section>';
}

function qzField(id, label, value, opt) {
  opt = opt || {};
  var tag = opt.area ? '<textarea class="i" rows="' + (opt.rows || 3) + '" id="' + id + '" data-qf="' + (opt.key || '') + '"' + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + '>' + esc(value) + '</textarea>'
    : '<input class="i" id="' + id + '" data-qf="' + (opt.key || '') + '" type="' + (opt.type || 'text') + '"' + (opt.mode ? ' inputmode="' + opt.mode + '"' : '') +
      ' value="' + esc(value) + '"' + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + '>';
  return '<div' + (opt.wide ? ' style="grid-column:1/-1"' : '') + '><label class="f" for="' + id + '">' + esc(label) +
    (opt.optional ? ' <span class="sku">(optional)</span>' : '') + '</label>' + tag + '</div>';
}

    }).join('') + '</div><div class="fields">' +
      qzField('qz_title', 'Project title', q.title, { key: 'title', wide: true, ph: 'e.g. 3D printing equipment' }) +
      qzField('qz_cust', 'Customer name', q.customer, { key: 'customer', optional: true }) +
      qzField('qz_contact', 'Contact person', q.contact, { key: 'contact', optional: true }) +
      qzField('qz_email', 'Email', q.email, { key: 'email', optional: true, type: 'email' }) +
      qzField('qz_phone', 'Phone', q.phone, { key: 'phone', optional: true, type: 'tel' }) +

        (mixed ? '<select class="i" aria-label="Kind" data-qi="' + i + '" data-qk="kind"><option' + (it.kind === 'Product' ? ' selected' : '') +

        '<input class="i" aria-label="Rate" inputmode="decimal" data-qi="' + i + '" data-qk="rate" value="' + esc(it.rate) + '">' +
        '<div class="amt" id="qz_amt_' + i + '"><strong>' + qzMoney(qzRound(Number(it.qty) * Number(it.rate)), q.currency) + '</strong></div>' +

      qzField('qz_vat', 'VAT %', q.vat, { key: 'vat', mode: 'decimal' }) +
      qzField('qz_ship', 'Delivery / additional charge', q.shipping, { key: 'shipping', mode: 'decimal' }) +
      qzField('qz_adv', 'Advance requested %', q.advance, { key: 'advance', mode: 'decimal' }) +

      qzField('qz_notes', 'Additional notes', q.notes, { key: 'notes', area: true, wide: true, rows: 3, optional: true }) + '</div>' +
      (sn.length ? '<div class="sub" style="margin-top:8px">Insert from the conditions library: ' + sn.map(function (x, i) {
        return '<button class="btn small" type="button" data-qzsnip="' + i + '">+ ' + esc(x.title) + '</button>'; }).join(' ') + '</div>' : '') +
      '<h3 style="margin-top:16px">Payment accounts</h3>' + qzBankPicker(q) +
      '<h3 style="margin-top:16px">Signatory &amp; look</h3>' +
      '<label class="chk"><input type="checkbox" data-qb="showSignature"' + (q.showSignature ? ' checked' : '') + '> Show the signatory block</label><br>' +
      '<label class="chk"><input type="checkbox" data-qb="useSignature"' + (q.useSignature ? ' checked' : '') + '> Include the signature image</label>' +
      '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">' + ['Signature', 'Executive', 'Minimal'].map(function (t) {
        return '<button class="chip' + (q.theme === t ? ' on' : '') + '" type="button" data-qztheme="' + t + '">' + t + '</button>'; }).join('') +
      '<input type="color" data-qf="accent" value="' + esc(q.accent) + '" title="Accent colour" style="width:48px;height:34px;padding:2px"> ' +
      '<input type="color" data-qf="dark" value="' + esc(q.dark || '#303030') + '" title="Second colour" style="width:48px;height:34px;padding:2px"> ' +
      '<select class="i" data-qf="font" style="width:170px">' + LZ_FONTS.map(function (f) {
        return '<option' + ((q.font || 'Arial') === f ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select> ' +
      '<select class="i" data-qf="fontSize" style="width:150px"><option' + (q.fontSize === 'Comfortable' ? ' selected' : '') + '>Comfortable</option><option' +

    var errs = qzReadiness(q), t = qzTotals(q);
    h += '<h2>Review</h2>' + (errs.length ? '<ul style="color:var(--critical)">' + errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>'
      : '<div class="note" style="margin:10px 0"><div class="ico">✓</div><div>Ready to issue. ' + fmt(q.items.length) + ' item(s), total <strong>' +
        esc(qzMoney(t.total, q.currency)) + '</strong>.</div></div>') +
      (q.company && q.company.takenAt ? '<div class="sub">Business details on this quotation were taken ' + esc(String(q.company.takenAt).slice(0, 10)) +
        '. <label class="chk"><input type="checkbox" id="qz_refreshid"> Use today\'s business details on the next save</label></div>' : '') +
      '<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">' +
      '<button class="btn" type="button" id="qz_save2">Save draft</button>' +

}
function qzPickList() {
  var out = [];
  (CAT || []).forEach(function (p) {
    if (String(p.status || '').toLowerCase() === 'discontinued') return;
    out.push('<option value="' + esc(p.name + ' · ' + p.sku) + '">');
  });
  (QZ.boot.savedItems || []).forEach(function (s) { out.push('<option value="' + esc(s.name + ' · saved item') + '">'); });
  return out.join('');
}
function qzBankPicker(q) {
  var banks = (q.company ? q.company.banks : QZ.boot.profile.banks) || [];
  if (!banks.length) return '<div class="sub">No bank accounts in the business profile' + (QZ.boot.canSettings ? ' — add them in Settings.' : '.') + '</div>';
  return '<label class="chk"><input type="checkbox" data-qb="showBank"' + (q.showBank ? ' checked' : '') + '> Show payment details</label>' +
    '<div style="margin-top:6px">' + banks.map(function (b) {
      return '<label class="chk" style="display:block"><input type="checkbox" data-qbank="' + esc(b.id) + '"' +
        ((q.bankIds || []).indexOf(b.id) >= 0 ? ' checked' : '') + (q.company ? ' disabled' : '') + '> ' + esc(b.bank) + ' · ' + esc(b.number) + '</label>';
    }).join('') + (q.company ? '<div class="sub">Accounts were fixed when this quotation was saved.</div>' : '') + '</div>';
}

function qzCondHtml() {
  if (!QZ.snipDraft) QZ.snipDraft = JSON.parse(JSON.stringify(QZ.boot.snippets || []));
  var can = QZ.boot.canSnippets;
  var h = '<section><div class="card"><h2>Conditions library</h2><div class="sub">Reusable terms. Insert them into a quotation on the Terms step; ' +
    'inserting never replaces what is already written.</div>';
  QZ.snipDraft.forEach(function (sn, i) {
    h += '<div class="qz-item"><div class="fields"><div style="grid-column:1/-1"><label class="f">Title</label><input class="i" data-qsn="' + i + '" data-qsk="title" value="' +
      esc(sn.title) + '"' + (can ? '' : ' readonly') + '></div><div style="grid-column:1/-1"><label class="f">Text</label><textarea class="i" rows="5" data-qsn="' + i +
      '" data-qsk="text"' + (can ? '' : ' readonly') + '>' + esc(sn.text) + '</textarea></div></div>' +
      '<div class="row" style="gap:6px;margin-top:6px"><button class="btn small" type="button" data-qzcopy="' + i + '">Copy</button>' +
      (QZ.quote ? '<button class="btn small" type="button" data-qzins="' + i + '">Insert into the open quotation</button>' : '') +

  });

    '<button class="btn primary" type="button" id="qz_snsave">Save the library</button></div>';
  return h + '</div></section>';
}

    sf('qs_pt', 'Default terms — products', 'productTerms', { area: true, wide: true, rows: 5, optional: true }) +

      ['Minimal', 'Serif name, thin rule'], ['Centered', 'Logo above the name']].map(function (x) {
      return '<button type="button" class="qz-type' + (L.style === x[0] ? ' selected' : '') + '" data-lhstyle="' + x[0] + '"><b>' + x[0] + '</b><small>' + x[1] + '</small></button>';
    }).join('') + '</div><div class="fields">' +
    '<div><label class="f">Colours</label><input type="color" data-lh="accent" value="' + esc(L.accent) + '" title="Accent" style="width:60px;height:38px;padding:2px"> ' +
      '<input type="color" data-lh="dark" value="' + esc(L.dark) + '" title="Second colour" style="width:60px;height:38px;padding:2px"></div>' +
    '<div><label class="f" for="lh_font">Font</label><select class="i" id="lh_font" data-lh="font">' + LZ_FONTS.map(function (f) {
      return '<option' + (L.font === f ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f" for="lh_side">Logo</label><select class="i" id="lh_side" data-lh="logoSide"><option value="left"' + (L.logoSide !== 'right' ? ' selected' : '') +
      '>On the left</option><option value="right"' + (L.logoSide === 'right' ? ' selected' : '') + '>On the right</option></select></div></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" type="button" id="lh_save">Save the letterhead</button></div></div></section>';

  var saved = {};
  (QZ.boot.savedItems || []).forEach(function (x) { saved[x.key] = true; });
  h += '<section><div class="card"><h2>Items from the old quotation app</h2><div class="sub">Recovered from earlier quotations. The prices are <strong>what was quoted then</strong>, ' +
    'shown as a hint only — a quotation never fills them in by itself. No specifications were stored, so descriptions start empty.</div>' +
    '<div class="scroll" style="margin-top:8px"><table><tbody>' + QZ_IMPORT.map(function (it, i) {
      var match = (CAT || []).filter(function (p) { return String(p.name).toLowerCase() === it.name.toLowerCase(); })[0];
      return '<tr><td><input type="checkbox" data-qimp="' + i + '"' + (saved[it.catalogKey] ? ' disabled' : ' checked') + '></td><td class="nm">' + esc(it.name) +
        '<br><span class="sku">' + esc(it.provenance) + '</span></td><td>' + esc(it.kind) + ' · ' + esc(it.unit) + '</td><td class="num">' +
        (it.historicalRate ? 'last quoted ' + fmt(it.historicalRate) : '—') + '</td><td>' + (saved[it.catalogKey] ? '<span class="pill ok">saved</span>'
        : match ? '<span class="pill">same as product ' + esc(match.sku) + '</span>' : '<span class="sku">not in the product list</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div><button class="btn" type="button" id="qs_import" style="margin-top:8px">Save the ticked items</button></div></section>';
  return h;
}

// ---- wiring --------------------------------------------------------------------
function qzEdited(full) {
  QZ.dirty = true; QZ.restored = false;
  if (QZ.quote.status === 'Ready') QZ.quote.status = 'Draft';        // an edit takes it back to draft
  if (QZ.saving) QZ.pendingEdit = true;
  qzKeep();
  var st = el('qz_state'); if (st) st.textContent = qzStateText();
  if (full) repaint(); else qzRefreshPreview();
}
function qzNum(v) { var n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; }

function qzSave(status, then) {
  if (QZ.saving) return;
  var q = JSON.parse(JSON.stringify(QZ.quote));
  q.status = status || 'Draft';
  q.items.forEach(function (it) { delete it.hint; });
  var refresh = !!(el('qz_refreshid') && el('qz_refreshid').checked);
  QZ.saving = true; QZ.pendingEdit = false;
  var st = el('qz_state'); if (st) st.textContent = 'Saving…';
  var key = qzUuid();
  function attempt(n) {
    srv('erpQuoteSave', [{ quote: q, expectedVersion: QZ.version, saveKey: key, refreshIdentity: refresh }], function (r) {
      QZ.saving = false;
      var saved = r.quote;
      if (QZ.pendingEdit) {
        // typed while saving: keep what was typed, take only what the server decided
        QZ.quote.number = saved.number; QZ.quote.company = saved.company; QZ.quote.createdAt = saved.createdAt;
        QZ.version = saved.version; QZ.dirty = true; qzKeep();
        toast('Saved as ' + esc(saved.number) + '. You kept typing, so save again to keep the latest changes.', false, 9000);
        repaint(); return;
      }
      QZ.quote = saved; QZ.version = saved.version; QZ.dirty = false; qzKeep(); qzForget();
      qzLoadAssets(saved.company || {});
      QZ.list = null;
      toast((status === 'Ready' ? 'Ready · ' : 'Saved · ') + esc(saved.number), false, 6000);
      repaint();
      if (then) then(saved);
    }, function (e) {
      var m = String(e && e.message ? e.message : e);
      if (n < 2 && /timed out|network|unavailable|busy/i.test(m)) { attempt(n + 1); return; }   // same key: cannot save twice
      QZ.saving = false; qzKeep();
      var s2 = el('qz_state'); if (s2) s2.textContent = qzStateText();
      toast(esc(m.replace(/^CONFLICT:\s*/, '')) + '<br>Your changes are still here and kept in this browser.', true, 20000);
    });
  }
  attempt(0);
}

/** Print the pages at full size. The print window's "Save as PDF" makes the file; text stays text. */
function qzPrint(q) {
  var box = el('qz_print');
  if (!box) { box = document.createElement('div'); box.id = 'qz_print'; document.body.appendChild(box); }
  qzPaginate(q, box);
  var old = document.title;
  document.title = (q.number || 'Quotation') + (q.title ? ' - ' + q.title : '');
  setTimeout(function () { window.print(); document.title = old; }, 150);
}

function wireQuotes() {
  function each(sel, ev, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener(ev, fn); }
  each('button[data-qzsub]', 'click', function () {
    QZ.sub = this.getAttribute('data-qzsub');
    if (QZ.sub === 'dash') { QZ.list = null; qzLoadList(); }
    if (QZ.sub === 'settings') { QZ.setDraft = null; QZ.profDraft = null; QZ.lhDraft = null; }
    if (QZ.sub === 'conditions') QZ.snipDraft = null;
    repaint();
  });
  if (!QZ.boot) return;

  // ---- dashboard ----
  var q1 = el('qz_q'), st1 = el('qz_st');
  if (q1) q1.addEventListener('keydown', function (e) { if (e.key === 'Enter') { QZ.listQ.search = q1.value; QZ.listQ.offset = 0; QZ.list = null; repaint(); qzLoadList(); } });
  if (st1) st1.addEventListener('change', function () { QZ.listQ.status = st1.value; QZ.listQ.offset = 0; QZ.list = null; repaint(); qzLoadList(); });
  var rf = el('qz_refresh'); if (rf) rf.addEventListener('click', function () { QZ.listQ.search = q1 ? q1.value : ''; QZ.list = null; repaint(); qzLoadList(); });
  async function startNew() {
    if (QZ.dirty && !(await uiConfirm('The open quotation has unsaved changes. Start a new one anyway?'))) return;
    QZ.quote = qzNew(); QZ.version = 0; QZ.dirty = false; QZ.step = 1; QZ.sub = 'new'; QZ.restored = false; qzForget(); repaint();
  }
  ['qz_newbtn', 'qz_newbtn2'].forEach(function (id) { var b = el(id); if (b) b.addEventListener('click', startNew); });
  each('button[data-qzpage]', 'click', function () { QZ.listQ.offset = Math.max(0, (QZ.list.offset || 0) + Number(this.getAttribute('data-qzpage'))); qzLoadList(); });
  each('button[data-qzopen]', 'click', async function () {
    if (QZ.dirty && !(await uiConfirm('The open quotation has unsaved changes. Open another anyway?'))) return;
    srv('erpQuoteGet', [{ id: this.getAttribute('data-qzopen') }], function (q) {
      QZ.quote = q; QZ.version = q.version; QZ.dirty = false; QZ.step = 1; QZ.sub = 'new'; QZ.restored = false;
      qzLoadAssets(q.company || {}); qzForget(); repaint();
    }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
  each('button[data-qzdup]', 'click', async function () {
    if (QZ.dirty && !(await uiConfirm('The open quotation has unsaved changes. Replace it with a copy?'))) return;
    srv('erpQuoteDuplicate', [{ id: this.getAttribute('data-qzdup') }], function (q) {
      QZ.quote = q; QZ.version = 0; QZ.dirty = true; QZ.step = 1; QZ.sub = 'new'; qzKeep(); repaint();
      toast('A copy, not yet saved. It will get its own number when you save.', false, 8000);
    }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });

  // ---- editor ----
  if (QZ.sub === 'new' && QZ.quote) {
    var q = QZ.quote;
    qzRefreshPreview();
    var dsc = el('qz_discard');
    if (dsc) dsc.addEventListener('click', function () { qzForget(); QZ.quote = null; QZ.dirty = false; QZ.restored = false; QZ.sub = 'dash'; QZ.list = null; qzLoadList(); repaint(); });
    each('button[data-qzstep]', 'click', function () { QZ.step = Number(this.getAttribute('data-qzstep')); qzKeep(); repaint(); });
    each('button[data-qzkind]', 'click', function () {
      var k = this.getAttribute('data-qzkind');
      // swap the terms only if nobody changed them from the old kind's default
      if (String(q.terms) === String(qzTermsFor(q.kind))) q.terms = qzTermsFor(k);
      q.kind = k;
      q.items.forEach(function (it) { if (k === 'Products') it.kind = 'Product'; if (k === 'Services') it.kind = 'Service'; });
      qzEdited(true);
    });
    each('[data-qf]', 'input', function () {
      var k = this.getAttribute('data-qf'); if (!k) return;
      var numeric = { discount: 1, vat: 1, shipping: 1, advance: 1 };
      q[k] = numeric[k] ? qzNum(this.value) : this.value;
      if (k === 'date') {
        var d = new Date(q.validUntil + 'T12:00:00Z') - new Date(this.value + 'T12:00:00Z');
        if (!(d >= 0)) q.validUntil = qzAddDays(this.value, QZ.boot.settings.validDays);
      }
      qzEdited(false);
    });
    each('select[data-qf]', 'change', function () { q[this.getAttribute('data-qf')] = this.value; qzEdited(false); });
    each('[data-qi]', 'input', function () {
      var i = Number(this.getAttribute('data-qi')), k = this.getAttribute('data-qk');
      q.items[i][k] = (k === 'qty' || k === 'rate') ? qzNum(this.value) : this.value;
      var a = el('qz_amt_' + i); if (a) a.innerHTML = '<strong>' + qzMoney(qzRound(q.items[i].qty * q.items[i].rate), q.currency) + '</strong>';
      qzEdited(false);
    });
    each('details[data-qzdesc]', 'toggle', function () {
      if (!QZ.descOpen) QZ.descOpen = {};
      QZ.descOpen[Number(this.getAttribute('data-qzdesc'))] = this.open;
    });
    each('select[data-qi]', 'change', function () { q.items[Number(this.getAttribute('data-qi'))].kind = this.value; qzEdited(false); });
    function blank(extra) {
      var svc = q.kind === 'Services';
      var it = { id: qzUuid(), sku: '', name: '', description: '', kind: svc ? 'Service' : 'Product', qty: 1, unit: svc ? 'project' : 'unit', rate: 0 };
      for (var k in extra) if (extra.hasOwnProperty(k)) it[k] = extra[k];
      if (q.items.length >= 150) { toast('A quotation can hold at most 150 items.', true); return; }
      q.items.push(it); qzEdited(true);
    }
    var ai = el('qz_additem'); if (ai) ai.addEventListener('click', function () { blank({}); });
    var pk = el('qz_pick');
    if (pk) pk.addEventListener('change', function () {
      var v = pk.value, sku = v.split(' · ').pop(), name = v.split(' · ')[0];
      var p = (CAT || []).filter(function (x) { return x.sku === sku; })[0];
      if (p) { blank({ sku: p.sku, name: p.name, kind: 'Product', unit: 'unit', rate: Number(p.sell) || 0 }); return; }
      var s2 = (QZ.boot.savedItems || []).filter(function (x) { return x.name === name; })[0];
      if (s2) blank({ name: s2.name, description: s2.description, kind: s2.kind, unit: s2.unit, rate: 0,
                      hint: s2.historicalRate ? 'last quoted ' + fmt(s2.historicalRate) + ' — type today\'s rate' : '' });
    });
    each('button[data-qzdel]', 'click', function () { q.items.splice(Number(this.getAttribute('data-qzdel')), 1); QZ.descOpen = {}; qzEdited(true); });
    each('button[data-qzup]', 'click', function () {
      var i = Number(this.getAttribute('data-qzup')); var x = q.items[i]; q.items[i] = q.items[i - 1]; q.items[i - 1] = x; QZ.descOpen = {}; qzEdited(true);
    });
    each('button[data-qzsnip]', 'click', function () {
      var sn = QZ.boot.snippets[Number(this.getAttribute('data-qzsnip'))];
      q.terms = String(q.terms || '').replace(/\s+$/, '') + (String(q.terms || '').trim() ? '\n' : '') + sn.text;
      qzEdited(true);
    });
    each('input[data-qb]', 'change', function () { q[this.getAttribute('data-qb')] = this.checked; qzEdited(false); });
    each('input[data-qbank]', 'change', function () {
      var id = this.getAttribute('data-qbank'); q.bankIds = (q.bankIds || []).filter(function (x) { return x !== id; });
      if (this.checked) q.bankIds.push(id);
      qzEdited(false);
    });
    each('button[data-qztheme]', 'click', function () { q.theme = this.getAttribute('data-qztheme'); qzEdited(true); });
    ['qz_save', 'qz_save2'].forEach(function (id) { var b = el(id); if (b) b.addEventListener('click', function () { qzSave('Draft'); }); });
    var rd = el('qz_ready');
    if (rd) rd.addEventListener('click', function () { qzSave('Ready', function (saved) { qzPrint(saved); }); });
  }

  // ---- conditions ----
  each('[data-qsn]', 'input', function () { QZ.snipDraft[Number(this.getAttribute('data-qsn'))][this.getAttribute('data-qsk')] = this.value; });
  each('button[data-qzsdel]', 'click', function () { QZ.snipDraft.splice(Number(this.getAttribute('data-qzsdel')), 1); repaint(); });
  each('button[data-qzcopy]', 'click', function () {
    var t = QZ.snipDraft[Number(this.getAttribute('data-qzcopy'))].text;
    try { navigator.clipboard.writeText(t).then(function () { toast('Copied.'); }); } catch (e) { toast('Copy is not allowed here - select the text instead.', true); }
  });
  each('button[data-qzins]', 'click', function () {
    var t = QZ.snipDraft[Number(this.getAttribute('data-qzins'))].text;
    QZ.quote.terms = String(QZ.quote.terms || '').replace(/\s+$/, '') + (String(QZ.quote.terms || '').trim() ? '\n' : '') + t;
    QZ.dirty = true; qzKeep(); toast('Added to the terms of the open quotation.');
  });
  var sa = el('qz_snadd'); if (sa) sa.addEventListener('click', function () { QZ.snipDraft.push({ id: qzUuid(), title: '', text: '' }); repaint(); });
  var ss = el('qz_snsave');
  if (ss) ss.addEventListener('click', function () {
    ss.disabled = true;
    srv('erpQuoteSnippetsSave', [{ snippets: QZ.snipDraft }], function (list) {
      QZ.boot.snippets = list; QZ.snipDraft = null; toast('Library saved.'); repaint();
    }, function (e) { ss.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });

  // ---- settings ----
  each('[data-qp]', 'input', function () { QZ.profDraft[this.getAttribute('data-qp')] = this.value; });
  each('[data-qs]', 'input', function () { QZ.setDraft[this.getAttribute('data-qs')] = this.value; });
  each('select[data-qs]', 'change', function () { QZ.setDraft[this.getAttribute('data-qs')] = this.value; });
  each('input[data-qsb]', 'change', function () { QZ.setDraft[this.getAttribute('data-qsb')] = this.checked; });
  each('[data-qbk]', 'input', function () { QZ.profDraft.banks[Number(this.getAttribute('data-qbk'))][this.getAttribute('data-qbf')] = this.value; });
  each('button[data-qbdel]', 'click', function () { QZ.profDraft.banks.splice(Number(this.getAttribute('data-qbdel')), 1); repaint(); });
  var ba = el('qp_bankadd'); if (ba) ba.addEventListener('click', function () { (QZ.profDraft.banks = QZ.profDraft.banks || []).push({ id: qzUuid(), bank: '', name: '', number: '', branch: '', extra: '' }); repaint(); });
  function upload(inputId, kind) {
    var n = el(inputId);
    if (!n) return;
    n.addEventListener('change', function () {
      var f = n.files && n.files[0];
      if (!f) return;
      if (f.size > 1024 * 1024) { toast('That image is over 1 MB.', true); return; }
      var fr = new FileReader();
      fr.onload = function () {
        var d = String(fr.result);
        srv('erpQuoteAssetUpload', [{ kind: kind, mime: f.type, data: d.slice(d.indexOf(',') + 1) }], function (r) {
          QZ.assets[r.id] = d; QZ.boot.profile = r.profile; qzTrimLogo(r.id);
          if (kind === 'logo') brandSet(r.id, d);
          QZ.profDraft.logoId = r.profile.logoId; QZ.profDraft.signatureId = r.profile.signatureId; QZ.profDraft.qrId = r.profile.qrId;
          toast((kind === 'logo' ? 'Logo' : kind === 'qr' ? 'Bangla QR' : 'Signature') + ' saved.'); repaint();
        }, function (e) { toast(esc(e && e.message ? e.message : e), true, 12000); });
      };
      fr.readAsDataURL(f);
    });
  }
  upload('qp_sig', 'signature'); upload('qp_qr', 'qr');
  var nq = el('qp_noqr'); if (nq) nq.addEventListener('click', function () { QZ.profDraft.clearQr = true; QZ.profDraft.qrId = ''; repaint(); });
  var ns = el('qp_nosig'); if (ns) ns.addEventListener('click', function () { QZ.profDraft.clearSignature = true; QZ.profDraft.signatureId = ''; repaint(); });
  var ps = el('qp_save');
  if (ps) ps.addEventListener('click', function () {
    ps.disabled = true;
    srv('erpQuoteProfileSave', [{ profile: QZ.profDraft }], function (p) {
      QZ.boot.profile = p; QZ.profDraft = null; if (!p.logoId) brandClear(); toast('Business profile saved. New quotations use it; saved ones keep theirs.', false, 9000); repaint();
    }, function (e) { ps.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var qs = el('qs_save');
  if (qs) qs.addEventListener('click', function () {
    qs.disabled = true;
    var s = QZ.setDraft; s.validDays = Number(s.validDays);
    srv('erpQuoteSettingsSave', [{ settings: s, expectedVersion: QZ.boot.settings.version }], function (r) {
      QZ.boot.settings = r; QZ.setDraft = null; toast('Defaults saved.'); repaint();
    }, function (e) { qs.disabled = false; toast(esc(String(e && e.message ? e.message : e).replace(/^CONFLICT:\s*/, '')), true, 12000); });
  });
  each('button[data-lhstyle]', 'click', function () { QZ.lhDraft.style = this.getAttribute('data-lhstyle'); repaint(); });
  each('[data-lh]', 'input', function () { QZ.lhDraft[this.getAttribute('data-lh')] = this.value; });
  each('select[data-lh]', 'change', function () { QZ.lhDraft[this.getAttribute('data-lh')] = this.value; });
  var lhs = el('lh_save');
  if (lhs) lhs.addEventListener('click', function () {
    lhs.disabled = true;
    srv('erpLetterheadSave', [{ letterhead: QZ.lhDraft, expectedVersion: QZ.boot.letterhead.version }], function (r) {
      QZ.boot.letterhead = r; QZ.lhDraft = null; toast('Letterhead saved for this business.'); repaint();
    }, function (e) { lhs.disabled = false; toast(esc(String(e && e.message ? e.message : e).replace(/^CONFLICT:\s*/, '')), true, 12000); });
  });
  var im = el('qs_import');
  if (im) im.addEventListener('click', function () {
    var pick = [];
    each('input[data-qimp]', 'change', function () {});
    var boxes = el('view').querySelectorAll('input[data-qimp]');
    for (var i = 0; i < boxes.length; i++) if (boxes[i].checked && !boxes[i].disabled) pick.push(QZ_IMPORT[Number(boxes[i].getAttribute('data-qimp'))]);
    if (!pick.length) { toast('Nothing ticked.', true); return; }
    im.disabled = true;
    srv('erpQuoteItemsImport', [{ items: pick.map(function (x) {
      var m = (CAT || []).filter(function (p) { return String(p.name).toLowerCase() === x.name.toLowerCase(); })[0];
      var o = JSON.parse(JSON.stringify(x)); o.sku = m ? m.sku : ''; o.requiresReview = true; return o; }) }], function (r) {
      toast(fmt(r.added) + ' added, ' + fmt(r.updated) + ' updated.'); QZ.boot = null; loadQuoteBoot();
    }, function (e) { im.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
}

/* =====================================================================
 * LETTERHEAD DOCUMENTS
 * ---------------------------------------------------------------------
 * A Word letter, put on this business's letterhead. The letter's own
 * text is kept as written - including any address typed inside it; only
 * the header and footer come from the business profile.
 *
 * The design is the business's own: its style, its two colours, its font
 * and which side the logo sits on are set in Quotations -> Settings, and
 * stored in that business's sheet. Two businesses never share a look.
 *
 * The Word file is untrusted: it is read in this browser only, its markup
 * is rebuilt from a short list of safe tags, no external file is fetched,
 * and oversized or malformed archives are refused. Nothing is uploaded.
 * ===================================================================== */
var LZ = { html: '', name: '', warnings: [], size: 14, busy: false, err: '' };
var LZ_LIBS = {

/* =====================================================================
 * CAMPAIGNS
 * ---------------------------------------------------------------------
 * Choose customers with filters, write one message, then go down the list:
 * the ERP opens each customer's chat in YOUR WhatsApp with the message
 * already typed, you press send, and it moves to the next. The message
 * goes from your real number into the chat you already have with them.
 *
 * Nothing sends by itself - that is deliberate. A program that logs into
 * WhatsApp and sends for you is against WhatsApp's rules and gets numbers
 * banned; a person pressing send is simply you using WhatsApp.
 * ===================================================================== */
var CP = { aud: null, err: '', list: null, camp: null, openMode: 'app', copied: '',
           f: { q: '', last: '', pattern: '', due: '', cats: [], minSpent: '', skipRecent: '7', who: 'cust' },
           spread: true, leadText: '', leadSrc: '', leadRes: null, leadBusy: false,
           picked: {}, name: '',
           msg: 'Assalamu alaikum {name},\n\n{business} has fresh stock this month — please see the attached product list.\n\nReply here to order. Thank you!',
           // the product list, when it is attached or written into the message
           prod: { cats: [], stockOnly: true, prices: true, max: 80 },
           // what travels with the message: none, the list as a PDF, the list as a Google Sheet, or a file of your own
           attach: { src: 'pdf', file: null } };

// what the page is showing: which of the four places, and how far a new campaign has got
CP.msg0 = CP.msg;
CP.tab = 'list'; CP.step = 1; CP.when = 'spread'; CP.startOn = ''; CP.ctab = 'leads'; CP.leadQ = ''; CP.editLead = null; CP.msgEdit = null;
CP.connOpen = false; CP.testBusy = false; CP.testPhone = ''; CP.lead1 = { name: '', code: '+880', phone: '' };
try { CP.testPhone = localStorage.getItem('czcp_testphone') || ''; } catch (eTp) {}
function cpLoad() {
  srv('erpCampaignAudience', [], function (r) { CP.aud = r; CP.err = ''; if (VIEW === 'campaigns') repaint(); },
      function (e) { CP.err = (e && e.message) ? e.message : String(e); if (VIEW === 'campaigns') repaint(); });
  srv('erpCampaignList', [], function (r) { CP.list = r; if (VIEW === 'campaigns') repaint(); }, function () {});
  if (!EVO.status) srv('erpEvoStatus', [], function (s) { EVO.status = s; if (VIEW === 'campaigns') repaint(); }, function (e) { EVO.status = { error: e.message }; });
}
function cpBusinessName() {
  var b = BIZ && BIZ.businesses ? BIZ.businesses.filter(function (x) { return x.id === BIZ.active; })[0] : null;
  return (QZ.boot && QZ.boot.profile && QZ.boot.profile.name) || (b && b.name) || '';
}
/** The customers the filters let through. */
function cpFiltered() {
  var f = CP.f, q = f.q.trim().toLowerCase();
  return (CP.aud ? CP.aud.customers : []).filter(function (c) {
    if (c.optedOut) return false;
    if (f.who === 'cust' && c.lead) return false;
    if (f.who === 'lead' && !c.lead) return false;
    if (q && (c.name + ' ' + c.phone + ' ' + (c.source || '')).toLowerCase().indexOf(q) < 0) return false;
    if (f.last === 'never' && c.orders) return false;
    if (/^in\d+$/.test(f.last) && (c.daysSince === null || c.daysSince > Number(f.last.slice(2)))) return false;
    if (/^out\d+$/.test(f.last) && (c.daysSince === null || c.daysSince <= Number(f.last.slice(3)))) return false;
    if (f.pattern === 'once' && c.orders !== 1) return false;
    if (f.pattern === 'repeat' && c.orders < 2) return false;
    if (f.due === 'yes' && !(c.due > 0)) return false;
    if (f.due === 'no' && c.due > 0) return false;
    if (f.minSpent && c.spent < Number(f.minSpent)) return false;
    if (f.cats.length && !f.cats.some(function (x) { return c.cats.indexOf(x) >= 0; })) return false;
    if (f.skipRecent && c.lastMessagedDays !== null && c.lastMessagedDays < Number(f.skipRecent)) return false;
    return true;
  });
}
/** The product list, as WhatsApp text: bold categories, one line per product. */
function cpProducts() {
  var p = CP.prod, by = {}, n = 0;
  (CAT || []).forEach(function (x) {
    if (String(x.status || '').toLowerCase() === 'discontinued') return;
    if (p.stockOnly && !(x.stock > 0)) return;
    if (p.cats.length && p.cats.indexOf(x.cat) < 0) return;
    (by[x.cat || 'Other'] = by[x.cat || 'Other'] || []).push(x);
  });
  var out = [];
  Object.keys(by).sort().forEach(function (c) {
    if (n >= p.max) return;
    out.push('*' + c + '*');
    by[c].sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); }).forEach(function (x) {
      if (n >= p.max) return;
      out.push('• ' + x.name + (p.prices && x.sell ? ' — ৳' + fmt(x.sell) : ''));
      n++;
    });
    out.push('');
  });
  return { text: out.join('\n').replace(/\n+$/, ''), count: n };
}
function cpMessageFor(c, template, products) {
  return String(template || '').replace(/\{name\}/g, String(c.name || '').trim())
    .replace(/\{business\}/g, cpBusinessName()).replace(/\{products\}/g, products)
    .replace(/ ,/g, ',').replace(/Assalamu alaikum ,/g, 'Assalamu alaikum,');
}
function cpLink(wa, text) {
  var t = encodeURIComponent(text);
  if (CP.openMode === 'web') return 'https://web.whatsapp.com/send?phone=' + wa + '&text=' + t;
  if (CP.openMode === 'phone') return 'https://wa.me/' + wa + '?text=' + t;
  return 'whatsapp://send?phone=' + wa + '&text=' + t;
}
/** What the attachment is called on screen. */
function cpAttachLabel() {
  var a = CP.attach;
  if (a.src === 'pdf') return 'Product list (PDF)';
  if (a.src === 'sheet') return 'Product list (spreadsheet file)';
  if (a.src === 'file') return a.file ? a.file.name : 'your file';
  return '';
}
/** The count of products the attached list will hold, from the current choices. */
function cpListCount() {
  var p = CP.prod, n = 0;
  (CAT || []).forEach(function (x) {
    if (String(x.status || '').toLowerCase() === 'discontinued') return;
    if (p.stockOnly && !(x.stock > 0)) return;
    if (p.cats.length && p.cats.indexOf(x.cat) < 0) return;

/**
 * Make the attachment ready for the chosen way of sending, then hand back
 * what to do with it: a link to add to the message, a file to attach, or
 * nothing.  mode: 'hand' (a link, since a chat link cannot carry a file),
 * 'evo' (a real attachment where the server can send one).
 */
function cpResolveAttach(mode, done, fail) {
  var a = CP.attach;
  if (a.src === 'none') { done({}); return; }
  if (a.src === 'file') {
    if (!a.file) { fail('Attach the file first.'); return; }
    if (mode === 'evo') { done({ file: a.file }); return; }
    srv('erpShareFile', [{ fileId: a.file.fileId }], function (r) { done({ link: r.url, linkName: r.name }); }, function (e) { fail(e && e.message ? e.message : e); });
    return;
  }
  var opts = { cats: CP.prod.cats, prices: CP.prod.prices, stockOnly: CP.prod.stockOnly };
  if (a.src === 'pdf' && mode === 'evo') {
    srv('erpWaProductPdf', [opts], function (r) { done({ file: { fileId: r.fileId, name: r.name, mime: 'application/pdf' } }); }, function (e) { fail(e && e.message ? e.message : e); });
    return;
  }
  opts.kind = a.src;
  srv('erpProductListShare', [opts], function (r) { done({ link: r.url, linkName: r.name }); }, function (e) { fail(e && e.message ? e.message : e); });
}
function cpWithLink(text, res) {
  return res && res.link ? text.replace(/\s+$/, '') + '\n\n📎 ' + (res.linkName || 'Product list') + ':\n' + res.link : text;
}

      '<button class="btn primary" type="button" data-cpmark="sent" data-cpk="' + esc(cur.key) + '">2 · Sent ✓ — next</button>' +

      '<button class="btn" type="button" data-cpstop="' + esc(cur.key) + '" data-cpn="' + esc(cur.name) + '" data-cpp="' + esc(cur.phone) + '">Asked to stop</button></div></div>';
  } else h += '<div class="note ok" style="margin-top:12px"><div class="ico">✓</div><div>Everyone in this campaign has been done.</div></div>';
  h += '<div class="scroll tall" style="margin-top:12px"><table><tbody>' + R.map(function (r) {
    return '<tr><td class="nm">' + esc(r.name || '—') + '<br><span class="sku">' + esc(r.phone) + '</span></td><td>' +
      (r.status === 'sent' ? '<span class="pill ok">✓ sent</span>' : r.status === 'skipped' ? '<span class="pill">skipped</span>' : '<span class="pill low">waiting</span>') +
      (r.at && r.status !== 'waiting' ? ' <span class="sku">' + esc(r.at) + ' · ' + esc(r.by) + '</span>' : '') + '</td><td class="num">' +
      (r.status !== 'waiting' ? '<button class="btn small" type="button" data-cpmark="waiting" data-cpk="' + esc(r.key) + '">Put back</button>' : '') + '</td></tr>';
  }).join('') + '</tbody></table></div></div></section>';
  return h;
}

    '<button class="btn small" type="button" id="cp_refresh">Refresh</button><button class="btn small" type="button" id="cp_back">← All campaigns</button></div>' +
    '<div class="sub">Sent through your WhatsApp server · started ' + esc(c.created) + ' · ' + esc(c.by) + '</div>' +
    '<div class="grid g-kpi" style="margin:10px 0">' + kpiT('Sent', '', fmt(n('sent')), '', 'good') + kpiT('Waiting', '', fmt(n('waiting')), '', n('waiting') ? 'accent' : '') +
    kpiT('Failed', '', fmt(n('failed')), '', n('failed') ? 'bad' : '') + kpiT('Skipped', '', fmt(n('skipped')), '<span class="delta">asked to stop, or messaged lately</span>') + '</div>' +
    '<div class="bar"><div style="width:' + Math.round(done / Math.max(1, R.length) * 100) + '%"></div></div>' +
    (WA.prog ? '<div class="note" style="margin-top:8px"><div class="ico">…</div><div>' + esc(WA.prog) + '</div></div>' : '');
  if (c.spread && n('waiting')) {
    var future = c.spread.start && c.spread.start > todayISO();
    h += (c.spread.paused
        ? '<div class="note err" style="margin-top:8px"><div class="ico">✕</div><div><strong>Paused.</strong> ' + esc(c.spread.why || '') + ' Nothing more is sent until you press Resume.</div></div>'
        : '<div class="note ok" style="margin-top:8px"><div class="ico">✓</div><div><strong>' + (future ? 'Scheduled for ' + esc(c.spread.start) + '.' : 'Sending by itself') + '</strong>' + (future ? ' It then sends' : ',') + ' a few at a time between ' + cpHour(c.spread.from) + ' and ' + cpHour(c.spread.to) + '. ' +
          (c.spread.last ? 'Last sent ' + esc(c.spread.last) + '. ' : future ? '' : 'The first ones go within about ten minutes, inside those hours. ') +
          (R.some(function (r) { return r.lead && r.status === 'waiting'; }) ? 'Leads: at most ' + fmt(c.spread.leadDaily) + ' a day. ' : '') + 'You can close this page.</div></div>') +
      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn' + (c.spread.paused ? ' primary' : '') + '" type="button" id="cp_pause" data-pause="' + (c.spread.paused ? '0' : '1') + '">' + (c.spread.paused ? 'Resume' : 'Pause') + '</button></div>';
  }
  h += '<div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">' +
    (!c.spread && n('waiting') ? '<button class="btn primary" type="button" id="wa_rest"' + (WA.busy ? ' disabled' : '') + '>Send to the ' + fmt(n('waiting')) + ' still waiting</button>' : '') +
    (n('failed') ? '<button class="btn" type="button" id="cp_retry">Try the ' + fmt(n('failed')) + ' failed again</button>' : '') + '</div>' +
    '<div class="scroll tall" style="margin-top:12px"><table><tbody>' + R.map(function (r) {
      return '<tr><td class="nm">' + esc(r.name || '—') + (r.lead ? ' <span class="pill">lead</span>' : '') + '<br><span class="sku">' + esc(r.phone) + '</span></td><td>' +
        (r.status === 'sent' ? '<span class="pill ok">✓ sent</span> <span class="sku">' + esc(r.at) + '</span>' : r.status === 'failed' ? '<span class="pill out">failed</span>' :
         r.status === 'skipped' ? '<span class="pill">skipped</span>' : '<span class="pill low">waiting</span>') +
        (r.status === 'failed' || r.status === 'skipped' ? ' <span class="sku">' + esc(String(r.by).split(' · ').slice(1).join(' · ')) + '</span>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div></section>';
  return h;
}

/** Start again from an old campaign: its message and the same people, as far as they are still on the lists. */
function cpDuplicate(id) {
  srv('erpCampaignGet', [{ id: id }], function (c) {
    cpFresh();
    var m = String(c.message || ''), text = m;
    if (m.indexOf('EVO:') === 0) { try { text = JSON.parse(m.slice(4)).text || ''; } catch (e) { text = ''; } }
    CP.msg = String(text).replace(/\n\n📎 [^\n]*:\nhttps?:\/\/\S+\s*$/, ''); CP.name = c.name + ' (again)'; CP.attach.src = 'none';
    var have = {}; CP.aud.customers.forEach(function (x) { if (!x.optedOut) have[x.key] = x; });
    c.recipients.forEach(function (r) { if (have[r.key]) CP.picked[r.key] = true; });
    CP.f.who = 'both'; CP.f.skipRecent = ''; CP.camp = null; CP.tab = 'new'; CP.step = 1; cpDraftSave(); repaint(); window.scrollTo(0, 0);
    toast('Copied. ' + fmt(Object.keys(CP.picked).length) + ' of ' + fmt(c.recipients.length) + ' people are still on your lists. Choose the attachment again in step 2.', false, 9000);
  }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
}

function cpExport(c) {
  var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = 'Name,Phone,Status,When,Note\r\n' + c.recipients.map(function (r) {
    return [q(r.name), q('="' + r.phone + '"'), q(r.status), q(r.at), q(String(r.by || '').split(' · ').slice(1).join(' · '))].join(','); }).join('\r\n');
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF) + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = String(c.name || 'campaign').replace(/[^\w\- ]+/g, '') + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Saved as a spreadsheet file (CSV).');
  } catch (e) { toast('This browser would not save the file.', true); }
}

function wireCampaigns() {
  function each(sel, ev, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener(ev, fn); }
  function bad(e) { toast(esc(e && e.message ? e.message : e), true, 12000); repaint(); }
  function keepMsg() { var m = el('cp_msg'); if (m) CP.msg = m.value; var nm = el('cp_name'); if (nm) CP.name = nm.value; }
  function reloadAud(then) { srv('erpCampaignAudience', [], function (a2) { CP.aud = a2; if (then) then(); if (VIEW === 'campaigns') repaint(); }, function () {}); }
  function savedOf(kind, id) { return ((CP.aud.saved && CP.aud.saved[kind]) || []).filter(function (x) { return x.id === id; })[0]; }

  each('button[data-go]', 'click', function () { go(this.getAttribute('data-go')); window.scrollTo(0, 0); });
  each('[data-cptab]', 'click', function () {
    keepMsg(); var t = this.getAttribute('data-cptab');
    if (t === 'new' && CP.tab !== 'new' && !Object.keys(CP.picked).length && CP.msg === CP.msg0) cpFresh();
    CP.tab = t; CP.camp = null; if (t === 'list') { CP.list = null; srv('erpCampaignList', [], function (r) { CP.list = r; if (VIEW === 'campaigns') repaint(); }, function () {}); }
    repaint(); window.scrollTo(0, 0);
  });
  var conn = el('cp_conn'); if (conn) conn.addEventListener('click', function () { keepMsg(); CP.connOpen = !CP.connOpen; repaint(); });
  var lk = el('cp_link'); if (lk) lk.addEventListener('click', function () { lk.disabled = true; evoLinkStart(); });
  var sh = el('cp_stophook');
  if (sh) sh.addEventListener('click', function () {
    sh.disabled = true;
    srv('erpEvoStopHook', [{ off: sh.getAttribute('data-off') === '1' }], function (s) { EVO.status = s; toast(s.stopHook ? 'On. A reply of STOP now takes that person off the list.' : 'Off.'); repaint(); }, bad);
  });
  each('button[data-cpopen]', 'click', function () {
    srv('erpCampaignGet', [{ id: this.getAttribute('data-cpopen') }], function (c) { CP.camp = c; repaint(); window.scrollTo(0, 0); }, bad);
  });
  each('button[data-cpdup]', 'click', function () { cpDuplicate(this.getAttribute('data-cpdup')); });
  var dg = el('cp_draftgo'); if (dg) dg.addEventListener('click', function () { var d = cpDraftRead(); if (d) cpDraftOpen(d); repaint(); });
  var dd = el('cp_draftdel'); if (dd) dd.addEventListener('click', function () { cpDraftClear(); cpFresh(); repaint(); });

  // ---- one campaign, opened ----
  if (CP.camp) {
    var back = el('cp_back'); if (back) back.addEventListener('click', function () { CP.camp = null; CP.tab = 'list'; CP.list = null; cpLoad(); repaint(); });
    var ex = el('cp_export'); if (ex) ex.addEventListener('click', function () { cpExport(CP.camp); });
    var pz = el('cp_pause');
    if (pz) pz.addEventListener('click', function () {
      pz.disabled = true;
      srv('erpCampaignPause', [{ id: CP.camp.id, pause: pz.getAttribute('data-pause') === '1' }], function (full) { CP.camp = full; repaint(); }, bad);
    });
    var rf = el('cp_refresh');
    if (rf) rf.addEventListener('click', function () { srv('erpCampaignGet', [{ id: CP.camp.id }], function (full) { CP.camp = full; repaint(); }, function () {}); });
    var rt = el('cp_retry');
    if (rt) rt.addEventListener('click', function () {
      rt.disabled = true;
      srv('erpCampaignRetry', [{ id: CP.camp.id }], function (full) { CP.camp = full; toast('Put back in the queue.'); repaint(); }, bad);
    });
    var rest = el('wa_rest');
    if (rest) rest.addEventListener('click', async function () {
      if (!(await uiConfirm('Send to everyone still waiting?'))) return;
      WA.busy = true; WA.sent = 0; WA.failed = 0; WA.prog = 'Sending…'; repaint();
      campRun('erpEvoSendBatch', CP.camp.id, function () {
        WA.busy = false;
        srv('erpCampaignGet', [{ id: CP.camp.id }], function (full) { CP.camp = full; WA.prog = null; repaint(); }, function () {});
      });
    });
    each('button[data-cpmode]', 'click', function () { CP.openMode = this.getAttribute('data-cpmode'); try { localStorage.setItem('czwa_mode', CP.openMode); } catch (e) {} repaint(); });
    each('button[data-cpmark]', 'click', function () {
      var key = this.getAttribute('data-cpk'), st = this.getAttribute('data-cpmark');
      CP.camp.recipients.forEach(function (r) { if (r.key === key) { r.status = st; r.at = 'now'; r.by = ME ? ME.name : ''; } });
      repaint();
      srv('erpCampaignMark', [{ id: CP.camp.id, key: key, status: st }], function () {}, function (e) { toast('Could not record that: ' + esc(e && e.message ? e.message : e), true, 10000); });
    });
  }

  // ---- new campaign ----
  each('[data-cpstep]', 'click', function () {
    keepMsg(); var to = Number(this.getAttribute('data-cpstep'));
    for (var s = 1; s < to; s++) { var p = cpStepProblem(s); if (p) { toast(esc(p), true); to = s; break; } }
    CP.step = to; cpDraftSave(); repaint(); window.scrollTo(0, 0);
  });
  var nx = el('cp_next'); if (nx) nx.addEventListener('click', function () { keepMsg(); var p = cpStepProblem(CP.step); if (p) { toast(esc(p), true); return; } CP.step++; cpDraftSave(); repaint(); window.scrollTo(0, 0); });
  // who
  each('button[data-cpwho]', 'click', function () { CP.f.who = this.getAttribute('data-cpwho'); repaint(); });
  var q = el('cp_q'); if (q) q.addEventListener('change', function () { CP.f.q = q.value; repaint(); });
  each('[data-cpf]', 'change', function () { CP.f[this.getAttribute('data-cpf')] = this.value; repaint(); });
  each('button[data-cpcat]', 'click', function () { var c = this.getAttribute('data-cpcat'), i = CP.f.cats.indexOf(c); if (i >= 0) CP.f.cats.splice(i, 1); else CP.f.cats.push(c); repaint(); });
  each('input[data-cppick]', 'change', function () { CP.picked[this.getAttribute('data-cppick')] = this.checked; cpDraftSave(); repaint(); });
  var all = el('cp_all'); if (all) all.addEventListener('click', function () { cpFiltered().forEach(function (c) { CP.picked[c.key] = true; }); cpDraftSave(); repaint(); });
  var none = el('cp_none'); if (none) none.addEventListener('click', function () { CP.picked = {}; cpDraftSave(); repaint(); });
  function useGroup(id) {
    var g = savedOf('groups', id); if (!g) return;
    CP.f = Object.assign({ q: '', last: '', pattern: '', due: '', cats: [], minSpent: '', skipRecent: '', who: 'cust' }, g.filter); CP.f.cats = (g.filter.cats || []).slice();
    CP.picked = {}; cpFiltered().forEach(function (c) { CP.picked[c.key] = true; });
    toast(esc(g.name) + ': ' + fmt(Object.keys(CP.picked).length) + ' people chosen.');
  }
  each('button[data-cpgroup]', 'click', function () { useGroup(this.getAttribute('data-cpgroup')); cpDraftSave(); repaint(); });
  var sg = el('cp_savegroup');
  if (sg) sg.addEventListener('click', async function () {
    var name = (await uiPrompt('Name for this group (the filters are saved, so it always holds whoever fits):', ''));
    if (!name || !name.trim()) return;
    srv('erpCampGroupSave', [{ name: name.trim(), filter: CP.f }], function (s) { CP.aud.saved = s; toast('Group saved.'); repaint(); }, bad);
  });
  // message
  var nm = el('cp_name'); if (nm) nm.addEventListener('input', function () { CP.name = nm.value; });
  var msg = el('cp_msg'); if (msg) msg.addEventListener('change', function () { CP.msg = msg.value; cpDraftSave(); repaint(); });
  var sv = el('cp_saved');
  if (sv) sv.addEventListener('change', async function () {
    var m = savedOf('messages', sv.value); if (!m) return;
    if (CP.msg !== CP.msg0 && CP.msg.trim() && (el('cp_msg').value !== m.text) && !(await uiConfirm('Replace what is written with "' + m.name + '"?'))) { sv.value = ''; return; }
    CP.msg = m.text; CP.attach.src = m.attach || 'none'; if (!CP.name) CP.name = m.name; cpDraftSave(); repaint();
  });
  var sm = el('cp_savemsg');
  if (sm) sm.addEventListener('click', async function () {
    keepMsg();
    var name = (await uiPrompt('Name for this saved message:', CP.name || ''));
    if (!name || !name.trim()) return;
    srv('erpCampMsgSave', [{ name: name.trim(), text: CP.msg, attach: CP.attach.src }], function (s) { CP.aud.saved = s; toast('Saved.'); repaint(); }, bad);
  });
  each('button[data-cpatt]', 'click', function () { keepMsg(); CP.attach.src = this.getAttribute('data-cpatt'); cpDraftSave(); repaint(); });
  each('button[data-cppc]', 'click', function () { keepMsg(); var c = this.getAttribute('data-cppc'), i = CP.prod.cats.indexOf(c); if (i >= 0) CP.prod.cats.splice(i, 1); else CP.prod.cats.push(c); repaint(); });
  var stk = el('cp_stock'); if (stk) stk.addEventListener('change', function () { keepMsg(); CP.prod.stockOnly = stk.checked; repaint(); });
  var pr = el('cp_prices'); if (pr) pr.addEventListener('change', function () { keepMsg(); CP.prod.prices = pr.checked; repaint(); });
  var fi = el('cp_file');
  if (fi) fi.addEventListener('change', function () {
    var f = fi.files && fi.files[0]; if (!f) return;
    if (f.size > 10 * 1024 * 1024) { toast('That file is over 10 MB.', true); return; }
    keepMsg();
    var fr = new FileReader();
    fr.onload = function () {
      var d = String(fr.result);
      toast('Uploading…', false, 20000);
      srv('erpEvoUpload', [{ mime: f.type, name: f.name, data: d.slice(d.indexOf(',') + 1) }], function (a) { CP.attach.file = a; toast('Attached.'); repaint(); }, bad);
    };
    fr.readAsDataURL(f);
  });
  // when
  each('input[data-cpwhen]', 'change', function () { CP.when = this.getAttribute('data-cpwhen'); cpDraftSave(); repaint(); });
  var so = el('cp_starton'); if (so) so.addEventListener('change', function () { CP.startOn = so.value; cpDraftSave(); repaint(); });
  // review
  var tp = el('cp_testphone'); if (tp) tp.addEventListener('input', function () { CP.testPhone = tp.value; try { localStorage.setItem('czcp_testphone', tp.value); } catch (e) {} });
  var ts = el('cp_test');
  if (ts) ts.addEventListener('click', function () {
    var tr = String(CP.testPhone || '').trim(), ph = (tr.charAt(0) === '+' ? '+' : '') + tr.replace(/\D/g, '');
    if (!/^01[3-9]\d{8}$/.test(ph) && !/^\+[1-9]\d{7,14}$/.test(ph)) { toast('Type your own number first: 11 digits starting with 01, or + and the country code for a number abroad.', true, 9000); return; }
    CP.testBusy = true; WA.busy = true; repaint();
    var P = cpPicked(), lead = P[0] && P[0].lead;
    cpResolveAttach('evo', function (res) {
      var text = cpWithLink(cpMessageFor(P[0] || { name: 'Karim' }, CP.msg, cpProducts().text), res) + (lead ? '\n\nReply STOP to stop these messages.' : '');
      srv('erpEvoSendTest', [{ phone: ph, text: text, attach: res.file || null }], function () { CP.testBusy = false; WA.busy = false; toast('Test sent to ' + esc(ph) + '. Look at your phone.', false, 8000); repaint(); },
          function (e) { CP.testBusy = false; WA.busy = false; bad(e); });
    }, function (m) { CP.testBusy = false; WA.busy = false; toast(esc(m), true, 12000); repaint(); });
  });
  var go2 = el('cp_go');
  if (go2) go2.addEventListener('click', async function () {
    var P = cpPicked(), list = P.map(function (c) { return { key: c.key, name: c.name, phone: c.phone }; });
    var name = CP.name || ('Campaign ' + todayISO());
    if (CP.when === 'hand') {
      if (!(await uiConfirm('Start "' + name + '" for ' + list.length + ' people?\n\nYou will open each chat and press send yourself.'))) return;
      WA.busy = true; WA.prog = CP.attach.src === 'none' ? 'Starting…' : 'Preparing the attachment…'; repaint();
      cpResolveAttach('hand', function (res) {
        srv('erpCampaignCreate', [{ name: name, message: cpWithLink(CP.msg, res), recipients: list }], function (c) {
          WA.busy = false; WA.prog = null; CP.camp = c; cpDraftClear(); cpFresh(); repaint(); window.scrollTo(0, 0);
        }, function (e) { WA.busy = false; WA.prog = null; bad(e); });
      }, function (m) { WA.busy = false; WA.prog = null; toast(esc(m), true, 12000); repaint(); });
      return;
    }
    var spread = CP.when !== 'now';
    if (!(await uiConfirm((CP.when === 'date' ? 'Schedule "' + name + '" for ' + CP.startOn + ', ' + list.length + ' people?' : spread ? 'Start sending "' + name + '" to ' + list.length + ' people, spread through the day?'
      : 'Send "' + name + '" to ' + list.length + ' people now, all at once?') + '\n\n' + EVO_WARN))) return;
    WA.busy = true; WA.sent = 0; WA.failed = 0; WA.prog = 'Preparing…'; repaint();
    cpResolveAttach('evo', function (res) {
      var text = cpWithLink(cpMessageFor({ name: '{name}' }, CP.msg, cpProducts().text), res);
      srv('erpEvoCampaignStart', [{ name: name, text: text, attach: res.file || null, recipients: list, spread: spread, startOn: CP.when === 'date' ? CP.startOn : '' }], function (c) {
        cpDraftClear(); cpFresh();
        if (c.spread) {                                   // the timer does the sending: show where it stands and let go
          WA.busy = false; WA.prog = null; CP.camp = c; repaint(); window.scrollTo(0, 0);
          toast(c.spread.start && c.spread.start > todayISO() ? 'Scheduled. It starts by itself on ' + esc(c.spread.start) + '.' : 'Started. It sends by itself; you can close this page.', false, 8000);
          return;
        }
        CP.camp = c; WA.prog = 'Sending…'; repaint(); window.scrollTo(0, 0);
        campRun('erpEvoSendBatch', c.id, function () {
          WA.busy = false;
          srv('erpCampaignGet', [{ id: c.id }], function (full) { CP.camp = full; WA.prog = null; repaint(); }, function () {});
        });
      }, function (e) { WA.busy = false; WA.prog = null; bad(e); });
    }, function (m) { WA.busy = false; WA.prog = null; toast(esc(m), true, 12000); repaint(); });
  });

  // ---- contacts ----
  each('button[data-cpctab]', 'click', function () { CP.ctab = this.getAttribute('data-cpctab'); CP.editLead = null; repaint(); });
  var lt = el('cp_leadtext'); if (lt) lt.addEventListener('input', function () { CP.leadText = lt.value; });

  each('button[data-cpleadrm]', 'click', async function () {

  each('button[data-cpgroupuse]', 'click', function () { cpFresh(); useGroup(this.getAttribute('data-cpgroupuse')); CP.tab = 'new'; CP.step = 1; cpDraftSave(); repaint(); window.scrollTo(0, 0); });
  each('button[data-cpgroupdel]', 'click', async function () {

  });
  each('button[data-cpstop]', 'click', async function () {

    srv('erpCampaignOptOut', [{ key: key, name: n, phone: this.getAttribute('data-cpp') }], function () {

/* ---- Evolution API: the owner's own WhatsApp server ------------------------- */
var WA = { mode: 'hand', busy: false, prog: null, sent: 0, failed: 0 };   // how a campaign is being sent, and how far it has got
var EVO = { status: null, qr: null, qrTimer: null };
var EVO_WARN = 'If your Evolution server is connected by scanning a QR code (WhatsApp Web), this is not an official WhatsApp connection. ' +
  'WhatsApp can restrict or ban that number, especially for offers sent to many people. Use a second number, not the one you chat with customers on.';

function evoSettingsHtml() {
  if (!ME || ME.role !== 'owner') return '';
  var s = EVO.status || {};
  return '<section><div class="card"><h2>WhatsApp (Evolution API server)</h2>' +
    '<div class="sub">Your own Evolution API server, for sending campaigns from a number logged in there. Kept for <strong>this business</strong> only; ' +
    'the API key is never shown again.</div>' +
    '<div class="note warn" style="margin:10px 0"><div class="ico">!</div><div>' + esc(EVO_WARN) + '</div></div>' +
    (s.connected ? '<div class="note ok" style="margin-bottom:10px"><div class="ico">✓</div><div>Connected: instance <strong>' + esc(s.instance) + '</strong> is logged in.</div></div>'
      : s.needsLink ? '<div class="note" style="margin-bottom:10px"><div class="ico">▲</div><div><strong>Server connected. One step left:</strong> press <strong>Link a WhatsApp number (QR code)</strong> below and scan it with the phone.</div></div>'
      : (s.error ? '<div class="note err" style="margin-bottom:10px"><div class="ico">✕</div><div>' + esc(s.error) + '</div></div>' : '')) +
    '<div class="fields"><div style="grid-column:1/-1"><label class="f" for="evo_url">Server address</label><input class="i" id="evo_url" autocomplete="off" value="' + esc(s.url || '') + '" placeholder="https://wa.yourdomain.com"></div>' +
    '<div><label class="f" for="evo_inst">Instance name</label><input class="i" id="evo_inst" autocomplete="off" value="' + esc(s.instance || '') + '"></div>' +
    '<div><label class="f" for="evo_key">API key</label><input class="i" id="evo_key" type="password" autocomplete="off" placeholder="' + (s.hasKey ? '•••••••• already set' : 'from your Evolution server') + '"></div></div>' +
    '<div class="row" style="gap:8px;margin-top:10px;justify-content:flex-end;flex-wrap:wrap">' + (s.configured ? '<button class="btn" type="button" id="evo_clear">Disconnect</button>' : '') +
    (s.configured && !s.connected ? '<button class="btn" type="button" id="evo_qr">Link a WhatsApp number (QR code)</button>' : '') +
    (s.connected ? '<button class="btn" type="button" id="evo_logout">Log the number out</button>' : '') +
    '<button class="btn primary" type="button" id="evo_save">Save and test</button></div>' +
    (EVO.qr ? '<div style="margin-top:12px;text-align:center"><div class="sub">On the phone with the <strong>second</strong> number: WhatsApp → Linked devices → Link a device, then scan. ' +
      'The code refreshes by itself.</div><img src="' + esc(EVO.qr) + '" alt="QR code" style="width:260px;height:260px;background:#fff;padding:8px;border-radius:8px;margin-top:8px"></div>' : '') +
    '</div></section>';
}
/** Ask the server for a fresh QR code every few seconds until the phone has scanned it. */
function evoLinkStart() {
  clearTimeout(EVO.qrTimer);
  var here = VIEW;
  (function poll(n) {
    srv('erpEvoQr', [], function (r) {
      if (r.connected) {
        EVO.qr = null; clearTimeout(EVO.qrTimer);
        srv('erpEvoStatus', [], function (s) { EVO.status = s; toast('WhatsApp linked.'); if (VIEW === here) repaint(); }, function () {});
        return;
      }
      EVO.qr = r.qr; if (VIEW === here) repaint();
      if (n < 20 && VIEW === here) EVO.qrTimer = setTimeout(function () { poll(n + 1); }, 15000);
      else { EVO.qr = null; if (VIEW === here) repaint(); }
    }, function (e) { EVO.qr = null; toast(esc(e && e.message ? e.message : e), true, 12000); if (VIEW === here) repaint(); });
  })(0);
}
function wireEvoSettings() {
  if (!EVO.status && ME && ME.role === 'owner') {
    EVO.status = {};
    srv('erpEvoStatus', [], function (s) { EVO.status = s; if (VIEW === 'settings') repaint(); }, function () {});
  }
  var sv = el('evo_save');
  if (sv) sv.addEventListener('click', function () {
    sv.disabled = true; sv.textContent = 'Testing…';
    srv('erpEvoSetup', [{ url: el('evo_url').value, instance: el('evo_inst').value, key: el('evo_key').value }], function (s) {
      EVO.status = s; toast(s.connected ? 'WhatsApp connected.' : s.needsLink ? 'Saved. Now press Link a WhatsApp number and scan the QR code.' : esc(s.error || 'Saved, but not ready yet.'), !s.connected && !s.needsLink, 12000); repaint();
    }, function (e) { sv.disabled = false; sv.textContent = 'Save and test'; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var qb = el('evo_qr'); if (qb) qb.addEventListener('click', function () { qb.disabled = true; evoLinkStart(); });
  var lo = el('evo_logout');
  if (lo) lo.addEventListener('click', async function () {
    if (!(await uiConfirm('Log this WhatsApp number out of the server? Campaigns cannot be sent until it is linked again.'))) return;
    srv('erpEvoLogout', [], function (s) { EVO.status = s; repaint(); }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
  var cl = el('evo_clear');
  if (cl) cl.addEventListener('click', async function () {
    if (!(await uiConfirm('Disconnect the Evolution server for this business?'))) return;
    srv('erpEvoSetup', [{ clear: true }], function () { EVO.status = null; repaint(); }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
}

/** Send a started campaign a batch at a time until nobody is left or it must stop. */
function campRun(fn, id, done) {
  srv(fn, [{ id: id, max: 25 }], function (r) {
    WA.sent = (WA.sent || 0) + r.sent; WA.failed = (WA.failed || 0) + r.failed;
    WA.prog = 'Sent ' + fmt(WA.sent) + (WA.failed ? ' · failed ' + fmt(WA.failed) : '') + ' · ' + fmt(r.left) + ' left';
    if (r.errors.length) toast(esc(r.errors.join(' · ')), true, 15000);
    if (VIEW === 'campaigns') repaint();
    if (r.left > 0 && !r.stopped) campRun(fn, id, done); else done(r);
  }, function (e) { WA.busy = false; toast(esc(e && e.message ? e.message : e), true, 15000); done(null); });
}
function viewSales() {
  var cur = OPT ? OPT.currency : 'BDT';
