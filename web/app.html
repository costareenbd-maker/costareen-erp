/**
 * The waiting room: orders that still have to be entered with Steadfast.
 *
 * It sits above everything else on the Sales screen and holds nothing but
 * those. Booking one - or setting it aside - takes it out of here; the sale
 * itself stays in the list below, where it now shows as sent. When nothing
 * is waiting the room is not drawn at all, so an empty box never trains the
 * eye to skip it.
 */
function salesWaitingHtml() {
  var list = (SALES && SALES.toSend) || [];
  if (!list.length) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section><div class="card" style="border:2px solid var(--serious)">' +
    '<h2>Waiting for Steadfast <span class="pill low">' + fmt(list.length) + '</span></h2>' +
    '<div class="sub">These orders go by courier and have not been entered with Steadfast yet. ' +

    '<div class="scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th>' +
    '<th>Address</th><th class="num">Rider collects</th><th></th></tr></thead><tbody>';
  list.forEach(function (o) {
    h += '<tr><td class="nm">' + esc(o.id) + '</td><td>' + esc(o.date) + '</td>' +
      '<td class="nm">' + esc(o.customer || '—') +

      '<td>' + (o.address ? esc(o.address) : '<span class="pill out">no address</span>') + '</td>' +

        '<button class="btn small" type="button" data-handled="' + esc(o.id) + '">Already handled</button>' +
      '</td></tr>';
  });
  return h + '</tbody></table></div></div></section>';
}

/** The parcel cell of a sale: what is to be done, or that it is done. */
function salesParcelHtml(o) {
  if (o.consignment) {
    return '<span class="pill ok">✓ Sent' + (o.fromSite ? ' by website' : '') + '</span>' + cidHtml(o.consignment);

/**
 * Cancel a whole sale. Nothing is deleted: every product comes back, the
 * delivery charge is written off, and any money paid goes back or is kept
 * as advance. The sale stays on the list, marked cancelled.
 */
function openCancel(id, customer, paid) {
  var cur = OPT ? OPT.currency : 'BDT';
  var canRefund = ME && (ME.role === 'owner' || ME.role === 'shareholder');
  var old = document.getElementById('cancelbox');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var w = document.createElement('div');
  w.id = 'cancelbox';
  w.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;align-items:center;' +
    'justify-content:center;background:rgba(0,0,0,.55)';
  var money = '';
  function draw() {
    w.innerHTML = '<div class="card" style="max-width:520px;width:94%">' +
      '<h2 style="margin:0 0 2px">Cancel ' + esc(id) + '</h2>' +
      '<div class="sub" style="margin-bottom:10px">' + esc(customer || 'Walk-in') + '. Everything on it comes back ' +
      'into stock, the delivery charge is dropped, and the sale stays on the list marked cancelled. ' +
      'Nothing is deleted.</div>' +
      '<div class="fields">' +
      '<div><label class="f" for="cx_cond">The goods</label><select class="i" id="cx_cond">' +
        '<option value="good">Back on the shelf</option><option value="damaged">Damaged — write off</option></select></div>' +
      '<div style="grid-column:1/-1"><label class="f" for="cx_reason">Why</label>' +
        '<input class="i" id="cx_reason" placeholder="Customer changed their mind, entered by mistake…"></div></div>' +
      (paid > 0.5
        ? '<div style="margin-top:10px"><label class="f">The customer paid ' + esc(cur) + ' ' + fmt(paid) +
          '. What happens to it?</label><div class="chips" style="margin:4px 0 0">' +
          '<button class="chip' + (money === 'advance' ? ' on' : '') + '" type="button" data-cxm="advance">Keep as advance</button>' +
          '<button class="chip' + (money === 'refund' ? ' on' : '') + '" type="button" data-cxm="refund"' +
            (canRefund ? '' : ' disabled') + '>Refund it now</button></div>' +
          (canRefund ? '' : '<div class="sub" style="margin-top:4px">Only the owner or a shareholder can hand money back.</div>') +
          (money === 'refund' ? '<div style="margin-top:8px;max-width:240px"><label class="f" for="cx_method">Refunded by</label>' +
            '<select class="i" id="cx_method">' + ((OPT && OPT.paymentMethods) || ['Cash']).map(function (m) {
              return '<option value="' + esc(m) + '">' + esc(m) + '</option>'; }).join('') + '</select></div>' : '') +
          '</div>'
        : '') +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="cx_close">Keep the sale</button>' +
      '<button class="btn primary" type="button" id="cx_go" style="background:var(--critical);border-color:var(--critical)">Cancel the sale</button></div></div>';
    var reasonNow = '';
    var ms = w.querySelectorAll('button[data-cxm]');
    for (var i = 0; i < ms.length; i++) ms[i].addEventListener('click', function () {
      reasonNow = document.getElementById('cx_reason').value;
      var cond = document.getElementById('cx_cond').value;
      money = this.getAttribute('data-cxm'); draw();
      document.getElementById('cx_reason').value = reasonNow;
      document.getElementById('cx_cond').value = cond;
    });
    document.getElementById('cx_close').addEventListener('click', function () { if (w.parentNode) w.parentNode.removeChild(w); });
    var go2 = document.getElementById('cx_go');
    go2.addEventListener('click', function () {
      var why = document.getElementById('cx_reason').value.trim();
      if (!why) { toast('Say why the sale is being cancelled.', true); return; }
      if (paid > 0.5 && !money) { toast('Choose what happens to the ' + fmt(paid) + ' paid.', true); return; }
      var mt = document.getElementById('cx_method');
      go2.disabled = true; go2.textContent = 'Cancelling…';
      srv('erpCancelInvoice', [{ invoiceNo: id, reason: why, money: money,
                                 condition: document.getElementById('cx_cond').value,
                                 method: mt ? mt.value : 'Cash' }], function (r) {
        if (w.parentNode) w.parentNode.removeChild(w);
        toast('<strong>' + esc(r.invoiceNo) + ' cancelled.</strong> ' + fmt(r.units) + ' unit(s) back' +
              (r.restocked ? ' in stock' : ', written off') +
              (r.refund ? ' · <strong>hand back ' + esc(cur) + ' ' + fmt(r.refund) + '</strong>' : '') +
              (r.advance ? ' · ' + fmt(r.advance) + ' kept as advance' : '') +
              (r.pdfUrl ? ' · <a href="' + esc(r.pdfUrl) + '" target="_blank" rel="noopener">return note</a>' : ''),
              false, 20000);
        SALES = null; D = null; ORDERS = null; HIST = null; CUST = null; PLAN = null; DUES = null;
        srv('erpBundle', [['catalog']], applyBundle, function () {});
        if (VIEW === 'sales') { repaint(); loadSales(); }
      }, function (e) {
        go2.disabled = false; go2.textContent = 'Cancel the sale';
        toast(esc(e && e.message ? e.message : e), true, 15000);
      });
    });
  }
  document.body.appendChild(w);
  draw();
}

        return '<option value="' + esc(s) + '"' + (o.delivery === s ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select></div></div>' +
    (locked ? '<div class="sub" style="margin-top:8px">A parcel (' + esc(o.consignment) + ') is already booked, so the ' +
      'delivery method is fixed. A changed address or phone does not reach Steadfast — tell them yourself.</div>' : '') +
    '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
    '<button class="btn" type="button" id="fx_close">Close</button>' +
    '<button class="btn primary" type="button" id="fx_save">Save the correction</button></div></div>';
  document.body.appendChild(w);
  wirePhones(w);
  function shut() { if (w.parentNode) w.parentNode.removeChild(w); }
  document.getElementById('fx_close').addEventListener('click', shut);
  var sv = document.getElementById('fx_save');
  sv.addEventListener('click', function () {
    var p = { invoiceNo: o.id, name: document.getElementById('fx_nm').value,
              phone: document.getElementById('fx_ph').value,
              address: document.getElementById('fx_ad').value };
    if (!locked) p.delivery = document.getElementById('fx_dl').value;
    if (p.phone !== o.phone && phoneProblem(p.phone)) { toast(esc(phoneProblem(p.phone)), true); return; }
    sv.disabled = true; sv.textContent = 'Saving…';
    srv('erpFixInvoice', [p], function (res) {
      shut();
      if (!res.changed) { toast('Nothing was different.'); return; }
      toast(esc(o.id) + ' corrected: ' + esc(res.fields.join(', ')) + '.' +
            (res.pdfUrl ? ' <a href="' + esc(res.pdfUrl) + '" target="_blank" rel="noopener">Corrected PDF</a>' : '') +
            (res.warning ? '<br><strong>' + esc(res.warning) + '</strong>' : ''), !!res.warning, res.warning ? 20000 : 8000);
      CUST = null; parcelsChanged();
    }, function (e) {
      sv.disabled = false; sv.textContent = 'Save the correction';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });
}

function loadSales() {
  srv('erpSales', [{ q: SALES_F.q, filter: SALES_F.filter, limit: SALES_PAGE, offset: SALES_F.offset || 0 }], function (r) {
    SALES = r; SALES_ERR = null;
    if (VIEW === 'sales') repaint();
  }, function (e) {
    SALES_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'sales') repaint();
  });
}

function wireSales() {
  function reload() { SALES = null; SALES_ERR = null; repaint(); loadSales(); }
  function each(sel, fn) {
    var n = el('view').querySelectorAll(sel);
    for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn);
  }
  var q = el('sl_q'), go2 = el('sl_go');
  if (go2) go2.addEventListener('click', function () { SALES_F.q = q.value.trim(); SALES_F.offset = 0; reload(); });
  if (q) q.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { SALES_F.q = q.value.trim(); SALES_F.offset = 0; reload(); }
  });
  each('button[data-sfilter]', function () { SALES_F.filter = this.getAttribute('data-sfilter'); SALES_F.offset = 0; reload(); });

  each('button[data-spdf]', function () {
    var id = this.getAttribute('data-spdf'), b = this;
    b.disabled = true;
    toast('Finding the PDF for ' + esc(id) + '…', false, 20000);
    srv('erpInvoicePdf', [{ invoiceNo: id }], function (r) {
      b.disabled = false;
      var links = [];
      if (r.found) links.push('<a href="' + esc(r.url) + '" target="_blank" rel="noopener"><strong>Open ' +
                              esc(r.name) + '</strong></a>');
      (r.notes || []).forEach(function (n) {
        links.push('<a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.name) + '</a>');
      });
      if (!links.length) { toast(esc(r.why || 'No PDF was saved for this invoice.'), true, 10000); return; }
      toast(links.join(' · '), false, 30000);
    }, function (e) {
      b.disabled = false;
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  each('button[data-sret]', function () { openReturn(this.getAttribute('data-sret')); });
  each('button[data-spay]', function () {
    openDueBox(this.getAttribute('data-spay'), this.getAttribute('data-spayname'));
  });
  each('button[data-sfix]', function () { openFix(this.getAttribute('data-sfix')); });
  each('button[data-scancel]', function () {
    openCancel(this.getAttribute('data-scancel'), this.getAttribute('data-scust'),
               Number(this.getAttribute('data-spaid')) || 0);
  });
  // Send parcel, Already handled and Put back are wired by wireParcel
}

/**
 * Goods coming back.
 *
 * The box shows the invoice as it was sold and asks only three things: how
 * many came back, whether they can be sold again, and what happens to any
 * money already paid for them. It floats above the page and redraws itself,
 * so typing a quantity does not disturb the list underneath.
 */
var RET = null;

function openReturn(invoiceNo) {
  RET = { invoiceNo: invoiceNo, data: null, qty: {}, cond: {}, money: '', method: '', reason: '', busy: false };
  retRender();
  srv('erpReturnPreview', [{ invoiceNo: invoiceNo }], function (d) {
    if (!RET || RET.invoiceNo !== invoiceNo) return;
    RET.data = d; retRender();
  }, function (e) {
    closeReturn();
    toast(esc(e && e.message ? e.message : e), true, 12000);
  });
}

function closeReturn() {
  RET = null;
  var w = document.getElementById('retbox');
  if (w && w.parentNode) w.parentNode.removeChild(w);
}

/** The value of what has been typed so far, and how the money falls. */
function retSums() {
  var d = RET.data, value = 0, units = 0;
  d.lines.forEach(function (L) {
    var q = Math.min(L.left, Math.max(0, Math.round(num(RET.qty[L.sku]))));
    value += q * L.unit; units += q;
  });
  value = Math.round(value * 100) / 100;
  var offDue = Math.min(value, d.owed);
  return { value: value, units: units, offDue: offDue,
           excess: Math.round((value - offDue) * 100) / 100 };
}

function retRender() {
  var w = document.getElementById('retbox');
  if (!w) {
    w = document.createElement('div');
    w.id = 'retbox';
    w.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;align-items:center;' +
      'justify-content:center;background:rgba(0,0,0,.55);overflow:auto';
    document.body.appendChild(w);
  }
  if (!RET) return;
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<div class="card" style="max-width:720px;width:94%;max-height:92vh;overflow:auto">' +
    '<h2 style="margin:0 0 2px">Return against ' + esc(RET.invoiceNo) + '</h2>';
  if (!RET.data) {
    w.innerHTML = h + '<div class="loading">Reading the invoice&hellip;</div></div>';
    return;
  }
  var d = RET.data, s = retSums();
  h += '<div class="sub" style="margin-bottom:10px">' + esc(d.customer || 'Walk-in') +
    (d.phone ? ' · ' + esc(d.phone) : '') + ' · invoice ' + esc(cur) + ' ' + fmt(d.grand) +
    ' · paid ' + fmt(d.paid) + ' · <strong>owes ' + fmt(d.owed) + '</strong>. ' +
    'The invoice itself is not changed; the return is recorded beside it.</div>';

  h += '<div class="scroll"><table><thead><tr><th>Product</th><th class="num">Sold</th>' +
    '<th class="num">Already back</th><th class="num">Coming back now</th><th>Condition</th>' +
    '<th class="num">Each</th></tr></thead><tbody>';
  d.lines.forEach(function (L) {
    h += '<tr><td class="nm">' + esc(L.product) + '<br><span class="sku">' + esc(L.sku) + '</span></td>' +
      '<td class="num">' + fmt(L.sold) + '</td><td class="num">' + (L.returned ? fmt(L.returned) : '—') + '</td>' +
      '<td class="num">' + (L.left > 0
        ? '<input class="i qty" type="number" min="0" max="' + L.left + '" step="1" data-rq="' + esc(L.sku) +
          '" value="' + (RET.qty[L.sku] || '') + '" placeholder="0"> <span class="sku">of ' + fmt(L.left) + '</span>'
        : '<span class="sku">all returned</span>') + '</td>' +
      '<td>' + (L.left > 0
        ? '<select class="i" data-rc="' + esc(L.sku) + '">' +
          '<option value="good"' + (RET.cond[L.sku] !== 'damaged' ? ' selected' : '') + '>Good — back to stock</option>' +
          '<option value="damaged"' + (RET.cond[L.sku] === 'damaged' ? ' selected' : '') + '>Damaged — not restocked</option>' +
          '</select>' : '') + '</td>' +
      '<td class="num">' + fmt(L.unit) + '</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="totals" style="margin-top:12px">' +
    '<div><span>Value of what is coming back</span><span>' + esc(cur) + ' ' + fmt(s.value) + '</span></div>' +
    (s.offDue > 0 ? '<div><span>Comes off what is owed</span><span>− ' + fmt(s.offDue) + '</span></div>' : '') +
    (s.excess > 0.5 ? '<div class="due"><span>Already paid by the customer</span><span>' + fmt(s.excess) + '</span></div>' : '') +
    '</div>';

  if (s.excess > 0.5) {
    h += '<div style="margin-top:10px"><label class="f">The customer already paid ' + fmt(s.excess) +
      ' for these. What happens to it?</label><div class="chips" style="margin:4px 0 0">' +
      '<button class="chip' + (RET.money === 'advance' ? ' on' : '') + '" type="button" data-rm="advance"' +
        (d.hasAccount ? '' : ' disabled') + '>Keep as advance for the next order</button>' +
      '<button class="chip' + (RET.money === 'refund' ? ' on' : '') + '" type="button" data-rm="refund"' +
        (d.canRefund ? '' : ' disabled') + '>Refund it now</button></div>' +
      (!d.canRefund ? '<div class="sub" style="margin-top:4px">Only the owner or a shareholder can hand money back.</div>' : '') +
      (!d.hasAccount ? '<div class="sub" style="margin-top:4px">This sale has no customer name or phone, so an advance cannot be kept.</div>' : '') +
      (RET.money === 'refund'
        ? '<div style="margin-top:8px;max-width:240px"><label class="f" for="rt_method">Refunded by</label>' +
          '<select class="i" id="rt_method">' + ((OPT && OPT.paymentMethods) || ['Cash']).map(function (m) {
            return '<option value="' + esc(m) + '"' + (RET.method === m ? ' selected' : '') + '>' + esc(m) + '</option>';
          }).join('') + '</select></div>' : '') +
      '</div>';
  }

  h += '<div style="margin-top:10px"><label class="f" for="rt_reason">Why did it come back?</label>' +
    '<input class="i" id="rt_reason" placeholder="Wrong colour, faulty, customer refused the parcel…" value="' +
    esc(RET.reason) + '"></div>' +
    '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
    '<button class="btn" type="button" id="rt_cancel">Close</button>' +
    '<button class="btn primary" type="button" id="rt_save"' + (RET.busy || !s.units ? ' disabled' : '') + '>' +
      (RET.busy ? 'Recording…' : 'Record the return') + '</button></div></div>';
  w.innerHTML = h;

  // ---- wiring ----
  var qs = w.querySelectorAll('input[data-rq]');
  for (var i = 0; i < qs.length; i++) {
    qs[i].addEventListener('change', function () {
      RET.qty[this.getAttribute('data-rq')] = Math.max(0, Math.round(num(this.value)));
      RET.reason = (document.getElementById('rt_reason') || {}).value || RET.reason;
      retRender();
    });
  }
  var cs = w.querySelectorAll('select[data-rc]');
  for (var j = 0; j < cs.length; j++) {
    cs[j].addEventListener('change', function () { RET.cond[this.getAttribute('data-rc')] = this.value; });
  }
  var ms = w.querySelectorAll('button[data-rm]');
  for (var k = 0; k < ms.length; k++) {
    ms[k].addEventListener('click', function () {
      RET.money = this.getAttribute('data-rm');
      RET.reason = (document.getElementById('rt_reason') || {}).value || RET.reason;
      retRender();
    });
  }
  var mt = document.getElementById('rt_method');
  if (mt) mt.addEventListener('change', function () { RET.method = mt.value; });
  var rr = document.getElementById('rt_reason');
  if (rr) rr.addEventListener('input', function () { RET.reason = rr.value; });
  document.getElementById('rt_cancel').addEventListener('click', closeReturn);
  document.getElementById('rt_save').addEventListener('click', saveReturn);
}

function saveReturn() {
  if (!RET || !RET.data || RET.busy) return;
  // a quantity still being typed has not fired its change event yet
  var w = document.getElementById('retbox');
  var qs = w.querySelectorAll('input[data-rq]');
  for (var i = 0; i < qs.length; i++) {
    RET.qty[qs[i].getAttribute('data-rq')] = Math.max(0, Math.round(num(qs[i].value)));
  }
  var s = retSums();
  if (!s.units) { toast('Enter how many came back.', true); return; }
  if (!String(RET.reason || '').trim()) { toast('Say why it came back.', true); return; }
  if (s.excess > 0.5 && !RET.money) {
    toast('Choose what happens to the ' + fmt(s.excess) + ' already paid.', true, 9000); return;
  }
  var lines = RET.data.lines.filter(function (L) { return num(RET.qty[L.sku]) > 0; })
    .map(function (L) { return { sku: L.sku, qty: Math.round(num(RET.qty[L.sku])),
                                 condition: RET.cond[L.sku] === 'damaged' ? 'damaged' : 'good' }; });
  var mt = document.getElementById('rt_method');
  RET.busy = true; retRender();
  srv('erpReturnGoods', [{ invoiceNo: RET.invoiceNo, lines: lines,
                           money: s.excess > 0.5 ? RET.money : 'due',
                           method: mt ? mt.value : (RET.method || 'Cash'),
                           reason: String(RET.reason).trim() }],
    function (res) {
      closeReturn();
      returnDone(res);
      // stock and money both moved: refetch what the next sale reads, and
      // mark the rest stale
      SALES = null; D = null; ORDERS = null; HIST = null; CUST = null; PLAN = null; DUES = null;
      srv('erpBundle', [['catalog']], applyBundle, function () {});
      if (VIEW === 'sales') { repaint(); loadSales(); }
    },
    function (e) {
      if (RET) { RET.busy = false; retRender(); }
      toast(esc(e && e.message ? e.message : e), true, 15000);
    });
}

/** What was recorded, kept on screen until it is closed. */
function returnDone(res) {
  var cur = OPT ? OPT.currency : 'BDT';
  var wrap = document.createElement('div');
  wrap.id = 'retdone';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;' +
    'align-items:center;justify-content:center;background:rgba(0,0,0,.55)';
  wrap.innerHTML =
    '<div class="card" style="max-width:460px;width:92%;text-align:center">' +
      '<div style="font-size:34px;line-height:1">&#10003;</div>' +
      '<h2 style="margin:6px 0 2px">Return recorded</h2>' +
      '<div class="sub">' + esc(res.returnId) + ' · against ' + esc(res.invoiceNo) + '</div>' +
      '<div class="sub" style="margin:10px 0 14px;line-height:1.7">' +
        fmt(res.units) + ' unit(s) worth <strong>' + esc(cur) + ' ' + fmt(res.value) + '</strong><br>' +
        (res.restocked ? fmt(res.restocked) + ' put back into stock<br>' : '') +
        (res.units - res.restocked ? fmt(res.units - res.restocked) + ' damaged, not restocked<br>' : '') +
        (res.dueReduced ? fmt(res.dueReduced) + ' taken off what was owed<br>' : '') +
        (res.refund ? '<strong>Hand back ' + esc(cur) + ' ' + fmt(res.refund) + ' to the customer</strong><br>' : '') +
        (res.advance ? fmt(res.advance) + ' kept as advance for the next order<br>' : '') +
      '</div>' +
      (res.pdfUrl ? '<a class="btn primary" href="' + esc(res.pdfUrl) + '" target="_blank" rel="noopener">' +
                    'Open the return note</a> ' : '') +
      '<button class="btn" type="button" id="retdoneclose">Done</button>' +
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('retdoneclose').addEventListener('click', function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  });
}

function viewOrders() {

  var h = '<section><div class="card"><h2>Delivery entry</h2>'+
          '<div class="sub">Orders going out by Steadfast. Send each one to the courier, '+
          'or set it aside if it was already dealt with.</div>'+
          '<div class="row" style="margin:10px 0;gap:6px">'+
          [['post','To send'],['sent','Sent']].map(function (f) {
            return '<button class="chip'+(INV_FILTER===f[0]?' on':'')+
                   '" type="button" data-ifilter="'+f[0]+'">'+f[1]+'</button>';
          }).join('')+
          '<span class="sub" style="margin-left:6px">Only orders going by '+
          '<strong>Steadfast courier</strong> are listed here. Every sale, of any kind, '+
          'is on the <strong>Sales</strong> screen.</span></div>';
  if (ORDERS_ERR) { h += '<div class="note err"><div class="ico">✕</div><div>'+
    '<strong>Could not read the sales.</strong><br>'+esc(ORDERS_ERR)+'</div></div>'; }
  else if (!ORDERS.length) { h += '<div class="empty">No invoices logged yet.</div>'; }
  else {
    h += '<div class="scroll tall"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th>'+
         '<th class="num">Lines</th><th class="num">Units</th><th class="num">Total</th>'+
         '<th>Method</th><th>Status</th><th>Delivery</th><th>Parcel</th></tr></thead><tbody>';
    ORDERS.filter(function (o) {
      if (INV_FILTER === 'post') return o.postable;
      if (INV_FILTER === 'sent') return !!o.handled || !!o.consignment;
      return true;
    }).forEach(function (o) {
      h += '<tr><td class="nm">'+esc(o.id)+'</td><td>'+esc(o.date)+'</td>'+
           '<td class="nm">'+esc(o.customer||'—')+
             (o.phone?'<br><span class="sku">'+esc(o.phone)+'</span>':'')+'</td>'+
           '<td class="num">'+o.lines+'</td><td class="num">'+fmt(o.units)+'</td>'+
           '<td class="num">'+(o.total?fmt(o.total):'<span class="sku">no price</span>')+'</td>'+
           '<td>'+esc(o.method||'—')+'</td><td>'+esc(o.status||'—')+'</td>'+
           '<td>'+esc(o.source||'—')+'</td>'+
           '<td class="num" style="white-space:nowrap">'+
             (o.handled
               ? (o.consignment
                   ? '<span class="pill ok">sent</span>'+cidHtml(o.consignment)
                   : '<span class="pill low">set aside</span>')+
                 (o.byHand ? '<br><button class="btn small" type="button" data-putback="'+
                     esc(o.id)+'">Put back</button>' : '')
               : o.fromSite
                 ? (o.consignment
                     ? '<span class="pill ok">sent by website</span>'+cidHtml(o.consignment)
                     : '<span class="sku">website books it<br>no parcel number yet</span>')
                 : o.canSend
                     ? '<button class="btn small'+(o.postable?' primary':'')+'" type="button" data-send="'+
                         esc(o.id)+'">Send parcel</button> '+
                       '<button class="btn small" type="button" data-handled="'+
                         esc(o.id)+'">Already handled</button>'
                     : '<span class="sku">\u2014</span>')+
           '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div></section>';
  return h;
}

function wireProductForm() {
  if (!PRODUCT_FORM) return;
  var map = { pf_sku:'sku', pf_name:'product_name', pf_cat:'category', pf_brand:'brand',
              pf_type:'type', pf_color:'color', pf_unit:'unit', pf_sup:'supplier',
              pf_bin:'location_bin', pf_status:'status' };
  Object.keys(map).forEach(function (id) {
    var n = el(id);
    if (n) n.addEventListener('input', function () { PRODUCT_FORM[map[id]] = n.value; });
  });
  var nums = { pf_cost:'cost_price', pf_sell:'sell_price', pf_whole:'wholesale_price', pf_reorder:'reorder_level',
               pf_lead:'lead_time_days', pf_open:'opening_stock' };
  Object.keys(nums).forEach(function (id) {
    var n = el(id);
    if (n) n.addEventListener('input', function () { PRODUCT_FORM[nums[id]] = num(n.value); });
  });
  var c = el('pf_cancel');
  if (c) c.addEventListener('click', function () { PRODUCT_FORM = null; repaint(); });
  var s = el('pf_save');
  if (s) s.addEventListener('click', saveProduct);
}

function saveProduct() {
  if (BUSY) return;
  if (!String(PRODUCT_FORM.product_name || '').trim()) {
    toast('Product name is required.', true); return;
  }
  var returnTo = PRODUCT_FORM.returnTo;

  // In a shipment the product is only a draft: it joins the list at the bottom
  // and is created for real when the shipment is received, so abandoning the
  // form cannot leave a half-entered product behind in the sheet.
  if (returnTo === 'receive') {
    var draft = {};
    Object.keys(PRODUCT_FORM).forEach(function (k) { draft[k] = PRODUCT_FORM[k]; });
    delete draft.returnTo;
    RECV.lines.push({
      sku: '', isNew: true, product: draft,
      name: String(PRODUCT_FORM.product_name || '').trim(),
      qty: Math.max(1, num(PRODUCT_FORM.opening_stock) || 1), stock: 0
    });
    PRODUCT_FORM = null;
    toast('Added to this shipment. It is created when you press Receive.');
    repaint();
    return;
  }

  if (returnTo === 'pox') {
    var d3 = {};
    Object.keys(PRODUCT_FORM).forEach(function (k) { d3[k] = PRODUCT_FORM[k]; });
    delete d3.returnTo;
    var oX = null;
    ((PO && PO.orders) || []).forEach(function (x) { if (x.id === POX_FOR) oX = x; });
    if (oX) poArr(oX).extras.push({ sku: '', isNew: true, product: d3, name: String(PRODUCT_FORM.product_name || '').trim(),
                                    qty: Math.max(1, num(PRODUCT_FORM.opening_stock) || 1), rmb: '' });
    PRODUCT_FORM = null;
    toast('Added to this box. It joins the product list when you add the box to stock.');
    repaint();
    return;
  }

  if (returnTo === 'po') {
    var d2 = {};
    Object.keys(PRODUCT_FORM).forEach(function (k) { d2[k] = PRODUCT_FORM[k]; });
    delete d2.returnTo;
    if (!PONEW) PONEW = poBlank();
    PONEW.lines.push({ sku: '', isNew: true, product: d2, name: String(PRODUCT_FORM.product_name || '').trim(),
                       qty: Math.max(1, num(PRODUCT_FORM.opening_stock) || 1), rmb: '' });
    PRODUCT_FORM = null;
    toast('Added to the order. It joins the product list when you save the order.');
    repaint();
    return;
  }

  if (returnTo === 'invoice' && num(PRODUCT_FORM.opening_stock) <= 0) {
    toast('Give it an opening stock figure, or it cannot go on an invoice yet.', true);
    return;
  }
  BUSY = 'product'; repaint();
  srv('erpSaveProduct', [PRODUCT_FORM],
      function (res) {
      BUSY = ''; PRODUCT_FORM = null;
      toast(res.created ? ('Product created · SKU <strong>'+esc(res.sku)+'</strong>')
                        : ('Saved <strong>'+esc(res.sku)+'</strong>'));
      if (returnTo) { attachNewProduct(returnTo, res.sku); return; }
      CAT = null; D = null; loadAll();
    },
      function (e) {
      BUSY = ''; repaint();
      toast('Could not save: '+esc(e && e.message ? e.message : e), true, 12000);
    });
}

/** Re-pull the catalogue, then put the new product where it was asked for. */
function attachNewProduct(target, sku) {
  srv('erpCatalog', [],
      function (cat) {
    CAT = cat;
    if (target === 'invoice') {
      addToCart(sku);
    } else {
      var p = null;
      for (var i = 0; i < CAT.length; i++) if (CAT[i].sku === sku) { p = CAT[i]; break; }
      RECV.lines.push({ sku: sku, name: p ? p.name : sku, qty: 1, stock: p ? p.stock : 0 });
    }
    D = null; loadDashboardOnly();
    updateCounts();
    repaint();
  },
      function (e) {
    toast('Saved, but the product list did not refresh: ' + esc(e && e.message ? e.message : e), true);
    CAT = null; loadAll();
  });
}

function loadDashboardOnly() {
  srv('erpDashboardData', [],

    if (VIEW === 'dash') repaint();
  },

function recvModeChip(val, label) {

/** What each unit will end up costing, worked out before anything is saved. */
function recvCostSummary() {
  var total = recvTotalBdt();
  var units = 0;
  for (var i = 0; i < RECV.lines.length; i++) units += Number(RECV.lines[i].qty) || 0;
  if (!(total > 0) || !units) {
    return '<div class="sub" style="text-align:right">' +
      (RECV.mode === 'none'
        ? 'Each line will be costed from the price book.'
        : 'Enter the shipment total and each line will be costed from it.') + '</div>';
  }
  var rate = Number(RECV.rate) || 0;
  return '<div class="sub" style="text-align:right">' +
    'Shipment total <strong>' + fmt(total) + ' TK</strong> across ' + fmt(units) +
    ' unit(s) — about <strong>' + fmt(total / units) + ' TK</strong> each on average' +
    (RECV.mode === 'rmb' && rate > 0 ? ' · at ' + rate + ' TK/RMB' : '') +
    '.<br>Freight and the broker are already inside this figure, so the ' +
    'handling default is not added again.</div>';
}

function recvTotalBdt() {
  if (RECV.mode === 'rmb') {
    var r = Number(RECV.rate) || 0, t = Number(RECV.totalRmb) || 0;
    return (r > 0 && t > 0) ? r * t : 0;
  }
  if (RECV.mode === 'bdt') return Number(RECV.totalBdt) || 0;
  return 0;
}

/**
 * Orders to suppliers. An order is written down the day it is placed -
 * products already in the list and brand-new ones together, each with its
 * RMB price - and ticked off line by line when the box arrives. A ticked
 * line goes into stock at its real cost; what did not come stays "to come".
 */
var PO = null, POPICK = {}, POSHIP = 'Sea';
var SHIP_RATE = { Sea: 250, Air: 770 };
var PONEW = null;        // the order being written: { lines, rate, ship, note }
var POARR = {};          // per open order: what has been checked as arrived
var PO_BUSY = '';

function loadPo() {
  srv('erpPoList', [], function (r) { PO = r; if (VIEW === 'stock') repaint(); }, function () { PO = { orders: [] }; });
}
function poCanOrder() { return !!(ME && (ME.role === 'manager' || ME.role === 'shareholder' || ME.role === 'owner')); }
function poBlank() { return { lines: [], rate: '', ship: POSHIP, note: '', supplier: '' }; }
function poNewTotals() {
  var rmb = 0, units = 0;
  (PONEW ? PONEW.lines : []).forEach(function (l) { rmb += num(l.qty) * num(l.rmb); units += num(l.qty); });
  return { rmb: Math.round(rmb * 100) / 100, units: units, bdt: Math.round(rmb * num(PONEW && PONEW.rate)) };
}
/**
 * One open order's box, as it is being checked: what was received on each
 * line (blank = not looked at yet), anything in the box that was never
 * ordered, and the shipment's own details.
 */
function poArr(o) {
  var a = POARR[o.id];
  if (!a) a = POARR[o.id] = { got: {}, extras: [], ship: { no: '', agent: '', kg: '', rate: '', total: '', date: '' } };
  return a;
}
/** What the typed number means for one line: nothing typed, matches, short or extra. */
function poLineState(l, a) {
  var v = a.got[l.sku];
  if (v === undefined || v === '' || v === null) return { seen: false };
  var n = Math.max(0, Math.round(num(v)));
  return { seen: true, n: n, short: Math.max(0, l.left - n), extra: Math.max(0, n - l.left), match: n === l.left };
}
function poShipTotal(a, o) {
  if (String(a.ship.total) !== '') return num(a.ship.total);
  return Math.round(num(a.ship.kg) * num(a.ship.rate || SHIP_RATE[o.shipBy === 'Air' ? 'Air' : 'Sea']));
}

function poNewHtml() {
  var t = poNewTotals();
  var h = '<div id="po_new" style="margin-top:12px;border:1px solid var(--series-1);border-radius:12px;padding:14px">' +
    '<h3 style="margin:0 0 4px">New order</h3><div class="sub">Everything you bought from the supplier. A product that is not in your list yet ' +
    'can be added here — it joins the product list with nothing in stock until it arrives.</div>';
  if (PONEW.lines.length) {

        '<div><label class="f">Shipping paid <span class="sku">TK</span></label><input class="i" inputmode="decimal" data-pas="' + esc(o.id) + '|total" value="' + esc(st.total) +
          '" placeholder="' + (num(st.kg) > 0 ? fmt(poShipTotal(a, o)) + ' (kg × rate)' : 'total') + '"></div>' +
        '<div><label class="f">Arrived on</label><input class="i" type="date" data-pas="' + esc(o.id) + '|date" value="' + esc(st.date || todayISO()) + '" max="' + esc(todayISO()) + '"></div></div>' +

        '<button class="btn primary" type="button" data-pago="' + esc(o.id) + '"' + (nSeen && PO_BUSY !== o.id ? '' : ' disabled') + '>' +
        (PO_BUSY === o.id ? 'Adding to stock…' : 'Add to stock') + '</button></div>';

var POX_FOR = '';        // which order a new, never-ordered product is being added to

function recvPoBanner() {

/** Shipping paid on arrival: kilos times the rate for sea or air. */
function recvShipBdt() {
  var s = RECV.ship || {};
  if (!s.mode || s.mode === 'none') return 0;
  if (s.mode === 'total') return num(s.total);
  return Math.round(num(s.kg) * num(s.rate || SHIP_RATE[s.mode]));
}
function recvShipNote() {
  var s = RECV.ship || {};
  if (!s.mode || s.mode === 'none' || s.mode === 'total') return '';
  return s.mode.toLowerCase() + ' ' + num(s.kg) + ' kg @ ' + num(s.rate || SHIP_RATE[s.mode]);
}
/** A kilo figure for an all-filament shipment; anything else is typed. */
function recvKgGuess() {
  if (!RECV.lines.length) return '';
  var kg = 0, ok = true;
  RECV.lines.forEach(function (l) {
    var p = null;
    (CAT || []).forEach(function (x) { if (x.sku === l.sku) p = x; });
    if (p && /filament/i.test(String(p.cat || ''))) kg += num(l.qty) * 1.3; else ok = false;
  });
  return ok ? Math.round(kg * 10) / 10 : '';
}
function recvShipHtml() {
  var s = RECV.ship || (RECV.ship = { mode: 'none', kg: '', rate: '', total: '' });
  function chip(v, label) {
    return '<button type="button" class="chip ckcat' + (s.mode === v ? ' on' : '') + '" data-rvship="' + v + '">' + label + '</button>';
  }
  var h = '<div style="margin-top:12px"><label class="f">Shipping paid on arrival</label><div class="chips">' +
    chip('none', 'None') + chip('Sea', 'Sea') + chip('Air', 'Air') + chip('total', 'Type the total') + '</div>';
  if (s.mode === 'Sea' || s.mode === 'Air') {
    var guess = recvKgGuess();
    h += '<div class="fields"><div><label class="f" for="rv_kg">Weight (kg)</label><input class="i" id="rv_kg" inputmode="decimal" value="' +
      esc(s.kg) + '" placeholder="' + (guess !== '' ? esc(guess) + ' (filament × 1.3)' : 'kg') + '"></div>' +
      '<div><label class="f" for="rv_krate">Taka per kg</label><input class="i" id="rv_krate" inputmode="decimal" value="' +
      esc(s.rate) + '" placeholder="' + SHIP_RATE[s.mode] + '"></div>' +
      '<div><label class="f">Shipping</label><div style="padding:9px 0"><strong id="rv_shipsum">' + fmt(recvShipBdt()) + '</strong></div></div></div>';
  } else if (s.mode === 'total') {
    h += '<div class="fields"><div><label class="f" for="rv_shiptot">Shipping paid (TK)</label><input class="i" id="rv_shiptot" inputmode="decimal" value="' +
      esc(s.total) + '" placeholder="0"></div></div>';
  }
  return h + '</div>';
}

function wirePo() {
  var picks = el('view').querySelectorAll('input[data-popick]');
  for (var i = 0; i < picks.length; i++) picks[i].addEventListener('change', function () {
    var sku = this.getAttribute('data-popick');
    if (this.checked) {
      var r = null;
      (PLAN.rows || []).forEach(function (x) { if (x.sku === sku) r = x; });
      POPICK[sku] = r ? r.need : 1;
    } else delete POPICK[sku];
    repaint();
  });
  var qs = el('view').querySelectorAll('input[data-poqty]');
  for (var j = 0; j < qs.length; j++) qs[j].addEventListener('input', function () {
    POPICK[this.getAttribute('data-poqty')] = Math.max(1, Math.round(num(this.value)));
  });
  var all = el('po_all');
  if (all) all.addEventListener('click', function () {
    if (Object.keys(POPICK).length) POPICK = {};
    else (PLAN.rows || []).forEach(function (r) { POPICK[r.sku] = r.need; });
    repaint();
  });
  var pl = el('po_place');
  if (pl) pl.addEventListener('click', function () {
    if (!PONEW) PONEW = poBlank();
    Object.keys(POPICK).forEach(function (sku) {
      if (PONEW.lines.some(function (l) { return l.sku === sku; })) return;
      var p = null;
      (CAT || []).forEach(function (x) { if (x.sku === sku) p = x; });
      PONEW.lines.push({ sku: sku, name: p ? p.name : sku, qty: POPICK[sku], rmb: '' });
    });
    POPICK = {};
    repaint();
    var box = el('po_new'); if (box && box.scrollIntoView) box.scrollIntoView({ block: 'start' });
  });

  // ---- writing a new order ----
  var st = el('po_start');
  if (st) st.addEventListener('click', function () { PONEW = poBlank(); repaint(); });
  var cx = el('pn_cancel');
  if (cx) cx.addEventListener('click', async function () {
    if (PONEW.lines.length && !(await uiConfirm('Throw this order away? Nothing has been saved.'))) return;
    PONEW = null; repaint();
  });
  var ps = el('pn_search');
  if (ps) ps.addEventListener('change', function () {
    var v = String(ps.value || '').trim(), p = null;
    (CAT || []).forEach(function (x) { if ((x.name + ' · ' + x.sku) === v || x.sku.toLowerCase() === v.toLowerCase()) p = x; });
    if (!p) return;
    if (PONEW.lines.some(function (l) { return l.sku === p.sku; })) { toast(esc(p.name) + ' is already on this order.', true); ps.value = ''; return; }
    PONEW.lines.push({ sku: p.sku, name: p.name, qty: 1, rmb: '' });
    repaint();
    var again = el('pn_search'); if (again) again.focus();
  });
  var npd = el('pn_newprod');
  if (npd) npd.addEventListener('click', function () { quickStart('po', ''); });
  function sumNow() { var s = el('pn_sum'); if (s) s.textContent = poSumText(poNewTotals()); }
  var pq = el('view').querySelectorAll('input[data-pnqty], input[data-pnrmb]');
  for (var a1 = 0; a1 < pq.length; a1++) pq[a1].addEventListener('input', function () {
    var isQty = this.hasAttribute('data-pnqty'), i = Number(this.getAttribute(isQty ? 'data-pnqty' : 'data-pnrmb'));
    if (isQty) PONEW.lines[i].qty = Math.max(0, Math.round(num(this.value))); else PONEW.lines[i].rmb = this.value;
    var c = el('pn_line_' + i); if (c) c.textContent = fmt(Math.round(num(PONEW.lines[i].qty) * num(PONEW.lines[i].rmb) * 100) / 100);
    sumNow();
  });
  var pd = el('view').querySelectorAll('button[data-pndel]');
  for (var a2 = 0; a2 < pd.length; a2++) pd[a2].addEventListener('click', function () {
    PONEW.lines.splice(Number(this.getAttribute('data-pndel')), 1); repaint();
  });
  var pr = el('pn_rate'); if (pr) pr.addEventListener('input', function () { PONEW.rate = pr.value; sumNow(); });
  var psh = el('pn_ship'); if (psh) psh.addEventListener('change', function () { PONEW.ship = psh.value; POSHIP = psh.value; });
  var pnt = el('pn_note'); if (pnt) pnt.addEventListener('input', function () { PONEW.note = pnt.value; });
  var psu = el('pn_sup'); if (psu) psu.addEventListener('input', function () { PONEW.supplier = psu.value; });
  var sv2 = el('pn_save');
  if (sv2) sv2.addEventListener('click', async function () {
    var lines = PONEW.lines.filter(function (l) { return num(l.qty) > 0; });
    if (!lines.length) { toast('Give at least one product a quantity.', true); return; }
    var priced = lines.some(function (l) { return num(l.rmb) > 0; });
    if (priced && !(num(PONEW.rate) > 0)) { toast('Enter the rate you paid (TK per RMB).', true); return; }
    var unpriced = lines.filter(function (l) { return !(num(l.rmb) > 0); }).length;
    var t = poNewTotals();
    if (!(await uiConfirm('Save this order?\n\n' + lines.length + ' product(s), ' + fmt(t.units) + ' pieces, RMB ' + fmt(t.rmb) +
        (unpriced ? '\n\n' + unpriced + ' line(s) have no RMB price: their cost will come from the price book instead.' : '')))) return;
    PO_BUSY = 'new'; repaint();
    srv('erpPoCreate', [{ shipBy: PONEW.ship, rate: num(PONEW.rate), note: PONEW.note, supplier: PONEW.supplier,
        lines: lines.map(function (l) { return l.isNew ? { isNew: true, product: l.product, qty: l.qty, rmbUnit: num(l.rmb) }
                                                      : { sku: l.sku, qty: l.qty, rmbUnit: num(l.rmb) }; }) }], function (r) {
      PO_BUSY = ''; PONEW = null;
      toast('Order <strong>' + esc(r.poId) + '</strong> saved · ' + fmt(r.units) + ' piece(s) on the way' +
        (r.created && r.created.length ? ' · ' + fmt(r.created.length) + ' new product(s) added to the list' : '') + '.', false, 10000);
      PO = null; PLAN = null; PLAN_ERR = null; loadPo(); loadPlan();
      if (r.created && r.created.length) { CAT = null; loadAll(); }
    }, function (e) { PO_BUSY = ''; repaint(); toast(esc(e && e.message ? e.message : e), true, 15000); });
  });

  // ---- checking a box in ----
  function orderOf(id) { var o = null; ((PO && PO.orders) || []).forEach(function (x) { if (x.id === id) o = x; }); return o; }
  function each2(sel, ev, fn) { var ns = el('view').querySelectorAll(sel); for (var z = 0; z < ns.length; z++) ns[z].addEventListener(ev, fn); }
  each2('input[data-paqty]', 'change', function () {
    var k = this.getAttribute('data-paqty').split('|'), o = orderOf(k[0]);
    if (!o) return;
    poArr(o).got[k[1]] = this.value === '' ? '' : Math.max(0, Math.round(num(this.value)));
    repaint();
  });
  each2('button[data-paok]', 'click', function () {
    var k = this.getAttribute('data-paok').split('|'), o = orderOf(k[0]);
    if (!o) return;
    var a = poArr(o), l = null;
    o.lines.forEach(function (x) { if (x.sku === k[1]) l = x; });
    if (!l) return;
    var s = poLineState(l, a);
    a.got[k[1]] = (s.seen && s.match) ? '' : l.left;       // tick = it matches; tick again = not looked at
    repaint();
  });
  each2('button[data-paall]', 'click', function () {
    var o = orderOf(this.getAttribute('data-paall'));
    if (!o) return;
    var a = poArr(o);
    o.lines.forEach(function (l) { if (l.left > 0 && !poLineState(l, a).seen) a.got[l.sku] = l.left; });
    repaint();
  });
  each2('input[data-pas]', 'input', function () {
    var k = this.getAttribute('data-pas').split('|'), o = orderOf(k[0]);
    if (o) poArr(o).ship[k[1]] = this.value;
  });
  each2('input[data-pas]', 'change', function () { if (/\|(kg|rate)$/.test(this.getAttribute('data-pas'))) repaint(); });
  // something in the box that was never ordered
  each2('input[data-pxadd]', 'change', function () {
    var o = orderOf(this.getAttribute('data-pxadd')), v = String(this.value || '').trim(), p = null;
    if (!o) return;
    (CAT || []).forEach(function (x) { if ((x.name + ' · ' + x.sku) === v || x.sku.toLowerCase() === v.toLowerCase()) p = x; });
    if (!p) return;
    if (o.lines.some(function (l) { return l.sku === p.sku; })) { toast(esc(p.name) + ' is on the order — type what came on its own line.', true); this.value = ''; return; }
    var a = poArr(o);
    if (a.extras.some(function (x) { return x.sku === p.sku; })) { this.value = ''; return; }
    a.extras.push({ sku: p.sku, name: p.name, qty: 1, rmb: '' });
    repaint();
  });
  each2('button[data-pxnew]', 'click', function () { POX_FOR = this.getAttribute('data-pxnew'); quickStart('pox', ''); });
  each2('input[data-pxqty], input[data-pxrmb]', 'input', function () {
    var isQ = this.hasAttribute('data-pxqty'), k = this.getAttribute(isQ ? 'data-pxqty' : 'data-pxrmb').split('|'), o = orderOf(k[0]);
    if (!o) return;
    var x = poArr(o).extras[Number(k[1])];
    if (x) { if (isQ) x.qty = Math.max(0, Math.round(num(this.value))); else x.rmb = this.value; }
  });
  each2('button[data-pxdel]', 'click', function () {
    var k = this.getAttribute('data-pxdel').split('|'), o = orderOf(k[0]);
    if (o) { poArr(o).extras.splice(Number(k[1]), 1); repaint(); }
  });
  each2('button[data-pawont]', 'click', async function () {
    var k = this.getAttribute('data-pawont').split('|'), o = orderOf(k[0]), l = null;
    if (!o) return;
    o.lines.forEach(function (x) { if (x.sku === k[1]) l = x; });
    if (!l) return;
    var why = (await uiPrompt(l.product + ': ' + l.left + ' will not come.\n\nThey stop counting as on the way' +
      (l.rmbUnit ? ', and the supplier owes you RMB ' + fmt(Math.round(l.left * l.rmbUnit * 100) / 100) : '') + '.\n\nWhy are they not coming?', 'supplier did not send them'));
    if (why === null) return;
    srv('erpPoLineClose', [{ poId: k[0], sku: k[1], reason: why }], function (r) {
      toast(esc(l.product) + ': closed' + (r.owed ? ' · supplier owes RMB ' + fmt(r.owed) : '') + '.', false, 9000);
      delete POARR[k[0]]; PO = null; PLAN = null; PLAN_ERR = null; loadPo(); loadPlan();
    }, function (e) { toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  each2('button[data-pago]', 'click', async function () {
    var id = this.getAttribute('data-pago'), o = orderOf(id);
    if (!o || PO_BUSY) return;
    var a = poArr(o), lines = [], shorts = [], overs = [];
    o.lines.forEach(function (l) {
      if (!(l.left > 0)) return;
      var s = poLineState(l, a);
      if (!s.seen) return;
      if (s.n > 0) lines.push({ sku: l.sku, qty: s.n });
      if (s.short) shorts.push(l.product + ' −' + s.short);
      if (s.extra) overs.push(l.product + ' +' + s.extra);
    });
    var extras = a.extras.filter(function (x) { return num(x.qty) > 0; }).map(function (x) {
      return x.isNew ? { isNew: true, product: x.product, qty: x.qty, rmbUnit: num(x.rmb) } : { sku: x.sku, name: x.name, qty: x.qty, rmbUnit: num(x.rmb) };
    });
    if (!lines.length && !extras.length) return;
    var ship = poShipTotal(a, o), units = lines.reduce(function (s2, l) { return s2 + l.qty; }, 0) + extras.reduce(function (s2, x) { return s2 + num(x.qty); }, 0);
    if (!(await uiConfirm('Add ' + fmt(units) + ' pieces to stock?' +
        (ship > 0 ? '\n\nShipping ' + fmt(ship) + ' TK is shared into their cost.' : '\n\nNo shipping entered for this box.') +
        (shorts.length ? '\n\nSHORT (stays marked, you decide later):\n' + shorts.join('\n') : '') +
        (overs.length ? '\n\nEXTRA (goes into stock, you decide later):\n' + overs.join('\n') : '') +
        (extras.length ? '\n\nNOT ORDERED (goes into stock, you decide later):\n' + extras.map(function (x) { return (x.name || (x.product && x.product.product_name)) + ' ×' + x.qty; }).join('\n') : '')))) return;
    PO_BUSY = id; repaint();
    srv('erpPoArrive', [{ poId: id, lines: lines, extras: extras,
        shipment: { no: a.ship.no, agent: a.ship.agent, by: o.shipBy, kg: num(a.ship.kg), shippingBdt: ship, date: a.ship.date || todayISO() } }], function (r) {
      PO_BUSY = ''; delete POARR[id];
      toast(fmt(r.units) + ' piece(s) are in stock' + (r.shipping ? ' · shipping ' + fmt(r.shipping) + ' shared into the cost' : '') +
        (r.differences ? ' · <strong>' + fmt(r.differences) + ' to decide</strong>' : '') +
        (r.stillToCome ? ' · ' + fmt(r.stillToCome) + ' still to come' : ' · order ' + esc(id) + ' is complete') + '.', false, 12000);
      PO = null; loadPo();
      CAT = null; HIST = null; D = null; PLAN = null; PLAN_ERR = null; loadAll(); loadPlan();
    }, function (e) { PO_BUSY = ''; repaint(); toast(esc(e && e.message ? e.message : e), true, 15000); });
  });
  // ---- the differences, and the money ----
  each2('button[data-pod]', 'click', async function () {
    var b = this, did = b.getAttribute('data-pod'), act = b.getAttribute('data-act');
    var say = act === 'pay' ? 'Keep it and pay the supplier for it?' : act === 'free' ? 'Keep it as a free bonus? It will cost nothing, so that product’s average cost comes down.'
            : 'Not yours? It will be taken out of stock again.';
    if (!(await uiConfirm(say))) return;
    b.disabled = true;
    srv('erpPoDiffDecide', [{ diffId: did, decision: act }], function (r) {
      toast(act === 'pay' ? 'Kept. The supplier is owed for it.' : act === 'free' ? 'Kept as a bonus' + (r.note ? ' · ' + esc(r.note) : '') + '.' : 'Taken out of stock.', false, 9000);
      PO = null; loadPo();
      if (act !== 'pay') { CAT = null; D = null; loadAll(); }
    }, function (e) { b.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  each2('button[data-poset]', 'click', async function () {
    var sup = this.getAttribute('data-poset');
    var how = (await uiPrompt('Settled with ' + sup + '.\n\nHow? (refunded, paid, deducted from the next order …)', ''));
    if (how === null) return;
    if (!how.trim()) { toast('Say how it was settled.', true); return; }
    srv('erpPoSettle', [{ supplier: sup, note: how.trim() }], function () { toast('Settled with ' + esc(sup) + '.'); PO = null; loadPo(); },
        function (e) { toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var cl = el('view').querySelectorAll('button[data-poclose]');
  for (var m = 0; m < cl.length; m++) cl[m].addEventListener('click', async function () {
    var id = this.getAttribute('data-poclose');
    var why = (await uiPrompt('Close ' + id + '?\n\nWhat has arrived stays in stock. Everything still to come stops counting as on the way, and what was paid for it becomes money the supplier owes you.\n\nWhy is it not coming?', ''));
    if (why === null) return;
    if (!why.trim()) { toast('Say why.', true); return; }
    srv('erpPoClose', [{ poId: id, reason: why.trim() }], function () {
      toast(esc(id) + ' closed.'); delete POARR[id]; PO = null; PLAN = null; PLAN_ERR = null; loadPo(); loadPlan();
    }, function (e) { toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var np = el('rv_nopo');
  if (np) np.addEventListener('click', function () { RECV.poId = ''; repaint(); });
  var ships = el('view').querySelectorAll('button[data-rvship]');
  for (var s2 = 0; s2 < ships.length; s2++) ships[s2].addEventListener('click', function () {
    RECV.ship = RECV.ship || {};
    RECV.ship.mode = this.getAttribute('data-rvship'); repaint();
  });
  function shipInput(id, key) {
    var n = el(id);
    if (!n) return;
    n.addEventListener('input', function () {
      RECV.ship[key] = n.value;
      var s = el('rv_shipsum');
      if (s) s.textContent = fmt(recvShipBdt());
    });
  }
  shipInput('rv_kg', 'kg'); shipInput('rv_krate', 'rate'); shipInput('rv_shiptot', 'total');
}

function wireStock() {
  wirePo();
  ['rv_sup','rv_ref','rv_notes'].forEach(function (id) {
    var n = el(id);
    if (n) n.addEventListener('input', function () {
      RECV[id === 'rv_sup' ? 'supplier' : id === 'rv_ref' ? 'reference' : 'notes'] = n.value;
    });
  });

  var modes = document.querySelectorAll('button[data-rvmode]');
  for (var mi = 0; mi < modes.length; mi++) {
    modes[mi].addEventListener('click', function () {
      RECV.mode = this.getAttribute('data-rvmode');
      if (RECV.mode === 'rmb' && !RECV.rate && COSTS && Number(COSTS.rate) > 0) {
        RECV.rate = String(COSTS.rate);
      }
      repaint();
    });
  }
  ['rv_rmb', 'rv_rate', 'rv_bdt'].forEach(function (id) {
    var n = el(id);
    if (!n) return;
    n.addEventListener('input', function () {
      RECV[id === 'rv_rmb' ? 'totalRmb' : id === 'rv_rate' ? 'rate' : 'totalBdt'] = n.value;
      var s = el('rv_costsum');
      if (s) s.innerHTML = recvCostSummary();
    });
  });
  var sr = el('rv_saverate');
  if (sr) sr.addEventListener('change', function () { RECV.saveRate = sr.checked; });

  var np = el('newProductStock');
  if (np) np.addEventListener('click', function () { quickStart('receive', ''); });

  var s = el('rv_search');
  if (s) {
    s.addEventListener('input', function () { paintRecvResults(s.value); });
    paintRecvResults('');
  }

  var q = el('view').querySelectorAll('[data-rvqty]');
  for (var i = 0; i < q.length; i++) (function (n) {
    n.addEventListener('change', function () {
      RECV.lines[Number(n.getAttribute('data-rvqty'))].qty = Math.max(1, Math.round(num(n.value)));
      repaint();
    });
  })(q[i]);

  var d = el('view').querySelectorAll('[data-rvdel]');
  for (var j = 0; j < d.length; j++) (function (n) {
    n.addEventListener('click', function () {
      RECV.lines.splice(Number(n.getAttribute('data-rvdel')), 1); repaint();
    });
  })(d[j]);

  var c = el('rv_clear');
  if (c) c.addEventListener('click', function () { RECV.lines = []; repaint(); });

  var sv = el('rv_save');
  if (sv) sv.addEventListener('click', function () {
    if (BUSY || !RECV.lines.length) return;
    BUSY = 'receive'; repaint();
    srv('erpReceiveShipment', [recvPayload()],
        function (res) {
        BUSY = '';
        toast('Received '+fmt(res.units || 0)+' unit(s) across '+fmt(res.received)+' product(s)'+
              (res.shipping ? ' · shipping '+fmt(res.shipping)+' spread into the cost' : '')+
              (RECV.poId ? ' · order '+esc(RECV.poId)+' updated' : '')+'.', false, 10000);
        RECV = { supplier:RECV.supplier, reference:'', notes:'', lines:[] };
        PO = null; loadPo();
        CAT = null; HIST = null; D = null; PLAN = null; PLAN_ERR = null; loadAll(); loadPlan();
      },
        function (e) {
        BUSY = ''; repaint();
        toast('Receive failed: '+esc(e && e.message ? e.message : e), true, 12000);
      });
  });

  var aj = { aj_sku:'sku', aj_dir:'direction', aj_reason:'reason' };
  Object.keys(aj).forEach(function (id) {
    var n = el(id);
    if (n) n.addEventListener('change', function () { ADJ[aj[id]] = n.value; repaint(); });
    if (n && id === 'aj_reason') {
      n.addEventListener('input', function () { ADJ.reason = n.value; });
    }
  });
  var aq = el('aj_qty');
  if (aq) aq.addEventListener('change', function () { ADJ.qty = Math.max(1, Math.round(num(aq.value))); repaint(); });

  var as = el('aj_save');
  if (as) as.addEventListener('click', function () {
    if (BUSY) return;
    if (!ADJ.sku) { toast('Choose a product.', true); return; }
    if (!String(ADJ.reason).trim()) { toast('A reason is required.', true); return; }
    BUSY = 'adjust'; repaint();
    srv('erpAdjustStock', [ADJ],
        function (res) {
        BUSY = '';
        toast('Recorded '+esc(res.direction)+' '+fmt(res.qty)+' · '+esc(res.product)+'.');
        ADJ = { sku:'', qty:1, direction:ADJ.direction, reason:'', notes:'' };
        CAT = null; HIST = null; D = null; PLAN = null; PLAN_ERR = null; loadAll(); loadPlan();
      },
        function (e) {
        BUSY = ''; repaint();
        toast('Adjustment failed: '+esc(e && e.message ? e.message : e), true, 12000);
      });
  });
}

function paintRecvResults(q) {
  var box = el('rv_results');
  if (!box) return;
  q = String(q || '').trim().toLowerCase();
  if (!q) { box.innerHTML = '<div class="empty">Start typing to find a product.</div>'; return; }
  var rows = CAT.filter(function (p) {
    if (String(p.status||'').toLowerCase() === 'discontinued') return false;
    return (p.name+' '+p.sku+' '+p.brand+' '+p.color).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 40);
  var newRow = '<div class="r" data-newr="1"><div><div class="nm" style="color:var(--series-1)">' +
    '+ Create new product' + (q ? ' \u201c' + esc(q) + '\u201d' : '') + '</div>' +
    '<div class="sku">A SKU you have never received before</div></div><div></div></div>';
  if (!rows.length) { box.innerHTML = newRow; wireRecvPicks(box, q); return; }
  var h = '';
  rows.forEach(function (p) {
    h += '<div class="r" data-rvpick="'+esc(p.sku)+'">'+
         '<div><div class="nm">'+esc(p.name)+'</div><div class="sku">'+esc(p.sku)+
         ' · '+fmt(p.stock)+' in stock</div></div>'+
         '<div>'+stateBadge(p.state)+'</div></div>';
  });
  box.innerHTML = h + newRow;
  wireRecvPicks(box, q);
}

function wireRecvPicks(box, q) {
  var picks = box.querySelectorAll('[data-rvpick]');
  for (var i = 0; i < picks.length; i++) (function (n) {
    n.addEventListener('click', function () {
      var sku = n.getAttribute('data-rvpick'), p = null;
      for (var k = 0; k < CAT.length; k++) if (CAT[k].sku === sku) { p = CAT[k]; break; }
      if (!p) return;
      for (var j = 0; j < RECV.lines.length; j++) {
        if (RECV.lines[j].sku === sku) { RECV.lines[j].qty += 1; repaint(); return; }
      }
      RECV.lines.push({ sku:p.sku, name:p.name, qty:1, stock:p.stock });
      repaint();
    });
  })(picks[i]);
  var nr = box.querySelector('[data-newr]');
  if (nr) nr.addEventListener('click', function () { quickStart('receive', q || ''); });
}

// view: customers
