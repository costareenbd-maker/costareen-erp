/**
 * A website order somebody already dealt with by hand. Ticking it off is
 * not enough: the courier's money has to find the invoice, so the box asks
 * which invoice it was - offering the likely ones - and ties the two
 * together. Only an order with no invoice at all is ticked off bare.
 */
function webHandledBox(no) {
  var w = document.createElement('div');
  w.className = 'gate';
  w.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px';
  w.innerHTML = '<div class="card" style="max-width:520px;width:100%"><h2 style="margin-top:0">Order #' + esc(no) + ' — which invoice is it?</h2>' +
    '<div class="loading" id="wh_body">Looking for the invoice…</div></div>';
  document.body.appendChild(w);
  function shut() { if (w.parentNode) w.parentNode.removeChild(w); }
  w.addEventListener('click', function (ev) { if (ev.target === w) shut(); });

  function paint(r) {
    var box = document.getElementById('wh_body');
    if (!box) return;
    box.className = '';
    var sg = r.suggest || [];
    box.innerHTML = '<div class="sub">' + esc(r.customer || '') + (r.phone ? ' · ' + esc(r.phone) : '') + ' · ' + fmt(r.total) +
      '. Tying it to its invoice is what lets Steadfast’s payout mark that invoice paid.</div>' +
      (sg.length ? '<div style="margin-top:10px">' + sg.map(function (s, i) {
        return '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="' + esc(s.id) + '"' + (i === 0 ? ' checked' : '') + '> <strong>' +
          esc(s.id) + '</strong> <span class="sku">' + esc(s.when) + ' · ' + esc(s.customer) + ' · ' + fmt(s.total) + '</span></label>';
      }).join('') + '</div>' : '<div class="note" style="margin-top:10px"><div class="ico">i</div><div>No invoice with this phone number was found near that date.</div></div>') +
      '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="__other"' + (sg.length ? '' : ' checked') + '> Another invoice: ' +
        '<input class="i" id="wh_other" placeholder="INV-YYYYMMDD-0000" style="max-width:220px;display:inline-block"></label>' +
      '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="__none"> There is no invoice — it was cancelled or never sold</label>' +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="wh_close">Cancel</button><button class="btn primary" type="button" id="wh_save">Save</button></div>';
    document.getElementById('wh_close').addEventListener('click', shut);
    var other = document.getElementById('wh_other');
    other.addEventListener('focus', function () { var o = w.querySelector('input[value="__other"]'); if (o) o.checked = true; });
    var sv = document.getElementById('wh_save');
    sv.addEventListener('click', async function () {
      var pick = w.querySelector('input[name="wh_pick"]:checked'), v = pick ? pick.value : '';
      function done(msg) { shut(); toast(msg, false, 9000); WEB = null; COURIER = null; loadWeb(); loadCourier(); }
      function bad(e) { sv.disabled = false; sv.textContent = 'Save'; toast(esc(e && e.message ? e.message : e), true, 12000); }
      if (v === '__none') {
        if (!(await uiConfirm('Tick order #' + no + ' off with no invoice?\n\nNothing is sold and no stock moves.'))) return;
        sv.disabled = true; sv.textContent = 'Saving…';
        srv('erpMarkWebOrderEntered', [no], function (res) { done('Order #' + esc(res.orderNo) + ' ticked off — no invoice.'); }, bad);
        return;
      }
      var inv = v === '__other' ? String(other.value || '').trim() : v;
      if (!inv) { toast('Choose the invoice, or type its number.', true); return; }
      sv.disabled = true; sv.textContent = 'Saving…';
      srv('erpLinkWebOrder', [{ orderNo: no, invoiceNo: inv }], function () { done('Order #' + esc(no) + ' is tied to ' + esc(inv) + '.'); }, bad);
    });
  }
  srv('erpWebOrderInvoices', [{ orderNo: no }], function (r) {
    if (r.linked) { shut(); toast('Order #' + esc(no) + ' is already tied to ' + esc(r.linked) + '.', false, 9000); WEB = null; loadWeb(); return; }
    paint(r);
  }, function (e) { paint({ suggest: [], customer: '', phone: '', total: 0 }); toast(esc(e && e.message ? e.message : e), true, 10000); });
}

// =====================================================================
// on-screen status strip
//
// The app runs inside Apps Script's sandboxed iframe, which no external
// tool can read the console of. So the page reports its own state: what
// the queue is doing, how long the current call has been running, and the
// last error. This is how a stuck call becomes visible instead of silent.
// =====================================================================
// Show the mechanic's readout only when the link says ?debug=1.
var DBG_ON = (function () {
  try { return /[?&]debug=1/.test(String(location.search || '')); }
  catch (e) { return false; }
})();
var DBG_START = new Date().getTime();
var DBG_LAST = '';
var DBG_JOB = null;
var DBG_JOB_AT = 0;
var DBG_DONE = [];

function dbgSet(msg, bad) {
  DBG_LAST = (bad ? '!! ' : '') + msg;
}

function dbgPaint() {
  var el2 = document.getElementById('dbg');
  if (!el2) return;
  var now = new Date().getTime();
  var running = DBG_JOB
    ? DBG_JOB + ' running ' + Math.round((now - DBG_JOB_AT) / 1000) + 's'
    : 'idle';
  var state = {
    CAT: CAT === null ? 'null' : (CAT.length + ' products'),
    LISTS: LISTS === null ? 'null' : 'ok',
    CUST: CUST === null ? 'null' : (CUST.length + ''),
    ORDERS: ORDERS === null ? 'null' : (ORDERS.length + ''),
    HIST: HIST === null ? 'null' : (HIST.length + ''),
    WEB: WEB === null ? 'null' : (WEB.length + '')
  };
  // This is a mechanic's readout, not something to show a person selling
  // filament. It stays hidden unless the link asks for it (?debug=1), so it
  // is still one URL away when something needs diagnosing.
  var slow = DBG_JOB && (now - DBG_JOB_AT) > 12000;
  var bad = DBG_LAST && DBG_LAST.indexOf('!!') === 0;
  if (DBG_ON && (slow || bad)) el2.className = 'on'; else el2.className = '';
  if (!DBG_ON) return;

  el2.innerHTML =
    '<b>queue</b> ' + running + ' | waiting ' + SRV_Q.length + ' | busy ' + SRV_BUSY +
    '   <b>data</b> cat:' + state.CAT + ' lists:' + state.LISTS +
    ' cust:' + state.CUST + ' inv:' + state.ORDERS + ' hist:' + state.HIST +
    ' web:' + state.WEB +
    '   <b>done</b> ' + (DBG_DONE.join(', ') || '-') +
    (DBG_LAST ? '\n<span class="' + (DBG_LAST.indexOf('!!') === 0 ? 'bad' : '') + '">' +
       esc(DBG_LAST) + '</span>' : '');
}
setInterval(dbgPaint, 500);

// Reading the sales history and the customer list is minutes of work for a
// big sheet; a button press is not. One watchdog for both meant the slow
// ones were killed while still working.
var SRV_SLOW = { erpPoCreate: 180000, erpPoArrive: 180000, erpPoDiffDecide: 120000, erpBackupRun: 300000, erpBackupStatus: 90000, erpCourier: 120000,
                 erpBookParcel: 120000, erpBookedParcels: 180000, erpCourierTest: 60000, erpBundle: 120000, erpAdmin: 90000, erpCustomers: 90000,
                 erpMergeCustomers: 300000, erpTool: 300000,
                 erpDeployBusiness: 300000, erpCreateBusiness: 300000,
                 erpSelfTest: 180000, erpApplyReorderLevels: 180000,
                 // Saving a sale writes the stock movements, the sales rows,
                 // the customer and a PDF. On a full sheet that is well past
                 // 45 seconds, and giving up on it was the worst kind of
                 // wrong: the sale WAS saved, and the screen said it failed
                 // and kept the last customer on the form.
                 erpMoney: 180000, erpReorderPlan: 180000,
                 erpExpenses: 120000, erpExpenseExport: 180000,
                 erpSales: 120000, erpFixInvoice: 90000, erpCancelInvoice: 180000, erpPoCreate: 90000, erpPnl: 180000, erpSfPayouts: 240000, erpStatementPdf: 120000, erpQuoteSave: 120000, erpQuoteAssetUpload: 120000, erpCampaignAudience: 120000, erpCampaignCreate: 120000, erpEvoSendBatch: 330000, erpEvoUpload: 120000, erpProductListShare: 120000, erpWaProductPdf: 120000, erpReturnGoods: 180000, erpInvoicePdf: 90000, erpReturnPreview: 90000,
                 erpCreateInvoice: 240000, erpEnterWebOrder: 240000,
                 erpVoidInvoice: 180000 };
function srvPatience(name) { return SRV_SLOW[name] || SRV_TIMEOUT; }

/**
 * A long random id for this browser, made once and kept.
 *
 * It is what ties a code to one phone: the same code from anywhere else is
 * refused until the owner allows that device.
 */
function erpDevice() {
  var k = 'erp_device_id';
  var v = '';
  try { v = window.localStorage.getItem(k) || ''; } catch (e) {}
  if (!v) {
    v = 'd' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) +
        new Date().getTime().toString(36);
    try { window.localStorage.setItem(k, v); } catch (e) {}
  }
  return v;
}

function erpCode() {
  try { return window.localStorage.getItem('erp_code') || ''; } catch (e) { return ''; }
}

function erpSetCode(c) {

function srv(name, args, ok, bad) {
  SRV_Q.push({ name: name, args: args || [], ok: ok, bad: bad });
  srvPump();
}

var SRV_ACTIVE = 0, SRV_WRITING = false;
// the same list the server uses to know a call changes nothing (ERP_READS)
var SRV_READS = /^(erpBundle|erpHello|erpMe|erpCatalog|erpSales|erpDues|erpCustomers|erpPnl|erpMoney|erpToday|erpDaySales|erpProduct|erpLookupCustomer|erpCustomerAccount|erpCustomerStatement|erpCustomerCredit|erpWebOrders|erpWebOrderInvoices|erpCampaignAudience|erpCampaignList|erpCampaignGet|erpEvoStatus|erpBrandLogo|erpQuoteBoot|erpQuoteList|erpQuoteGet|erpQuoteAsset|erpExpenses|erpCapital|erpBackupStatus|erpAiKeys|erpGetTheme|erpBusinesses|erpStockHistory|erpReorderPlan|erpPoList|erpSfPayoutLines|erpBookedParcels|erpParcelPreview|erpReturnPreview|erpSettingsFull|erpSettingsLists|erpFormOptions|erpAdmin|erpPeople|erpDevices|erpCourierKeyStatus|erpPayReasons|erpDiscontinued|erpAccessWarning|erpBusinessLinks|erpLookupUsage|erpRecentInvoices|erpCourier|erpDashboardData|erpInvoice|erpCustomerPage|erpSearch|erpProductPage|erpPnlMonth|erpExpenseReceiptUrl|erpPartnership|erpPartnerStock|erpSecurity|erpCustomerList|erpAlerts|erpAccessKeys|erpListView|erpCurrencies|erpSharedStock|erpPoolCatalog|erpCashBook|erpSuppliers|erpSupplierPage)$/;
function srvPump() {
  if (!SRV_Q.length) return;
  var isRead = SRV_READS.test(SRV_Q[0].name);
  // a read waits only for a write; a write waits for everything before it
  if (isRead ? (SRV_WRITING || SRV_ACTIVE >= 4) : SRV_ACTIVE > 0) return;
  SRV_ACTIVE++; if (!isRead) SRV_WRITING = true;
  SRV_BUSY = true;
  var job = SRV_Q.shift();
  var settled = false;
  DBG_JOB = job.name + '(' + (job.args[0] || '') + ')';
  DBG_JOB_AT = new Date().getTime();
  dbgPaint();

  function finish(fn, arg) {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    SRV_ACTIVE--; if (!isRead) SRV_WRITING = false;
    SRV_BUSY = SRV_ACTIVE > 0;
    DBG_DONE.push(DBG_JOB + ' ' + Math.round((new Date().getTime() - DBG_JOB_AT) / 1000) + 's');
    if (DBG_DONE.length > 6) DBG_DONE.shift();
    if (arg instanceof Error) dbgSet(DBG_JOB + ' -> ' + arg.message, true);
    // an action the server no longer knows means this page is older than the server
    if (arg && arg.message && /Unknown action/.test(String(arg.message))) staleBanner();
    DBG_JOB = null;
    dbgPaint();
    if (!isRead && !(arg instanceof Error)) { try { pagesAfterWrite(); } catch (e3) {} }
    try { if (fn) fn(arg); } catch (err) {
      try { toast('Display error: ' + esc(err && err.message ? err.message : err), true); } catch (e2) {}
    }
    srvPump();
  }

  var patience = srvPatience(job.name);
  var timer = setTimeout(function () {
    finish(job.bad, new Error('The server did not answer within ' +
      Math.round(patience / 1000) + ' seconds. Check the connection and try again.'));
  }, patience);

  // One door: the server identifies the caller and checks the role before
  // doing anything, so a screen that is hidden is also data that is never
  // sent. erpHello is the only exception - it is how you sign in.
  try {
    erpPost(job.name, job.args || []).then(function (res) {
      if (res && res.ok) finish(job.ok, res.result);
      else finish(job.bad, new Error((res && res.error) || 'The server did not answer.'));
    }, function (e) {
      finish(job.bad, new Error('Could not reach the server - check the internet connection. (' +
        ((e && e.message) || e) + ')'));
    });
  } catch (e) {
    finish(job.bad, e);
  }
  srvPump();   // start the next one too, if it may run alongside
}

/** Is this value one of the selected ones? */

/** One editable price cell, showing the unsaved value if there is one. */
function costInput(r, ed, key, ph) {
  var v = (ed[key] !== undefined) ? ed[key]

  return '<td class="num"><input class="i qty" inputmode="decimal" data-ck="' + key + '" ' +
         'data-row="' + r.row + '" value="' + esc(v) + '"' +

/**
 * Handling, which is the one column with two meanings: empty follows the
 * default above, a number overrides it for this row only. Without a hint,
 * a row holding its own copy of the default looks identical to one following
 * it - and then changing the default appears to do nothing.
 */
function costHandling(r, ed, dflt) {
  var td = costInput(r, ed, 'handling', String(dflt));
  var v = (ed.handling !== undefined) ? ed.handling
        : ((r.handling === null || r.handling === undefined) ? '' : String(r.handling));
  var title = String(v).trim() === ''
    ? 'Follows the default of ' + dflt + ' TK'
    : 'Set for this row only - the default does not apply here';
  return td.replace('<input class="i qty"',
    '<input class="i qty' + (String(v).trim() === '' ? '' : ' pinned') +
    '" title="' + esc(title) + '"');

    return '<span class="pill low" title="Below your minimum margin">' + txt + '</span>';
  }
  return '<span class="pill ok">' + txt + '</span>';
}

function wireCosts() {

  var ins = v.querySelectorAll('[data-ck]');
  for (var i = 0; i < ins.length; i++) {
    ins[i].addEventListener('input', function () {
      var row = this.getAttribute('data-row');
      COST_EDIT[row] = COST_EDIT[row] || {};
      COST_EDIT[row][this.getAttribute('data-ck')] = this.value;
      costDirty();
    });
  }
  costDirty();

  var chips = v.querySelectorAll('button[data-ckcat]');
  for (var c = 0; c < chips.length; c++) {
    chips[c].addEventListener('click', function () {
      var kind = this.getAttribute('data-ckkind');
      var val = this.getAttribute('data-ckcat');
      var list = kind === 'cat' ? COST_FILTER.cats : COST_FILTER.brands;
      var at = -1;
      for (var k = 0; k < list.length; k++) if (list[k] === val) { at = k; break; }
      if (at >= 0) list.splice(at, 1); else list.push(val);

  });

      if (ed.handling !== undefined) item.handling = ed.handling;

      if (ed.amount !== undefined || ed.cur !== undefined) {

        item.cur = ed.cur !== undefined ? ed.cur : (r.cur || 'RMB');

              esc(res.notFound.join(', ')) + '. Reload and try those again.', true, 15000);

/** How many rows are waiting to be saved - on the button row and the tab. */
function costDirty() {

/**
 * Who can open the business currently on screen.
 *
 * Access is Drive access to that business's sheet - add a partner here and
 * they can use the ERP for this business and nothing else. There is no
 * separate password list that could drift out of step.
 */
/**
 * One link per business.
 *
 * A shared link with a switcher is only as private as the switcher. A link
 * bound to one sheet cannot reach another business at all, which is what a
 * partner should be given.
 */
/**
 * The people who may use this ERP.
 *
 * Access is a code tied to one phone, so this list is the whole of it: add
 * someone here and they can work; revoke them here and they cannot, on the
 * next thing they try.
 */
/**
 * Devices waiting to be let in.
 *
 * This sits above everything else in Settings because it is the only thing
 * here that somebody is waiting on: until it is answered, a person standing
 * in the shop cannot work.
 */
function viewRequests() {
  var iAm = (ME && ME.role) || 'owner';
  if (iAm !== 'owner' && iAm !== 'shareholder') return '';
  if (!DEVS) return '';

  var waiting = DEVS.pending || [];
  if (!waiting.length) return '';

  var h = '<section><div class="card" style="border-color:var(--serious)">' +
    '<h2>' + fmt(waiting.length) + ' asking to use the ERP</h2>' +
    '<div class="sub">Someone entered their code on a device you have not allowed ' +
    'before. Check the name and the device look right, then let them in. ' +
    'Nothing works for them until you do.</div>' +
    '<div class="scroll"><table><thead><tr><th>Who</th><th>Role</th>' +
    '<th>Device</th><th>Asked</th><th></th></tr></thead><tbody>';

  waiting.forEach(function (d) {
    h += '<tr><td class="nm">' + esc(d.name) +
         (d.phone ? '<br><span class="sku">' + esc(d.phone) + '</span>' : '') + '</td>' +
         '<td>' + esc(d.roleLabel) + '</td>' +
         '<td>' + esc(d.label) + '</td>' +
         '<td><span class="sku">' + esc(d.requested) + '</span></td>' +
         '<td class="num">' +
         '<button class="btn small primary" type="button" data-allowdev="' + esc(d.id) + '">Let in</button> ' +
         '<button class="btn small danger" type="button" data-denydev="' + esc(d.id) + '">Refuse</button>' +
         '</td></tr>';
  });
  h += '</tbody></table></div></div></section>';
  return h;
}

/** The devices one person may work from, listed under their name. */
function deviceLines(p) {
  var ds = p.devices || [];
  if (!ds.length) return '<span class="sku">no device yet</span>';
  var out = [];
  ds.forEach(function (d) {
    var pill = d.status === 'approved' ? '<span class="pill ok">allowed</span>'
             : d.status === 'pending' ? '<span class="pill low">waiting</span>'
             : d.status === 'denied' ? '<span class="pill out">refused</span>'
             : '<span class="pill out">revoked</span>';
    out.push('<div style="margin:3px 0">' + esc(d.label) + ' ' + pill +
      (d.lastUsed ? ' <span class="sku">' + esc(d.lastUsed) + '</span>' : '') +
      (d.status === 'approved'
        ? ' <button class="btn small danger" type="button" data-revdev="' +
          esc(d.id) + '">Remove</button>' : '') +
      (d.status === 'pending'
        ? ' <button class="btn small primary" type="button" data-allowdev="' +
          esc(d.id) + '">Let in</button>' : '') +
      '</div>');
  });
  return out.join('');
}

function wireRequests() {
  var v = el('view');
  if (!v) return;
  function act(attr, fn, word) {
    var btns = v.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', async function () {
        var id = this.getAttribute(attr);
        var b = this;
        if (word === 'Remove' && !(await uiConfirm(
            'Stop this device working?\n\nThey can ask again from it later.'))) return;
        b.disabled = true; b.textContent = '…';
        srv(fn, [id], function (res) {
          DEVS = res.devices;
          if (res.people) STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
          toast(word === 'Let in' ? 'Allowed. They can start now.'
               : word === 'Refuse' ? 'Refused.' : 'That device can no longer be used.');
          repaint();
        }, function (e) {
          b.disabled = false; b.textContent = word;
          toast(esc(e && e.message ? e.message : e), true, 12000);
        });
      });
    }
  }
  act('data-allowdev', 'erpAllowDevice', 'Let in');
  act('data-denydev', 'erpDenyDevice', 'Refuse');
  act('data-revdev', 'erpRevokeDevice', 'Remove');
}

function viewStaff() {

  }

    '<select class="i" id="st_role">' +
    roles.map(function (r) {
      return '<option value="' + esc(r.id) + '">' + esc(r.label) +
             (r.cap < 100 ? ' · max ' + r.cap + '% discount' : '') + '</option>';
    }).join('') + '</select></div>' +
    '<div style="flex:0 0 auto;align-self:flex-end">' +

/**
 * Staff, links and people in one trip.
 *
 * Three separate calls queued ahead of the heavy customers/invoices bundle
 * and pushed it past its watchdog. One call cannot do that, and a section
 * that fails reports itself instead of taking the others down.
 */
var ADMIN_ASKED = false;

function loadAdmin(force) {
  if (ADMIN_ASKED && !force) return;
  ADMIN_ASKED = true;
  srv('erpAdmin', [], function (res) {
    STAFF = (res && res.staff) || null;
    STAFF_ERR = (res && res.staffError) || null;
    DEVS = (res && res.devices) || null;
    LINKS = (res && res.links) || null;
    LINKS_ERR = (res && res.linksError) || null;
    PEOPLE = (res && res.people) || null;
    PEOPLE_ERR = (res && res.peopleError) || null;
    if (PEOPLE && res.warning) PEOPLE.warning = res.warning;
    if (VIEW === 'settings') repaint();
  }, function (e) {
    var msg = (e && e.message) ? e.message : String(e);
    STAFF = LINKS = PEOPLE = null;
    STAFF_ERR = LINKS_ERR = PEOPLE_ERR = msg;
    ADMIN_ASKED = false;              // let it be tried again
    if (VIEW === 'settings') repaint();
  });
}

function wireStaff() {
  var v = el('view');
  if (!v) return;

  var add = el('st_add');
  if (add) add.addEventListener('click', function () {
    var name = (el('st_name').value || '').trim();
    if (!name) { toast('Type their name.', true); return; }
    add.disabled = true; add.textContent = 'Adding…';
    srv('erpAddPerson', [{ name: name,
                           phone: (el('st_phone').value || '').trim(),
                           role: el('st_role').value }], function (res) {
      add.disabled = false; add.textContent = 'Add person';
      NEWCODE = { name: res.name, code: res.code };
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      repaint();
    }, function (e) {
      add.disabled = false; add.textContent = 'Add person';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  var hide = el('st_hide');
  if (hide) hide.addEventListener('click', function () { NEWCODE = null; repaint(); });

  function act(attr, fn) {
    var btns = v.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { fn(this.getAttribute(attr), this); });
    }
  }

  act('data-allow', function (id, b) {
    b.disabled = true; b.textContent = 'Allowing…';
    srv('erpApproveDevice', [id], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Allowed. They can use the ERP now.');
      repaint();
    }, function (e) {
      b.disabled = false; b.textContent = 'Allow';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  act('data-newphone', async function (id, b) {
    if (!(await uiConfirm('Let this person set up a new phone?\n\n' +
        'Their current phone stops working until you allow the new one.'))) return;
    b.disabled = true;
    srv('erpResetCode', [{ id: id, newCode: false }], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Ready. Ask them to enter their code on the new phone.');
      repaint();
    }, function (e) {
      b.disabled = false;
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  act('data-revoke', async function (id, b) {
    if (!(await uiConfirm('Revoke this person?\n\nTheir code stops working straight away.'))) return;
    b.disabled = true;
    srv('erpRevokePerson', [id], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Revoked.');
      repaint();
    }, function (e) {
      b.disabled = false;
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });
}

function wireLinks() {

                         '" target="_blank">open it</a>' : ''), false, 20000);

      }, function (e) {
        b.disabled = false; b.textContent = 'Create link';
        toast(esc(e && e.message ? e.message : e), true, 20000);

  for (var c = 0; c < cp.length; c++) {

function repaint() {
  var h = VIEW === 'home' ? homeHtml()
        : VIEW === 'dash' ? viewDash()
        : VIEW === 'products' ? viewProducts()
        : VIEW === 'invoice' ? viewInvoice()
        : VIEW === 'stock' ? viewStock()
        : VIEW === 'customers' ? viewCustomers()
        : VIEW === 'profit' ? viewProfit()
        : VIEW === 'expenses' ? viewExpenses()
        : VIEW === 'capital' ? viewCapital()
        : VIEW === 'cash' ? viewCash()
        : VIEW === 'suppliers' ? viewSuppliers()
        : VIEW === 'sales' ? viewSales()
        : VIEW === 'quotes' ? viewQuotes()
        : VIEW === 'campaigns' ? viewCampaigns()
        : VIEW === 'weborders' ? viewWebOrders()
        : VIEW === 'costs' ? viewCosts()
        : VIEW === 'settings' ? viewSettings()
        : VIEW === 'tools' ? viewTools()
        : viewOrders();
  el('view').innerHTML = h;
  // One broken wiring call used to throw here AFTER the HTML was already on
  // screen, which killed whatever the caller meant to do next - that is how a
  // missing function turned into a panel that loaded forever with no error.
  // Wiring failures are now reported instead of silently aborting the caller.
  try {
    bindTips(el('view'));
    wirePhones();                 // before the view's own listeners, so they read the cleaned number
    if (VIEW === 'products') wireProducts();
    if (VIEW === 'invoice') wireInvoice();
    if (VIEW === 'stock') wireStock();
    if (VIEW === 'customers') { wireCustomers(); wireDueBox(); wireStatements(); }
    if (VIEW === 'profit') wireProfit();
    if (VIEW === 'expenses') wireExpenses();
    if (VIEW === 'capital') wireCapital();
    if (VIEW === 'sales') { wireSales(); wireDueBox(); wireSfp(); }
    if (VIEW === 'quotes') { wireQuotes(); if (QZ.sub === 'letter') wireLetter(); }
    if (VIEW === 'campaigns') wireCampaigns();
    wirePages();
    wireProductPage();
    wireStockExtra();
    wirePhase4();
    wirePhase5();
    wirePhase6();
    wireAccess();
    wireCash();
    wireSuppliers();
    // the parcel confirmation floats above whatever screen is open
    var pb = document.getElementById('parcelbox');
    if (pb && pb.parentNode) pb.parentNode.removeChild(pb);
    var box = parcelBox();
    if (box) {
      var w = document.createElement('div');
      w.id = 'parcelbox'; w.innerHTML = box;
      document.body.appendChild(w);
    }
    if (VIEW === 'weborders') { wireWebOrders(); wireCourier(); }
    sendCount();
    if (VIEW === 'settings') { wireCourierKeys(); wireEvoSettings(); }
    if (PARCEL || VIEW === 'orders' || VIEW === 'sales') wireParcel();
    if (VIEW === 'tools') wireTools();
    if (VIEW === 'settings') { wireSettings(); wireLinks(); wireStaff(); wireRequests(); }
    if (VIEW === 'costs') wireCosts();
    if (VIEW === 'dash') wireDash();
    if (PRODUCT_FORM) wireProductForm();
    if (CUST_FORM) wireCustomerForm();
  } catch (err) {
    var m = 'Screen wiring failed on "' + VIEW + '": ' + (err && err.message ? err.message : err);
    try { dbgSet(m, true); } catch (e2) {}
    try { toast(esc(m), true, 15000); } catch (e3) {}
  }
}

  if (c) c.textContent = CART.length ? String(CART.length) : '';
  setTimeout(tabbarSync, 0);     // the bottom bar repeats these badges
  var p = el('cProducts');

    var pend = WEB ? WEB.filter(function (o) { return !o.entered; }).length : 0;

// ---- every screen has its own address (#/sales), so Back and Forward work,
// a reload stays on the same screen, and a screen can be bookmarked ----
function routeView() {
  var m = /^#\/([a-z]+)/.exec(location.hash || '');
  return m ? m[1] : '';
}
function routeAllowed(view) {
  var b = el('nav').querySelector('button[data-view="' + view + '"]');
  return !!(b && b.style.display !== 'none');
}
function routeParam() {
  var m = /^#\/[a-z]+\/(.+)$/.exec(location.hash || '');
  try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
}
function routeSet(view, param, replace) {
  try {
    var want = '#/' + view + (param ? '/' + encodeURIComponent(param) : '');
    if ((location.hash || '') === want) return;
    if (replace) history.replaceState(null, '', want); else history.pushState(null, '', want);
  } catch (e) {}
}
window.addEventListener('popstate', function () {
  var v = routeView();
  var pm = routeParam();
  var cur = VIEW === 'sales' ? INVP.no : VIEW === 'customers' ? CUSP.key : VIEW === 'products' ? PRODP.sku : VIEW === 'suppliers' ? SUPP.name : '';
  if (ME && v && (v !== VIEW || pm !== cur) && routeAllowed(v)) go(v, pm);
});

function tabbarSync() {
  var tb = el('tabbar'); if (!tb) return;
  var on = !!ME;
  tb.hidden = !on;
  document.body.classList.toggle('has-tabbar', on);
  var b = tb.querySelectorAll('button[data-tab]');
  for (var i = 0; i < b.length; i++) {
    var v = b[i].getAttribute('data-tab');
    if (v !== '__menu') b[i].style.display = routeAllowed(v) ? '' : 'none';
    if (v === VIEW) b[i].setAttribute('aria-current', 'page'); else b[i].removeAttribute('aria-current');
  }
  try { el('tbCart').textContent = el('cCart').textContent; el('tbSend').textContent = el('cSend').textContent; } catch (e) {}
}
(function () {
  var tb = document.getElementById('tabbar'); if (!tb) return;
  tb.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]'); if (!b) return;
    var v = b.getAttribute('data-tab');
    if (v === '__menu') { el('app').classList.toggle('navopen'); return; }
    go(v);
  });
})();

function go(view, param) {
  VIEW = view;
  // a record page inside a screen: one invoice, one customer
  param = (view === 'sales' || view === 'customers' || view === 'products' || view === 'suppliers') ? String(param || '') : '';
  if (view === 'suppliers') { if (SUPP.name !== param) SUPP = { name: param, data: null, err: null }; }
  if (view === 'products') { if (PRODP.sku !== param) { PRODP = { sku: param, data: null, err: null }; PRODUCT_FORM = null; } }
  if (view === 'sales') { if (INVP.no !== param) { INVP = { no: param, data: null, err: null }; } }
  if (view === 'customers') { if (CUSP.key !== param) { CUSP = { key: param, data: null, err: null }; CUST_FORM = null; } }
  routeSet(view, param);
  tabbarSync();
  var b = el('nav').querySelectorAll('button');
  for (var i = 0; i < b.length; i++) {
    b[i].setAttribute('aria-selected', b[i].getAttribute('data-view') === view ? 'true' : 'false');
    if (b[i].getAttribute('data-view') === view) {
      var pt = el('pageTitle');
      if (pt) pt.textContent = String(b[i].textContent || '').replace(/\d+$/, '').trim();
    }
  }
  var app = el('app'); if (app) app.classList.remove('navopen');
  window.scrollTo(0, 0);
  repaint();
  if (view === 'orders' && !ORDERS) loadOrders();
  // The badge beside a name comes from the dues. The customer list is
  // also fetched at start-up WITHOUT them, so having customers is not
  // enough - that is how the badges went missing.
  if (view === 'customers' && (!CLIST || !DUES)) loadCustomers();
  if (view === 'profit' && !MONEY) loadMoney();
  if (view === 'profit') { PNL = null; PNL_ERR = null; loadPnl(); }
  if (view === 'expenses' && !EXP && !EXP_ERR) loadExpenses();
  if (view === 'cash') { CASH_ERR = null; loadCash(); }
  if (view === 'suppliers') { if (SUPP.name) loadSupplier(); else loadSuppliers(); }
  if (view === 'capital') { CAP_ERR = null; loadCapital(); if (CAP_TAB === 'partner') { PART_ERR = null; loadPartner(); } }
  if (view === 'settings' && SET_TAB === 'security' && !SEC) loadSecurity();
  if (view === 'sales' && INVP.no && !INVP.data) loadInvoicePage();
  if (view === 'products' && PRODP.sku && !PRODP.data) loadProductPage();
  if (view === 'customers' && CUSP.key && !CUSP.data) loadCustomerPage();
  if (view === 'sales' && !SALES && !SALES_ERR) loadSales();
  if (view === 'quotes' && !QZ.boot) loadQuoteBoot();
  if (view === 'campaigns') {
    try { CP.openMode = localStorage.getItem('czwa_mode') || CP.openMode; } catch (e) {}
    if (!CP.aud) cpLoad();
    if (!QZ.boot) loadQuoteBoot();          // the business name for {business}
  }
  if (view === 'stock' && !PLAN && !PLAN_ERR) loadPlan();
  if (view === 'stock' && !PO) loadPo();
  if (view === 'settings' && !SFKEYS) loadKeyStatus();
  if (view === 'weborders' && !WEB) loadWeb();
  if (view === 'weborders' && !COURIER && !COURIER_ERR) loadCourier();
  if (view === 'stock' && !HIST) loadHistory();
  if (view === 'settings' && !SETTINGS) loadSettings();
  if (view === 'settings') loadAdmin(false);
  if (view === 'costs' && !COSTS) loadCosts();
  if ((view === 'products' || view === 'stock') && !LISTS) loadLists();
}

// =====================================================================
// v3.5 - ONE server call instead of six
//
// These redefine the loaders above. Function declarations are hoisted and
// the last definition wins, so this block is what actually runs.
//
// Why: each google.script.run was a separate Apps Script execution, and
// Apps Script queues executions per user. A queued call that never runs
// fires neither handler, so the screen waited forever with nothing to
// report. erpBundle() returns every section in a single execution.
// =====================================================================

/** The code this page was loaded with. The server says which it is running; when they differ the page is old. */
var ERP_BUILD = 'b261002-1321';
function staleBanner() {
  if (document.getElementById('staleBar')) return;
  var d = document.createElement('div');
  d.id = 'staleBar';
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:500;background:#b3261e;color:#fff;padding:10px 16px;font-weight:600;text-align:center;font-size:14px';
  d.textContent = 'The ERP was updated while this page was open. Close this tab and open the ERP again (or press Ctrl+Shift+R) before you do anything else.';
  document.body.appendChild(d);
}

function applyBundle(b) {
  if (!b) return;
  if (b.build && b.build !== ERP_BUILD) staleBanner();
  var e = (b && b.errors) || {};

  if (b.dash) {
    D = b.dash;
    DASH_SAVED = !!D.saved;
    try {
      el('stamp').textContent = 'as of ' + D.generatedAt + ' \u00b7 ' + D.monthLabel + ' to date';
    } catch (x) {}
  }
  if (b.catalog)   CAT = b.catalog;
  if (b.lists)   { LISTS = b.lists; LISTS_ERR = null; }
  if (b.options) {
    OPT = b.options;
    if (OPT) {
      if (!FORM.source && OPT.sources && OPT.sources.length) FORM.source = OPT.sources[0];
      if (!FORM.method && OPT.paymentMethods && OPT.paymentMethods.length) FORM.method = OPT.paymentMethods[0];
      if (!FORM.status && OPT.paymentStatuses && OPT.paymentStatuses.length) FORM.status = OPT.paymentStatuses[0];
    }
  }
  if (b.customers) { CUST = b.customers; CUST_ERR = null; }
  if (b.invoices)  { ORDERS = b.invoices; ORDERS_ERR = null; }
  if (b.history)   { HIST = b.history; HIST_ERR = null; }
  if (b.weborders) WEB = b.weborders;
  if (b.settings) { SETTINGS = b.settings; SET_ERR = null; }
  if (b.today) TODAY_STR = b.today;
  if (b.costs) { COSTS = b.costs; COST_ERR = null; }
  if (b.dues) { DUES = b.dues; DUES_ERR = null; updateDueCount(); }
  if (e.costs) { COSTS = null; COST_ERR = e.costs; }

  // A section that failed reports itself, instead of leaving a panel spinning.
  if (e.catalog)   CAT = CAT || [];
  if (e.lists)   { LISTS = {}; LISTS_ERR = e.lists; }
  if (e.customers) { CUST = []; CUST_ERR = e.customers; }
  if (e.invoices)  { ORDERS = []; ORDERS_ERR = e.invoices; }
  if (e.history)   { HIST = []; HIST_ERR = e.history; }
  if (e.weborders) WEB = [];
  if (e.settings) { SETTINGS = null; SET_ERR = e.settings; }
  if (e.dash) toast('Dashboard: ' + esc(e.dash), true, 10000);

  updateCounts();
  repaint();
}

/** Any section still null after a load would spin forever - show why instead. */
function settleEmpties() {
  if (CAT === null) CAT = [];
  if (LISTS === null) LISTS = {};
  if (CUST === null)  { CUST = [];   CUST_ERR   = CUST_ERR   || 'No response for customers.'; }
  if (ORDERS === null){ ORDERS = []; ORDERS_ERR = ORDERS_ERR || 'No response for invoices.'; }
  if (HIST === null)  { HIST = [];   HIST_ERR   = HIST_ERR   || 'No response for stock movements.'; }
  if (WEB === null) WEB = [];
  updateCounts();
  repaint();
}

function bundleFail(e) {
  var msg = (e && e.message) ? e.message : String(e);
  settleEmpties();
  toast('Could not load: ' + esc(msg) +
        ' &nbsp; <a href="#" id="tRetry">Retry</a>', true, 20000);
  var r = el('tRetry');
  if (r) r.addEventListener('click', function (ev) { ev.preventDefault(); loadAll(); });
}

 * Nothing is drawn until we know who is here.
 *
 * The owner is let through without a code - losing a code must never lock
 * the business out of its own system.
 */
function gateName() {
  return (BIZ && BIZ.businesses && BIZ.businesses.length ? BIZ.businesses[0].name : '') || 'Costareen';
}
function gateScreen() {
  var busy = GATE_BUSY, owner = GATE_TAB === 'owner';
  var mark = String(gateName()).charAt(0).toUpperCase();
  return '<div class="gate"><div class="gatecard">' +
    '<div class="gatehead"><div class="gatemark">' + esc(mark) + '</div>' +
    '<div><div class="gatetitle">' + esc(gateName()) + '</div><div class="sub">Sign in to the ERP</div></div></div>' +
    '<div class="gatetabs" role="tablist">' +
      '<button type="button" role="tab" id="gate_t_staff" aria-selected="' + (!owner) + '">Staff</button>' +
      '<button type="button" role="tab" id="gate_t_owner" aria-selected="' + owner + '">Owner</button></div>' +
    (ME_MSG ? '<div class="note ' + (GATE_OK ? 'ok' : 'err') + '" style="margin-bottom:14px"><div class="ico">' + (GATE_OK ? '✓' : '✕') + '</div>' +
              '<div>' + esc(ME_MSG) + '</div></div>' : '') +
    (owner && GATE_STEP === 'totp' ? gateTotpHtml(busy) : owner
      ? '<label class="f" for="gate_email">Email</label>' +
        '<input class="i" id="gate_email" type="email" autocomplete="username" inputmode="email" value="' + esc(GATE_EMAIL) + '"' + (busy ? ' disabled' : '') + '>' +
        '<label class="f" for="gate_pass" style="margin-top:10px">Password</label>' +
        '<input class="i" id="gate_pass" type="password" autocomplete="current-password"' + (busy ? ' disabled' : '') + '>' +
        '<button class="btn primary gatego" type="button" id="gate_owner_go"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Checking…' : 'Sign in') + '</button>' +
        '<div class="sub gatefoot"><a href="#" id="gate_forgot">Forgot the password?</a></div>'
      : '<label class="f" for="gate_code">Your code</label>' +
        '<input class="i gatein" id="gate_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"' + (busy ? ' disabled' : '') + '>' +
        '<button class="btn primary gatego" type="button" id="gate_go"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Checking…' : 'Start') + '</button>' +
        '<div class="sub gatefoot">No code yet? The owner adds you under Settings → Staff, and allows this device the first time.</div>') +
    '</div></div>';
}

function wireGate() {
  function tab(t) { GATE_TAB = t; GATE_STEP = ''; ME_MSG = ''; GATE_OK = false; try { localStorage.setItem('erp_gate_tab', t); } catch (e) {} paintGate(); }
  var ts = el('gate_t_staff'), to = el('gate_t_owner');
  if (ts) ts.addEventListener('click', function () { if (GATE_TAB !== 'staff') tab('staff'); });
  if (to) to.addEventListener('click', function () { if (GATE_TAB !== 'owner') tab('owner'); });
  function fail(msg) { GATE_BUSY = false; GATE_OK = false; ME_MSG = msg; paintGate(); }

  // ---- staff: a code, on a device the owner has allowed ----
  var box = el('gate_code'), go = el('gate_go');
  if (box) { try { box.focus(); } catch (e) {} }
  function submit() {
    if (GATE_BUSY) return;
    var c = (box && box.value || '').replace(/\D/g, '');
    if (c.length < 4) { fail('Type the code you were given.'); return; }
    GATE_BUSY = true; ME_MSG = ''; paintGate();
    erpSetCode(c);
    srv('erpHello', [], function (res) {
      GATE_BUSY = false;
      if (res && res.ok) { ME = res; ME_MSG = ''; startApp(); }
      else { erpSetCode(''); fail((res && res.message) || 'Could not sign you in.'); }
    }, function (e) { erpSetCode(''); fail((e && e.message) ? e.message : String(e)); });
  }
  if (go) go.addEventListener('click', submit);
  if (box) box.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });

  // ---- owner: email and password ----
  var em = el('gate_email'), pw = el('gate_pass'), og = el('gate_owner_go'), fg = el('gate_forgot');
  if (em) { try { (em.value ? pw : em).focus(); } catch (e) {} em.addEventListener('input', function () { GATE_EMAIL = em.value.trim(); }); }
  function ownerIn() {
    if (GATE_BUSY) return;
    var mail = (em && em.value || '').trim(), pass = (pw && pw.value) || '';
    GATE_EMAIL = mail;
    if (!mail || !pass) { fail('Type your email and password.'); return; }
    if (!SB) { fail('Sign-in could not load. Check the internet connection and reload.'); return; }
    GATE_BUSY = true; ME_MSG = ''; paintGate();
    erpSetCode('');
    SB.auth.signInWithPassword({ email: mail, password: pass }).then(function (r) {
      if (r.error) throw r.error;
      gateNeedsCode(function () { gateHello(fail); });
    }).catch(function (e) {
      fail(/invalid/i.test(String(e && e.message)) ? 'That email and password do not match.' : ((e && e.message) || String(e)));
    });
  }
  if (og) og.addEventListener('click', ownerIn);
  if (pw) pw.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ownerIn(); });
  if (em) em.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && pw) pw.focus(); });
  if (fg) fg.addEventListener('click', function (ev) {
    ev.preventDefault();
    if (GATE_BUSY) return;
    var mail = (em && em.value || '').trim();
    if (!/^\S+@\S+\.\S+$/.test(mail)) { fail('Type your email above first, then press "Forgot the password?".'); return; }
    if (!SB) { fail('Sign-in could not load. Check the internet connection and reload.'); return; }
    GATE_BUSY = true; ME_MSG = ''; paintGate();
    var said = function () {
      // the same answer whether or not the address has an account, so nobody can test addresses here
      GATE_BUSY = false; GATE_OK = true;
      ME_MSG = 'If ' + mail + ' is an owner account, a link to choose a new password is on its way. Open it on this device.';
      paintGate();
    };
    SB.auth.resetPasswordForEmail(mail, { redirectTo: location.origin + '/' }).then(said, said);
  });
  wireGateTotp(fail);
}

/** Forget the code on this device, and go back to the code screen. */
async function signOut() {
  if (!(await uiConfirm('Sign out on this device?'))) return;
  erpSetCode('');
  ME = null; ME_MSG = ''; GATE_STEP = ''; SEC = null; MFA = { known: false, on: false, factor: null, enroll: null, busy: false, err: '' };
  var after = function () { paintGate(); };
  try { if (SB) { SB.auth.signOut().then(after, after); return; } } catch (e) {}
  after();
}

function paintGate() {
  tabbarSync();
  var v = el('view');
  if (v) { v.innerHTML = gateScreen(); wireGate(); }
  try { el('nav').style.display = 'none'; el('side').style.display = 'none'; document.querySelector('.topbar').style.display = 'none'; } catch (e) {}
}

/** Ask the server who this is, then either open the app or show the gate. */
function signIn() {
  srv('erpHello', [], function (res) {
    if (res && res.ok) { ME = res; startApp(); }
    else { ME = null; GATE_OK = false; ME_MSG = (res && res.reason === 'NO_CODE') ? '' : ((res && res.message) || ''); paintGate(); gateResume(); }
  }, function (e) {
    ME = null;
    ME_MSG = (e && e.message) ? e.message : String(e);
    paintGate();
  });
}

function startApp() {
  try { el('nav').style.display = ''; el('side').style.display = ''; document.querySelector('.topbar').style.display = ''; } catch (e) {}
  var so = el('signoutBtn');
  if (so && !so.__wired) { so.__wired = true; so.addEventListener('click', signOut); }
  applyRole();
  // open on the screen the address names, if this person may see it
  var want = routeView();
  if (want && routeAllowed(want)) go(want, routeParam()); else { routeSet(VIEW, '', true); go(VIEW); }
  loadAll(true);
}

/** Hide what this role may not use. The server refuses it too. */
function applyRole() {
  var role = (ME && ME.role) || 'owner';
  var rank = { sales: 1, manager: 2, shareholder: 3, owner: 4 }[role] || 0;
  // The dashboard is the shape of the business - the month's revenue, what
  // the stock is worth, the trend. That is not a manager's to see, so the
  // screen goes rather than being emptied out.
  var need = { dash: 3, costs: 3, settings: 3, tools: 3, profit: 3, expenses: 3, capital: 3, cash: 3, suppliers: 2, campaigns: 2,
               weborders: 2, stock: 2 };
  var btns = document.querySelectorAll('#nav button[data-view]');
  for (var i = 0; i < btns.length; i++) {
    var v = btns[i].getAttribute('data-view');
    var min = need[v] || 0;
    btns[i].style.display = (rank >= min) ? '' : 'none';
  }
  var grps = document.querySelectorAll('#nav .navgrp');
  for (var g = 0; g < grps.length; g++) {
    var any = false, n = grps[g].nextElementSibling;
    while (n && !n.classList.contains('navgrp')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
    grps[g].style.display = any ? '' : 'none';
  }
  var who = el('whoami');
  if (who) {
    who.textContent = (ME && ME.name ? ME.name : '') +
      (ME && ME.roleLabel ? ' · ' + ME.roleLabel : '');
    who.style.display = (ME && ME.name) ? '' : 'none';
  }
  // a manager can run more than one business, so they get the switcher too;
  // the list they are given holds only the ones they were put in
  try { el('bizSel').style.display = (rank >= 2) ? '' : 'none'; } catch (e) {}
  // web app: everyone signed in can sign out - the owner ends their session
  var so = el('signoutBtn');
  if (so) so.style.display = ME ? '' : 'none';
  // send them somewhere they are allowed to be, not to a screen they cannot open
  var home = rank >= 3 ? 'dash' : 'products';
  if (!ME || rank < (need[VIEW] || 0)) VIEW = home;
}

function loadBusinesses(done) {
  srv('erpBusinesses', [], function (b) {
    applyBusinesses(b);
    if (done) done();
  }, function (e) {
    toast('Could not read the business list: ' + esc(e && e.message ? e.message : e), true, 12000);
    if (done) done();
  });
}
/** Put the list of businesses on the page. The logo is fetched after, so it never holds the first screen up. */
function applyBusinesses(b) {
    BIZ = b;
    var sel = el('bizSel');
    if (sel) {
      if (!b.businesses.length) {
        sel.innerHTML = '<option>No business shared with you</option>';
      } else {
        sel.innerHTML = b.businesses.map(function (x) {
          return '<option value="' + esc(x.id) + '"' +
                 (x.id === b.active ? ' selected' : '') + '>' + esc(x.name) + (x.pool ? ' (joint pool)' : '') + '</option>';
        }).join('') + (b.canAdd ? '<option value="__new">+ Add a business\u2026</option>' : '');
      }
    }
    var cur = null;
    for (var i = 0; i < b.businesses.length; i++) if (b.businesses[i].id === b.active) cur = b.businesses[i];
    var nm = el('bizName');
    if (nm && cur) nm.textContent = cur.name;
    if (cur) { brandLetter(cur.name); brandLoad(cur.id); }
    if (b.theme) applyTheme(b.theme);
}

function switchBusiness(id) {
  srv('erpSetBusiness', [id], function (res) {
    toast('Switched to <strong>' + esc(res.name) + '</strong>.');
    // everything on screen belongs to the previous business
    D = CAT = CUST = ORDERS = LISTS = HIST = WEB = SETTINGS = null;
    OPT = null; CART = []; RECV = { supplier:'', reference:'', notes:'', lines:[] };
    PRODUCT_FORM = null; CUST_FORM = null;
    CLIST = null; CUST_OFF = 0; ALERTS = null; loadAlerts(); LVS = {};
    CASH = null; CASH_ACC = ''; SUPS = null; SUPP = { name: '', data: null, err: null };
    PART = null; PART_STOCK = null; PART_MONTH = ''; CAPD = null; EXP = null; PNL = null; MONEY = null; SALES = null; PLAN = null; PO = null;
    PNLM = { month: '', data: null, err: null }; INVP = { no: '', data: null, err: null }; CUSP = { key: '', data: null, err: null }; PRODP = { sku: '', data: null, err: null };
    if (VIEW === 'capital' || VIEW === 'expenses' || VIEW === 'profit' || VIEW === 'sales' || VIEW === 'stock') setTimeout(function () { go(VIEW); }, 0);
    var nm = el('bizName'); if (nm) nm.textContent = res.name;
    brandLetter(res.name); brandLoad(id);
    loadAll();
  }, function (e) {
    toast(esc(e && e.message ? e.message : e), true, 12000);
    loadBusinesses();
  });
}

var DASH_SAVED = false;   // the dashboard on screen is the kept copy; a fresh one is on its way
function loadAll(first, fresh) {
  if (!BIZ_READY) return;
  el('view').innerHTML = '<div class="loading">Loading&hellip;</div>';
  // Core first so the screen becomes usable quickly, then the rest. On the
  // very first load the list of businesses rides along, instead of being a
  // trip of its own that everything else waited behind.
  var core = (first === true ? ['biz'] : []).concat(['dash', 'catalog', 'lists', 'options']);
  var left = 2;
  function one() { if (--left === 0) settleEmpties(); }
  srv('erpBundle', [core, { fresh: fresh === true }], function (b) {
    if (b && b.biz) applyBusinesses(b.biz);
    applyBundle(b);
    one();
    // what was shown at once was the kept copy: now fetch today's figures behind it
    if (DASH_SAVED) srv('erpBundle', [['dash'], { fresh: true }], function (b3) { applyBundle(b3); if (VIEW === 'dash') repaint(); }, function () {});
  }, bundleFail);
  srv('erpBundle', [['invoices', 'history', 'weborders']], function (b2) {
    applyBundle(b2);
    one();
  }, bundleFail);
}

function loadOrders()    { srv('erpBundle', [['invoices']],  applyBundle, bundleFail); }
function loadCustomers() {
  // dues ride along: the badge beside each name comes from the same answer,
  // so opening this screen costs one call, not one per customer
  srv('erpBundle', [['customers', 'dues']], applyBundle, bundleFail);
}
function loadHistory()   { srv('erpBundle', [['history']],   applyBundle, bundleFail); }
function loadWeb()       { srv('erpBundle', [['weborders']], applyBundle, bundleFail); }
function loadLists()     { srv('erpBundle', [['lists']],     applyBundle, bundleFail); }
function loadSettings()  { srv('erpBundle', [['settings']],  applyBundle, bundleFail); }
function loadCosts()     { srv('erpBundle', [['costs']],     applyBundle, bundleFail); }
function srvOpt()        { srv('erpBundle', [['options']],   applyBundle, bundleFail); }

/** Tools: time every section so a slow or broken sheet is visible, not guessed at. */
function runSelfTest() {
  toast('Running diagnostics\u2026');
  srv('erpSelfTest', [], function (rows) {
    var h = '<div class="scroll"><table><thead><tr><th>Section</th><th class="num">Time</th>' +
            '<th class="num">Rows</th><th>Result</th></tr></thead><tbody>';
    (rows || []).forEach(function (r) {
      h += '<tr><td class="nm">' + esc(r.part) + '</td>' +
           '<td class="num">' + fmt(r.ms) + ' ms</td>' +
           '<td class="num">' + fmt(r.size) + '</td>' +
           '<td>' + (r.error
              ? '<span class="pill out">\u2715 ' + esc(r.error) + '</span>'
              : '<span class="pill ok">\u2713 OK</span>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    var box = el('selfTestOut');
    if (box) box.innerHTML = h; else toast('Diagnostics finished.');
  }, function (e) {
    var box = el('selfTestOut');
    var msg = '<div class="note err"><div class="ico">\u2715</div><div>' +
              esc((e && e.message) ? e.message : String(e)) + '</div></div>';
    if (box) box.innerHTML = msg; else toast('Diagnostics failed.', true);
  });
}

</script>

.pagehead .meta { color:var(--muted); font-size:13px; margin-top:3px; }

.backlink { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:600; color:var(--ink-2);
  background:none; border:none; padding:4px 0; margin-bottom:8px; cursor:pointer; }

/* search in the top bar */
.gsearch { position:relative; flex:1 1 260px; max-width:440px; margin:0 12px; }
.gsearch input { width:100%; min-height:38px; }
#gs_out { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:90; background:var(--surface); border:1px solid var(--ring);
  border-radius:12px; box-shadow:var(--shadow-lg, 0 18px 50px rgba(0,0,0,.35)); max-height:70vh; overflow:auto; padding:6px; }
