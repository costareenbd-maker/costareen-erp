  return h;
}

/** Inside the pool: who put in what, who sold what, and who pays whom. */
function poolHtml() {
  var p = PART, ed = p.canEdit, cur = p.currency, r = p.report || {}, tm = r.this_month || {}, td = r.to_date || {}, ps = r.partners || [];
  var nameOf = {}; p.partners.forEach(function (x) { nameOf[x.id] = x.name; });
  var closed = !!r.closed, canClose = ed && !p.isCurrent && !closed;
  var h = '<section><div class="row" style="align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
    '<button class="btn small" type="button" id="pl_prev">&larr; Earlier</button>' +
    '<strong style="min-width:140px;text-align:center">' + esc(p.label) + '</strong>' +
    '<button class="btn small" type="button" id="pl_next"' + (p.isCurrent ? ' disabled' : '') + '>Later &rarr;</button>' +
    (closed ? '<span class="pill ok">closed — fixed as agreed</span>' : p.isCurrent ? '<span class="pill">this month, so far</span>' : '<span class="pill low">open</span>') +
    '<span style="flex:1"></span>' +
    (canClose ? '<button class="btn small primary" type="button" id="pl_close">Close ' + esc(p.label) + '</button>' : '') + '</div>' +
    '<div class="grid g-kpi">' +
    kpiT('Sold this month', cur, fmt(tm.revenue || 0), '<span class="delta">goods cost ' + fmt(tm.cogs || 0) + '</span>', 'accent') +
    kpiT('Profit this month', cur, fmt(tm.profit || 0), '<span class="delta">after ' + fmt(tm.expenses || 0) + ' of pool expenses</span>', (tm.profit || 0) < 0 ? 'bad' : 'good') +
    kpiT('Capital in the pool', cur, fmt(td.capital || 0), '<span class="delta">profit so far ' + fmt(td.profit || 0) + '</span>') +
    kpiT('Stock at cost', cur, fmt(td.stock_at_cost || 0), '<span class="delta">owned in the same shares</span>') +
    (td.basis === 'cash' ? kpiT('Customers still owe', cur, fmt(td.receivables || 0), '<span class="delta">sold on credit, not paid yet \u2014 shared like the stock</span>', (td.receivables || 0) > 0.5 ? 'warn' : '') : '') +
    '</div></section>';

  h += '<section><div class="card"><h2>' + esc(p.name) + ' — the partners</h2><div class="sub">Profit is shared by capital as it stood when the month began; money added during a month counts from the next. ' +
    '“Holds” is the pool’s cash in that partner’s hands \u2014 money actually received from customers, by whoever took it; a sale on credit is not counted until it is paid. “Should hold” is what is theirs. The difference is what they pay in or get back.</div>' +
    '<div class="scroll"><table><thead><tr><th>Partner</th><th class="num">Capital</th><th class="num">Share</th><th class="num">Sold this month</th><th class="num">Profit share</th>' +
    '<th class="num">Holds</th><th class="num">Should hold</th><th class="num">To settle</th></tr></thead><tbody>' +
    ps.map(function (x) {
      var b = Number(x.balance) || 0;
      return '<tr><td class="nm">' + esc(x.name) + (x.business_id === p.me ? ' <span class="pill">you</span>' : '') + '<br><span class="sku">sells at the ' + esc(x.tier) + ' price</span></td>' +
        '<td class="num">' + fmt(x.capital) + '</td><td class="num"><strong>' + (Math.round(x.ratio * 1000) / 10) + '%</strong></td><td class="num">' + fmt(x.month_sales) + '</td>' +
        '<td class="num">' + fmt(x.profit_share) + '</td><td class="num">' + fmt(x.held) + '</td><td class="num">' + fmt(x.due) + '</td>' +
        '<td class="num"><strong style="color:var(' + (b > 0.5 ? '--critical' : b < -0.5 ? '--good' : '--muted') + ')">' + (b > 0.5 ? 'pays ' + fmt(b) : b < -0.5 ? 'receives ' + fmt(-b) : 'even') + '</strong></td></tr>';
    }).join('') + '</tbody></table></div>';
  var tr = r.transfers || [];
  if (!tr.length) h += '<div class="paybox"><span class="pill ok">✓</span> Nobody owes anything — the cash is where it should be.</div>';
  else tr.forEach(function (t) {
    h += '<div class="paybox"><span><strong>' + esc(nameOf[t.from] || '?') + '</strong> hands <b>' + esc(cur) + ' ' + fmt(t.amount) + '</b> to <strong>' + esc(nameOf[t.to] || '?') + '</strong> and everyone is even.</span>' +
      (ed && !closed ? '<button class="btn small primary" type="button" data-plpay="' + esc(t.from) + '" data-to="' + esc(t.to) + '" data-amt="' + esc(t.amount) + '">It has been handed over</button>' : '') + '</div>';
  });
  if (ps.length > 1 && ps.some(function (x) { return x.top_up_to_equal > 0.5; })) {
    h += '<div class="sub" style="margin-top:8px">To bring the shares level: ' + ps.filter(function (x) { return x.top_up_to_equal > 0.5; }).map(function (x) {
      return esc(x.name) + ' puts in ' + fmt(x.top_up_to_equal) + ' more'; }).join(' · ') + '.</div>';
  }
  if ((r.partner_deals_open || []).length) h += '<div class="sub" style="margin-top:8px">' + fmt(r.partner_deals_open.length) + ' sale(s) from each other’s own stock are not paid yet — they are settled separately, in each company’s own Partnership tab.</div>';
  if (ed && ps.length > 1) {
    h += '<div class="row" style="margin-top:12px;gap:8px;align-items:flex-end;flex-wrap:wrap">' + p.partners.map(function (x) {
      return '<div style="flex:0 1 220px"><label class="f">' + esc(x.name) + ' sells at</label><select class="i" data-pltier="' + esc(x.id) + '"><option value="retail"' + (x.tier === 'retail' ? ' selected' : '') + '>Retail price</option>' +
        '<option value="wholesale"' + (x.tier === 'wholesale' ? ' selected' : '') + '>Wholesale price</option></select></div>'; }).join('') + '</div>';
  }
  h += '</div></section>';

  // ---- the book ----
  if (ed && !closed) {
    var e = PART_EN, who = e.partner || p.me || (p.partners[0] ? p.partners[0].id : '');
    var opts = function (sel, skip) { return p.partners.filter(function (x) { return x.id !== skip; }).map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (sel === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join(''); };
    h += '<section><div class="card"><h2>Write in the pool’s book</h2><div class="sub">Money that is not a sale or a stock purchase: capital put in or taken back, a cost one partner paid for the pool, cash handed from one to the other. ' +
      'Sales and purchases are counted by themselves, to whoever made them.</div>' +
      '<div class="row" style="align-items:flex-end;gap:8px;flex-wrap:wrap">' +
      '<div style="flex:1 1 170px"><label class="f" for="pe_kind">What</label><select class="i" id="pe_kind">' +
        [['capital_in', 'Money put in'], ['capital_out', 'Capital taken back'], ['expense', 'Expense paid for the pool'], ['transfer', 'Cash handed to the other']].map(function (o) {
          return '<option value="' + o[0] + '"' + (e.kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
      '<div style="flex:1 1 150px"><label class="f" for="pe_who">' + (e.kind === 'transfer' ? 'From' : 'Who') + '</label><select class="i" id="pe_who">' + opts(who) + '</select></div>' +
      (e.kind === 'transfer' ? '<div style="flex:1 1 150px"><label class="f" for="pe_to">To</label><select class="i" id="pe_to">' + opts(e.to, who) + '</select></div>' : '') +
      '<div style="flex:1 1 120px"><label class="f" for="pe_amt">Amount</label><input class="i" id="pe_amt" inputmode="decimal" placeholder="0" value="' + esc(e.amount) + '"></div>' +
      '<div style="flex:1 1 140px"><label class="f" for="pe_date">Date <span class="sku">(empty = today)</span></label><input class="i" id="pe_date" type="date" max="' + esc(p.today) + '" value="' + esc(e.date) + '"></div>' +
      (e.kind === 'expense' ? '<div style="flex:1 1 150px"><label class="f" for="pe_cat">Category</label><input class="i" id="pe_cat" maxlength="40" placeholder="Transport, packaging…" value="' + esc(e.category) + '"></div>' : '') +
      '<div style="flex:2 1 200px"><label class="f" for="pe_note">Note <span class="sku">(optional)</span></label><input class="i" id="pe_note" maxlength="300" value="' + esc(e.note) + '"></div>' +
      '<button class="btn primary" type="button" id="pe_add"' + (PART_BUSY ? ' disabled' : '') + '>' + (PART_BUSY ? 'Saving…' : 'Write it down') + '</button></div></div></section>';
  }
  h += '<section><div class="grid g-half"><div class="card"><h2>The pool’s book</h2><div class="sub">Newest first. Nothing is removed: a wrong line is struck out with a reason, and every partner sees it. A line in a closed month can no longer be changed.</div>';
  if (!p.ledger.length) h += '<div class="empty">Nothing written yet. Start with the capital each partner put in.</div>';
  else h += '<div class="scroll tall"><table><tbody>' + p.ledger.map(function (l) {
    var plus = l.kind === 'capital_in';
    return '<tr' + (l.voided ? ' style="opacity:.6"' : '') + '><td style="white-space:nowrap">' + esc(l.when) + '</td><td class="nm"' + (l.voided ? ' style="text-decoration:line-through"' : '') + '>' + esc(l.who) + (l.to ? ' &rarr; ' + esc(l.to) : '') + '<br><span class="sku">' + esc(l.label) + (l.category ? ' · ' + esc(l.category) : '') + (l.note ? ' · ' + esc(l.note) : '') + '</span>' +
      (l.voided ? '<br><span class="sku" style="text-decoration:none;display:inline-block">' + esc(l.voided) + '</span>' : '') + '</td>' +
      '<td class="num"><strong>' + (plus ? '+' : l.kind === 'transfer' ? '' : '−') + fmt(l.amount) + '</strong></td>' +
      '<td class="num">' + (ed && !l.locked && !l.voided ? '<button class="btn small" type="button" data-pldel="' + esc(l.id) + '">Strike out</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '</div><div class="card"><h2>Partners and invites</h2><div class="list">' + p.partners.map(function (x) {
    return '<div><span>' + esc(x.name) + '<span class="sku">sells at the ' + esc(x.tier) + ' price</span></span><b>' + (x.id === p.me ? 'you' : '') + '</b></div>'; }).join('') + '</div>';
  if (ed) {
    h += (p.invites.length ? '<div class="sub" style="margin-top:12px">Send this code to your partner. They sign in to their own business, open Capital → Partnership and join with it. Good until ' + esc(p.invites[0].until) + ', works once.</div>' +
        p.invites.map(function (i) { return '<div style="margin-top:6px"><span class="codebox">' + esc(i.code) + '</span></div>'; }).join('')
      : '<div class="sub" style="margin-top:12px">No invite is open.</div>') +
      '<button class="btn small" type="button" id="pl_invite" style="margin-top:10px"' + (PART_BUSY ? ' disabled' : '') + '>New invite code</button>';
  }
  if (p.closedMonths.length) h += '<div class="sub" style="margin-top:12px">Closed months: ' + p.closedMonths.map(function (m) { return esc(capMonth(m)); }).join(' · ') + '</div>';
  return h + '</div></div></section>';
}

// ------------------------------------------------------------ wiring for all of the above
function wirePhase4() {
  var v = el('view'); if (!v) return;
  function val(id) { var n = el(id); return n ? n.value : ''; }
  function bind(id, obj, key) { var n = el(id); if (n) n.addEventListener('input', function () { obj[key] = n.value; }); }

  if (VIEW === 'profit') {
    var step = function (by) { if (!PNL) return; PNL_TO = shiftMonth(PNL.to, by); PNL = null; repaint(); loadPnl(); };
    var pv = el('pnl_prev'), nx = el('pnl_next'), cs = el('pnl_csv');
    if (pv) pv.addEventListener('click', function () { step(-3); });
    if (nx) nx.addEventListener('click', function () { step(3); });
    if (cs) cs.addEventListener('click', function () { if (PNL) pnlCsv(); });
    p4Each('button[data-pnln]', function () { PNL_N = Number(this.getAttribute('data-pnln')); PNL = null; repaint(); loadPnl(); });
    p4Each('button[data-pnlm]', function () {
      PNLM = { month: this.getAttribute('data-pnlm'), data: null, err: null }; repaint(); loadPnlMonth();
      var box = el('pnlm'); if (box && box.scrollIntoView) box.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
    var cl = el('pnlm_close'); if (cl) cl.addEventListener('click', function () { PNLM = { month: '', data: null, err: null }; repaint(); });
    var ex = el('pnlm_exp'); if (ex) ex.addEventListener('click', function () { EXP_MONTH = PNLM.month; EXP = null; EXP_ERR = null; go('expenses'); });
  }

  if (VIEW === 'expenses') {
    var fi = el('ex_file');
    if (fi) fi.addEventListener('change', function () { var f = fi.files && fi.files[0]; fi.value = ''; expSendReceipt(f); });
    p4Each('button[data-exrca]', function () { EXP_RC = this.getAttribute('data-exrca'); var f = el('ex_file'); if (f) f.click(); });
    p4Each('button[data-exrcv]', function () {
      var w = window.open('', '_blank');
      srv('erpExpenseReceiptUrl', [{ id: this.getAttribute('data-exrcv') }], function (r) { if (w) w.location = r.url; else location.href = r.url; },
          function (e) { if (w) w.close(); toast(p4Err(e), true, 10000); });
    });
    var tg = el('exc_toggle'); if (tg) tg.addEventListener('click', function () { EXP_CAT_OPEN = !EXP_CAT_OPEN; repaint(); });
    var catDone = function (e) { EXP = e; EXP_MONTH = e.month; if (VIEW === 'expenses') repaint(); };
    var catBad = function (e) { toast(p4Err(e), true, 10000); };
    p4Each('button[data-excadd]', function () {
      var k = this.getAttribute('data-excadd'), box = v.querySelector('input[data-excnew="' + k + '"]');
      srv('erpExpenseCategory', [{ kind: k, add: box ? box.value : '', month: EXP_MONTH }], catDone, catBad);
    });
    p4Each('button[data-excdel]', async function () {
      var k = this.getAttribute('data-excdel'), name = this.getAttribute('data-v');
      if (!(await uiConfirm('Take “' + name + '” off the list?\n\nEntries already written keep it.'))) return;
      srv('erpExpenseCategory', [{ kind: k, remove: name, month: EXP_MONTH }], catDone, catBad);
    });
  }

  if (VIEW !== 'capital') return;
  p4Each('button[data-captab]', function () {
    CAP_TAB = this.getAttribute('data-captab');
    if (CAP_TAB === 'partner') { PART = null; PART_ERR = null; PART_STOCK = null; loadPartner(); }
    repaint();
  });
  if (CAP_TAB !== 'partner' || !PART) return;

  // ---- own business ----
  bind('pn_name', PART_NEW, 'name'); bind('pn_disp', PART_NEW, 'displayName'); bind('pj_code', PART_NEW, 'code'); bind('pj_disp', PART_NEW, 'joinName');
  var t1 = el('pn_tier'); if (t1) t1.addEventListener('change', function () { PART_NEW.tier = t1.value; });
  var t2 = el('pj_tier'); if (t2) t2.addEventListener('change', function () { PART_NEW.joinTier = t2.value; });
  var mk = el('pn_create');
  if (mk) mk.addEventListener('click', async function () {
    if (!PART_NEW.name.trim()) { toast('Give the joint pool a name.', true); return; }
    if (!(await uiConfirm('Create the joint pool “' + PART_NEW.name.trim() + '”?\n\nIt becomes a business of its own in the menu at the top, owned together with the partner who joins it.'))) return;
    partSave('erpPoolCreate', [{ name: PART_NEW.name, displayName: PART_NEW.displayName, tier: PART_NEW.tier }], '', function (r) {
      PART_NEW.name = ''; PART_NEW.displayName = '';
      uiAlert('“' + r.name + '” is ready.\n\nSend this code to your partner: ' + r.code + '\n\nThey sign in to their own business here, open Capital → Partnership, and join with it. The code works once and is good for 7 days. You can make a new one inside the pool.');
      loadBusinesses(); PART = null; loadPartner();
    });
  });
  var jn = el('pj_join');
  if (jn) jn.addEventListener('click', function () {
    partSave('erpPoolJoin', [{ code: PART_NEW.code, displayName: PART_NEW.joinName, tier: PART_NEW.joinTier }], '', function (r) {
      PART_NEW.code = ''; PART_NEW.joinName = '';
      toast('Joined <strong>' + esc(r.name) + '</strong>. It is now in the menu at the top.', false, 10000);
      loadBusinesses(); PART = null; loadPartner();
    });
  });
  p4Each('button[data-poolopen]', function () { PART = null; CAPD = null; PART_MONTH = ''; var id = this.getAttribute('data-poolopen'), bs = el('bizSel'); if (bs) bs.value = id; switchBusiness(id); });
  p4Each('button[data-pstock]', function () {
    var id = this.getAttribute('data-pstock'), name = this.getAttribute('data-n');
    srv('erpPartnerStock', [{ partner: id }], function (r) { PART_STOCK = { partner: id, name: name, products: r.products }; if (VIEW === 'capital') repaint(); },
        function (e) { toast(p4Err(e), true, 10000); });
  });
  var sh = el('pp_share'); if (sh) sh.addEventListener('change', function () { partSave('erpPoolShare', [{ share: sh.checked }], sh.checked ? 'Partners can see your stock counts.' : 'Partners no longer see your stock.'); });
  bind('pd_what', PART_DEAL, 'description'); bind('pd_qty', PART_DEAL, 'qty'); bind('pd_amt', PART_DEAL, 'amount'); bind('pd_date', PART_DEAL, 'date');
  var dp = el('pd_partner'); if (dp) { if (!PART_DEAL.partner) PART_DEAL.partner = dp.value; dp.addEventListener('change', function () { PART_DEAL.partner = dp.value; }); }
  var ds = el('pd_side'); if (ds) ds.addEventListener('change', function () { PART_DEAL.side = ds.value; });
  var da = el('pd_add');
  if (da) da.addEventListener('click', function () {
    partSave('erpPartnerDeal', [{ action: 'record', partner: PART_DEAL.partner, side: PART_DEAL.side, sku: (el('pd_sku') ? el('pd_sku').value.trim() : ''), description: PART_DEAL.description, qty: PART_DEAL.qty, amount: PART_DEAL.amount, date: PART_DEAL.date }],
      'Written down. The other side has to confirm it.', function () { PART_DEAL.description = ''; PART_DEAL.amount = ''; PART_DEAL.qty = '1'; PART_DEAL.date = ''; PART_DEAL.sku = ''; CAT = null; loadAll(); });
  });
  p4Each('button[data-pdeal]', async function () {
    var act = this.getAttribute('data-pdeal'), id = this.getAttribute('data-id');
    var ask = act === 'confirm' ? 'Confirm this deal at the amount shown?' : act === 'paid' ? 'Mark this deal as paid?\n\nOnly do this once the money is in your hands.' : 'Cancel this deal?';
    if (!(await uiConfirm(ask))) return;
    partSave('erpPartnerDeal', [{ action: act, id: id }], act === 'confirm' ? 'Confirmed.' : act === 'paid' ? 'Marked paid.' : 'Deal cancelled.');
  });

  // ---- inside the pool ----
  var moveTo = function (by) { PART_MONTH = shiftMonth(PART.month, by); PART = null; repaint(); loadPartner(); };
  var lp = el('pl_prev'), ln = el('pl_next');
  if (lp) lp.addEventListener('click', function () { moveTo(-1); });
  if (ln) ln.addEventListener('click', function () { moveTo(1); });
  var lc = el('pl_close');
  if (lc) lc.addEventListener('click', async function () {
    if (!(await uiConfirm('Close ' + PART.label + '?\n\nIts report is kept exactly as it stands now. After this, the invoices and book lines of that month can no longer be changed. This cannot be undone.'))) return;
    partSave('erpPoolClose', [{ month: PART.month }], PART.label + ' is closed.');
  });
  var li = el('pl_invite'); if (li) li.addEventListener('click', function () { partSave('erpPoolInvite', [], 'New invite code made.'); });
  p4Each('button[data-plpay]', async function () {
    var from = this.getAttribute('data-plpay'), to = this.getAttribute('data-to'), amt = this.getAttribute('data-amt');
    if (!(await uiConfirm('Write down that this cash has been handed over?\n\n' + fmt(Number(amt)) + ' — only do this once it has really changed hands.'))) return;
    partSave('erpPoolEntryAdd', [{ kind: 'transfer', partner: from, to: to, amount: amt, month: PART.month, note: 'Settlement' }], 'Written in the book. Everyone is even.');
  });
  var tiers = v.querySelectorAll('select[data-pltier]');
  for (var ti = 0; ti < tiers.length; ti++) tiers[ti].addEventListener('change', function () {
    partSave('erpPoolTier', [{ partner: this.getAttribute('data-pltier'), tier: this.value, month: PART.month }], 'Price changed.', function () { CAT = null; });
  });
  bind('pe_amt', PART_EN, 'amount'); bind('pe_date', PART_EN, 'date'); bind('pe_cat', PART_EN, 'category'); bind('pe_note', PART_EN, 'note');
  var pk = el('pe_kind'); if (pk) pk.addEventListener('change', function () { PART_EN.kind = pk.value; repaint(); });
  var pw = el('pe_who'); if (pw) pw.addEventListener('change', function () { PART_EN.partner = pw.value; if (PART_EN.kind === 'transfer') repaint(); });
  var pt = el('pe_to'); if (pt) pt.addEventListener('change', function () { PART_EN.to = pt.value; });
  var pa = el('pe_add');
  if (pa) pa.addEventListener('click', function () {
    partSave('erpPoolEntryAdd', [{ kind: PART_EN.kind, partner: val('pe_who'), to: val('pe_to'), amount: PART_EN.amount, date: PART_EN.date, category: PART_EN.category, note: PART_EN.note, month: PART.month }],
      'Written in the book.', function () { PART_EN.amount = ''; PART_EN.note = ''; PART_EN.category = ''; PART_EN.date = ''; });
  });
  p4Each('button[data-pldel]', async function () {
    var id = this.getAttribute('data-pldel');
    var why = await uiPrompt('Why is this line being struck out? It stays in the book, crossed through, and your partner sees the reason.', '');
    if (why === null) return;
    if (!why.trim()) { toast('Say why.', true); return; }
    partSave('erpPoolEntryRemove', [{ id: id, reason: why.trim(), month: PART.month }], 'Struck out.');
  });
}
</script>
<style>
/* ---------- phase 5: settings tabs, security ---------- */
.qrbox { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; margin-top:12px; }
.qrbox img { width:180px; height:180px; background:#fff; border-radius:10px; padding:8px; }
.onoff { display:inline-flex; align-items:center; gap:8px; font-weight:700; }
.onoff i { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; }
.onoff.on i { background:var(--good); }
</style>
<script>
// =====================================================================
// phase 5: Settings in tabs, the Security tab (2-step sign-in, activity),
// a company for a partner, the second step on the sign-in screen
// =====================================================================
var SET_TAB = 'business';
var SET_TABS = [['business', 'Business'], ['lists', 'Lists'], ['connections', 'Connections'], ['security', 'Security']];
function setMark(t) { return '<!--tab:' + t + '-->'; }
function settingsTabsHtml() {
  var owner = ME && ME.role === 'owner';
  return '<div class="tabs" role="tablist">' + SET_TABS.filter(function (t) { return owner || (t[0] !== 'security' && t[0] !== 'connections'); }).map(function (t) {
    return '<button type="button" role="tab" data-settab="' + t[0] + '" aria-selected="' + (SET_TAB === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
}
/** Everything Settings draws carries a mark saying which tab it belongs to; only the open tab is shown. */
function settingsPick(h) {
  var parts = h.split(/<!--tab:(\w+)-->/), out = '';
  for (var i = 1; i < parts.length; i += 2) if (parts[i] === SET_TAB) out += parts[i + 1];
  return settingsTabsHtml() + (out || '<div class="empty">Nothing here for your account.</div>');
}

// ------------------------------------------------------------ a company for a partner
var PCO = { business: '', ownerName: '', email: '', busy: false };
var PCO_LINK = null;     // { business, ownerName, url } - shown once, right after the company is made
function partnerCompanyHtml() {
  if (!ME || ME.role !== 'owner') return '';
  return '<section><div class="card"><h2>A company for a partner</h2>' +
    (PCO_LINK ? '<div class="note" style="margin-bottom:12px"><div class="ico">\u2713</div><div><strong>\u201c' + esc(PCO_LINK.business) + '\u201d is ready.</strong> ' +
      'This is ' + esc(PCO_LINK.ownerName) + '\u2019s private link. Send it to them and to nobody else \u2014 whoever opens it is the owner of their company. <strong>It is shown only now.</strong>' +
      '<div class="row" style="margin-top:8px;gap:8px"><input class="i" id="pc_link" readonly style="flex:1 1 260px" value="' + esc(PCO_LINK.url) + '">' +
      '<button class="btn primary" type="button" id="pc_copy">Copy</button><button class="btn" type="button" id="pc_done">I have sent it</button></div>' +
      '<div class="sub" style="margin-top:6px">Next: start a joint pool under Capital \u2192 Partnership and send them the invite code. They join from Capital \u2192 Partnership in their own company. ' +
      'They can make more links for their own devices under Settings \u2192 Access links.</div></div></div>' : '') +
    '<div class="sub">For a partner who runs their own shop and will share a joint pool with you. They get their own company here and their own private access link. ' +
    'You are <strong>not</strong> let into their company, and they are not let into yours — you meet only in the joint pool.</div>' +
    '<div class="fields">' +
    '<div><label class="f" for="pc_biz">Their company’s name</label><input class="i" id="pc_biz" maxlength="80" placeholder="e.g. ProtoReen" value="' + esc(PCO.business) + '"></div>' +
    '<div><label class="f" for="pc_owner">Owner’s name</label><input class="i" id="pc_owner" maxlength="80" value="' + esc(PCO.ownerName) + '"></div>' +
    '<div><label class="f" for="pc_email">Owner’s e-mail <span class="sku">(optional)</span></label><input class="i" id="pc_email" type="email" inputmode="email" placeholder="partner@example.com" value="' + esc(PCO.email) + '"></div></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" type="button" id="pc_go"' + (PCO.busy ? ' disabled' : '') + '>' + (PCO.busy ? 'Creating…' : 'Create their company') + '</button></div>' +
    '<div class="sub" style="margin-top:6px">They receive an e-mail with a link to choose a password. Then: you start a joint pool under Capital → Partnership and send them the invite code; they join with it from their own company.</div>' +
    '</div></section>';
}

// ------------------------------------------------------------ security tab
var SEC = null, SEC_ERR = null, SEC_F = 'all';
var MFA = { known: false, on: false, factor: null, enroll: null, busy: false, err: '' };
function loadSecurity() {
  srv('erpSecurity', [{}], function (r) { SEC = r; SEC_ERR = null; if (VIEW === 'settings') repaint(); },
      function (e) { SEC_ERR = e && e.message ? e.message : String(e); if (VIEW === 'settings') repaint(); });
  loadMfa();
}
function loadMfa() {
  if (!SB || !ME || !ME.implicit) { MFA.known = true; return; }
  try {
    SB.auth.mfa.listFactors().then(function (r) {
      if (r.error) throw r.error;
      var t = (r.data && r.data.totp) || [];
      MFA.known = true; MFA.on = t.length > 0; MFA.factor = t[0] || null; MFA.err = '';
      if (VIEW === 'settings') repaint();
    }).catch(function (e) { MFA.known = true; MFA.err = (e && e.message) || String(e); if (VIEW === 'settings') repaint(); });
  } catch (e) { MFA.known = true; MFA.err = String(e); }
}
function mfaFail(e) { MFA.busy = false; toast(esc((e && e.message) || e), true, 12000); if (VIEW === 'settings') repaint(); }
function mfaStart() {
  if (MFA.busy) return;
  MFA.busy = true; repaint();
  // a set-up that was begun and never finished is cleared first
  SB.auth.mfa.listFactors().then(function (r) {
    if (r.error) throw r.error;
    var stale = ((r.data && r.data.all) || []).filter(function (f) { return f.status !== 'verified'; });
    return Promise.all(stale.map(function (f) { return SB.auth.mfa.unenroll({ factorId: f.id }); }));
  }).then(function () {
    return SB.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'ERP ' + new Date().toISOString().slice(0, 16) });
  }).then(function (r) {
    if (r.error) throw r.error;
    MFA.busy = false;
    MFA.enroll = { id: r.data.id, qr: r.data.totp.qr_code, secret: r.data.totp.secret };
    repaint();
  }).catch(mfaFail);
}
function mfaConfirm(code) {
  if (MFA.busy || !MFA.enroll) return;
  code = String(code || '').replace(/\D/g, '');
  if (code.length !== 6) { toast('Type the 6 digits the app shows.', true); return; }
  MFA.busy = true; repaint();
  SB.auth.mfa.challengeAndVerify({ factorId: MFA.enroll.id, code: code }).then(function (r) {
    if (r.error) throw r.error;
    MFA.busy = false; MFA.enroll = null;
    toast('<strong>The second step is on.</strong> From now on signing in as owner asks for a code from the app.', false, 12000);
    loadMfa();
  }).catch(function (e) { mfaFail(/invalid|expired/i.test(String(e && e.message)) ? 'That code is not right. Wait for the next one and try again.' : e); });
}
function mfaOff() {
  if (MFA.busy || !MFA.factor) return;
  MFA.busy = true; repaint();
  SB.auth.mfa.unenroll({ factorId: MFA.factor.id }).then(function (r) {
    if (r.error) throw r.error;
    MFA.busy = false; MFA.on = false; MFA.factor = null;
    toast('The second step is off. Signing in needs only the password again.', false, 10000);
    // the session is refreshed so the server sees an account with no second step
    return SB.auth.refreshSession();
  }).then(function () { loadMfa(); }).catch(mfaFail);
}
function mfaCardHtml() {
  var h = '<section><div class="card"><h2>Second step when signing in</h2>' +
    '<div class="sub">With this on, the owner’s password alone opens nothing: signing in also asks for a 6-digit code from an authenticator app on your phone ' +
    '(Google Authenticator, Microsoft Authenticator, Authy). A stolen or guessed password is then not enough.</div>';
  if (!ME || !ME.implicit) return h + '<div class="note"><div class="ico">▲</div><div>This belongs to the owner’s e-mail login. Sign out and sign in on the <strong>Owner</strong> tab to switch it on.</div></div></div></section>';
  if (!MFA.known) return h + '<div class="loading">Checking&hellip;</div></div></section>';
  if (MFA.err) h += '<div class="note err"><div class="ico">✕</div><div>' + esc(MFA.err) + '</div></div>';
  if (MFA.on) {
    return h + '<div class="row" style="align-items:center;gap:12px;margin-top:8px"><span class="onoff on"><i></i>On</span>' +
      '<button class="btn danger" type="button" id="mfa_off"' + (MFA.busy ? ' disabled' : '') + '>Switch it off</button></div>' +
      '<div class="sub" style="margin-top:8px">If the phone is lost, the second step can only be removed by whoever looks after this system for you — keep the phone, or set the app up on a second one with the same QR before you need it.</div></div></section>';
  }
  if (MFA.enroll) {
    return h + '<div class="qrbox"><img alt="QR code for the authenticator app" src="' + esc(MFA.enroll.qr) + '">' +
      '<div style="flex:1 1 240px"><strong>1.</strong> Open the authenticator app and scan this code.<br>' +
      '<span class="sku">Cannot scan? Type this key into the app instead:</span><br><span class="codebox" style="font-size:13px;letter-spacing:.06em;margin:6px 0 12px">' + esc(MFA.enroll.secret) + '</span><br>' +
      '<strong>2.</strong> Type the 6 digits the app now shows.' +
      '<div class="row" style="gap:8px;margin-top:8px"><input class="i" id="mfa_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="max-width:140px">' +
      '<button class="btn primary" type="button" id="mfa_ok"' + (MFA.busy ? ' disabled' : '') + '>' + (MFA.busy ? 'Checking…' : 'Confirm') + '</button>' +
      '<button class="btn" type="button" id="mfa_cancel">Cancel</button></div>' +
      '<div class="sub" style="margin-top:8px">Nothing changes until the code is confirmed.</div></div></div></div></section>';
  }
  return h + '<div class="row" style="align-items:center;gap:12px;margin-top:8px"><span class="onoff"><i></i>Off</span>' +
    '<button class="btn primary" type="button" id="mfa_on"' + (MFA.busy ? ' disabled' : '') + '>' + (MFA.busy ? 'Preparing…' : 'Switch it on') + '</button></div></div></section>';
}
function securityHtml() {
  if (!ME || ME.role !== 'owner') return '';
  var h = accessCardHtml();
  h += '<section><div class="card"><h2>Activity</h2><div class="sub">Who opened the app and who changed what, newest first. Kept for 90 days. Looking at a screen is not recorded — only sign-ins and changes.</div>';
  if (SEC_ERR) return h + '<div class="note err"><div class="ico">✕</div><div>' + esc(SEC_ERR) + '</div></div></div></section>';
  if (!SEC) return h + '<div class="loading">Reading the log&hellip;</div></div></section>';
  if (SEC.people.length) h += '<div class="catchips">' + SEC.people.map(function (p) {
    return '<span style="padding-right:10px">' + esc(p.name) + ' · ' + esc(p.role) + ' · last ' + esc(p.last) + '</span>'; }).join('') + '</div>';
  h += '<div class="row" style="gap:6px;margin:8px 0">' + [['all', 'Everything'], ['in', 'Sign-ins'], ['ch', 'Changes']].map(function (f) {
    return '<button class="chip' + (SEC_F === f[0] ? ' on' : '') + '" type="button" data-secf="' + f[0] + '">' + f[1] + '</button>'; }).join('') +
    '<span style="flex:1"></span><button class="btn small" type="button" id="sec_reload">Read again</button></div>';
  var rows = SEC.activity.filter(function (a) { return SEC_F === 'all' || (SEC_F === 'in') === !!a.signIn; });
  if (!rows.length) h += '<div class="empty">Nothing recorded yet.</div>';
  else h += '<div class="scroll tall"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>From</th></tr></thead><tbody>' + rows.map(function (a) {
    return '<tr><td style="white-space:nowrap">' + esc(a.when) + '</td><td class="nm">' + esc(a.who) + '<br><span class="sku">' + esc(a.role) + '</span></td>' +
      '<td>' + esc(a.what) + (a.detail ? '<br><span class="sku">' + esc(a.detail) + '</span>' : '') + '</td>' +
      '<td>' + esc(a.device || '—') + (a.ip ? '<br><span class="sku">' + esc(a.ip) + '</span>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  return h + '</div></section>';
}

function wirePhase5() {
  if (VIEW !== 'settings') return;
  var v = el('view');
  var tabs = v.querySelectorAll('button[data-settab]');
  for (var i = 0; i < tabs.length; i++) tabs[i].addEventListener('click', function () {
    SET_TAB = this.getAttribute('data-settab');
    if (SET_TAB === 'security') { SEC = null; SEC_ERR = null; loadSecurity(); }
    repaint(); window.scrollTo(0, 0);
  });
  function bind(id, key) { var n = el(id); if (n) n.addEventListener('input', function () { PCO[key] = n.value; }); }
  bind('pc_biz', 'business'); bind('pc_owner', 'ownerName'); bind('pc_email', 'email');
  var go5 = el('pc_go');
  if (go5) go5.addEventListener('click', async function () {
    if (PCO.busy) return;
    if (!PCO.business.trim() || !PCO.ownerName.trim()) { toast('Fill in the company and the owner’s name.', true); return; }
    if (!(await uiConfirm('Create “' + PCO.business.trim() + '” for ' + PCO.ownerName.trim() + '?\n\nThey get a private access link of their own, which you hand to them. You will not have access to their company.'))) return;
    PCO.busy = true; repaint();
    srv('erpPartnerCompany', [{ business: PCO.business, ownerName: PCO.ownerName, email: PCO.email }], function (r) {
      PCO = { business: '', ownerName: '', email: '', busy: false };
      PCO_LINK = r.link && r.link.key ? { business: r.business, ownerName: r.ownerName || 'the partner', url: location.origin + location.pathname + '#k=' + r.link.key } : null;
      repaint();
      if (!PCO_LINK) uiAlert('“' + r.business + '” is ready.');
    }, function (e) { PCO.busy = false; toast(esc(e && e.message ? e.message : e), true, 14000); repaint(); });
  });

  var on = el('mfa_on'), off = el('mfa_off'), ok = el('mfa_ok'), cx = el('mfa_cancel'), code = el('mfa_code');
  if (on) on.addEventListener('click', mfaStart);
  if (ok) ok.addEventListener('click', function () { mfaConfirm(code ? code.value : ''); });
  if (code) { try { code.focus(); } catch (e) {} code.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') mfaConfirm(code.value); }); }
  if (cx) cx.addEventListener('click', function () {
    var id = MFA.enroll && MFA.enroll.id; MFA.enroll = null; repaint();
    if (id) { try { SB.auth.mfa.unenroll({ factorId: id }); } catch (e) {} }
  });
  if (off) off.addEventListener('click', async function () {
    if (!(await uiConfirm('Switch the second step off?\n\nSigning in as owner will need only the password again. This makes the account easier to break into.'))) return;
    mfaOff();
  });
  var sp = el('sec_people'); if (sp) sp.addEventListener('click', function () { SET_TAB = 'people'; repaint(); window.scrollTo(0, 0); });
  var sr = el('sec_reload'); if (sr) sr.addEventListener('click', function () { SEC = null; repaint(); loadSecurity(); });
  var fs = v.querySelectorAll('button[data-secf]');
  for (var j = 0; j < fs.length; j++) fs[j].addEventListener('click', function () { SEC_F = this.getAttribute('data-secf'); repaint(); });
}

// ------------------------------------------------------------ the second step on the sign-in screen
var GATE_STEP = '';
function gateTotpHtml(busy) {
  return '<label class="f" for="gate_totp">Code from your authenticator app</label>' +
    '<input class="i gatein" id="gate_totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"' + (busy ? ' disabled' : '') + '>' +
    '<button class="btn primary gatego" type="button" id="gate_totp_go"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Checking…' : 'Confirm') + '</button>' +
    '<div class="sub gatefoot">The password was right. This is the second step you switched on. <a href="#" id="gate_totp_back">Use another account</a></div>';
}
function gateHello(fail) {
  srv('erpHello', [], function (res) {
    GATE_BUSY = false;
    if (res && res.ok) { ME = res; ME_MSG = ''; GATE_STEP = ''; startApp(); }
    else fail((res && res.message) || 'Could not sign you in.');
  }, function (e) { fail((e && e.message) || String(e)); });
}
/** After the password: does this account ask for a second step? */
function gateNeedsCode(then) {
  try {
    SB.auth.mfa.getAuthenticatorAssuranceLevel().then(function (r) {
      var d = r && r.data;
      if (d && d.nextLevel === 'aal2' && d.currentLevel !== 'aal2') { GATE_BUSY = false; GATE_STEP = 'totp'; GATE_TAB = 'owner'; GATE_OK = false; ME_MSG = ''; paintGate(); }
      else then();
    }, function () { then(); });
  } catch (e) { then(); }
}
/** A page reload in the middle of signing in: go straight back to the code step. */
function gateResume() {
  if (!SB) return;
  try {
    SB.auth.getSession().then(function (r) {
      if (!r || !r.data || !r.data.session || ME) return;
      gateNeedsCode(function () {});
    }, function () {});

}
function wireGateTotp(fail) {

<script>

      (a.detail ? '<div class="d">' + esc(a.detail) + '</div>' : '') +

window.addEventListener('focus', function () { if (Date.now() - LAST_FRESH > 60000) quietRefresh(); });
setInterval(function () { if (Date.now() - LAST_FRESH > 290000) quietRefresh(); }, 60000);

function wirePhase6() {

})();

<script>
// phone layout: give every list-table cell its column name so the CSS above can
// stack rows as cards. Runs after any repaint; document previews are left alone.
(function () {
  function labelTables() {
    var tables = document.querySelectorAll('.scroll > table');   // rows can be redrawn inside a table
    for (var t = 0; t < tables.length; t++) {
      var tb = tables[t];
      if (tb.closest('.qz-preview, .qz-pagewrap, #qz_print')) continue;
      var heads = [], th = tb.querySelectorAll(':scope > thead th');
      for (var h = 0; h < th.length; h++) heads.push(th[h].textContent.trim());
      var rows = tb.querySelectorAll(':scope > tbody > tr');
      for (var r = 0; r < rows.length; r++) {
        var col = 0, cells = rows[r].children;
        for (var c = 0; c < cells.length; c++) {
          if (!cells[c].hasAttribute('data-label')) cells[c].setAttribute('data-label', heads[col] || '');
          col += cells[c].colSpan || 1;
        }
      }
      if (!tb.classList.contains('m-cards')) tb.classList.add('m-cards');
    }
  }
  try {
    new MutationObserver(labelTables).observe(document.body, { childList: true, subtree: true });
    labelTables();
  } catch (e) {}
})();

<script>
// =====================================================================
// look 2 - step 1: the shell

var APPS = [
  { id: 'dashboards', name: 'Dashboard', color: '#7c6bb1', views: ['dash'],

  { id: 'inventory', name: 'Inventory', color: '#c8553d', views: ['products', 'stock', 'suppliers', 'costs'],
    icon: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>' },
  { id: 'accounting', name: 'Accounting', color: '#3a86c8', views: ['profit', 'expenses', 'cash', 'capital'],
    icon: '<circle cx="12" cy="12" r="9"/><path d="M15 9.2c-.6-.8-1.7-1.2-3-1.2-1.8 0-3 .8-3 2s1 1.800 3 2 3 .8 3 2-1.200 2-3 2c-1.300 0-2.400-.4-3-1.200M12 6v2M12 16v2"/>' },
  { id: 'settings', name: 'Settings', color: '#5f6b7a', views: ['settings', 'tools'],
    icon: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100"/>' }
];
var VIEW_NAMES = { invoice: 'New invoice', sales: 'Invoices', weborders: 'Web orders', quotes: 'Quotations', customers: 'Customers', campaigns: 'Campaigns',
                   products: 'Products', stock: 'Stock', costs: 'Product cost', profit: 'Profitability', expenses: 'Expenses', capital: 'Capital', cash: 'Money', suppliers: 'Suppliers',
                   settings: 'Settings', tools: 'Maintenance', dash: 'Dashboard', home: 'Home' };
var VIEW_COUNT = { invoice: 'cCart', sales: 'cSend', weborders: 'cWeb', costs: 'cCosts' };
function appOf(view) { for (var i = 0; i < APPS.length; i++) if (APPS[i].views.indexOf(view) >= 0) return APPS[i]; return null; }
function appViews(app) { return app.views.filter(function (v) { return navOn(v); }); }
function countOf(view) { var c = VIEW_COUNT[view] && el(VIEW_COUNT[view]); return c ? c.textContent : ''; }

function homeHtml() {
  var hr = new Date().getHours(), greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  var biz = el('bizName') ? el('bizName').textContent : '';
  var h = '<div class="o_hello"><h1>' + esc(greet) + '</h1><div>' + esc(biz) + '</div></div><div class="o_apps">';
  APPS.forEach(function (a) {
    var vs = appViews(a); if (!vs.length) return;
    var n = 0; vs.forEach(function (v) { if (v !== 'invoice' && v !== 'costs') n += Number(countOf(v)) || 0; });
    h += '<button class="o_tile" type="button" data-app="' + a.id + '"><span class="ico" style="background:' + a.color + '"><svg viewBox="0 0 24 24">' + a.icon + '</svg></span>' +
      '<span class="nm">' + esc(a.name) + '</span><span class="n">' + (n ? n : '') + '</span></button>';
  });
  return h + '</div>';
}

/** Where am I: Invoices / INV-1883. The first part goes back to the list. */
function crumbs() {
  var out = [{ t: VIEW_NAMES[VIEW] || VIEW, go: VIEW }], rec = '';
  if (VIEW === 'sales' && INVP.no) rec = INVP.no;
  if (VIEW === 'customers' && CUSP.key) rec = (CUSP.data && CUSP.data.name) || 'Customer';
  if (VIEW === 'products' && PRODP.sku) rec = (PRODP.data && PRODP.data.name) || PRODP.sku;
  if (VIEW === 'suppliers' && SUPP.name) rec = SUPP.name;
  if (VIEW === 'settings') { var st = SET_TABS.filter(function (t) { return t[0] === SET_TAB; })[0]; if (st) rec = st[1]; }
  if (VIEW === 'capital' && CAP_TAB === 'partner') rec = 'Partnership';
  if (rec) out.push({ t: rec });
  return out;
}
function shellSync() {
  var home = VIEW === 'home' || !ME;
  document.body.classList.toggle('o-home', !!ME && VIEW === 'home');
  var cp = el('o_cp'), menu = el('o_menu'), nm = el('o_appname');
  if (!cp) return;
  cp.style.display = (!ME || VIEW === 'home') ? 'none' : '';
  if (home) return;
  var app = appOf(VIEW);
  nm.textContent = app ? app.name : '';
  var vs = app ? appViews(app) : [];
  menu.innerHTML = vs.length > 1 ? vs.map(function (v) {
    return '<button type="button" data-oview="' + v + '"' + (v === VIEW ? ' aria-current="page"' : '') + '>' + esc(VIEW_NAMES[v] || v) + '<span class="n">' + esc(countOf(v)) + '</span></button>'; }).join('') : '';
  var c = crumbs();
  cp.querySelector('.crumbs').innerHTML = c.map(function (x, i) {
    return (i ? '<span class="sep">/</span>' : '') + (i < c.length - 1 ? '<button type="button" data-ocrumb="' + esc(x.go) + '">' + esc(x.t) + '</button>' : '<span class="here">' + esc(x.t) + '</span>'); }).join('');
  var s = el('stamp'); cp.querySelector('.stampx').textContent = (VIEW === 'dash' && s) ? s.textContent : '';
}

(function () {
  // ---- build the new top bar out of the old one (the pieces keep their wiring)
  var bar = document.querySelector('.topbar'), nav = document.getElementById('nav');
  if (!bar || !nav) return;
  var hb = document.createElement('button'); hb.type = 'button'; hb.setAttribute('data-view', 'home'); hb.textContent = 'Home'; hb.style.display = 'none';
  nav.insertBefore(hb, nav.firstChild);
  var home = document.createElement('button'); home.className = 'act'; home.id = 'o_home'; home.type = 'button'; home.title = 'All apps'; home.setAttribute('aria-label', 'All apps');
  home.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.500" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.500" width="5" height="5" rx="1"/><rect x="9.500" y="9.500" width="5" height="5" rx="1"/><rect x="16" y="9.500" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.500" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>';
  var name = document.createElement('div'); name.className = 'o_app'; name.id = 'o_appname';
  var menu = document.createElement('div'); menu.className = 'o_menu'; menu.id = 'o_menu';
  bar.insertBefore(menu, bar.firstChild); bar.insertBefore(name, menu); bar.insertBefore(home, name);
  var user = document.createElement('button'); user.className = 'act'; user.id = 'o_user'; user.type = 'button'; user.setAttribute('aria-label', 'Account'); user.textContent = '•';
  bar.appendChild(user);
  var um = document.createElement('div'); um.id = 'o_usermenu';
  var who = document.getElementById('whoami'), so = document.getElementById('signoutBtn'), th = document.getElementById('themeBtn');
  if (who) um.appendChild(who);
  if (th) { th.className = ''; um.appendChild(th); }
  if (so) { so.className = ''; um.appendChild(so); }
  document.body.appendChild(um);
  var cp = document.createElement('div'); cp.id = 'o_cp'; cp.style.display = 'none'; cp.innerHTML = '<div class="crumbs"></div><div class="stampx"></div>';
  bar.parentNode.insertBefore(cp, bar.nextSibling);

  home.addEventListener('click', function (ev) { ev.stopPropagation(); appsMenuToggle(); });
  name.addEventListener('click', function () { var a = appOf(VIEW); if (a) { var v = appViews(a); if (v.length) go(v[0]); } });
  menu.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-oview]'); if (b) go(b.getAttribute('data-oview')); });
  cp.addEventListener('click', function (ev) { var b = ev.target.closest('button[data-ocrumb]'); if (b) go(b.getAttribute('data-ocrumb')); });
  user.addEventListener('click', function () { um.classList.toggle('open'); });
  document.addEventListener('mousedown', function (ev) { if (!ev.target.closest('#o_usermenu') && !ev.target.closest('#o_user')) um.classList.remove('open'); });
  um.addEventListener('click', function (ev) { if (ev.target.closest('button')) um.classList.remove('open'); });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-app]'); if (!t) return;
    var a = APPS.filter(function (x) { return x.id === t.getAttribute('data-app'); })[0];

    if (a) { var v = appViews(a), first = (a.id === 'sales' && v.indexOf('sales') >= 0) ? 'sales' : v[0]; if (first) go(first); }
  });

  // ---- every redraw keeps the top bar and the breadcrumb in step
  var paint = repaint;
  repaint = function () { paint(); try { shellSync(); } catch (e) {} };
  var gate = paintGate;
  paintGate = function () { gate(); document.body.classList.remove('o-home'); try { el('o_cp').style.display = 'none'; } catch (e) {} };
  var start = startApp;

    var u = el('o_user'); if (u && ME && ME.name) u.textContent = String(ME.name).trim().charAt(0).toUpperCase();

      if (!localStorage.getItem('cz_look2')) { localStorage.setItem('cz_look2', '1'); LOOK_RESET = true; applyTheme('light'); srv('erpSetTheme', ['light'], function () { LOOK_RESET = false; }, function () { LOOK_RESET = false; }); }
    } catch (e) {}

  var counts = updateCounts;

    counts.apply(this, arguments);
    try { if (ME) { if (VIEW === 'home') el('view').innerHTML = homeHtml(); else shellSync(); } } catch (e) {}
  };
})();
var LOOK_RESET = false;

document.addEventListener('mousedown', function (ev) {

(function () { var b = el('o_home'); if (b) { b.title = 'Apps'; b.setAttribute('aria-haspopup', 'true'); b.setAttribute('aria-expanded', 'false'); } })();
</script>

<script>
// =====================================================================
// look 2 - step 2: the list view. One component behind Invoices, Products
// and Customers: a search box that turns what is typed into facets, a
// Filters / Group By / Favorites menu, columns that sort, tick boxes with
// actions, pages and totals. The server does the searching (erpListView);
// this draws it. Everything is wired by delegation on the document, so a
// redraw never loses a handler.
// =====================================================================
var LV_CFG = {
  invoices:  { view: 'sales', title: 'Invoices', defaults: [], what: 'invoice' },
  products:  { view: 'products', title: 'Products', defaults: ['active'], what: 'product',
               newBtn: function () { if (!LISTS) loadLists(); PRODUCT_FORM = blankProduct(); repaint(); window.scrollTo(0, 0); } },
  customers: { view: 'customers', title: 'Customers', defaults: [], what: 'customer',
               newBtn: function () { CUST_FORM = { row: 0, name: '', phone: '', email: '', address: '', type: 'Retail', source: (OPT && OPT.sources[0]) || 'Walk-in', status: 'New' }; repaint(); window.scrollTo(0, 0); } },
};
var LV_SUB = { phone: 'Phone', parcel: 'Parcel', line2: 'SKU', lastAgo: 'Days since' };
var LVS = {};
function lvSt(m) {
  if (!LVS[m]) LVS[m] = { search: [], filters: LV_CFG[m].defaults.slice(), groupBy: '', order: null, offset: 0, data: null, err: null, busy: false,
                          open: {}, grows: {}, sel: {}, all: false, q: '', dd: false, sug: 0, seq: 0, spec: null, rows: {} };
  return LVS[m];
}
function lvModelOf(view) { for (var k in LV_CFG) if (LV_CFG[k].view === view) return k; return ''; }

// ---------------------------------------------------------------- loading
function lvArgs(st, m, extra) {
  var a = { model: m, search: st.search, filters: st.filters, groupBy: st.groupBy, order: st.order, offset: st.offset, limit: 80 };
  for (var k in (extra || {})) a[k] = extra[k];
  return a;
}
function lvLoad(m, keepSel) {
  var st = lvSt(m), my = ++st.seq;
  st.busy = true; st.err = null;
  if (!keepSel) { st.sel = {}; st.all = false; }
  srv('erpListView', [lvArgs(st, m)], function (r) {
    if (my !== st.seq) return;
    st.busy = false; st.data = r; st.spec = r.spec; st.stale = false;
    st.grows = {};
    var open = Object.keys(st.open).filter(function (k) { return st.open[k]; });
    lvPaint(m);
    open.forEach(function (k) { lvLoadGroup(m, k); });
  }, function (e) {
    if (my !== st.seq) return;
    st.busy = false; st.err = (e && e.message) || String(e); lvPaint(m);
  });
}
function lvLoadGroup(m, key, more) {
  var st = lvSt(m), have = more && st.grows[key] ? st.grows[key].rows.length : 0;
  srv('erpListView', [lvArgs(st, m, { group: key, offset: have, limit: 80 })], function (r) {
    var g = st.grows[key];
    st.grows[key] = { rows: (more && g ? g.rows : []).concat(r.rows), total: r.total };
    lvPaint(m);
  }, function (e) { toast(esc((e && e.message) || e), true, 8000); });
}
/** Start a list from somewhere else (a dashboard card): these filters, nothing else. */
function lvPreset(m, filters) {
  var st = lvSt(m);
  st.search = []; st.filters = filters.slice(); st.groupBy = ''; st.offset = 0; st.open = {}; st.data = null; st.q = '';
}

// ---------------------------------------------------------------- drawing
function lvHtml(m) {
  var st = lvSt(m);
  if ((!st.data || st.stale) && !st.busy) setTimeout(function () { lvLoad(m, true); }, 0);
  return '<div class="o_lv" id="lv_' + m + '" data-lv="' + m + '">' + lvInner(m) + '</div>';
}
function lvPaint(m) {
  var w = el('lv_' + m); if (!w) return;
  var a = document.activeElement, typing = a && a.id === 'lvq_' + m, pos = typing ? a.selectionStart : 0;
  w.innerHTML = lvInner(m);
  if (typing) { var q = el('lvq_' + m); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} } }
}
function lvFacetsHtml(st, m) {
  var sp = st.spec, h = '';
  st.search.forEach(function (f, i) {
    var lab = sp ? (sp.search.filter(function (x) { return x.field === f.field; })[0] || {}).label : f.field;
    h += '<span class="o_facet"><b>' + esc(lab || f.field) + '</b><span>' + f.values.map(esc).join(' <i style="opacity:.6">or</i> ') + '</span><button type="button" data-lv-rmf="' + i + '" aria-label="Remove">×</button></span>';
  });
  if (st.filters.length && sp) {
    // one facet per set: "or" inside it, the facets together are "and" - as the server reads them
    var sets = [], bySet = {};
    sp.filters.forEach(function (f) { if (st.filters.indexOf(f.name) < 0) return; if (!bySet[f.set]) { bySet[f.set] = []; sets.push(f.set); } bySet[f.set].push(f.label); });
    sets.forEach(function (k) {
      h += '<span class="o_facet"><b class="f">▼</b><span>' + bySet[k].map(esc).join(' <i style="opacity:.6">or</i> ') + '</span><button type="button" data-lv-rmset="' + esc(k) + '" aria-label="Remove">×</button></span>';
    });
  }
  if (st.groupBy && sp) {
    var g = sp.groups.filter(function (x) { return x.field === st.groupBy; })[0];
    if (g) h += '<span class="o_facet"><b class="g">≡</b><span>' + esc(g.label) + '</span><button type="button" data-lv-rmgroup="1" aria-label="Remove">×</button></span>';
  }
  return h;
}
function lvFavs(m) { try { return JSON.parse(localStorage.getItem('cz_lv_fav_' + m) || '[]'); } catch (e) { return []; } }
function lvSetFavs(m, list) { try { localStorage.setItem('cz_lv_fav_' + m, JSON.stringify(list)); } catch (e) {} }

function lvInner(m) {
  var st = lvSt(m), cfg = LV_CFG[m], sp = st.spec, d = st.data, h = '<div class="o_lv_bar">';
  if (cfg.newBtn) h += '<button class="btn primary" type="button" data-lv-new="1">New</button>';
  h += '<div class="o_sbox"><span class="o_sico">&#x1F50D;&#xFE0E;</span>' + lvFacetsHtml(st, m) +
    '<input id="lvq_' + m + '" data-lv-q="1" type="search" autocomplete="off" placeholder="Search…" value="' + esc(st.q) + '">' +
    '<button class="o_stoggle" type="button" data-lv-dd="1" aria-expanded="' + st.dd + '" title="Filters, group by, favourites">▼</button>';
  // what the typed text can be searched as
  if (st.q.trim() && sp) {
    h += '<div class="o_sugg">' + sp.search.map(function (s, i) {
      return '<button type="button" data-lv-sug="' + esc(s.field) + '" class="' + (i === st.sug ? 'on' : '') + '">Search <i>' + esc(s.label) + '</i> for: <i>' + esc(st.q.trim()) + '</i></button>'; }).join('') + '</div>';
  }
  // filters, group by, favourites
  if (st.dd && sp) {
    var lastSet = null;
    h += '<div class="o_fdd"><div><h4><span class="dot" style="background:var(--accent-2)"></span>Filters</h4>' + sp.filters.map(function (f) {
      var sep = lastSet !== null && f.set !== lastSet ? '<hr>' : ''; lastSet = f.set;
      return sep + '<button type="button" class="it" data-lv-flt="' + esc(f.name) + '" aria-checked="' + (st.filters.indexOf(f.name) >= 0) + '">' + esc(f.label) + '</button>'; }).join('') + '</div>' +
      '<div><h4><span class="dot" style="background:#5f6b7a"></span>Group by</h4>' + sp.groups.map(function (g) {
        return '<button type="button" class="it" data-lv-grp="' + esc(g.field) + '" aria-checked="' + (st.groupBy === g.field) + '">' + esc(g.label) + '</button>'; }).join('') + '</div>' +
      '<div><h4><span class="dot" style="background:#e3a62d"></span>Favourites</h4>' + lvFavs(m).map(function (f, i) {
        return '<div class="favrow"><button type="button" class="it" data-lv-fav="' + i + '">' + esc(f.name) + '</button><button type="button" class="del" data-lv-favdel="' + i + '" title="Remove">×</button></div>'; }).join('') +
      '<input class="i" id="lvfav_' + m + '" maxlength="40" placeholder="Name this search…"><button class="btn small" type="button" data-lv-favsave="1" style="margin-top:6px">Save current search</button></div></div>';
  }
  h += '</div>';
  // pager
  if (d && !st.groupBy && d.total > d.limit) {
    var from = d.offset + 1, to = Math.min(d.total, d.offset + d.rows.length);
    h += '<div class="o_pager"><span>' + fmt(from) + '–' + fmt(to) + ' / ' + fmt(d.total) + '</span>' +
      '<button type="button" data-lv-pg="-1"' + (d.offset > 0 ? '' : ' disabled') + ' aria-label="Previous">‹</button>' +
      '<button type="button" data-lv-pg="1"' + (to < d.total ? '' : ' disabled') + ' aria-label="Next">›</button></div>';
  } else if (d) {
    h += '<div class="o_pager"><span>' + fmt(d.total) + (st.groupBy && d.groups ? ' in ' + fmt(d.groups.length) + ' group' + (d.groups.length === 1 ? '' : 's') : '') + '</span></div>';
  }
  h += '</div>';

  // selected rows
  var nsel = Object.keys(st.sel).length;
  if (nsel || st.all) {
    var pageAll = d && d.rows && d.rows.length && d.rows.every(function (r) { return st.sel[r.key]; });
    h += '<div class="o_selbar"><strong>' + (st.all ? 'All ' + fmt(d.total) : fmt(nsel)) + ' selected</strong>' +
      (!st.all && pageAll && d.total > d.rows.length ? '<button class="linkbtn" type="button" data-lv-selallmatch="1">Select all ' + fmt(d.total) + '</button>' : '') +
      '<button class="linkbtn" type="button" data-lv-unsel="1">Unselect</button><span style="flex:1"></span>' +
      '<button class="btn small" type="button" data-lv-act="export">Export</button>' +
      (m === 'products' && ME && ME.role !== 'sales' ? '<button class="btn small" type="button" data-lv-act="discontinue">Discontinue</button><button class="btn small" type="button" data-lv-act="reactivate">Reactivate</button>' : '') +
      '</div>';
  }

  if (st.err) return h + '<div class="note err"><div class="ico">✕</div><div><strong>Could not read the ' + esc(cfg.title.toLowerCase()) + '.</strong><br>' + esc(st.err) + '</div></div>';
  if (!d) return h + '<div class="o_tbl"><div class="loading">Loading ' + esc(cfg.title.toLowerCase()) + '&hellip;</div></div>';
  return h + '<div class="o_tbl">' + lvTable(m) + '</div>';
}

function lvCell(c, r) {
  var v = r[c.key], out;
  if (c.type === 'money' || c.type === 'num') out = (v === null || v === undefined || v === '') ? '' : (c.type === 'money' && !v ? '<span style="color:var(--muted)">0</span>' : fmt(v));
  else if (c.type === 'badge') {
    if (c.badge === 'state') out = stateBadge(r.state);
    else {
      var cls = { Paid: 'ok', Due: 'out', Returned: 'low', Cancelled: '' }[v];
      out = v ? '<span class="pill' + (cls ? ' ' + cls : '') + '">' + esc(v) + '</span>' : '';
    }
  } else out = esc(v == null ? '' : v);
  if (c.sub && r[c.sub]) out += '<span class="s">' + esc(r[c.sub]) + '</span>';
  return out;
}
function lvTable(m) {
  var st = lvSt(m), sp = st.spec, d = st.data, cols = sp.columns, ord = st.order || sp.order;
  st.rows = {};
  var pageRows = d.rows || [], allOn = pageRows.length && pageRows.every(function (r) { return st.sel[r.key]; });

    cols.map(function (c) {

      return '<th data-lv-sort="' + esc(c.sort) + '" class="' + (c.type === 'money' || c.type === 'num' ? 'n' : '') + (c.phone ? '' : ' o_np') + '">' + esc(c.label) +
        (on ? '<span class="ar">' + (ord.dir === 'asc' ? '▲' : '▼') + '</span>' : '') + '</th>'; }).join('') + '<th class="o_np o_acts"></th></tr></thead><tbody>';
  function row(r) {
    st.rows[r.key] = r;
    return '<tr class="r' + (st.sel[r.key] || st.all ? ' sel' : '') + '" data-lv-open="' + esc(r.key) + '"><td class="cb"><input type="checkbox" data-lv-sel="' + esc(r.key) + '"' + (st.sel[r.key] || st.all ? ' checked' : '') + ' aria-label="Select"></td>' +
      cols.map(function (c) { return '<td class="' + (c.type === 'money' || c.type === 'num' ? 'n' : '') + (c.main ? ' m' : '') + (/^(date|lastOrder|coverText|stateText|status)$/.test(c.key) ? ' nw' : '') + (c.phone ? '' : ' o_np') + '">' + lvCell(c, r) + '</td>'; }).join('') +
      '<td class="o_np o_acts">' + lvRowActs(m, r) + '</td></tr>';
  }
  if (st.groupBy && d.groups) {
    if (!d.groups.length) h += '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">Nothing matches.</div></td></tr>';

        return '<td class="' + (c.sum ? 'n' : '') + (c.phone ? '' : ' o_np') + '">' + (c.sum ? fmt(g.sums[c.key]) : '') + '</td>'; }).join('') + '<td class="o_np"></td></tr>';
      if (open) {
        var gr = st.grows[g.key];
        if (!gr) h += '<tr class="o_ghost"><td></td><td colspan="' + (cols.length + 1) + '">Loading&hellip;</td></tr>';
        else {
          gr.rows.forEach(function (r) { h += row(r); });
          if (gr.rows.length < gr.total) h += '<tr class="more"><td colspan="' + (cols.length + 2) + '"><button class="linkbtn" type="button" data-lv-more="' + esc(g.key) + '">Show ' + fmt(Math.min(80, gr.total - gr.rows.length)) + ' more of ' + fmt(gr.total - gr.rows.length) + '</button></td></tr>';
        }

    });
  } else {
    if (!pageRows.length) h += '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">Nothing matches.' + (st.search.length || st.filters.length ? ' <button class="linkbtn" type="button" data-lv-clear="1">Clear the search</button>' : '') + '</div></td></tr>';
    pageRows.forEach(function (r) { h += row(r); });
  }
  h += '</tbody>';
  if (cols.some(function (c) { return c.sum; }) && d.sums && d.total) {
    h += '<tfoot><tr><td class="cb"></td>' + cols.map(function (c) { return '<td class="' + (c.sum ? 'n' : '') + (c.phone ? '' : ' o_np') + '">' + (c.sum ? fmt(d.sums[c.key]) : '') + '</td>'; }).join('') + '<td class="o_np"></td></tr></tfoot>';
  }
  return h + '</table>';
}

// ---------------------------------------------------------------- doing
function lvRefresh(m) { var st = lvSt(m); st.offset = 0; lvLoad(m); lvPaint(m); }
function lvAddSearch(m, field) {
  var st = lvSt(m), v = st.q.trim(); if (!v) return;
  var f = st.search.filter(function (x) { return x.field === field; })[0];
  if (f) { if (f.values.indexOf(v) < 0) f.values.push(v); } else st.search.push({ field: field, values: [v] });
  st.q = ''; st.sug = 0; lvRefresh(m);
}
function lvOpenRow(m, key) {
  var r = lvSt(m).rows[key]; if (!r || !r.open) return;
  if (r.open.invoice) openInvoicePage(r.open.invoice);
  else if (r.open.product) openProductPage(r.open.product);
  else if (r.open.customer !== undefined) openCustomerPage(r.open.customer, r.open.name);
}
function lvCsv(m, rows) {
  var sp = lvSt(m).spec, cols = [];
  sp.columns.forEach(function (c) { cols.push([c.key, c.label]); if (c.sub) cols.push([c.sub, LV_SUB[c.sub] || c.sub]); });
  var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var text = [cols.map(function (c) { return q(c[1]); }).join(',')].concat(rows.map(function (r) {
    return cols.map(function (c) { return q(c[0] === 'state' ? r.stateText : r[c[0]]); }).join(','); })).join('\r\n');
  downloadText(LV_CFG[m].title + ' ' + todayISO() + '.csv', text);
}
async function lvAction(m, act) {
  var st = lvSt(m);
  function chosen(done) {
    if (!st.all) return done(Object.keys(st.sel).map(function (k) { return st.rows[k] || { key: k }; }));
    toast('Reading every selected row…');
    srv('erpListView', [lvArgs(st, m, { exportAll: true })], function (r) { done(r.rows); }, function (e) { toast(esc((e && e.message) || e), true, 10000); });
  }
  if (act === 'export') return chosen(function (rows) { lvCsv(m, rows); toast('Exported ' + fmt(rows.length) + ' row(s).'); });
  if (m === 'products' && (act === 'discontinue' || act === 'reactivate')) {
    chosen(async function (rows) {
      var to = act === 'discontinue' ? 'Discontinued' : 'Active';
      if (!(await uiConfirm((act === 'discontinue' ? 'Discontinue ' : 'Bring back ') + fmt(rows.length) + ' product(s)?' +
            (act === 'discontinue' ? '\n\nA product that still has stock is skipped - sell or adjust it to 0 first.' : '')))) return;
      var ok = 0, bad = [], i = 0;
      (function next() {
        if (i >= rows.length) {
          toast(fmt(ok) + ' changed' + (bad.length ? ' · ' + fmt(bad.length) + ' skipped: ' + esc(bad.slice(0, 3).join('; ')) + (bad.length > 3 ? '…' : '') : ''), !!bad.length, 14000);
          CAT = null; loadAll(); lvLoad(m); return;
        }
        var r = rows[i++];
        srv('erpSetProductStatus', [r.key, to], function () { ok++; next(); }, function (e) { bad.push(r.key + ': ' + ((e && e.message) || e)); next(); });
      })();
    });
  }
}

// one set of listeners for every list, now and after any redraw
document.addEventListener('click', function (ev) {
  var w = ev.target.closest && ev.target.closest('.o_lv[data-lv]'); if (!w) return;
  var m = w.getAttribute('data-lv'), st = lvSt(m), t = ev.target, b;
  if ((b = t.closest('[data-lv-new]'))) { LV_CFG[m].newBtn(); return; }

  if ((b = t.closest('[data-lv-sug]'))) { lvAddSearch(m, b.getAttribute('data-lv-sug')); return; }
  if ((b = t.closest('[data-lv-rmf]'))) { st.search.splice(Number(b.getAttribute('data-lv-rmf')), 1); lvRefresh(m); return; }

  }

    var n = b.getAttribute('data-lv-flt'), i = st.filters.indexOf(n);

    if (f) { st.search = f.s.search || []; st.filters = f.s.filters || []; st.groupBy = f.s.groupBy || ''; st.order = f.s.order || null; st.open = {}; st.dd = false; lvRefresh(m); }
    return;
  }
  if ((b = t.closest('[data-lv-favdel]'))) { var l = lvFavs(m); l.splice(Number(b.getAttribute('data-lv-favdel')), 1); lvSetFavs(m, l); lvPaint(m); return; }

    var l2 = lvFavs(m); l2.push({ name: nm.trim(), s: { search: st.search, filters: st.filters, groupBy: st.groupBy, order: st.order } }); lvSetFavs(m, l2);

    lvRefresh(m); return;
  }
  if ((b = t.closest('[data-lv-more]'))) { lvLoadGroup(m, b.getAttribute('data-lv-more'), true); return; }
  if ((b = t.closest('tr[data-lv-g]'))) {

  if (t.closest('td.cb') || t.closest('th.cb')) return;            // tick boxes are handled on change
  if ((b = t.closest('[data-lva]'))) { lvRowAct(m, b.getAttribute('data-lva'), b.closest('tr').getAttribute('data-lv-open')); return; }
  if (t.closest('td.o_acts')) return;
  if ((b = t.closest('tr[data-lv-open]'))) { lvOpenRow(m, b.getAttribute('data-lv-open')); return; }
});
document.addEventListener('change', function (ev) {
  var w = ev.target.closest && ev.target.closest('.o_lv[data-lv]'); if (!w) return;
  var m = w.getAttribute('data-lv'), st = lvSt(m), t = ev.target;
  if (t.hasAttribute('data-lv-sel')) { var k = t.getAttribute('data-lv-sel'); if (t.checked) st.sel[k] = 1; else { delete st.sel[k]; st.all = false; } lvPaint(m); return; }

});
document.addEventListener('input', function (ev) {
  var t = ev.target; if (!t.hasAttribute || !t.hasAttribute('data-lv-q')) return;
  var m = t.closest('.o_lv').getAttribute('data-lv'), st = lvSt(m);

document.addEventListener('keydown', function (ev) {
  var t = ev.target; if (!t.hasAttribute || !t.hasAttribute('data-lv-q')) return;
  var m = t.closest('.o_lv').getAttribute('data-lv'), st = lvSt(m), n = st.spec ? st.spec.search.length : 0;

document.addEventListener('mousedown', function (ev) {

// the lists follow the books: re-read after any save, and when figures refresh themselves

})();

<script>
// =====================================================================
// theme library: ready-made themes and "my own colours", picked from the
// account menu. Applied at once, kept on this device, and saved with the
// person so every other device follows.
// =====================================================================
var THEMES = [
  ['plum', 'Plum', '#714B67', '#017E84'], ['ocean', 'Ocean', '#1f6feb', '#0a7ea4'], ['forest', 'Forest', '#2f7d4f', '#0e7c66'],
  ['teal', 'Teal', '#0f766e', '#0369a1'], ['indigo', 'Indigo', '#4f46e5', '#7c3aed'], ['royal', 'Royal', '#6d28d9', '#be185d'],
  ['rose', 'Rose', '#be185d', '#9d174d'], ['crimson', 'Crimson', '#b91c1c', '#9a3412'], ['sunset', 'Sunset', '#c2410c', '#b45309'],
  ['gold', 'Gold', '#a16207', '#92400e'], ['slate', 'Slate', '#475569', '#0369a1'], ['midnight', 'Midnight', '#1e293b', '#2563eb']
];
var LOOK = '';
function lookParse(v) {
  v = String(v || '');
  var m = /^custom\|(#[0-9a-f]{6})\|(#[0-9a-f]{6})$/.exec(v);
  if (m) return { id: 'custom', main: m[1], link: m[2] };

  return t ? { id: t[0], main: t[2], link: t[3] } : null;
}
/** Black or white, whichever reads better on this colour. */
function lookInk(hex) {
  var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? '#16161a' : '#ffffff';
}

  else { root.setAttribute('data-pal', t.id); root.style.setProperty('--pal', t.main); root.style.setProperty('--pal2', t.link); root.style.setProperty('--on-pal', lookInk(t.main)); }
  try { if (LOOK) localStorage.setItem('cz_look', LOOK); else localStorage.removeItem('cz_look'); } catch (e) {}
  if (save && ME) srv('erpSetLook', [LOOK], function () {}, function (e) { toast('The theme is set on this device, but could not be saved for your other devices: ' + esc((e && e.message) || e), true, 9000); });
}
try { lookApply(localStorage.getItem('cz_look') || '', false); } catch (e) {}

  var on = (LOOK || 'plum') === id || (id === 'custom' && /^custom\|/.test(LOOK));
  return '<button type="button" class="th_card" data-th="' + id + '" aria-pressed="' + on + '"><div class="th_prev"><div class="bar" style="background:' + main + '"></div>' +
    '<div class="body"><div class="side"><i style="background:' + main + ';opacity:.85"></i><i></i><i></i><i></i></div>' +
    '<div class="main"><u style="background:' + link + '"></u><u style="background:#d9dde3;width:90%"></u><u style="background:#d9dde3;width:55%"></u><b style="background:' + main + '"></b></div></div></div>' +
    '<div class="th_name">' + esc(name) + (on ? '<span>✓ in use</span>' : '') + '</div></button>';
}
function themeBoxHtml() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark', t = lookParse(LOOK) || { main: '#714B67', link: '#017E84' };
  return '<div id="th_box" role="dialog" aria-label="Themes"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Themes</h2>' +
    '<div class="sub" style="margin:0">Pick a look. It changes at once and follows you to your other devices. Only you see your choice.</div></div>' +
    '<button class="btn small" type="button" id="th_close">Done</button></div>' +
    '<div class="th_mode"><button type="button" data-thmode="light" aria-pressed="' + (!dark) + '">☀ Light</button><button type="button" data-thmode="dark" aria-pressed="' + dark + '">☾ Dark</button></div>' +
    '<div class="th_grid">' + THEMES.map(function (x) { return themeCard(x[0], x[1], x[2], x[3]); }).join('') + '</div>' +
    '<div class="th_own"><label>Main colour<input type="color" id="th_main" value="' + t.main + '"></label>' +
    '<label>Links<input type="color" id="th_link" value="' + t.link + '"></label>' +
    '<button class="btn primary" type="button" id="th_use">Use my colours</button>' +

<script>

        return '<tr><td>' + esc(p.when) + '</td><td class="nm">' + esc(p.customer || 'Customer') + ' paid by ' + esc(p.method) + (p.invoice ? '<br><span class="sku">' + esc(p.invoice) + '</span>' : '') + '</td><td class="num"><strong>' + fmt(p.amount) + '</strong></td>' +

function wireCash() {

<script>

// the two or three things done most often so they take one click, not two.
// =====================================================================

  if (m === 'invoices') return (mgr && a.due > 0.5 ? b('pay', 'Pay', 'primary') : '') + (mgr && a.canReturn ? b('return', 'Return') : '') + b('pdf', 'PDF');
  if (m === 'products') return (a.canAdd ? b('add', 'Add') : '') + (mgr ? b('edit', 'Edit') : '');
  if (m === 'customers') return b('invoice', 'Invoice') + (mgr && a.owes > 0.5 ? b('pay', 'Pay', 'primary') : '') + b('statement', 'Statement') + b('edit', 'Edit');
  return '';
}
function lvRowAct(m, act, key) {

    if (act === 'pay') openDueBox(a.phone, a.name);
    else if (act === 'return') openReturn(r.key);

        if (!links.length) { toast(esc(x.why || 'No PDF was saved for this invoice.'), true, 10000); return; }
        toast(links.join(' · '), false, 30000);
      }, function (e) { toast(esc((e && e.message) || e), true, 12000); });

  }
}

<script>
var FX = null, FX_BUSY = false, FX_NEW = false;
function fxLoad(force) {
  if (FX_BUSY || (FX && !force)) return;
  FX_BUSY = true;
  srv('erpCurrencies', [], function (res) { FX_BUSY = false; FX = res; repaint(); },
      function () { FX_BUSY = false; FX = { currencies: [], canEdit: false, names: {} }; });
}
function fxList() {
  return ((FX && FX.currencies) || []).filter(function (c) { return !c.archived; });
}
function fxRate(code) {
  var r = 0;
  fxList().forEach(function (c) { if (c.code === code) r = Number(c.rate) || 0; });
  return r;
}
function fxAccOpts(sel, none) {
  var h = '<option value="">' + esc(none) + '</option>';
  ((FX && FX.accounts) || []).forEach(function (a) {
    h += '<option value="' + esc(a.id) + '"' + (sel === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>';
  });
  return h;
}

// ---------------------------------------------------------------- receive
recvCostHtml = function () {
  fxLoad();
  if (RECV.mode === 'rmb') { RECV.mode = 'fx'; RECV.currency = 'RMB'; }
  var m = RECV.mode || 'none', cur = RECV.currency || 'RMB', usual = fxRate(cur);
  var h = '<div style="margin-top:12px"><label class="f">What did this shipment cost?</label><div class="chips">' +
    recvModeChip('none', 'Use the price book') + recvModeChip('fx', 'Imported \u2014 foreign money') +
    recvModeChip('bdt', 'Local \u2014 taka') + '</div>';
  if (m === 'fx') {
    var opts = '';
    fxList().forEach(function (c) {
      opts += '<option value="' + esc(c.code) + '"' + (c.code === cur ? ' selected' : '') + '>' + esc(c.code + ' \u2014 ' + c.name) + '</option>';
    });
    if (!opts) opts = '<option value="RMB">RMB</option>';
    h += '<div class="fields">' +
      '<div><label class="f" for="rv_cur">Currency</label><select class="i" id="rv_cur">' + opts + '</select></div>' +
      '<div><label class="f" for="rv_rmb">Total on the supplier invoice (' + esc(cur) + ')</label>' +
      '<input class="i" id="rv_rmb" inputmode="decimal" value="' + esc(RECV.totalRmb) + '" placeholder="e.g. 4800"></div>' +
      '<div><label class="f" for="rv_rate">Rate for THIS shipment (TK per ' + esc(cur) + ')</label>' +
      '<input class="i" id="rv_rate" inputmode="decimal" value="' + esc(RECV.rate) + '" placeholder="' +
      (usual > 0 ? esc(String(usual)) : 'rate') + '"></div>' +
      '<div><label class="f">&nbsp;</label><label class="chk"><input type="checkbox" id="rv_saverate"' +
      (RECV.saveRate ? ' checked' : '') + '> Make this my usual rate</label></div></div>' +
      '<div class="sub">Another currency? Add it under Product cost \u2192 Currencies.</div>';
  } else if (m === 'bdt') {
    h += '<div class="fields"><div><label class="f" for="rv_bdt">Total paid for this shipment (TK)</label>' +
      '<input class="i" id="rv_bdt" inputmode="decimal" value="' + esc(RECV.totalBdt) + '" placeholder="e.g. 62000"></div></div>';
  }
  if (m !== 'none' && FX && FX.accounts && FX.accounts.length) {
    h += '<div class="fields"><div><label class="f" for="rv_paid">Goods paid from</label><select class="i" id="rv_paid">' +
      fxAccOpts(RECV.paidFrom || '', 'Not paid yet \u2014 owed to the supplier') + '</select></div></div>';
  }
  return h + '</div>';
};
recvTotalBdt = function () {
  if (RECV.mode === 'fx' || RECV.mode === 'rmb') {
    var r = Number(RECV.rate) || 0, t = Number(RECV.totalRmb) || 0;
    return (r > 0 && t > 0) ? r * t : 0;
  }
  if (RECV.mode === 'bdt') return Number(RECV.totalBdt) || 0;
  return 0;
};
function recvExtraBdt() {
  var t = 0;
  (RECV.costs || []).forEach(function (c) { t += num(c.amount); });
  return t;
}
recvCostSummary = function () {
  var total = recvTotalBdt(), units = 0, extra = recvExtraBdt() + recvShipBdt();
  for (var i = 0; i < RECV.lines.length; i++) units += Number(RECV.lines[i].qty) || 0;
  if (!(total > 0) || !units) {
    return '<div class="sub" style="text-align:right">' +
      (RECV.mode === 'none' ? 'Each line will be costed from the price book.'
        : 'Enter the shipment total and each line will be costed from it.') +
      (extra > 0 ? ' Shipping and other costs (' + fmt(extra) + ' TK) are spread over the units.' : '') + '</div>';
  }
  var rate = Number(RECV.rate) || 0;
  return '<div class="sub" style="text-align:right">Goods <strong>' + fmt(total) + ' TK</strong>' +
    (RECV.mode === 'fx' && rate > 0 ? ' (at ' + rate + ' TK/' + esc(RECV.currency || 'RMB') + ')' : '') +
    (extra > 0 ? ' + shipping and other costs <strong>' + fmt(extra) + ' TK</strong>' : '') +
    ' across ' + fmt(units) + ' unit(s) \u2014 about <strong>' + fmt((total + extra) / units) +
    ' TK</strong> each on average.<br>The handling default is not added on top of a shipment total.</div>';
};
var recvShipHtmlA5 = recvShipHtml;
recvShipHtml = function () {
  var h = recvShipHtmlA5(), acc = FX && FX.accounts && FX.accounts.length;
