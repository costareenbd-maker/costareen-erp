<style>
/* ===================================================================
   Costareen ERP. Colours are the validated data-viz palette: categorical
   slot 1 (blue) for single-series charts, the reserved status palette for
   stock state. Status colour never carries meaning alone - it always ships
   with an icon and a label.
   =================================================================== */
/* ===================================================================
   Costareen ERP - visual system.
   Quiet surfaces, one accent, semantic colour only where it means
   something. Every class name the screens already use is kept; this
   file only changes how they look and where they sit.
   =================================================================== */
:root {
  color-scheme: light;
  --plane:#f4f6f9; --surface:#ffffff; --ink:#0f172a; --ink-2:#334155;
  --muted:#64748b; --grid:#e8ebf1; --baseline:#cbd2dc;
  --ring:#e3e7ee; --field:#ffffff;
  --series-1:#2f6fed; --series-1-soft:#e6eefc;
  --good:#16a34a; --good-soft:#e7f6ec; --warning:#d97706; --warning-soft:#fdf1df;
  --serious:#ea580c; --critical:#dc2626; --critical-soft:#fdeaea; --up:#15803d;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.05);
  --shadow-lg:0 10px 30px rgba(15,23,42,.10);
  --side-w:238px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:#0b0e14; --surface:#141822; --ink:#f1f5f9; --ink-2:#cbd5e1;
  --muted:#8b96a8; --grid:#232a37; --baseline:#343d4d;
  --ring:#252c3a; --field:#0f1319;
  --series-1:#5b8def; --series-1-soft:#1a2c52;
  --good:#22c55e; --good-soft:#10301d; --warning:#f59e0b; --warning-soft:#3a2a0b;
  --serious:#fb923c; --critical:#ef4444; --critical-soft:#3d1515; --up:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 14px 34px rgba(0,0,0,.5);
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
body {
  background:var(--plane); color:var(--ink);
  font:14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01";
}
a { color:var(--series-1); }

/* ------------------------------------------------------------ shell */
.app { display:flex; min-height:100vh; }
#side { width:var(--side-w); flex:0 0 var(--side-w); position:sticky; top:0; height:100vh;
  overflow-y:auto; background:var(--surface); border-right:1px solid var(--ring);
  display:flex; flex-direction:column; padding:14px 12px 12px; }
.main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.topbar { position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px;
  min-height:58px; padding:9px 24px; background:color-mix(in srgb, var(--plane) 86%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--ring); }
.ptitle { font-size:17px; font-weight:700; letter-spacing:-.01em; }
.stamp { color:var(--muted); font-size:12.5px; }
.spacer { flex:1 1 auto; }
#view { padding:22px 24px 56px; width:100%; max-width:1520px; }
.brand { display:flex; align-items:center; gap:10px; padding:4px 8px 14px; }
.brand .logo { width:34px; height:34px; border-radius:9px; background:var(--series-1); color:#fff;
  display:grid; place-items:center; font-weight:800; font-size:15px; letter-spacing:-.02em; flex:0 0 34px; }
.brand .logo.has-img { background:#fff; border:1px solid var(--ring); width:42px; height:42px; flex:0 0 42px; padding:2px; overflow:hidden; }
.brand .logo img { width:100%; height:100%; object-fit:contain; display:block; }
.brand h1 { font-size:14.5px; font-weight:700; margin:0; letter-spacing:-.01em; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
.brand .tag { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.sidefoot { margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--grid); font-size:12.5px; color:var(--ink-2);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sidefoot #whoami { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
select.bizsel { font:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--surface);
  border:1px solid var(--ring); border-radius:9px; padding:7px 10px; min-height:36px; max-width:230px; }
select.bizsel:hover { border-color:var(--series-1); }
.filebox { display:flex; align-items:center; gap:10px; }
.filebox img { max-height:54px; max-width:120px; border:1px solid var(--ring); border-radius:6px; }

/* --------------------------------------------------------------- nav */
nav#nav { display:flex; flex-direction:column; gap:2px; }
nav#nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  font:inherit; font-size:13.5px; font-weight:500; color:var(--ink-2); background:none; border:none;
  border-radius:9px; padding:8px 10px; min-height:38px; cursor:pointer; }
nav#nav button:hover { background:var(--plane); color:var(--ink); }
nav#nav button[aria-selected="true"] { background:var(--series-1-soft); color:var(--series-1); font-weight:600; }
nav#nav .ic { width:18px; height:18px; flex:0 0 18px; display:inline-flex; opacity:.85; }
nav#nav .ic svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
nav#nav .count { margin-left:auto; font-size:11px; font-weight:700; background:var(--series-1); color:#fff;
  border-radius:999px; padding:1px 7px; min-width:20px; text-align:center; line-height:16px; }
nav#nav .count:empty { display:none; }
.navgrp { font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  padding:14px 10px 5px; }
.menuBtn { display:none; }
.backdrop { display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:70; }

/* ----------------------------------------------------------- buttons */
button.act, .btn { font:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--surface);
  border:1px solid var(--ring); border-radius:9px; padding:8px 14px; cursor:pointer; min-height:36px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;
  transition:border-color .12s, background .12s, color .12s; }
button.act:hover, .btn:hover { border-color:var(--series-1); color:var(--series-1); }
.btn.primary { background:var(--series-1); border-color:var(--series-1); color:#fff; box-shadow:0 1px 2px rgba(47,111,237,.25); }
.btn.primary:hover { filter:brightness(1.07); color:#fff; }
.btn.primary:disabled, .btn:disabled { opacity:.45; cursor:not-allowed; filter:none; }
.btn.small { padding:5px 10px; min-height:30px; font-size:12px; border-radius:8px; }
.btn.danger { color:var(--critical); }
.btn.danger:hover { border-color:var(--critical); }

/* ------------------------------------------------------------- cards */
.card { background:var(--surface); border:1px solid var(--ring); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); min-width:0; }
.card h2 { font-size:14px; font-weight:700; margin:0 0 3px; color:var(--ink); letter-spacing:-.005em; }
.card h3 { font-size:13px; font-weight:700; margin:0 0 6px; }
.card .sub, .sub { font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
.grid { display:grid; gap:14px; }
.g-kpi { grid-template-columns:repeat(auto-fit, minmax(min(176px,100%),1fr)); }
.g-half { grid-template-columns:repeat(auto-fit, minmax(min(420px,100%),1fr)); }
.g-act { grid-template-columns:repeat(auto-fit, minmax(min(230px,100%),1fr)); }
.g-third { grid-template-columns:repeat(auto-fit, minmax(min(300px,100%),1fr)); }
section { margin-bottom:16px; }
.sect { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:6px 0 10px; }
.sect h3 { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0; }
.sect .sub { margin:0; }

.alert { display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--ring);
  border-radius:12px; padding:13px 15px; box-shadow:var(--shadow); }
.alert .ico { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:13px; font-weight:700; flex:0 0 30px; }
.alert.critical .ico { background:var(--critical-soft); color:var(--critical); }
.alert.warning .ico { background:var(--warning-soft); color:var(--warning); }
.alert.good .ico { background:var(--good-soft); color:var(--good); }
.alert .n { font-size:20px; font-weight:700; letter-spacing:-.02em; line-height:1.1; }
.alert .lbl { font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.alert .hint { font-size:11.5px; color:var(--muted); margin-top:3px; }

.kpi { background:var(--surface); border:1px solid var(--ring); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); min-width:0; }
.kpi .lbl { font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.01em; }
.kpi .val { font-size:26px; font-weight:700; letter-spacing:-.025em; margin:6px 0 4px; font-variant-numeric:tabular-nums; line-height:1.15; }
.kpi .val .cur { font-size:12.5px; font-weight:600; color:var(--muted); margin-right:4px; vertical-align:middle; }
.kpi .delta { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.kpi .delta .up { color:var(--up); background:var(--good-soft); font-weight:700; padding:1px 6px; border-radius:6px; }
.kpi .delta .down { color:var(--critical); background:var(--critical-soft); font-weight:700; padding:1px 6px; border-radius:6px; }
.kpi.disabled .val { color:var(--muted); font-size:19px; }
.kpi.tone-good { border-top:3px solid var(--good); }
.kpi.tone-warn { border-top:3px solid var(--warning); }
.kpi.tone-bad { border-top:3px solid var(--critical); }
.kpi.tone-accent { border-top:3px solid var(--series-1); }

/* --------------------------------------------------------- dashboard */
.hero { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:2px 0 18px; }
.hero h1 { font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0 0 3px; }
.hero .sub { margin:0; }
.qa { display:flex; gap:8px; flex-wrap:wrap; }
.list { display:grid; gap:0; }
.list > div { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--grid); font-size:13px; }
.list > div:last-child { border-bottom:none; }
.list b { font-variant-numeric:tabular-nums; font-weight:700; }
.g-third .list b { font-size:16px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
.list .sku { display:block; }
.list > div.lead { font-weight:700; }
.sharebar { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--grid); gap:2px; }
.sharebar > div { height:100%; min-width:2px; }
.steps { display:flex; align-items:center; gap:8px; margin:2px 0 18px; flex-wrap:wrap; }
.steps i { flex:1 1 16px; height:2px; background:var(--grid); min-width:12px; }
.stp { display:inline-flex; align-items:center; gap:8px; border:none; background:none; font:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; padding:4px 2px; }
.stp b { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; border:2px solid var(--ring); font-size:12px; }
.stp.on { color:var(--ink); } .stp.on b { background:var(--series-1); border-color:var(--series-1); color:#fff; }
.stp.done b { background:var(--good-soft); border-color:var(--good); color:var(--good); }
.picks { display:grid; gap:10px; }
.pick { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--ring); border-radius:12px; padding:12px 14px; cursor:pointer; }
.pick.on { border-color:var(--series-1); background:var(--series-1-soft); }
.pick.off { opacity:.5; cursor:not-allowed; }
.pick input { margin-top:3px; } .pick .sku { display:block; margin-top:2px; }
.list > div.lead .sku { font-weight:400; }
.rank { display:grid; gap:10px; }
.rank > div { display:grid; grid-template-columns:minmax(0,42%) 1fr 40px; gap:12px; align-items:center; font-size:13px; }
.rank .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2); }
.rank .tr { height:8px; border-radius:4px; background:var(--grid); overflow:hidden; }
.rank .tr i { display:block; height:100%; border-radius:4px; background:var(--series-1); }
.rank b { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
.day-pick { display:flex; align-items:center; gap:8px; }
.day-pick input.i { width:160px; min-height:34px; padding:5px 9px; font-size:13px; }

/* ------------------------------------------------------------ tables */
table { width:100%; border-collapse:collapse; font-size:13px; }
td:last-child, th:last-child { padding-right:0; }
th { text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  padding:2px 10px 9px 0; border-bottom:1px solid var(--grid); white-space:nowrap; }
td { padding:9px 10px 9px 0; border-bottom:1px solid var(--grid); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tbody tr:hover td { background:color-mix(in srgb, var(--plane) 60%, transparent); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; padding-right:16px; }
td.num:last-child, th.num:last-child { padding-right:0; }
.scroll { overflow-x:auto; }
.tall { max-height:clamp(300px, calc(100vh - 300px), 1400px); overflow-y:auto; }
.tall thead th { position:sticky; top:0; background:var(--surface); z-index:1; }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 9px;
  border-radius:999px; border:1px solid transparent; background:var(--grid); color:var(--ink-2); white-space:nowrap; }
.pill.out { background:var(--critical-soft); color:var(--critical); }
.pill.low { background:var(--warning-soft); color:var(--warning); }
.pill.ok { background:var(--good-soft); color:var(--good); }
.chip.ckcat { cursor:pointer; }
tr.pick { cursor:pointer; }
tr.pick:hover td { background:var(--field); }
.gate { display:flex; align-items:center; justify-content:center; min-height:92vh; padding:20px; }
.gatecard { width:100%; max-width:360px; background:var(--surface); border:1px solid var(--ring); border-radius:16px;
  padding:30px 26px; box-shadow:var(--shadow-lg); text-align:center; }
.gatetitle { font-size:19px; font-weight:700; letter-spacing:-.02em; }
.gatehead { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.gatemark { width:44px; height:44px; border-radius:12px; background:var(--series-1); color:#fff; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:20px; flex:none; }
.gatetabs { display:flex; gap:4px; padding:4px; background:var(--plane); border:1px solid var(--ring); border-radius:11px; margin-bottom:16px; }
.gatetabs button { flex:1 1 0; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink-2); background:none; border:none;
  border-radius:8px; padding:9px 8px; cursor:pointer; min-height:38px; }
.gatetabs button[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.gatego { width:100%; margin-top:14px; justify-content:center; min-height:44px; }
.gatefoot { margin-top:14px; text-align:center; line-height:1.5; }
.gatein { width:100%; text-align:center; font-size:26px; letter-spacing:.35em; font-variant-numeric:tabular-nums; padding:12px 8px; }
.i.qty.pinned { border-color:var(--serious); font-weight:650; }
tr.grp-new td { background:rgba(240,173,78,.08); }
.chk { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); padding:8px 0; }
.chip.ckcat.on { background:var(--series-1-soft); border-color:var(--series-1); color:var(--ink); font-weight:650; }
tr.grp td { background:var(--plane); font-weight:700; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
.bal { display:inline-block; margin-left:7px; padding:1px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; vertical-align:middle; }
.bal.owed { background:var(--critical); color:#fff; }
.bal.adv  { background:var(--good); color:#fff; }
.nm { color:var(--ink); font-weight:500; }
.sku { color:var(--muted); font-size:11.5px; }
.cid { display:inline-block; margin-top:4px; padding:3px 9px; border:2px solid var(--good); border-radius:8px; font-weight:800; font-size:16px; letter-spacing:.5px; cursor:pointer; user-select:all; }
.cidlab { display:block; color:var(--muted); font-size:10.5px; margin-top:5px; }

/* ------------------------------------------------------------- forms */
label.f { display:block; font-size:11.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-2); margin-bottom:5px; }
input.i, select.i, textarea.i { font:inherit; font-size:14px; color:var(--ink); background:var(--field); border:1px solid var(--ring);
  border-radius:9px; padding:9px 11px; width:100%; min-height:38px; transition:border-color .12s, box-shadow .12s; }
input.i:focus, select.i:focus, textarea.i:focus { outline:none; border-color:var(--series-1); box-shadow:0 0 0 3px var(--series-1-soft); }
input.i.qty { width:74px; min-height:34px; padding:5px 8px; text-align:right; font-variant-numeric:tabular-nums; }
.fields { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(200px,100%),1fr)); }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.results { border:1px solid var(--ring); border-radius:10px; max-height:260px; overflow-y:auto; margin-top:8px; }
.results div.r { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--grid); cursor:pointer; }
.results div.r:last-child { border-bottom:none; }
.results div.r:hover { background:var(--series-1-soft); }
.results div.r.dis { opacity:.5; cursor:not-allowed; }
.results div.r.dis:hover { background:none; }
.totals { display:grid; gap:6px; margin-left:auto; max-width:330px; font-size:13.5px; }
.totals div { display:flex; justify-content:space-between; gap:20px; font-variant-numeric:tabular-nums; }
.totals div.grand { border-top:1px solid var(--grid); margin-top:5px; padding-top:9px; font-size:17px; font-weight:700; }
.totals div.due { color:var(--critical); font-weight:600; }

/* --------------------------------------------------------------- misc */
#dbg { display:none; }
#dbg.on { display:block; position:sticky; top:0; z-index:200; font:11.5px/1.4 ui-monospace, Consolas, monospace;
  background:#111; color:#9fe89f; padding:5px 10px; border-bottom:1px solid #333; white-space:pre-wrap; word-break:break-word; }
#dbg b { color:#ffd479; } #dbg .bad { color:#ff8a8a; }
.chips { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 12px; }
.chip { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--ring); border-radius:999px; padding:5px 12px;
  font-size:12.5px; font-weight:500; background:var(--surface); color:var(--ink-2); cursor:pointer; font-family:inherit; }
.chip.on { background:var(--series-1); border-color:var(--series-1); color:#fff; font-weight:600; }
.chip button { border:none; background:none; cursor:pointer; color:var(--muted); font:inherit; font-size:15px; line-height:1; padding:2px 6px; border-radius:50%; }
.chip button:hover { color:var(--critical); background:rgba(208,59,59,.10); }
.setgrid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(260px,100%),1fr)); }
.setcard { height:320px; display:flex; flex-direction:column; }
.setcard .setchips { flex:1 1 auto; overflow-y:auto; align-content:flex-start; margin-bottom:10px; }
svg { display:block; width:100%; overflow:visible; }
.axis-lbl { font-size:11px; fill:var(--muted); }
.val-lbl { font-size:11px; fill:var(--ink-2); font-weight:600; font-variant-numeric:tabular-nums; }
.gridline { stroke:var(--grid); stroke-width:1; }
.baseline { stroke:var(--baseline); stroke-width:1; }
.hit { fill:transparent; cursor:pointer; }
.in-lbl { font-size:11px; fill:#fff; font-weight:700; font-variant-numeric:tabular-nums; }
.chead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; min-height:30px; }
.chead h2 { margin:0; }
.seg { display:flex; gap:4px; flex-wrap:wrap; }
.seg .btn.on { background:var(--series-1); color:#fff; border-color:transparent; }
.legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; }
.legend span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); }

.note { display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--ring); border-left:4px solid var(--warning); border-radius:10px; padding:12px 15px; }

.empty { color:var(--muted); font-size:13px; padding:22px 0; text-align:center; }
.loading { text-align:center; padding:70px 0; color:var(--muted); }
.hidden { display:none !important; }
/* in-page dialogs (uiConfirm / uiPrompt / uiAlert) */
.offbar { position:fixed; top:0; left:0; right:0; z-index:1100; background:var(--critical); color:#fff; text-align:center;
  font-size:13px; font-weight:600; padding:7px 12px; }
.dlg-back { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:18px;
  background:rgba(8,11,18,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:dlgIn .12s ease-out; }
.dlg { width:100%; max-width:440px; max-height:calc(100vh - 36px); overflow:auto; background:var(--surface); color:var(--ink);
  border:1px solid var(--ring); border-radius:16px; padding:22px 22px 18px; box-shadow:0 24px 70px rgba(0,0,0,.45); }
.dlg-t { font-size:16.5px; font-weight:700; line-height:1.35; }

@keyframes dlgIn { from { opacity:0; } to { opacity:1; } }
@media (max-width:640px) {
  .dlg-back { align-items:flex-end; padding:0; }
  .dlg { max-width:none; border-radius:18px 18px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
  .dlg-f .btn { flex:1 1 0; }
}
#toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--plane);
  border-radius:12px; padding:13px 18px; box-shadow:var(--shadow-lg); z-index:120; opacity:0; pointer-events:none;
  transition:opacity .16s ease, transform .16s ease; max-width:min(560px, 92vw); font-size:13.5px; border-left:4px solid var(--good); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
#toast.bad { border-left-color:var(--critical); }
#toast a { color:#93c5fd; font-weight:600; }
:root[data-theme="dark"] #toast { background:#f8fafc; color:#0f172a; }
:root[data-theme="dark"] #toast a { color:#1d4ed8; }
:root[data-theme="dark"] #tip { background:#f8fafc; color:#0f172a; }

<script>
// Dark is the default. Applied before the first paint so there is no white
// flash, and before any data loads. The saved choice arrives a moment later
// from the server and overrides it if the person picked light.
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('cz_look2') ? (localStorage.getItem('cz_theme') || 'light') : 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
})();

<script>

             mode:'none', totalRmb:'', rate:'', totalBdt:'', saveRate:true };

// Who is using this browser. ME is filled in before anything else loads;
// until it is, no screen is drawn and no data is asked for.
var ME = null;
var ME_MSG = '';

try { if (localStorage.getItem('erp_gate_tab') === 'owner') GATE_TAB = 'owner'; } catch (e) {}
var BIZ = null;          // { businesses:[{id,name}], active, canAdd }
var NEWBIZ = { name:'', bank:'', logo:null, qr:null };
// a business run by a partner is a separate draft - it has their people on it
var PBIZ = { name:'', bank:'', logo:null, qr:null, e1:'', e2:'', e3:'', e4:'' };
var DAYSEL = null;       // a past day picked on the dashboard, or null for today
var DAY_BUSY = false;
var DASH_YEAR = null;    // the year shown on the monthly chart; null is this year
var DAY_MODE = 'revenue'; // what the daily line measures: revenue or units
var SETTINGS = null;     // reference lists + config from the SETTINGS tab
var SET_ERR = null;
var COSTS = null;        // the price book: buy prices, the rate, the margin floor
var COST_ERR = null;
var COST_EDIT = {};      // row -> what has been typed but not saved yet
var COST_FILTER = { cats: [], brands: [], q: '' };  // multi-select filters

var EXP_ERR = null;

var PLAN_ERR = null;
var INV_FILTER = 'post'; // which invoices the list shows
var SALES = null;        // every sale, for the Sales tab
var SALES_ERR = null;
var SALES_F = { q: '', filter: 'all', offset: 0 };
var PARCEL = null;       // the parcel about to be sent, awaiting a yes
var SFKEYS = null;       // whether THIS business has courier keys
var BKUP = null;         // the nightly backup: when, how many, where
var BKUP_BUSY = false;
var COURIER = null;      // what the courier did with each parcel
var COURIER_ERR = null;
var MONEY = null;        // what earns, and what is not moving
var MONEY_DAYS = 90;     // the window being looked at
var DUEBOX = null;       // the customer whose account is open
var DUES = null;         // who owes money, and how long it has been owed
var DUES_ERR = null;
var DUE_VIEW = 'people';  // by customer, or invoice by invoice
var DEVS = null;         // devices asking for access, and the allowed ones
var STAFF = null;        // the people who may use this ERP
var STAFF_ERR = null;
var NEWCODE = null;      // a code just made, shown once
var LINKS = null;        // each business's own web app link
var LINKS_ERR = null;
var PEOPLE = null;       // who can open the business on screen
var PEOPLE_ERR = null;
var HIST_ERR = null;     // why the movement list could not load
var ORDERS_ERR = null;   // why the invoice list could not load
var CUST_ERR = null;     // why the customer list could not load
var LISTS_ERR = null;    // why the dropdown lists could not load

// =====================================================================
// helpers
// =====================================================================
function fmt(n) { return (Math.round(n || 0)).toLocaleString('en-US'); }
function compact(n) {
  n = Math.round(n || 0); var a = Math.abs(n);
  if (a >= 1e7) return (n/1e7).toFixed(2).replace(/\.00$/,'') + 'Cr';
  if (a >= 1e5) return (n/1e5).toFixed(2).replace(/\.00$/,'') + 'L';
  if (a >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function el(id) { return document.getElementById(id); }
function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

var tip = el('tip');
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  var pad = 14, x = evt.clientX + pad, y = evt.clientY + pad;
  var r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTips(root) {
  var n = root.querySelectorAll('[data-tip]');
  for (var i = 0; i < n.length; i++) (function (x) {
    x.addEventListener('mousemove', function (e) { showTip(e, x.getAttribute('data-tip')); });
    x.addEventListener('mouseleave', hideTip);
  })(n[i]);
}

var toastTimer = null;
// =====================================================================
// dialogs: asking the person something, inside the page
//
// uiConfirm(text) -> true/false, uiPrompt(text, value) -> string or null,
// uiAlert(text). The first line of the text is the heading; the rest is the
// explanation. One dialog at a time: a second waits for the first.
// =====================================================================
var DLG_CHAIN = Promise.resolve();
var DLG_DANGER = /\b(delete|remove|cancel the sale|strike|struck|void|revoke|refuse|discontinu|stop|log .{0,30} out|disconnect|throw|discard|cannot be undone|sign out|tick .{0,20} off|close )/i;
function uiDialog(kind, text, value) {
  var run = function () {
    return new Promise(function (resolve) {
      var parts = String(text == null ? '' : text).split('\n');
      var title = parts.shift() || '';
      while (parts.length && !parts[0].trim()) parts.shift();
      var body = parts.join('\n');
      var danger = kind === 'confirm' && DLG_DANGER.test(title);
      var back = document.createElement('div');
      back.className = 'dlg-back';
      back.innerHTML =
        '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg_t">' +
        '<div class="dlg-t" id="dlg_t">' + esc(title) + '</div>' +
        (body ? '<div class="dlg-b">' + esc(body) + '</div>' : '') +
        (kind === 'prompt' ? '<input class="i" id="dlg_in" autocomplete="off">' : '') +
        '<div class="dlg-f">' +
        (kind === 'alert' ? '' : '<button class="btn" type="button" id="dlg_no">Cancel</button>') +
        '<button class="btn ' + (danger ? 'danger solid' : 'primary') + '" type="button" id="dlg_yes">' +
        (kind === 'prompt' ? 'Save' : kind === 'alert' ? 'OK' : (danger ? 'Yes, do it' : 'Confirm')) + '</button>' +
        '</div></div>';
      document.body.appendChild(back);
      var box = back.querySelector('#dlg_in'), yes = back.querySelector('#dlg_yes'), no = back.querySelector('#dlg_no');
      var was = document.activeElement, over = false;
      if (box) { box.value = value == null ? '' : String(value); }
      function done(v) {
        if (over) return; over = true;
        document.removeEventListener('keydown', key, true);
        if (back.parentNode) back.parentNode.removeChild(back);
        try { if (was && was.focus) was.focus(); } catch (e) {}
        resolve(v);
      }
      function accept() { done(kind === 'prompt' ? box.value : kind === 'alert' ? undefined : true); }
      function refuse() { done(kind === 'prompt' ? null : kind === 'alert' ? undefined : false); }
      function key(ev) {
        if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); refuse(); }
        else if (ev.key === 'Enter' && (kind !== 'confirm' || document.activeElement === yes)) { ev.preventDefault(); ev.stopPropagation(); accept(); }
        else if (ev.key === 'Tab') {                       // keep the keyboard inside the dialog
          var f = back.querySelectorAll('input, button'), a = f[0], z = f[f.length - 1];
          if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); z.focus(); }
          else if (!ev.shiftKey && document.activeElement === z) { ev.preventDefault(); a.focus(); }
        }
      }
      document.addEventListener('keydown', key, true);
      yes.addEventListener('click', accept);
      if (no) no.addEventListener('click', refuse);
      back.addEventListener('mousedown', function (ev) { if (ev.target === back && kind !== 'prompt') refuse(); });
      setTimeout(function () { try { if (box) { box.focus(); box.select(); } else (danger && no ? no : yes).focus(); } catch (e) {} }, 0);
    });
  };
  var p = DLG_CHAIN.then(run, run);
  DLG_CHAIN = p.then(function () {}, function () {});
  return p;
}
// ---- no connection: say so, instead of letting a save fail without a word ----
(function () {
  var bar = null;
  function show() {
    if (navigator.onLine) { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; return; }
    if (bar) return;
    bar = document.createElement('div');
    bar.className = 'offbar';
    bar.setAttribute('role', 'status');
    bar.textContent = 'No internet connection. Nothing can be saved until it is back.';
    document.body.appendChild(bar);
  }
  window.addEventListener('offline', show);
  window.addEventListener('online', show);
  window.addEventListener('load', show);
})();

function uiConfirm(text) { return uiDialog('confirm', text); }
function uiPrompt(text, value) { return uiDialog('prompt', text, value); }
function uiAlert(text) { return uiDialog('alert', text); }

function toast(html, bad, ms) {
  var t = el('toast');
  t.innerHTML = html;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = bad ? 'bad' : ''; }, ms || (bad ? 7000 : 5000));
}

function delta(cur, prev) {
  if (!prev) return '<span class="delta">no ' + esc(D.prevLabel) + ' baseline</span>';
  var pc = ((cur - prev) / prev) * 100;
  return '<span class="delta"><span class="' + (pc >= 0 ? 'up' : 'down') + '">' +
         (pc >= 0 ? '▲' : '▼') + ' ' + Math.abs(pc).toFixed(0) + '%</span> vs ' +
         esc(D.prevLabel) + ' (' + compact(prev) + ')</span>';
}
function kpi(label, cur, val, sub) {
  return '<div class="kpi"><div class="lbl">' + esc(label) + '</div><div class="val">' +
         (cur ? '<span class="cur">' + esc(cur) + '</span>' : '') + val + '</div>' + sub + '</div>';
}
function monLabel(key) {
  var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = String(key).split('-');
  return names[Number(p[1]) - 1] + " '" + p[0].slice(2);
}
/**
 * The reorder level this product's own sales say it should have.
 * Shown beside the stored one so the difference is visible before anything
 * is changed; green when they agree, amber when the stored level is too low
 * (you will run out), grey when it is needlessly high.
 */
function suggestCell(p) {
  var want = Number(p.suggested || 0);
  var have = Number(p.reorder || 0);
  if (!(p.rate > 0)) return '<span class="sku">no sales</span>';
  if (want === have) return '<span class="pill ok">' + fmt(want) + '</span>';
  if (want > have) return '<span class="pill out">' + fmt(want) + ' \u2191</span>';
  return '<span class="sku">' + fmt(want) + ' \u2193</span>';
}

/** Days of stock left at the current sales rate. */
function coverCell(p) {
  if (!(p.rate > 0)) {
    if ((p.sold || 0) === 0) return '<span class="sku">never sold</span>';
    return '<span class="sku">no recent sales</span>';
  }
  var c = p.cover;
  if (c === null || c === undefined) return '<span class="sku">—</span>';
  if (c <= 7)  return '<span class="pill out">' + fmt(c) + ' days</span>';
  if (c <= 30) return '<span class="pill low">' + fmt(c) + ' days</span>';
  return fmt(c) + ' days';
}

function stateBadge(st) {
  if (st === 'out') return '<span class="pill out">✕ Out of stock</span>';
  if (st === 'low') return '<span class="pill low">▲ Reorder</span>';
  return '<span class="pill ok">✓ In stock</span>';
}

// =====================================================================
// charts
// =====================================================================
function niceMax(v) {
  if (v <= 0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), f = v / mag;
  var step = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return step * mag;
}
/**
 * A year, January to December. On top of each bar what was taken; inside the
 * bar how many pieces were sold. A bar too short to hold the number carries it
 * above instead; a month with pieces but no price logged is a grey stub. Where
 * last year is known, a thin mark shows the same month then.
 */
function yearChart(rows, prev, nowKey, cur) {
  var W=640,H=230,L=46,R=8,T=30,B=30, iw=W-L-R, ih=H-T-B, slot=iw/rows.length, bw=slot*0.78;
  var top = 1;
  rows.forEach(function (r, i) { top = Math.max(top, r.revenue, prev && prev[i] ? prev[i].revenue : 0); });
  var max = niceMax(top);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  for (var g=0; g<=4; g++) {
    var gv=max*g/4, gy=T+ih-(gv/max)*ih;
    s += '<line class="'+(g?'gridline':'baseline')+'" x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'"/>';
    s += '<text class="axis-lbl" x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end">'+(g?compact(gv):'0')+'</text>';
  }
  rows.forEach(function (r, i) {
    var cx=L+slot*(i+0.5), v=Math.max(0, r.revenue), u=r.units, x0=cx-bw/2;
    var ahead = nowKey && r.key > nowKey;
    var p = prev && prev[i] && (prev[i].revenue > 0 || prev[i].units > 0) ? prev[i] : null;
    if (!ahead && v > 0) {
      var hh=(v/max)*ih, y=T+ih-hh, rad=Math.min(4,hh/2);
      s += '<path d="M'+x0+' '+(T+ih)+' L'+x0+' '+(y+rad)+' Q'+x0+' '+y+' '+(x0+rad)+' '+y+
           ' L'+(x0+bw-rad)+' '+y+' Q'+(x0+bw)+' '+y+' '+(x0+bw)+' '+(y+rad)+' L'+(x0+bw)+' '+(T+ih)+' Z" fill="var(--series-1)"/>';
      if (hh >= 20) {
        s += '<text class="val-lbl" x="'+cx+'" y="'+(y-6)+'" text-anchor="middle">'+compact(v)+'</text>';
        if (u) s += '<text class="in-lbl" x="'+cx+'" y="'+(y+hh/2+4)+'" text-anchor="middle">'+fmt(u)+'</text>';
      } else {
        s += '<text class="val-lbl" x="'+cx+'" y="'+(y-18)+'" text-anchor="middle">'+compact(v)+'</text>';
        if (u) s += '<text class="axis-lbl" x="'+cx+'" y="'+(y-6)+'" text-anchor="middle">'+fmt(u)+' pcs</text>';
      }
    } else if (!ahead && u > 0) {
      // pieces went out but no price was written down: say so, do not draw it as nothing
      s += '<rect x="'+x0+'" y="'+(T+ih-14)+'" width="'+bw+'" height="14" rx="3" fill="var(--muted)" opacity=".4"/>';
      s += '<text class="axis-lbl" x="'+cx+'" y="'+(T+ih-20)+'" text-anchor="middle">'+fmt(u)+' pcs</text>';
    }
    if (p && p.revenue > 0) {
      var py=T+ih-(p.revenue/max)*ih;
      s += '<line x1="'+(x0-2)+'" y1="'+py+'" x2="'+(x0+bw+2)+'" y2="'+py+'" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>';
    }
    s += '<text class="axis-lbl" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(r.label)+'</text>';
    var tip = '<b>'+r.label+' '+String(r.key).slice(0,4)+'</b>';
    if (ahead) tip += '<span class="r">not here yet</span>';
    else if (!v && !u) tip += '<span class="r">no sales</span>';
    else tip += '<span class="r"><i>Revenue</i>'+(v ? cur+' '+fmt(v) : 'no price logged')+'</span><span class="r"><i>Sold</i>'+fmt(u)+' pcs</span><span class="r"><i>Orders</i>'+fmt(r.orders)+'</span>';
    if (p) tip += '<span class="r"><i>Last year</i>'+(p.revenue ? cur+' '+fmt(p.revenue)+' · ' : '')+fmt(p.units)+' pcs</span>';
    s += '<rect class="hit" x="'+(cx-slot/2)+'" y="'+(T-20)+'" width="'+slot+'" height="'+(ih+20)+'" data-tip="'+esc(tip)+'"/>';
  });
  return s + '</svg>';
}
/** The last thirty days as a line - taka or pieces, whichever is asked for - with the average drawn through it. */
function dayChart(rows, key, cur) {
  if (!rows.length) return '<div class="empty">No data in range.</div>';
  var W=640,H=230,L=46,R=14,T=30,B=30, iw=W-L-R, ih=H-T-B, n=rows.length;
  var vals = rows.map(function (r) { return Math.max(0, r[key]); });
  var max = niceMax(Math.max.apply(null, vals) || 1), sum = 0;
  vals.forEach(function (v) { sum += v; });
  var avg = sum / n;
  var x=function(i){return L+(n===1?iw/2:(iw/(n-1))*i);};
  var y=function(v){return T+ih-(max?(v/max)*ih:0);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  for (var g=0; g<=4; g++) {
    var gv=max*g/4, gy=y(gv);
    s += '<line class="'+(g?'gridline':'baseline')+'" x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'"/>';
    s += '<text class="axis-lbl" x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end">'+(g?compact(gv):'0')+'</text>';
  }
  var pts = vals.map(function(v,i){ return x(i).toFixed(1)+' '+y(v).toFixed(1); });
  s += '<polygon points="'+(L+' '+(T+ih))+' '+pts.join(' ')+' '+((W-R)+' '+(T+ih))+'" fill="var(--series-1-soft)" opacity=".35"/>';
  if (avg > 0) {
    s += '<line x1="'+L+'" y1="'+y(avg)+'" x2="'+(W-R)+'" y2="'+y(avg)+'" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s += '<text class="axis-lbl" x="'+(L+4)+'" y="'+(y(avg)-5)+'">average '+(key === 'units' ? fmt(Math.round(avg))+' pcs' : compact(avg))+'</text>';
  }
  s += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  rows.forEach(function (r,i) {
    var cx=x(i), cy=y(vals[i]), last = i === n-1;
    s += '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(last?4:2.5)+'" fill="var(--series-1)" stroke="var(--surface)" stroke-width="'+(last?2:1)+'"/>';
    if (last) s += '<text class="val-lbl" x="'+cx+'" y="'+(cy-10)+'" text-anchor="end">'+(key === 'units' ? fmt(vals[i])+' pcs' : compact(vals[i]))+'</text>';
    if ((n-1-i) % 5 === 0) s += '<text class="axis-lbl" x="'+cx+'" y="'+(H-10)+'" text-anchor="'+(last?'end':'middle')+'">'+esc(r.label)+'</text>';
    s += '<rect class="hit" x="'+(cx-iw/n/2)+'" y="'+T+'" width="'+(iw/n)+'" height="'+ih+'" data-tip="'+
         esc('<b>'+r.label+'</b><span class="r"><i>Revenue</i>'+cur+' '+fmt(r.revenue)+'</span><span class="r"><i>Sold</i>'+fmt(r.units)+' pcs</span><span class="r"><i>Orders</i>'+fmt(r.orders)+'</span>')+'"/>';
  });
  return s + '</svg>';
}
/** The two cards: the year month by month, and the last thirty days. */
function trendCardsHtml(cur) {
  var Y = D.years || {}, ys = Object.keys(Y).sort();
  if (!ys.length) return '';
  var nowY = String(D.thisMonth || ys[ys.length-1]).slice(0,4);
  var yr = DASH_YEAR && Y[DASH_YEAR] ? DASH_YEAR : (Y[nowY] ? nowY : ys[ys.length-1]);
  var rows = Y[yr], prev = Y[String(Number(yr)-1)] || null, tr = 0, tu = 0, unpriced = false;
  rows.forEach(function (r) { tr += r.revenue; tu += r.units; if (!r.revenue && r.units > 0) unpriced = true; });
  var seg = function (attr, list, on) {
    return '<div class="seg">' + list.map(function (x) {
      return '<button class="btn small' + (x[0] === on ? ' on' : '') + '" type="button" ' + attr + '="' + esc(x[0]) + '">' + esc(x[1]) + '</button>';
    }).join('') + '</div>';
  };
  var h = '<section><div class="grid g-half"><div class="card"><div class="chead"><h2>Sales per month — ' + esc(yr) + '</h2>' +
    (ys.length > 1 ? seg('data-year', ys.map(function (v) { return [v, v]; }), yr) : '') + '</div>' +
    '<div class="sub">' + esc(cur) + ' ' + compact(tr) + ' · ' + fmt(tu) + ' pcs in ' + esc(yr) + '. On top: taken. Inside the bar: pieces sold.' +
    (unpriced ? ' Grey: sold, but no price was logged.' : '') + (prev ? ' Dashed mark: the year before.' : '') + '</div>' +
    yearChart(rows, prev, D.thisMonth || '', cur) + '</div>';
  var days = D.days || [], dr = 0, du = 0, mode = DAY_MODE === 'units' ? 'units' : 'revenue';
  days.forEach(function (r) { dr += r.revenue; du += r.units; });
  h += '<div class="card"><div class="chead"><h2>Sales per day — last ' + fmt(days.length) + ' days</h2>' +
    seg('data-daymode', [['revenue', 'Taka'], ['units', 'Units']], mode) + '</div>' +
    '<div class="sub">' + esc(cur) + ' ' + compact(dr) + ' · ' + fmt(du) + ' pcs · average ' + fmt(days.length ? Math.round(du / days.length) : 0) + ' pcs and ' +
    esc(cur) + ' ' + compact(days.length ? dr / days.length : 0) + ' a day. Point at a day for both figures.</div>' +
    dayChart(days, mode, cur) + '</div></div></section>';
  return h;
}
function hBars(rows, labelKey, valKey, fmtFn, unitLabel) {
  if (!rows.length) return '<div class="empty">Nothing to show.</div>';
  var max = Math.max.apply(null, rows.map(function (r) { return r[valKey]; })) || 1;
  return '<div class="rank">' + rows.map(function (r) {
    var nm = String(r[labelKey] || ''), w = Math.max(1.5, (r[valKey] / max) * 100);
    return '<div title="' + esc(nm + ' · ' + fmt(r[valKey]) + ' ' + unitLabel) + '"><span class="nm">' + esc(nm) + '</span>' +
      '<span class="tr"><i style="width:' + w.toFixed(1) + '%"></i></span><b>' + fmtFn(r[valKey]) + '</b></div>';
  }).join('') + '</div>';
}
function stockBar(st) {
  var total = st.inStock + st.reorder + st.outOfStock;
  if (!total) return '<div class="empty">No stock rows.</div>';
  var segs = [
    {k:'In stock', n:st.inStock, c:'var(--good)', ico:'●'},
    {k:'At reorder', n:st.reorder, c:'var(--warning)', ico:'▲'},
    {k:'Out of stock', n:st.outOfStock, c:'var(--critical)', ico:'✕'}
  ];
  var W=640,H=52,gap=2,x=0, s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  segs.forEach(function (sg) {
    if (!sg.n) return;
    var w=(sg.n/total)*W-gap; if (w<1) w=1;
    s += '<rect x="'+x+'" y="0" width="'+w+'" height="26" rx="4" fill="'+sg.c+'"/>';
    if (w > 42) s += '<text class="val-lbl" x="'+(x+w/2)+'" y="17" text-anchor="middle" fill="#fff">'+sg.n+'</text>';
    s += '<text class="axis-lbl" x="'+(x+w/2)+'" y="44" text-anchor="middle">'+Math.round((sg.n/total)*100)+'%</text>';
    s += '<rect class="hit" x="'+x+'" y="0" width="'+w+'" height="'+H+
         '" data-tip="'+esc('<b>'+sg.k+'</b><span class="r">'+sg.n+' of '+total+' SKUs</span>')+'"/>';
    x += w + gap;
  });
  s += '</svg><div class="legend">';
  segs.forEach(function (sg) {
    s += '<span><i style="background:'+sg.c+'"></i>'+sg.ico+' '+sg.k+' &middot; <strong>'+sg.n+'</strong></span>';
  });
  return s + '</div>';
}

function todayISO() {
  // The business day is the shop's, in Bangladesh - not the day on whatever
  // computer is looking. Opened from abroad after midnight, the browser's
  // own date is already tomorrow while the shop is still trading today.
  if (TODAY_STR) return TODAY_STR;
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function wireDash() {
  var gos = el('view').querySelectorAll('[data-go]');
  for (var g = 0; g < gos.length; g++) gos[g].addEventListener('click', function () {
    if (this.getAttribute('data-sfp')) { SFP_OPEN = true; if (!SFP) loadSfp(); }    // straight to the courier money
    if (this.getAttribute('data-f')) dashFilter(this.getAttribute('data-f'));
    go(this.getAttribute('data-go'));
  });
  var dp = el('dayPick');
  if (dp) dp.addEventListener('change', function () {
    var v = dp.value;
    if (!v || v === todayISO()) { DAYSEL = null; repaint(); return; }
    DAY_BUSY = true; repaint();
    srv('erpDaySales', [v], function (res) {
      DAY_BUSY = false; DAYSEL = res; repaint();
    }, function (e) {
      DAY_BUSY = false; DAYSEL = null; repaint();
      toast('Could not read that day: ' + esc(e && e.message ? e.message : e), true, 10000);
    });
  });
  var yb = el('view').querySelectorAll('[data-year]');
  for (var y1 = 0; y1 < yb.length; y1++) yb[y1].addEventListener('click', function () { DASH_YEAR = this.getAttribute('data-year'); repaint(); });
  var mb = el('view').querySelectorAll('[data-daymode]');
  for (var m1 = 0; m1 < mb.length; m1++) mb[m1].addEventListener('click', function () { DAY_MODE = this.getAttribute('data-daymode'); repaint(); });
  var bt = el('dayToday');
  if (bt) bt.addEventListener('click', function () { DAYSEL = null; repaint(); });
}



/** Is this screen open to the person signed in? (the nav already knows) */
function navOn(v) {
  var b = document.querySelector('#nav button[data-view="' + v + '"]');
  return !!(b && b.style.display !== 'none');
}
function kpiT(label, cur, val, sub, tone) {
  return '<div class="kpi' + (tone ? ' tone-' + tone : '') + '"><div class="lbl">' + esc(label) + '</div><div class="val">' +
         (cur ? '<span class="cur">' + esc(cur) + '</span>' : '') + val + '</div>' + (sub || '') + '</div>';
}

/**
 * The dashboard: what needs attention, how today and the month are going,
 * where the money is, how long the shelf lasts, and what sold. Every figure
 * is drawn only when the server sent it, so nothing pretends to be a fact.
 */
/**
 * What is on the shelf, at a glance: one card, a row for everything and a row
 * per category - pieces in stock, how many products, what they cost to land.
 * Cost is left out for anyone who is not shown money.
 */
function stockCardHtml(cur) {
  var rows = D.stockByCat || [];
  if (!rows.length) return '';
  var money = !D.hideProfit && rows.some(function (r) { return r.cost !== undefined; });
  var t = { skus: 0, units: 0, cost: 0, uncosted: 0 };
  rows.forEach(function (r) { t.skus += r.skus || 0; t.units += r.units || 0; t.cost += r.cost || 0; t.uncosted += r.uncosted || 0; });
  function line(name, r, lead) {
    return '<div' + (lead ? ' class="lead"' : '') + '><span>' + esc(name) + '<span class="sku">' + fmt(r.skus) + ' product' + (r.skus === 1 ? '' : 's') +
      (money ? ' · cost ' + (r.cost ? esc(cur) + ' ' + fmt(r.cost) : 'not known') : '') + '</span></span><b>' + fmt(r.units) + ' pcs</b></div>';
  }
  var h = '<div class="card"><h2>Stock on hand</h2><div class="sub">Pieces on the shelf' + (money ? ', and what they cost to land.' : '.') + '</div><div class="list">';
  if (rows.length > 1) h += line('All stock', t, true);
  // the biggest categories get a row each; a long tail is added up so the card stays short
  var show = rows.slice(0, 5), rest = rows.slice(5);
  show.forEach(function (r) { h += line(r.cat, r, rows.length === 1); });
  if (rest.length) {
    var o = { skus: 0, units: 0, cost: 0 };
    rest.forEach(function (r) { o.skus += r.skus || 0; o.units += r.units || 0; o.cost += r.cost || 0; });
    h += line(fmt(rest.length) + ' other categories', o, false);
  }
  h += '</div>';
  if (money && t.uncosted) h += '<div class="sku" style="margin-top:8px">' + fmt(t.uncosted) + ' product(s) in stock have no cost on record, so they are not in the cost above.</div>';
  if (navOn('products')) h += '<button class="btn small" type="button" data-go="products" style="margin-top:10px">Open products</button>';
  return h + '</div>';
}

function viewDash() {
  if (!D) return '<div class="loading">Loading dashboard&hellip;</div>';
  var a = D.alerts, k = D.kpi, cur = D.currency, p = D.profit || null, c = D.cover || null, m = D.cash || null, h = '';

  // ---- greeting and the things people do most -----------------------------
  var hr = new Date().getHours();
  var greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  var who = ME && ME.name ? String(ME.name).split(' ')[0] : '';
  var qa = [];
  if (navOn('invoice')) qa.push('<button class="btn primary" type="button" data-go="invoice">+ New invoice</button>');
  if (navOn('stock')) qa.push('<button class="btn" type="button" data-go="stock">Receive stock</button>');
  if (navOn('quotes')) qa.push('<button class="btn" type="button" data-go="quotes">New quotation</button>');
  if (navOn('campaigns')) qa.push('<button class="btn" type="button" data-go="campaigns">Campaign</button>');
  h += '<div class="hero"><div><h1>' + esc(greet) + (who ? ', ' + esc(who) : '') + '</h1>' +
    '<div class="sub">' + esc(D.monthLabel) + ' to date · as of ' + esc(D.generatedAt) + '</div></div>' +
    '<div class="qa">' + qa.join('') + '</div></div>';

  // ---- what needs attention --------------------------------------------------
  var acts = [];
  if (a.webPending) acts.push({ cls: 'critical', ico: '!', n: a.webOrders, lbl: 'website orders not entered',
    hint: fmt(a.webPending) + ' lines · ' + cur + ' ' + fmt(a.webPendingValue) + ' · stock not deducted', go: 'weborders' });
  if (a.outOfStock) acts.push({ cls: 'critical', ico: '✕', n: a.outOfStock, lbl: 'products out of stock', hint: 'cannot be sold today', go: 'products', f: 'out' });

  var toSend = sendCount();
  if (toSend) acts.unshift({ cls: 'warning', ico: '▲', n: toSend, lbl: 'parcel(s) to send', hint: 'saved, not handed to the courier yet', go: 'sales', f: 'tosend' });
  var cz = a.courier || null;
  if (cz && cz.review) acts.push({ cls: 'critical', ico: '!', n: cz.review, lbl: 'Steadfast parcel(s) collected much less than the invoice',
    hint: 'write off, or the customer still owes \u2014 your decision', go: 'sales', sfp: 1 });
  if (cz && cz.pending) acts.push({ cls: 'warning', ico: '\u25B2', n: cz.pending, lbl: 'Steadfast parcel(s) to match to an invoice',

  if (!acts.length) acts.push({ cls: 'good', ico: '✓', n: '—', lbl: 'nothing needs attention', hint: '' });

    return '<div class="alert ' + x.cls + '"' + (x.go && navOn(x.go) ? ' data-go="' + x.go + '"' + (x.sfp ? ' data-sfp="1"' : '') + (x.f ? ' data-f="' + x.f + '"' : '') + ' style="cursor:pointer"' : '') + '><div class="ico">' + x.ico + '</div><div>' +

var pFilter = { q:'', cat:'', state:'', status:'active', move:'' };

function viewProducts() {
  if (PRODP.sku) return productPageHtml();
  return ((PRODUCT_FORM && !PRODUCT_FORM.returnTo) ? productFormHtml() : '') + lvHtml('products');
}

function filteredProducts() {
  var q = pFilter.q.trim().toLowerCase();
  return CAT.filter(function (p) {
    // ---- movement filters -------------------------------------------
    // "Dead stock" means money already spent that is not moving: it must
    // still HAVE stock. A product with none left is a restock decision,
    // not dead stock, so those are excluded here.
    var m = pFilter.move;
    if (m === 'never') {
      if ((p.sold || 0) > 0) return false;
    } else if (m === 'dead90' || m === 'dead180' || m === 'dead365') {
      var win = m === 'dead90' ? 90 : (m === 'dead180' ? 180 : 365);
      if ((p.stock || 0) <= 0) return false;
      var since = (p.lastSoldDays === null || p.lastSoldDays === undefined) ? 1e9 : p.lastSoldDays;
      if (since < win) return false;
    } else if (m === 'urgent') {
      // fast mover about to run out: sells regularly AND under 14 days left
      if (!(p.rate > 0)) return false;
      if (p.cover === null || p.cover === undefined || p.cover > 14) return false;
    } else if (m === 'cover30') {
      if (!(p.rate > 0)) return false;
      if (p.cover === null || p.cover === undefined || p.cover > 30) return false;
    } else if (m === 'levellow') {
      if (!(p.rate > 0)) return false;
      if (Number(p.suggested || 0) <= Number(p.reorder || 0)) return false;
    } else if (m === 'levelhigh') {
      if (!(p.rate > 0)) return false;
      if (Number(p.suggested || 0) >= Number(p.reorder || 0)) return false;
    }

    var st = String(p.status || 'Active').toLowerCase();
    if (pFilter.status === 'active' && st === 'discontinued') return false;
    if (pFilter.status === 'discontinued' && st !== 'discontinued') return false;
    if (pFilter.cat && p.cat !== pFilter.cat) return false;
    if (pFilter.state && p.state !== pFilter.state) return false;
    if (!q) return true;
    return (p.name+' '+p.sku+' '+p.brand+' '+p.color+' '+p.cat).toLowerCase().indexOf(q) !== -1;
  }).sort(function (x, y) {
    // most on the shelf first, down to nothing
    return (y.stock || 0) - (x.stock || 0);
  });
}

function wireStatusButtons() {
  async function setStatus(sku, status, label) {
    if (!(await uiConfirm(label + ' ' + sku + '?'))) return;
    srv('erpSetProductStatus', [sku, status],
        function (res) {
        toast('<strong>'+esc(res.sku)+'</strong> is now '+esc(res.status)+'.');
        CAT = null; D = null; loadAll();
      },
        function (e) {
        toast('Could not change the status: '+esc(e && e.message ? e.message : e), true, 10000);
      });
  }
  var d = el('view').querySelectorAll('[data-disc]');
  for (var i = 0; i < d.length; i++) (function (b) {
    b.addEventListener('click', function () {
      setStatus(b.getAttribute('data-disc'), 'Discontinued',

  })(d[i]);
  var a = el('view').querySelectorAll('[data-active]');
  for (var j = 0; j < a.length; j++) (function (b) {
    b.addEventListener('click', function () {
      setStatus(b.getAttribute('data-active'), 'Active', 'Bring back as active:'); });
  })(a[j]);
}

function wireAddButtons() {
  var b = el('view').querySelectorAll('[data-add]');
  for (var i = 0; i < b.length; i++) (function (btn) {
    btn.addEventListener('click', function () {
      addToCart(btn.getAttribute('data-add'));

      var g = el('goInv');
      if (g) g.addEventListener('click', function (e) { e.preventDefault(); go('invoice'); });
    });
  })(b[i]);

  var ed = el('view').querySelectorAll('[data-edit]');
  for (var j = 0; j < ed.length; j++) (function (btn) {
    btn.addEventListener('click', function () {
      var sku = btn.getAttribute('data-edit');
      if (!LISTS) loadLists();
      srv('erpProduct', [sku],

        if (!p) { toast('That product is no longer on the list.', true); return; }

      },
          function (e) {
        toast('Could not open that product: '+esc(e && e.message ? e.message : e), true);
      });
    });
  })(ed[j]);
}

var DEL_PLACES_END = true;

/** An address, tidied so that spelling habits do not hide the place in it. */
function delNorm(addr) {
  return (' ' + String(addr || '').toLowerCase()
    .replace(/[^a-z0-9ঀ-৿]+/g, ' ')
    .replace(/(gonjo|gonj|gunj)\b/g, 'ganj')
    .replace(/\bmoh[ao]mm[ae]d ?pur\b/g, 'mohammadpur')
    .replace(/\bcox s? ?bazar\b/g, 'coxsbazar')
    .replace(/\s+/g, ' ') + ' ');
}

/** The first of these names that stands as its own word in the address. */
function delHit(a, names, notARoad) {
  for (var i = 0; i < names.length; i++) {
    var n = String(names[i] || '').trim();
    if (!n) continue;
    var at = a.indexOf(' ' + n + ' ');
    while (at >= 0) {
      // "Mymensingh Road" and "Sylhet Highway" are streets, not destinations
      var after = a.slice(at + n.length + 2);
      if (!notARoad || !/^(road|rd|highway|hwy|sarak|sorok|lane|goli|house|tower|bhaban|plaza|market|hotel|store|bus|mishti|sweets|bakery|restaurant|biryani)\b/.test(after)) return n;
      at = a.indexOf(' ' + n + ' ', at + 1);
    }
  }
  return '';
}

/** Which zone an address is in, and the word that says so - zone '' when it does not say. */
function delZoneFind(addr) {
  var raw = String(addr || ''), a = delNorm(raw), w;
  if ((w = delHit(a, DEL_OUTSIDE_NAMES, true))) return { zone: 'outside', word: w };
  for (var b = 0; b < DEL_BN.outside.length; b++) if (raw.indexOf(DEL_BN.outside[b]) >= 0) return { zone: 'outside', word: DEL_BN.outside[b] };
  if ((w = delHit(a, DEL_DISTRICT_NAMES, false))) return { zone: 'district', word: w };
  for (var c = 0; c < DEL_BN.district.length; c++) if (raw.indexOf(DEL_BN.district[c]) >= 0) return { zone: 'district', word: DEL_BN.district[c] };
  if ((w = delHit(a, DEL_CITY_NAMES, false))) return { zone: 'city', word: w };
  for (var d = 0; d < DEL_BN.city.length; d++) if (raw.indexOf(DEL_BN.city[d]) >= 0) return { zone: 'city', word: DEL_BN.city[d] };
  // "…, Dhaka" with no other district and no suburb named is the city itself
  if (a.indexOf(' dhaka ') >= 0) return { zone: 'city', word: 'dhaka' };
  return { zone: '', word: '' };
}

/** Which zone an address is in - or '' when it does not say. */
function delZoneGuess(addr) {
  return delZoneFind(addr).zone;
}

function delCharge(spools, zone) {
  var z = DEL_ZONES[zone];
  if (!z || !(spools > 0)) return null;
  var kg = Math.round(spools * DEL_SPOOL_KG * 100) / 100;
  var bill = Math.max(1, Math.ceil(kg));
  return { amount: z.first + (bill - 1) * DEL_EXTRA_KG, kg: kg, bill: bill, zone: z.label };
}

/** What to suggest for the order on screen, and why - or why not. */
function delSuggest() {
  if (!isCourier(FORM.source)) return { off: true };
  if (!CART.length) return { note: 'Add the products and the charge is worked out.' };
  var spools = 0, other = 0;
  CART.forEach(function (l) {
    if (/filament/i.test(String(l.cat || ''))) spools += l.qty; else other += 1;
  });
  if (other) {
    return { note: 'This order is not only filament, so its weight is not known. ' +
                   'Type the delivery charge yourself.' };
  }
  var found = delZoneFind(FORM.address);
  var zone = FORM.zone || found.zone;
  if (!zone) return { needZone: true, note: 'The address does not say where this is going. Choose it once and the charge is worked out.' };
  var c = delCharge(spools, zone);
  c.zoneKey = zone;
  c.zoneWord = FORM.zone ? '' : found.word;       // the word in the address that decided it
  c.note = spools + (spools === 1 ? ' spool' : ' spools') + ' × ' + DEL_SPOOL_KG + ' kg = ' + c.kg +
           ' kg, billed as ' + c.bill + ' kg · ' + c.zone;
  return c;
}

/** Put the suggestion in the box - unless a person has typed their own. */
function delApply() {
  var s = delSuggest();
  if (FORM.delTouched) return s;
  if (s.amount != null) { FORM.delivery = s.amount; FORM.delAuto = true; }
  else if (FORM.delAuto) { FORM.delivery = 0; FORM.delAuto = false; }   // ours to take back
  return s;
}

function delHintHtml(s) {

}

function cartTotals() {
  // two discounts: so much off each piece of a line, and so much off the whole invoice
  var sub = 0, itemDisc = 0;
  CART.forEach(function (l) { sub += l.qty * l.price; itemDisc += l.qty * num(l.discEach); });
  var invDisc = Math.max(0, Math.round(num(FORM.invDisc)));
  var disc = itemDisc + invDisc;
  var delivery = num(FORM.delivery), advance = num(FORM.advance);
  var grand = sub - disc + delivery;
  return { sub:sub, itemDisc:itemDisc, invDisc:invDisc, disc:disc, pct: sub > 0 ? disc / sub * 100 : 0,
           delivery:delivery, grand:grand, advance:advance, due:grand - advance };
}

/**
 * A phone as it is being typed: digits only, never more than eleven, and a
 * pasted +880 or a number missing its zero put right on the spot.
 */
function phoneClean(v) {
  var d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.indexOf('8801') === 0) d = d.slice(2);
  else if (d.indexOf('01') !== 0 && /^1[3-9]/.test(d)) d = '0' + d;
  return d.slice(0, 11);
}
/** What is wrong with a phone, in words - or '' when it is fine (blank is fine). */
function phoneProblem(v) {
  var s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (/^01[3-9]\d{8}$/.test(s)) return '';
  var n = s.replace(/\D/g, '').length;
  return 'Phone must be 11 digits starting with 01 — this one has ' + n + '.';
}
/** Every phone box cleans itself as it is typed into. */
function wirePhones(root) {
  var ns = (root || document).querySelectorAll('input[data-bdphone]');
  for (var i = 0; i < ns.length; i++) (function (n) {
    if (n.__bd) return;
    n.__bd = true;
    n.addEventListener('input', function () {
      var c = phoneClean(n.value);
      if (c !== n.value) n.value = c;
      n.style.borderColor = (c && phoneProblem(c)) ? 'var(--critical)' : '';
    });
  })(ns[i]);
}

function cartProblems() {
  var p = [];
  if (!FORM.name.trim()) p.push('Customer name is required.');
  if (phoneProblem(FORM.phone)) p.push(phoneProblem(FORM.phone));
  if (!CART.length) p.push('Add at least one product.');
  CART.forEach(function (l) {
    if (l.qty <= 0) p.push(l.name + ': quantity must be at least 1.');
    else if (l.qty > l.stock) p.push(l.name + ': only ' + fmt(l.stock) + ' in stock, ' + fmt(l.qty) + ' requested.');
    if (num(l.discEach) > l.price) p.push(l.name + ': discount per piece is larger than the price.');
  });
  var t = cartTotals();
  if (t.invDisc > t.sub - t.itemDisc + 0.001) p.push('Invoice discount is larger than the goods.');
  var cap = (ME && ME.discountCap != null) ? Number(ME.discountCap) : 100;
  if (cap < 100 && t.disc > t.sub * cap / 100 + 0.5) {
    p.push('Discount is ' + (Math.round(t.pct * 10) / 10) + '% of the goods. Your limit is ' + cap + '% \u2014 ask a manager or the owner.');
  }
  return p;
}

/** One of the three ways a sale gets paid. */
/** Pull this customer's outstanding balance, if they are a known one. */
function loadAccount(phone, name) {
  var p = String(phone || '').replace(/\D/g, '');
  if (p.length < 10 && !String(name || '').trim()) { ACCT = null; repaint(); return; }
  srv('erpCustomerAccount', [{ phone: phone, name: name }], function (res) {
    ACCT = (res && res.balance > 0) ? res : null;
    if (VIEW === 'invoice') repaint();
  }, function () { ACCT = null; });
}

function payChip(mode, label) {
  var on = (FORM.payMode || 'full') === mode;
  return '<button type="button" class="chip ckcat' + (on ? ' on' : '') +
         '" data-paymode="' + mode + '">' + esc(label) + '</button>';
}

/**
 * What this customer already owes, shown while the sale is being written.
 *
 * It is information, not arithmetic - the invoice stays the goods sold. The
 * button is here because the moment of a new sale is when old money actually
 * gets collected.
 */
function acctPanel() {
  if (!ACCT) return '';

  // Money they have left with you for goods not yet delivered. It is shown
  // apart from what they owe, and only ever spent on this invoice.
  if (ACCT.credit > 0) {
    var cur = OPT ? OPT.currency : 'BDT';
    var h0 = '<div class="note" style="border-color:var(--good);margin-bottom:12px">' +
      '<div class="ico">✓</div><div><strong>' + esc(ACCT.customer) +
      ' has ' + cur + ' ' + fmt(ACCT.credit) + ' in advance with you</strong>' +
      ' — it will come off this invoice automatically.' +
      (ACCT.balance > 0
        ? '<br>They also owe ' + cur + ' ' + fmt(ACCT.balance) +
          ' on older invoices, which this advance does <strong>not</strong> touch.'
        : '') +
      '</div></div>';
    if (!(ACCT.balance > 0)) return h0;
    return h0 + acctOwedPanel();
  }
  if (!(ACCT.balance > 0)) return '';
  return acctOwedPanel();
}

function acctOwedPanel() {
  return '<div class="note" style="border-color:var(--serious);margin-bottom:12px">' +
    '<div class="ico">▲</div><div>' +
    '<strong>' + esc(ACCT.customer) + ' already owes ' +
    (OPT ? OPT.currency : 'BDT') + ' ' + fmt(ACCT.balance) + '</strong>' +
    ' from ' + fmt(ACCT.count) + ' invoice(s), oldest ' +
    fmt(ACCT.invoices[0].days) + ' days.<br>' +
    'This is not added to the invoice below — it is what they owe from before. ' +
    '<button class="btn small primary" type="button" id="acct_take">Take payment</button>' +
    '</div></div>';
}

function wireInvoice() {
  function bindVal(id, key, isNum) {
    var n = el(id);
    if (!n) return;
    n.addEventListener('input', function () { FORM[key] = isNum ? num(n.value) : n.value; });
    n.addEventListener('change', function () {
      FORM[key] = isNum ? num(n.value) : n.value;
      if (isNum) repaint();
    });
  }
  bindVal('cphone','phone'); bindVal('cname','name'); bindVal('caddr','address');

  // The address warning updates itself as it is typed. Repainting the whole
  // invoice on every keystroke would be unusable, so this one line redraws
  // on its own.
  (function () {
    var box = el('caddr'), hint = el('addrHint');
    if (!box || !hint) return;
    var sel = el('csource');
    function redraw() {
      hint.innerHTML = isCourier(sel ? sel.value : FORM.source) ? addrHintHtml(box.value) : '';
    }
    box.addEventListener('input', function () {
      // Typing an address is the customer asking for a delivery. Until the
      // employee has chosen a method themselves, follow that: an address
      // means the courier, no address means they are collecting it.
      if (sel && !FORM.touched) {
        var want = box.value.trim() ? 'Steadfast courier' : 'Customer pickup';
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === want) { sel.value = want; FORM.source = want; break; }
        }
      }
      redraw();
    });
    if (sel) sel.addEventListener('change', function () {
      FORM.touched = true; FORM.source = sel.value; redraw();
      repaint();                       // the delivery charge depends on the method
    });
    // leaving the address box: the zone, and so the charge, may have changed
    box.addEventListener('change', function () { FORM.address = box.value; repaint(); });
  })();

  // A figure typed by a person is theirs; the suggestion stops overwriting it.
  var fd = el('fdel');
  if (fd) fd.addEventListener('input', function () { FORM.delTouched = true; FORM.delAuto = false; });
  var fz = el('fzone');
  if (fz) fz.addEventListener('change', function () { FORM.zone = fz.value; if (!fz.value) FORM.zoneEdit = false; repaint(); });
  var fzc = el('fzonechg');
  if (fzc) fzc.addEventListener('click', function () { FORM.zoneEdit = true; repaint(); });
  var fu = el('fdeluse');
  if (fu) fu.addEventListener('click', function () { FORM.delTouched = false; repaint(); });

  // A date the same as today is left blank, so the sheet keeps its live
  // =TODAY() formula and nothing has to be thought about for a normal sale.
  var dt = el('cdate');
  if (dt) dt.addEventListener('change', function () {
    FORM.date = (dt.value && dt.value !== TODAY_STR) ? dt.value : '';
    if (dt.value && TODAY_STR && dt.value > TODAY_STR) {
      dt.value = TODAY_STR; FORM.date = '';
      toast('An invoice cannot be dated in the future.', true);
    }
  });
  bindVal('csource','source'); bindVal('fmethod','method');
  bindVal('fdel','delivery', true);
  bindVal('finvdisc','invDisc', true);
  bindVal('fpaid','paidNow', true);

  var modes = el('view').querySelectorAll('button[data-paymode]');
  for (var pm = 0; pm < modes.length; pm++) {
    modes[pm].addEventListener('click', function () {
      FORM.payMode = this.getAttribute('data-paymode');
      if (FORM.payMode !== 'part') FORM.paidNow = 0;
      repaint();
    });
  }

  // collecting old money is done here because this is when it happens
  var take = el('acct_take');
  if (take) take.addEventListener('click', async function () {
    if (!ACCT) return;
    var typed = (await uiPrompt('How much did ' + ACCT.customer + ' pay?\n\n' +
                              'They owe ' + fmt(ACCT.balance) +
                              '. It clears their oldest invoices first.',
                              String(ACCT.balance)));
    if (typed === null) return;
    var amount = num(typed);
    if (!(amount > 0)) { toast('Enter an amount.', true); return; }
    take.disabled = true; take.textContent = 'Saving…';
    srv('erpSettleDue', [{ phone: FORM.phone, name: FORM.name, amount: amount,
                           reason: 'payment', method: FORM.method || 'Cash' }],
      function (res) {
        ACCT = { customer: ACCT.customer, balance: res.balance,
                 count: (res.dues && res.dues.count) || 0,
                 invoices: (ACCT.invoices || []) };
        DUES = res.dues; if (typeof updateDueCount === 'function') updateDueCount();
        toast(res.balance > 0
          ? 'Recorded. ' + fmt(res.balance) + ' still owed.'
          : 'Settled in full.');
        loadAccount(FORM.phone, FORM.name);
      },
      function (e) {
        take.disabled = false; take.textContent = 'Take payment';
        toast(esc(e && e.message ? e.message : e), true, 12000);
      });
  });

  // name is required, so re-render on change to clear the blocking message
  var nm = el('cname');
  if (nm) nm.addEventListener('blur', repaint);

  var ph = el('cphone');
  if (ph) ph.addEventListener('blur', function () {
    var v = ph.value.trim();
    if (!v) return;
    if (phoneProblem(v)) { FORM.phone = v; repaint(); return; }   // say so now, not at Save
    var hint = el('custHint');
    if (hint) hint.innerHTML = '<div class="sub" style="margin:10px 0 0">Looking up&hellip;</div>';
    // Whatever the lookup finds, ask what this person owes: a customer with
    // an unpaid invoice needs showing even if nothing else about them changes.
    loadAccount(v, FORM.name);

    srv('erpLookupCustomer', [v],
        function (c) {
      if (!c) {
        if (hint) hint.innerHTML = '<div class="sub" style="margin:10px 0 0">New customer — they will be created on save.</div>';
        ACCT = null;
        return;
      }
      FORM.name = c.name; FORM.address = c.address;
      // how THIS order goes out is decided now, not inherited from last time
      if (c.phone) FORM.phone = c.phone;
      repaint();
      loadAccount(c.phone || v, c.name);
      var h2 = el('custHint');
      if (h2) h2.innerHTML = '<div class="note ok" style="margin-top:12px"><div class="ico">✓</div><div>'+
        'Existing customer — <strong>'+esc(c.name)+'</strong>, '+fmt(c.orders)+
        ' previous order(s), '+fmt(c.spent)+' spent.</div></div>';
    },
        function (e) {
      if (hint) hint.innerHTML = '<div class="note err" style="margin-top:12px"><div class="ico">✕</div><div>'+
        esc(e && e.message ? e.message : e)+'</div></div>';
    });
  });

  var npi = el('newProductInv');
  if (npi) npi.addEventListener('click', function () { quickStart('invoice', ''); });

  var s = el('isearch');
  if (s) {
    s.addEventListener('input', function () { iSearch = s.value; paintResults(); });
    paintResults();
  }

  var q = el('view').querySelectorAll('[data-qty]');
  for (var i = 0; i < q.length; i++) (function (n) {
    n.addEventListener('change', function () {
      CART[Number(n.getAttribute('data-qty'))].qty = Math.max(1, Math.round(num(n.value)));
      repaint();
    });
  })(q[i]);

  var dd = el('view').querySelectorAll('[data-disc]');
  for (var j = 0; j < dd.length; j++) (function (n) {
    n.addEventListener('change', function () {
      CART[Number(n.getAttribute('data-disc'))].discEach = Math.max(0, num(n.value));
      repaint();
    });
  })(dd[j]);

  var del = el('view').querySelectorAll('[data-del]');
  for (var d = 0; d < del.length; d++) (function (n) {
    n.addEventListener('click', function () {
      CART.splice(Number(n.getAttribute('data-del')), 1);
      updateCounts(); repaint();
    });
  })(del[d]);

  var c = el('clearInv');
  if (c) c.addEventListener('click', function () {
    CART = [];
    FORM.delivery = 0; FORM.advance = 0; FORM.invDisc = 0; FORM.delTouched = false; FORM.delAuto = false; FORM.zone = ''; FORM.zoneEdit = false;
    updateCounts(); repaint();
  });

  var sv = el('saveInv');
  if (sv) {
    sv.addEventListener('click', saveInvoice);
    sv.addEventListener('pointerdown', function () { SAVE_WANTED = new Date().getTime(); });
  }
  // the form was redrawn between the press and the release: finish what the press meant
  if (SAVE_WANTED && new Date().getTime() - SAVE_WANTED < 1500) {
    setTimeout(function () { if (SAVE_WANTED) saveInvoice(); }, 0);
  }
}
var SAVE_WANTED = 0;

function paintResults() {
  var box = el('iresults');
  if (!box) return;
  var q = iSearch.trim().toLowerCase();
  if (!q) { box.innerHTML = '<div class="empty">Start typing to find a product.</div>'; return; }
  var rows = CAT.filter(function (p) {
    if (String(p.status||'').toLowerCase() === 'discontinued') return false;
    return (p.name+' '+p.sku+' '+p.brand+' '+p.color).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 40);
  var newRow = '<div class="r" data-newp="1"><div><div class="nm" style="color:var(--series-1)">' +
    '+ Create new product' + (q ? ' \u201c' + esc(iSearch.trim()) + '\u201d' : '') + '</div>' +
    '<div class="sku">Not in the product list yet</div></div><div></div></div>';
  if (!rows.length) { box.innerHTML = newRow; wireInvPicks(box); return; }
  var h = '';
  rows.forEach(function (p) {
    var can = p.stock > 0 && p.sell > 0;
    h += '<div class="r'+(can?'':' dis')+'"'+(can?' data-pick="'+esc(p.sku)+'"':'')+'>'+
         '<div><div class="nm">'+esc(p.name)+'</div><div class="sku">'+esc(p.sku)+
         (p.brand?' · '+esc(p.brand):'')+' · '+fmt(p.stock)+' in stock</div></div>'+
         '<div style="text-align:right; white-space:nowrap">'+
         (p.sell ? '<strong>'+fmt(p.sell)+'</strong>' : '<span class="sku">no price</span>')+
         '<div>'+stateBadge(p.state)+'</div></div></div>';
  });
  box.innerHTML = h + newRow;
  wireInvPicks(box);
}

function wireInvPicks(box) {
  var picks = box.querySelectorAll('[data-pick]');
  for (var i = 0; i < picks.length; i++) (function (n) {
    n.addEventListener('click', function () { addToCart(n.getAttribute('data-pick')); repaint(); });
  })(picks[i]);
  var np = box.querySelector('[data-newp]');
  if (np) np.addEventListener('click', function () { quickStart('invoice', iSearch.trim()); });
}

function addToCart(sku) {
  var p = null;
  for (var i = 0; i < CAT.length; i++) if (CAT[i].sku === sku) { p = CAT[i]; break; }
  if (!p) return;
  for (var j = 0; j < CART.length; j++) {
    if (CART[j].sku === sku) { CART[j].qty += 1; updateCounts(); return; }
  }
  CART.push({ sku:p.sku, name:p.name, price:p.sell, qty:1, discEach:0, stock:p.stock, cat:p.cat });
  updateCounts();
}

async function saveInvoice() {
  SAVE_WANTED = 0;
  if (SAVING) return;
  var probs = cartProblems();
  if (probs.length) { toast(probs.map(esc).join('<br>'), true); return; }
  var t = cartTotals();
  var msg = 'Save this invoice?\n\n' +
            FORM.name.trim() + '\n' +
            CART.length + ' product line(s), ' +
            CART.reduce(function (a, l) { return a + l.qty; }, 0) + ' unit(s)\n' +
            'Grand total: ' + OPT.currency + ' ' + fmt(t.grand) +
            (function () {
              // what is taken now follows the "How was this paid?" choice
              var now = FORM.payMode === 'full' ? t.grand : FORM.payMode === 'part' ? Math.min(num(FORM.paidNow), t.grand) : 0;
              var due = Math.max(0, t.grand - now);
              return '\nPaid now: ' + OPT.currency + ' ' + fmt(now) + (due > 0 ? '\nDue: ' + OPT.currency + ' ' + fmt(due) : '');
            })() +
            '\n\nStock will be deducted and the invoice PDF made.';
  if (!(await uiConfirm(msg))) return;

  SAVING = true; repaint();
  srv('erpCreateInvoice', [{
      customer: { name:FORM.name.trim(), phone:FORM.phone.trim(),
                  address:FORM.address.trim(), source:FORM.source },
      items: CART.map(function (l) {
        return { sku:l.sku, qty:l.qty, discEach:num(l.discEach) };
      }),
      invoiceDiscount: Math.max(0, Math.round(num(FORM.invDisc))),
      deliveryCharge: num(FORM.delivery),
      payMode: FORM.payMode || 'full',
      paidNow: num(FORM.paidNow),
      advancePaid: num(FORM.advance),
      paymentMethod: FORM.method,
      paymentStatus: FORM.status,
      date: FORM.date || '',
      from: (typeof INV_FROM !== 'undefined' && INV_FROM) || ''
    }],
      function (res) {
      SAVING = false;
      if (typeof invFromSaved === 'function') invFromSaved(res);
      CART = [];
      // date goes back to blank, so a backdated invoice does not silently
      // set the date for every sale after it
      ACCT = null;
      FORM = { payMode:'full', paidNow:0, phone:'', name:'', address:'', source:(OPT.sources[0] || 'Customer pickup'),
               touched:false, method:FORM.method,
               status:FORM.status, delivery:0, advance:0, date:'' };
      iSearch = '';
      invoiceDone(res);
      updateCounts();
      // Stock moved, so the catalogue is refetched - that is what the next
      // sale reads. The dashboard, invoice list and history are only marked
      // stale: reloading all of them here made the employee wait another
      // half minute before they could start the next customer.
      D = null; ORDERS = null; HIST = null; PLAN = null; DUES = null;
      srv('erpBundle', [['catalog']], applyBundle, function () {});
    },
      function (e) {
      SAVING = false; repaint();
      toast('Could not save: ' + esc(e && e.message ? e.message : e), true, 12000);
    });
}
