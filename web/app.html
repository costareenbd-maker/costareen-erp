  /* document previews (invoice, quotation, statement) keep their own tables */
  #view .doc table th, #view .doc table td, #view .paper table th, #view .paper table td { background:none; }
}
/* the same list look for the simple two-column lists and for section titles */
#view .list > div { padding:9px 2px; }
#view .list > div:hover { background:color-mix(in srgb, var(--series-1) 4%, transparent); }
#view .card h2 { font-weight:600; }
#view .kpi .lbl { font-weight:500; }
</style>

<!-- plan C3: New invoice - totals always in sight, quantity keys, fits a phone -->
<style>
.c3bar { position:sticky; bottom:0; z-index:40; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px; padding:9px 14px;
  background:var(--surface); border:1px solid var(--ring); border-radius:6px; box-shadow:0 -4px 16px rgba(0,0,0,.12); }
.c3bar .c3n { color:var(--muted); font-size:13px; }
.c3bar .c3t { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.c3bar .c3t small { font-size:12px; font-weight:600; color:var(--muted); margin-right:4px; }
.c3bar .c3d { color:var(--critical); font-weight:600; font-size:13px; }
.c3bar .c3p { color:var(--critical); font-size:12.5px; flex:1 1 160px; }
.c3bar .btn { margin-left:auto; min-height:40px; padding:8px 18px; }
.qst { display:inline-flex; align-items:center; gap:4px; }
.qst button { width:30px; height:32px; border:1px solid var(--ring); background:var(--surface); color:var(--ink); border-radius:4px; font-size:17px; line-height:1; cursor:pointer; }
.qst button:hover { background:var(--thead); }
.qst input.i.qty { width:58px; text-align:center; }
.inv2-l .fields { grid-template-columns:1fr 1fr; }
.inv2 td .btn.c3x { min-width:30px; padding:4px 8px; }
@media (max-width:640px) {
  body.has-tabbar .c3bar { bottom:calc(64px + env(safe-area-inset-bottom)); }
  .c3bar { gap:10px; padding:8px 10px; margin-left:-4px; margin-right:-4px; }
  .c3bar .c3n { display:none; }
  .c3bar .c3p { flex-basis:100%; order:5; }
  .inv2 .card > .sub { display:none; }
  .inv2 .fields { grid-template-columns:1fr 1fr; gap:10px; }
  .inv2 section { margin-bottom:10px; }
  .inv2 .card { padding:12px; }
  .qst button { width:38px; height:38px; }
}
</style>
<script>
var viewInvoiceC3 = viewInvoice;
viewInvoice = function () {
  var h = viewInvoiceC3();
  if (!CAT || !OPT || h.indexOf('class="inv2"') < 0) return h;
  // quantity keys around every quantity box
  h = h.replace(/<input class="i qty" type="number" min="1" step="1" data-qty="(\d+)" value="(\d+)">/g, function (m, i) {
    return '<span class="qst"><button type="button" data-qstep="-1" data-qi="' + i + '" aria-label="One less">\u2212</button>' + m +
           '<button type="button" data-qstep="1" data-qi="' + i + '" aria-label="One more">+</button></span>';
  });
  h = h.replace(/(<button class="btn small danger)(" type="button" data-del="\d+")>Remove<\/button>/g, '$1 c3x$2 title="Remove this line" aria-label="Remove this line">✕</button>');
  var t = cartTotals(), probs = CART.length ? cartProblems() : [], units = 0;
  CART.forEach(function (l) { units += Number(l.qty) || 0; });
  var paid = FORM.payMode === 'full' ? t.grand : FORM.payMode === 'part' ? Math.min(num(FORM.paidNow), t.grand) : 0;
  var due = Math.max(0, t.grand - paid);
  var bar = '<div class="c3bar">' + (CART.length
    ? '<span class="c3n">' + fmt(CART.length) + ' product' + (CART.length === 1 ? '' : 's') + ' \u00b7 ' + fmt(units) + ' unit' + (units === 1 ? '' : 's') + '</span>' +
      '<span class="c3t"><small>' + esc(OPT.currency) + '</small>' + fmt(t.grand) + '</span>' +
      (due > 0 ? '<span class="c3d">due ' + fmt(due) + '</span>' : '<span class="c3n" style="display:inline">paid in full</span>') +
      (probs.length ? '<span class="c3p">' + esc(probs[0]) + (probs.length > 1 ? ' (+' + (probs.length - 1) + ' more)' : '') + '</span>' : '')
    : '<span class="c3n" style="display:inline">Search a product and press Enter, or tap it, to start.</span>') +
    '<button class="btn primary" type="button" id="c3save"' + (SAVING || !CART.length ? ' disabled' : '') + '>' + (SAVING ? 'Saving\u2026' : 'Save invoice') + '</button></div>';
  return h + bar;
};
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (!t || VIEW !== 'invoice') return;
  if (t.id === 'c3save') { saveInvoice(); return; }
  if (t.getAttribute && t.getAttribute('data-qstep')) {
    var l = CART[Number(t.getAttribute('data-qi'))];
    if (!l) return;
    l.qty = Math.max(1, (Number(l.qty) || 1) + Number(t.getAttribute('data-qstep')));
    try { updateCounts(); } catch (e) {}
    repaint();
  }
});
// Ctrl+Enter (or Cmd+Enter) saves from anywhere on the invoice
document.addEventListener('keydown', function (ev) {
  if (VIEW !== 'invoice' || ev.key !== 'Enter' || !(ev.ctrlKey || ev.metaKey)) return;
  if (!CART.length || SAVING) return;
  ev.preventDefault(); saveInvoice();
});
</script>

<!-- plan C4: dashboard trimmed - what needs doing, today, this month; the rest behind tabs -->
<style>
.dtabs { margin-top:6px; }
.dtabp[hidden] { display:none !important; }
</style>
<script>
var DASH_TAB = (function () { try { return localStorage.getItem('cz_dash_tab') || 'stock'; } catch (e) { return 'stock'; } })();
var viewDashC4 = viewDash;
viewDash = function () {
  var h = viewDashC4();
  var marks = [
    ['stock', 'Stock and cash', '<section><div class="grid g-third">'],
    ['top', 'Top products', '<section><div class="grid g-half"><div class="card"><h2>Top products'],
    ['orders', 'Recent orders', '<section><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Recent orders']
  ];
  var found = [];
  marks.forEach(function (m) { var at = h.indexOf(m[2]); if (at >= 0) found.push({ key: m[0], label: m[1], at: at }); });
  if (found.length < 2) return h;
  found.sort(function (a, b) { return a.at - b.at; });
  if (!found.some(function (f) { return f.key === DASH_TAB; })) DASH_TAB = found[0].key;
  var out = h.slice(0, found[0].at) + '<div class="tabs dtabs" role="tablist">' + found.map(function (f) {
    return '<button type="button" role="tab" data-dtab="' + f.key + '" aria-selected="' + (f.key === DASH_TAB) + '">' + f.label + '</button>'; }).join('') + '</div>';
  found.forEach(function (f, i) {
    var end = i + 1 < found.length ? found[i + 1].at : h.length;
    out += '<div class="dtabp" data-dtabp="' + f.key + '"' + (f.key === DASH_TAB ? '' : ' hidden') + '>' + h.slice(f.at, end) + '</div>';
  });
  return out;
};
document.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('button[data-dtab]') : null;
  if (!t) return;
  DASH_TAB = t.getAttribute('data-dtab');
  try { localStorage.setItem('cz_dash_tab', DASH_TAB); } catch (e) {}
  var tabs = document.querySelectorAll('button[data-dtab]'), panes = document.querySelectorAll('[data-dtabp]');
  for (var i = 0; i < tabs.length; i++) tabs[i].setAttribute('aria-selected', String(tabs[i] === t));
  for (var j = 0; j < panes.length; j++) panes[j].hidden = panes[j].getAttribute('data-dtabp') !== DASH_TAB;
});
</script>

<!-- plan C5: one search, short help with "?", menu groups that fold on a phone -->
<style>
#gs_out button.gs-list { color:var(--series-1); font-weight:600; border-bottom:1px solid var(--grid); }
.sub.c5clip { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden; }
.c5q { float:right; margin:0 0 4px 8px; width:20px; height:20px; border-radius:50%; border:1px solid var(--ring); background:var(--surface); color:var(--muted);
  font:inherit; font-size:11.5px; font-weight:700; line-height:1; cursor:pointer; padding:0; }
.c5q:hover, .c5q.on { color:var(--series-1); border-color:var(--series-1); }
@media (max-width:640px) {
  #nav .navgrp { cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding-top:12px; padding-bottom:8px; }
  #nav .navgrp::after { content:'\25BE'; font-size:12px; opacity:.7; }
  #nav .navgrp.c5shut::after { content:'\25B8'; }
  #nav button.c5hide { display:none !important; }
}
</style>
<script>
// ---- 1. the top search also filters the list that is open
function c5OpenList() {
  var w = document.querySelector('#view .o_lv[data-lv]');
  if (!w) return null;
  var m = w.getAttribute('data-lv'), st = lvSt(m);
  return st && st.spec && st.spec.search && st.spec.search.length ? { m: m, st: st } : null;
}
var gsHtmlC5 = gsHtml;
gsHtml = function () {
  var h = gsHtmlC5(), L = c5OpenList(), text = (GS.q || '').trim();
  if (!L || text.length < 2) return h;
  return '<button type="button" class="gs-list" data-gslist="1"><span>Filter this list for \u201c' + esc(text) + '\u201d</span><small>Enter</small></button>' + h;
};
function c5FilterList() {
  var L = c5OpenList(), text = (GS.q || (el('gs_q') ? el('gs_q').value : '')).trim();
  if (!L || text.length < 2) return false;
  L.st.q = text; L.st.sug = 0;
  lvAddSearch(L.m, L.st.spec.search[0].field);
  gsClose(true);
  return true;
}
document.addEventListener('click', function (ev) {
  var b = ev.target && ev.target.closest ? ev.target.closest('button[data-gslist]') : null;
  if (b) { ev.stopPropagation(); c5FilterList(); }
}, true);
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || !ev.target || ev.target.id !== 'gs_q') return;
  if (c5FilterList()) { ev.preventDefault(); ev.stopImmediatePropagation(); }
}, true);

// ---- 2. long help text: one line, the rest behind "?"
var C5_OPEN = {}, C5_ALL = (function () { try { return localStorage.getItem('cz_help_open') === '1'; } catch (e) { return false; } })();
function c5Help() {
  var subs = document.querySelectorAll('#view .card > .sub:not([data-c5]), #view .card > .row > div > .sub:not([data-c5])');
  for (var i = 0; i < subs.length; i++) {
    var n = subs[i];
    n.setAttribute('data-c5', '1');
    var text = (n.textContent || '').trim();
    if (text.length < 115 || n.querySelector('button, input, select, a, .pill')) continue;
    var key = text.slice(0, 60), open = C5_ALL || !!C5_OPEN[key];
    var q = document.createElement('button');
    q.type = 'button'; q.className = 'c5q' + (open ? ' on' : ''); q.textContent = '?';
    q.title = 'Show or hide the explanation'; q.setAttribute('aria-label', 'Show or hide the explanation');
    q.setAttribute('data-c5k', key);
    n.parentNode.insertBefore(q, n);
    if (!open) n.classList.add('c5clip');
  }
}
document.addEventListener('click', function (ev) {
  var q = ev.target;
  if (!q || !q.classList || !q.classList.contains('c5q')) return;
  var n = q.nextElementSibling; if (!n) return;
  var open = n.classList.contains('c5clip');
  n.classList.toggle('c5clip', !open); q.classList.toggle('on', open);
  var k = q.getAttribute('data-c5k'); if (open) C5_OPEN[k] = true; else delete C5_OPEN[k];
});
(function () {
  var v = document.getElementById('view'); if (!v || !window.MutationObserver) return;
  var due = false;
  new MutationObserver(function () {
    if (due) return; due = true;
    setTimeout(function () { due = false; try { c5Help(); } catch (e) {} }, 30);
  }).observe(v, { childList: true, subtree: true });
})();

// ---- 3. phone: the menu's groups fold; the one in use stays open
var C5_NAV = (function () { try { return JSON.parse(localStorage.getItem('cz_nav_open') || '{}'); } catch (e) { return {}; } })();
function c5Nav() {
  var nav = document.getElementById('nav'); if (!nav) return;
  var phone = window.matchMedia && window.matchMedia('(max-width:640px)').matches;
  var kids = nav.children, grp = null, groups = [];
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k.classList.contains('navgrp')) { grp = { head: k, name: k.textContent.trim(), items: [], current: false }; groups.push(grp); }
    else if (grp && k.tagName === 'BUTTON') { grp.items.push(k); if (k.getAttribute('aria-selected') === 'true') grp.current = true; }
  }
  groups.forEach(function (g) {
    var open = !phone || g.current || C5_NAV[g.name] === true || (C5_NAV[g.name] === undefined && /^(overview|sell)$/i.test(g.name));
    g.head.classList.toggle('c5shut', !open);
    g.items.forEach(function (b) { b.classList.toggle('c5hide', !open); });
  });
}
document.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('#nav .navgrp') : null;
  if (t) {
    if (!(window.matchMedia && window.matchMedia('(max-width:640px)').matches)) return;
    var name = t.textContent.trim();
    C5_NAV[name] = t.classList.contains('c5shut');
    try { localStorage.setItem('cz_nav_open', JSON.stringify(C5_NAV)); } catch (e) {}
    // the group in use cannot hide its own current screen; everything else follows the tap
    c5Nav();
    if (!C5_NAV[name]) { t.classList.add('c5shut'); var n = t.nextElementSibling; while (n && !n.classList.contains('navgrp')) { if (n.getAttribute('aria-selected') !== 'true') n.classList.add('c5hide'); n = n.nextElementSibling; } }
    return;
  }
  if (ev.target && ev.target.closest && ev.target.closest('#nav button[data-view]')) setTimeout(c5Nav, 0);
});
window.addEventListener('resize', function () { try { c5Nav(); } catch (e) {} });
window.addEventListener('hashchange', function () { setTimeout(c5Nav, 0); });
setTimeout(c5Nav, 0); setTimeout(c5Nav, 1500);
</script>
</body>
