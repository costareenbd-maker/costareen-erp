<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#00565A">
<title>Benndar Express</title>
<meta name="application-name" content="Benndar Express">
<meta name="apple-mobile-web-app-title" content="Benndar Express">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ship-8 (handlers/shipportal.js portalAct): the traveller's own page, one permanent link, no login, works offline
   (sw.js keeps the page; the last answer and the QR picture stay on the phone). Owner's rules: without our bag only his
   own details + "I can take luggage"; while he holds our bags: who receives, where to meet, how to exit, flight, bags,
   his QR. Benndar brand: teal / cream / coral; Comfortaa only for the brand words. */
@font-face{font-family:"Noto Sans Bengali";src:url(../fonts/NotoSansBengali-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Noto Sans Bengali";src:url(../fonts/NotoSansBengali-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Comfortaa";src:url(../fonts/Comfortaa-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Inter";src:url(../fonts/Inter-latin-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--teal:#00565A;--coral:#FF746B;--coral-ink:#A8322A;--bg:#F3EDE4;--card:#FFFFFF;--ink:#0E1E1F;--ink-2:#33423F;--ink-3:#4A5859;--line:#E2D9CB;--soft:#EFE8DD;
  --ok:#166534;--okbg:#E5F3EA;--warn:#6B4300;--warnbg:#FFF1D6;--bad:#9B1C1C;--focus:#00565A;--shadow:0 1px 2px rgba(14,30,31,.06),0 10px 28px -18px rgba(14,30,31,.32)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1E1F;--card:#152A2B;--line:#26403F;--soft:#1B3334;--ink:#F3EDE4;--ink-2:#D6CEC2;--ink-3:#B4AB9F;--teal:#0F777C;--coral-ink:#FF9A92;
  --ok:#5FD08A;--okbg:#163225;--warn:#F6C66A;--warnbg:#3A2C0F;--bad:#FF8A80;--focus:#FF746B;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Bengali",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
::selection{background:var(--coral);color:#0E1E1F}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num,.code{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{background:var(--teal);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 56px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:24px solid rgba(255,116,107,.22);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;position:relative;z-index:1}
.brand img{width:38px;height:38px;border-radius:11px;background:#F3EDE4;padding:4px;object-fit:contain}
.brand b{font-family:Comfortaa,Inter,sans-serif;font-size:18px}
.hi{max-width:560px;margin:18px auto 0;position:relative;z-index:1}
.hi h1{margin:0;font-size:23px;line-height:1.35;overflow-wrap:anywhere}
.hi p{margin:4px 0 0;font-size:16px;opacity:.92}
main{max-width:560px;margin:-36px auto 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
section{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
section>h2{font-size:17px;margin:0;padding:18px 18px 6px;line-height:1.4}
.pad{padding:0 18px 18px}
.lead{margin:0 0 12px;color:var(--ink-3);font-size:15px}
.row{border-top:1px solid var(--line);padding:14px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;width:100%}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pri{background:var(--teal);color:#fff}.sec{background:var(--soft);color:var(--ink)}
.ok{background:var(--ok);color:#fff}@media (prefers-color-scheme:dark){.ok{color:#0E1E1F}}
.line{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin:0 0 14px}.fld label,.lbl{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
.in{width:100%;max-width:100%;min-width:0;min-height:50px;border-radius:12px;border:1px solid #C9BFB0;background:var(--card);padding:10px 14px;font-size:16px}
@media (prefers-color-scheme:dark){.in{border-color:#3A5655}}
.in:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--soft);font-weight:700;font-size:15px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--teal);color:#fff}
.stp{display:flex;align-items:center;gap:10px}.stp button{width:48px;height:48px;border-radius:12px;border:0;background:var(--soft);font-size:22px;font-weight:700;cursor:pointer}
.stp output{min-width:34px;text-align:center;font:700 19px Inter,sans-serif}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;min-height:44px}
.chk input{width:24px;height:24px;accent-color:var(--teal);flex:none;margin:1px 0 0}
.me{display:flex;gap:14px;align-items:center;padding:4px 18px 14px}
.me .face,.person .face{width:72px;height:72px;border-radius:18px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--teal);flex:none}
.me>div{min-width:0}.me b{display:block;font-size:19px;overflow-wrap:anywhere}.me span{display:block;color:var(--ink-3);font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;padding:0 18px 14px;margin:0}.kv dt{color:var(--ink-3)}.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.req{display:grid;gap:4px;font-size:15px}.req .hd{display:flex;justify-content:space-between;gap:10px;align-items:center}.req .hd b{font-size:16px}
.req .ln{color:var(--ink-2)}.req .why{color:var(--ink-3);font-size:14px}
.wab{display:inline-block;margin-left:6px;font:700 12.5px Inter,sans-serif;color:var(--ok);background:var(--okbg);border-radius:999px;padding:1px 8px;vertical-align:2px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 18px 4px}
.steps3 div{font-size:14px;text-align:center;color:var(--ink-3)}.steps3 i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps3 .on i{background:var(--teal)}.steps3 .on{color:var(--ink);font-weight:700}
.hroute{display:flex;align-items:center;gap:10px;font:800 24px Inter,sans-serif;padding:2px 18px}.hroute span{color:var(--coral-ink);font-size:20px}
.hist{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 18px;cursor:pointer;min-height:56px}
.hist b{font-size:15.5px}.hist small{grid-column:1;color:var(--ink-3);font-size:14px}.hist:hover{background:var(--soft)}
.chip{font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.c-new{background:var(--warnbg);color:var(--warn)}.c-talked{background:#E6EFF8;color:#1E4E79}.c-made{background:var(--okbg);color:var(--ok)}.c-done{background:var(--soft);color:var(--ink-2)}.c-no{background:var(--soft);color:var(--ink-3)}
@media (prefers-color-scheme:dark){.c-talked{background:#16304A;color:#9CC7F0}}
.ret{background:#E6EFF8;border-radius:16px;padding:14px;margin:0 18px 14px}.ret b{color:#1E4E79;display:block}.ret p{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
@media (prefers-color-scheme:dark){.ret{background:#16304A}.ret b{color:#9CC7F0}}
.file{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}.file:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.file svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.hint{font-size:14px;color:var(--ink-3);background:var(--soft);border-radius:12px;padding:10px 12px;margin:-4px 0 14px}
.fld small{font-weight:400;color:var(--ink-3)}
details.em{border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 14px}details.em summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.em[open]{padding-bottom:6px}
.pill{font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--warnbg);color:var(--warn)}.pill.done{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--soft);color:var(--ink-3)}
.note{border-radius:14px;padding:12px 14px;font-size:15px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.ok{background:var(--okbg);color:var(--ok)}.note.bad{background:var(--soft);color:var(--bad)}
.note>svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.note .btn{width:auto;min-height:40px;padding:0 12px;margin-left:auto;flex:none}
/* holding our bags */
.person{display:grid;grid-template-columns:88px 1fr;gap:12px 14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.person .face{width:88px;height:88px}
.person>div{min-width:0}.person h3{margin:0;font-size:20px;line-height:1.25;overflow-wrap:anywhere}.person .role{margin:2px 0 0;color:var(--ink-3);font-size:15px}
.person .ph{margin:4px 0 0;font-size:16px;color:var(--ink-2);overflow-wrap:anywhere}
.acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meet{margin:0 18px 16px;padding:12px 14px;border-radius:14px;background:var(--okbg);color:var(--ink)}
.meet b{display:block;color:var(--ok);font-size:17px}
.steps{list-style:none;margin:0;padding:0 18px 12px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:7px 0;font-size:16px;align-items:flex-start}
.steps li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font:700 14px Inter,sans-serif;display:grid;place-items:center;flex:none;margin-top:1px}
.gph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 18px 16px}.gph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--soft)}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 18px 10px}
.route b{display:block;font:800 28px/1.1 Inter,sans-serif;letter-spacing:.02em}.route span{color:var(--ink-3);font-size:15px}.route>div:last-child{text-align:right}
.route svg{width:26px;height:26px;stroke:var(--coral-ink);fill:none;stroke-width:1.8;stroke-linejoin:round}
.times{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.times>div{padding:12px 18px}.times>div+div{border-left:1px solid var(--line);text-align:right}
.times small{display:block;color:var(--ink-3);font-size:14px}.times b{font-size:16px}
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 18px 14px}
.bag img,.bag .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--ink-3);font-size:15px}
.bag b{display:block;font-size:16px;margin-top:6px;overflow-wrap:anywhere}.bag .code{font-weight:700;font-size:15px;color:var(--teal)}
@media (prefers-color-scheme:dark){.bag .code{color:#8FD6DA}}
.kw{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:4px 18px 18px}
.qr{width:148px;height:148px;background:#fff;border-radius:14px;padding:9px;display:grid;place-items:center;color:#0E1E1F;font:800 22px Inter,sans-serif}
.qr svg{width:100%;height:100%;display:block}
.kw .code{display:block;font-size:32px;font-weight:800;line-height:1.1}.kw p{margin:6px 0 0;color:var(--ink-3);font-size:15px}
@media (max-width:360px){.kw{grid-template-columns:1fr;justify-items:center;text-align:center}.person{grid-template-columns:72px 1fr}.person .face{width:72px;height:72px}}
.foot{max-width:560px;margin:0 auto;padding:0 20px 26px;color:var(--ink-3);font-size:14px;text-align:center}
.skel{height:170px;border-radius:22px;background:linear-gradient(90deg,var(--card),var(--soft),var(--card));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.photo{display:flex;gap:12px;align-items:center}
.photo label{width:76px;height:76px;border-radius:18px;background:var(--soft);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;flex:none;color:var(--ink-3)}
.photo label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.photo img{width:100%;height:100%;object-fit:cover}.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8}
.err{color:var(--bad);font-weight:700;font-size:15px;margin:0 0 10px;min-height:0}
.link{background:none;border:0;color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0;min-height:44px}
@media (prefers-color-scheme:dark){.link{color:#8FD6DA}}
</style>
</head>
