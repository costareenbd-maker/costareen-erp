<meta name="description" content="Help me choose: point the camera at a thing and get the closest filament colours in stock; which filament for your job; which printer for your budget.">
<title>Help me choose</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
/* Stage N5b (docs/NETWORK-BLUEPRINT.md section 4.1): the Colour Finder (camera, photo or a picked colour -> the
   three closest filament colours shops have, "very close / close / roughly", in stock or not) and the filament and
   printer pickers. Live stock comes from the Find stock listings (?pub=find). No sign-in. */

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Hind Siliguri",sans-serif}
body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
main{max-width:680px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
header h1{font-size:22px;margin:0}header h1 small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tabs button{font-size:14px;padding:7px 12px;border-radius:999px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
button{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button:disabled{opacity:.6;cursor:default}
select,input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--mute)}.err{color:var(--bad);font-size:14px;margin-top:8px}
.sw{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);flex:0 0 auto}
.res{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.res b{font-size:16px}.res .m{font-size:13px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-mute{background:#eef1ee;color:var(--mute)}.b-in{background:var(--okbg);color:var(--ok)}.b-low{background:var(--warnbg);color:var(--warn)}
.shoprow{font-size:14px;padding:4px 0}.shoprow a{color:var(--acc)}
.cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;background:#000}
.cam .box{position:absolute;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.5);pointer-events:none}
.cam .box span{position:absolute;left:0;right:0;bottom:-26px;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px #000}
.cam .bar{display:flex;gap:8px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#111}
.cam .bar button{background:#222;color:#fff;border-color:#444}.cam .bar button.pri{background:var(--acc);border-color:var(--acc)}
canvas#pc{max-width:100%;border-radius:10px;border:1px solid var(--line);touch-action:manipulation;cursor:crosshair}
.pick{display:flex;gap:10px;align-items:center}.pick input[type=color]{width:60px;height:44px;padding:2px}
.q{margin-top:8px}
.rec h2{font-size:19px;margin:0 0 4px}.rec p{margin:4px 0}
footer{font-size:13px;color:var(--mute);text-align:center;margin-top:22px}footer a{color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
