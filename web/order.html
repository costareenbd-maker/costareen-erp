<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your order</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
/* The Inbox's order page (handlers/inboxpub.js orderPage): opened from the link the shop sends in the chat.
   The token in the address is the only key; the page shows that one order - its status, the bill, Track. */
@font-face{font-family:"Noto Sans Bengali";src:url(fonts/NotoSansBengali-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Noto Sans Bengali";src:url(fonts/NotoSansBengali-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--bg:#f5f6fa;--card:#fff;--ink:#14172a;--mute:#5f6476;--line:#e3e5ee;--acc:#5b5bd6;--accbg:#eeeefc;--ok:#1d8a5c;--okbg:#e5f5ed;--bad:#c2332d;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#171a23;--ink:#eef0f6;--mute:#9aa0b2;--line:#2a2f3c;--acc:#8b8cf2;--accbg:#22233c;--ok:#4cc38a;--okbg:#14291f;--bad:#f2706a;--badbg:#341a19}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:19px;margin:0}.top .c{font-size:13px;color:var(--mute)}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.no{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.no b{font-size:20px}.no span{color:var(--mute);font-size:13px}
.state{display:inline-block;margin-top:8px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--accbg);color:var(--acc)}
.state.done{background:var(--okbg);color:var(--ok)}.state.bad{background:var(--badbg);color:var(--bad)}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.steps li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:0 0 14px;color:var(--mute);font-size:15px}
.steps li:last-child{padding-bottom:0}
.steps li i{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);position:relative;z-index:1;margin-top:2px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.steps li.on{color:var(--ink);font-weight:600}.steps li.on i{border-color:var(--acc);background:var(--acc)}
.steps li.on:not(:last-child)::before{background:var(--acc)}
.items{margin:0;padding:0;list-style:none}.items li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.items li span{color:var(--mute);font-size:13px;display:block}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;color:var(--mute)}.tot.big{font-size:19px;color:var(--ink);font-weight:700}
.who{font-size:14px;color:var(--mute)}.who b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
a.btn{font:inherit;font-size:15px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600}
a.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.bill img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.msg{text-align:center;color:var(--mute);padding:40px 10px}
</style>
</head>
<body>
<main id="m"><p class="msg">…</p></main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var API = (q.get('api') || 'https://oqzcuuytytqadqjlwdsh.supabase.co/functions/v1/erp').replace(/\/+$/, '');
  var tok = q.get('o') || '';
  var L = null, D = null;
  try { L = localStorage.getItem('orderLang'); } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tk(n) { return '৳' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }
  var T = {
    bn: { lang: 'English', order: 'অর্ডার', items: 'যা অর্ডার করেছেন', sub: 'পণ্য', del: 'ডেলিভারি', total: 'মোট (ক্যাশ অন ডেলিভারি)', to: 'যেখানে যাবে', track: 'কুরিয়ারে ট্র্যাক করুন', call: 'কল করুন', bill: 'বিল', none: 'এই পেজটি পাওয়া যাচ্ছে না।' },
    en: { lang: 'বাংলা', order: 'Order', items: 'What you ordered', sub: 'Products', del: 'Delivery', total: 'Total (cash on delivery)', to: 'Delivering to', track: 'Track with the courier', call: 'Call us', bill: 'Bill', none: 'This page is not available.' } };
  function paint() {
    var m = document.getElementById('m');
    if (!D) return;
    var lg = L || D.lang || 'bn', t = T[lg], W = D.words[lg], o = D.order;
    document.documentElement.lang = lg;
    var cls = o.stage === 'delivered' ? ' done' : (o.stage === 'cancelled' || o.stage === 'failed') ? ' bad' : '';
    var at = o.steps.indexOf(o.stage);
    var h = '<div class="top"><div><h1>' + esc(D.shop.name) + '</h1>' + (D.shop.hours ? '<div class="c">' + esc(D.shop.hours) + '</div>' : '') + '</div><button class="lang" id="lg" type="button">' + t.lang + '</button></div>';
    h += '<div class="card"><div class="no"><b>' + t.order + ' ' + esc(o.no) + '</b><span>' + esc(o.date) + '</span></div><span class="state' + cls + '">' + esc(W[o.stage] || o.stage) + '</span>' +
      (o.steps.length ? '<ol class="steps">' + o.steps.map(function (s, i) { return '<li class="' + (i <= at ? 'on' : '') + '"><i></i>' + esc(W[s]) + '</li>'; }).join('') + '</ol>' : '') +
      (o.track || D.shop.phone ? '<div class="acts" style="margin-top:14px">' + (o.track ? '<a class="btn pri" href="' + esc(o.track) + '" target="_blank" rel="noopener">📦 ' + t.track + '</a>' : '') + (D.shop.phone ? '<a class="btn" href="tel:' + esc(D.shop.phone) + '">📞 ' + t.call + '</a>' : '') + '</div>' : '') + '</div>';
    var sub = o.items.reduce(function (s, x) { return s + x.qty * x.price; }, 0);
    h += '<div class="card"><b>' + t.items + '</b><ul class="items">' + o.items.map(function (x) { return '<li><div>' + esc(x.name) + '<span>' + x.qty + ' × ' + tk(x.price) + '</span></div><b>' + tk(x.qty * x.price) + '</b></li>'; }).join('') + '</ul>' +
      '<div class="tot"><span>' + t.sub + '</span><span>' + tk(sub) + '</span></div><div class="tot"><span>' + t.del + '</span><span>' + tk(o.delivery) + '</span></div><div class="tot big"><span>' + t.total + '</span><span>' + tk(o.total) + '</span></div></div>';
    h += '<div class="card who">' + t.to + ':<br><b>' + esc(o.name) + '</b> · ' + esc(o.phone) + '<br>' + esc(o.address) + '</div>';
    if (o.bill) h += '<div class="card bill"><b>' + t.bill + '</b><a href="' + esc(o.bill) + '" target="_blank" rel="noopener"><img src="' + esc(o.bill) + '" alt="' + t.bill + '" loading="lazy" style="margin-top:8px"></a></div>';
    m.innerHTML = h;
    document.getElementById('lg').onclick = function () { L = (L || D.lang || 'bn') === 'bn' ? 'en' : 'bn'; try { localStorage.setItem('orderLang', L); } catch (e) {} paint(); };
  }
  fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'inbox=order&o=' + encodeURIComponent(tok)).then(function (r) { return r.json(); }).then(function (r) {
    if (!r || !r.ok) { document.getElementById('m').innerHTML = '<p class="msg">' + T[L || 'bn'].none + '</p>'; return; }
    D = r; document.title = r.shop.name + ' — ' + r.order.no; paint();
  }).catch(function () { document.getElementById('m').innerHTML = '<p class="msg">' + T[L || 'bn'].none + '</p>'; });
})();
</script>
</body>
</html>
