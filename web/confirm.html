<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Confirm a sale</title>
<link rel="icon" href="icons/favicon-32.png">
<style>
/* Stage N2: a customer asks the seller to confirm a sale on the Printer Passport register. The seller answers from a
   phone in two minutes: shop name, number, city - a Lite record - then Confirm, Correct or Not ours. */
:root{--bg:#f6f7f4;--card:#fff;--ink:#14201c;--mute:#5d6b66;--line:#dfe5e1;--ok:#0f766e;--okbg:#e6f4f1;--warn:#9a5b00;--warnbg:#fff4df;--bad:#b42318;--badbg:#fdecea;--acc:#0f766e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Hind Siliguri",sans-serif}
body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
header h1{font-size:20px;margin:0}header h1 small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.state{color:var(--mute);margin:0}
h2{font-size:17px;margin:0 0 8px}
dl{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:8px 12px;margin:0;font-size:15px}dt{color:var(--mute)}dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photos a{display:block;width:96px;height:96px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eee}.photos img{width:100%;height:100%;object-fit:cover}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:12px 0 0}.chk input{width:auto;margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:15px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.bad{color:var(--bad)}button:disabled{opacity:.6;cursor:default}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
code{font-size:13px;word-break:break-all}
footer{font-size:13px;color:var(--mute);text-align:center;margin-top:22px}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="fd-public.css">
</head>
<body>
<main>
  <header><h1><span data-t="title">Printer Passport</span><small data-t="sub">A customer asks you to confirm a sale</small></h1><button class="lang" id="lang" type="button">বাংলা</button></header>
  <div id="out"><div class="card"><p class="state" data-t="loading">Loading…</p></div></div>
  <footer data-t="foot">A public warranty register. Confirming is free and takes two minutes. It cannot force anyone to honour a promise; it keeps the promise and the proof in one place.</footer>
</main>
<script>
var API = (new URLSearchParams(location.search).get('api') || 'https://oqzcuuytytqadqjlwdsh.supabase.co/functions/v1/erp').replace(/\/+$/, '');
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var T = {
  en: { title: 'Printer Passport', sub: 'A customer asks you to confirm a sale', loading: 'Loading…', foot: 'A public warranty register. Confirming is free and takes two minutes. It cannot force anyone to honour a promise; it keeps the promise and the proof in one place.',
    nolink: 'This link is not complete. Ask your customer to send it again.', net: 'The page could not be loaded. Check your connection and try again.',
    claim: 'The customer says', product: 'Printer', serial: 'Serial', month: 'Bought', warranty: 'Warranty promised', months: 'months', none: 'none', buyer: 'Customer', photos: 'Photos the customer added', you: 'Named seller',
    already: 'Already answered', answered: { confirmed: 'Confirmed', corrected: 'Confirmed with corrections', rejected: 'Not ours' }, again: 'You can answer again below; the latest answer counts.',
    shop: 'Your shop', shopName: 'Shop name', shopPhone: 'Shop mobile number', city: 'City or area', email: 'E-mail (optional)', show: 'Show my shop’s name on the register (otherwise it shows “Supplier · city”)',
    correctH: 'Correct the details', cMonth: 'Month of sale', cMonths: 'Warranty in months',
    yes: 'Yes, we sold it', yesFix: 'Yes, but correct the details', no: 'No, not ours', sending: 'Sending…',
    doneOk: 'Thank you. The passport is green now: confirmed by', doneNo: 'Recorded. The customer will see that you do not recognise this sale.',
    lite: 'Your own page', liteBody: 'Every unit you confirm gets a digital warranty card there. Save this link - it is your only way in:', copy: 'Copy link', copied: 'Copied', open: 'Open my page',
    why: 'Why confirm? Fewer arguments later, a free digital warranty card for your customer, and a “confirmed seller” mark on the register.' },
  bn: { title: 'প্রিন্টার পাসপোর্ট', sub: 'একজন ক্রেতা বিক্রি নিশ্চিত করতে অনুরোধ করেছেন', loading: 'লোড হচ্ছে…', foot: 'একটি পাবলিক ওয়ারেন্টি রেজিস্টার। নিশ্চিত করা ফ্রি, দুই মিনিট লাগে। এটি কাউকে প্রতিশ্রুতি মানতে বাধ্য করতে পারে না; প্রতিশ্রুতি ও প্রমাণ এক জায়গায় রাখে।',
    nolink: 'লিংকটি সম্পূর্ণ নয়। ক্রেতাকে আবার পাঠাতে বলুন।', net: 'পেজ লোড হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।',
    claim: 'ক্রেতার বক্তব্য', product: 'প্রিন্টার', serial: 'সিরিয়াল', month: 'কেনার মাস', warranty: 'প্রতিশ্রুত ওয়ারেন্টি', months: 'মাস', none: 'নেই', buyer: 'ক্রেতা', photos: 'ক্রেতার দেওয়া ছবি', you: 'উল্লেখিত বিক্রেতা',
    already: 'আগেই উত্তর দেওয়া হয়েছে', answered: { confirmed: 'নিশ্চিত', corrected: 'সংশোধনসহ নিশ্চিত', rejected: 'আমাদের নয়' }, again: 'নিচে আবার উত্তর দিতে পারেন; শেষ উত্তরটিই গণ্য হবে।',
    shop: 'আপনার দোকান', shopName: 'দোকানের নাম', shopPhone: 'দোকানের মোবাইল নম্বর', city: 'শহর বা এলাকা', email: 'ই-মেইল (ঐচ্ছিক)', show: 'রেজিস্টারে দোকানের নাম দেখান (না হলে “Supplier · শহর” দেখাবে)',
    correctH: 'তথ্য সংশোধন', cMonth: 'বিক্রির মাস', cMonths: 'ওয়ারেন্টি (মাস)',
    yes: 'হ্যাঁ, আমরা বিক্রি করেছি', yesFix: 'হ্যাঁ, তবে তথ্য সংশোধন করুন', no: 'না, আমাদের নয়', sending: 'পাঠানো হচ্ছে…',
    doneOk: 'ধন্যবাদ। পাসপোর্ট এখন সবুজ: নিশ্চিত করেছে', doneNo: 'লিপিবদ্ধ হয়েছে। ক্রেতা দেখবেন যে আপনি এই বিক্রি চেনেন না।',
    lite: 'আপনার নিজের পেজ', liteBody: 'আপনি যে ইউনিট নিশ্চিত করবেন, তার ডিজিটাল ওয়ারেন্টি কার্ড সেখানে পাবেন। লিংকটি সংরক্ষণ করুন - এটিই আপনার একমাত্র প্রবেশপথ:', copy: 'লিংক কপি', copied: 'কপি হয়েছে', open: 'আমার পেজ খুলুন',
    why: 'কেন নিশ্চিত করবেন? পরে তর্ক কম, ক্রেতার জন্য ফ্রি ডিজিটাল ওয়ারেন্টি কার্ড, আর রেজিস্টারে “নিশ্চিত বিক্রেতা” চিহ্ন।' }
};
var LANG = 'en'; try { LANG = localStorage.getItem('pp_lang') || ((navigator.language || '').indexOf('bn') === 0 ? 'bn' : 'en'); } catch (e) {}
function t(k) { return (T[LANG] || T.en)[k] || T.en[k] || k; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var DATA = null, DONE = null, out = document.getElementById('out');
function paintLang() { document.documentElement.lang = LANG; document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = t(n.getAttribute('data-t')); }); document.getElementById('lang').textContent = LANG === 'bn' ? 'English' : 'বাংলা'; if (DONE) showDone(DONE); else if (DATA) show(DATA); }
document.getElementById('lang').onclick = function () { LANG = LANG === 'bn' ? 'en' : 'bn'; try { localStorage.setItem('pp_lang', LANG); } catch (e) {} paintLang(); };
function val(id) { var n = document.getElementById(id); return n ? n.value : ''; }
function show(r) {
  DATA = r;
  if (!r.ok) { out.innerHTML = '<div class="card"><p class="state">' + esc(r.error || t('net')) + '</p></div>'; return; }
  var keep = { name: val('s_name'), phone: val('s_phone'), city: val('s_city'), email: val('s_email') };
  var h = '<div class="card"><h2>' + t('claim') + '</h2><dl><dt>' + t('product') + '</dt><dd>' + esc(r.product) + (r.brand ? ' <span style="font-weight:400;color:var(--mute)">' + esc(r.brand) + '</span>' : '') + '</dd>' +
    '<dt>' + t('serial') + '</dt><dd>' + esc(r.serial) + '</dd><dt>' + t('month') + '</dt><dd>' + esc(r.boughtMonth) + '</dd><dt>' + t('warranty') + '</dt><dd>' + (r.warrantyMonths ? r.warrantyMonths + ' ' + t('months') : t('none')) + '</dd>' +
    '<dt>' + t('buyer') + '</dt><dd>' + esc(r.buyer.name) + ' <span style="font-weight:400;color:var(--mute)">' + esc(r.buyer.phoneTail) + '</span></dd><dt>' + t('you') + '</dt><dd>' + esc(r.sellerClaim.name) + (r.sellerClaim.city ? ' · ' + esc(r.sellerClaim.city) : '') + '</dd></dl>' +
    (r.proofs.length ? '<div style="font-size:14px;color:var(--mute);margin-top:12px">' + t('photos') + '</div><div class="photos">' + r.proofs.map(function (p) { return p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"><img src="' + esc(p.url) + '" alt="' + esc(p.kind) + '"></a>' : ''; }).join('') + '</div>' : '') +
    (r.answer ? '<p style="margin:12px 0 0"><span class="badge ' + (r.answer === 'rejected' ? 'b-bad' : 'b-ok') + '">' + t('already') + ': ' + (T[LANG].answered[r.answer] || r.answer) + (r.lite ? ' · ' + esc(r.lite.name) : '') + '</span><br><span class="hint">' + t('again') + '</span></p>' : '') + '</div>';
  h += '<form class="card" id="f"><h2>' + t('shop') + '</h2><p class="hint" style="margin:0 0 4px">' + t('why') + '</p>' +
    '<label for="s_name">' + t('shopName') + '</label><input id="s_name" maxlength="80" value="' + esc(keep.name || (r.lite ? r.lite.name : r.sellerClaim.name)) + '" required>' +
    '<label for="s_phone">' + t('shopPhone') + '</label><input id="s_phone" inputmode="tel" placeholder="01XXXXXXXXX" maxlength="20" value="' + esc(keep.phone) + '" required>' +
    '<label for="s_city">' + t('city') + '</label><input id="s_city" maxlength="40" value="' + esc(keep.city || (r.lite ? r.lite.city : r.sellerClaim.city)) + '">' +
    '<label for="s_email">' + t('email') + '</label><input id="s_email" type="email" maxlength="80" value="' + esc(keep.email) + '">' +
    '<label class="chk"><input type="checkbox" id="s_show" checked> <span>' + t('show') + '</span></label>' +
    '<div id="fix" hidden><h2 style="margin-top:14px">' + t('correctH') + '</h2><label for="c_month">' + t('cMonth') + '</label><input id="c_month" type="month" value="' + esc(r.boughtMonth) + '"><label for="c_months">' + t('cMonths') + '</label><input id="c_months" inputmode="numeric" value="' + (r.warrantyMonths || 0) + '"></div>' +
    '<div class="row"><button type="button" class="pri" data-a="confirm">' + t('yes') + '</button><button type="button" data-a="correct">' + t('yesFix') + '</button><button type="button" class="bad" data-a="reject">' + t('no') + '</button></div><div class="err" id="err"></div></form>';
  out.innerHTML = h;
}
function showDone(r) {
  DONE = r;
  var h = '<div class="card">' + (r.answer === 'rejected' ? '<span class="badge b-warn">' + t('answered').rejected + '</span><p>' + t('doneNo') + '</p>' : '<span class="badge b-ok">' + (T[LANG].answered[r.answer] || r.answer) + '</span><p>' + t('doneOk') + ' <b>' + esc(r.shop.name) + '</b>.</p>') + '</div>';
  h += '<div class="card"><h2>' + t('lite') + '</h2><p class="hint" style="margin:0 0 8px">' + t('liteBody') + '</p><code id="lurl">' + esc(r.liteUrl) + '</code><div class="row"><button type="button" id="copy">' + t('copy') + '</button><a href="' + esc(r.liteUrl) + '"><button type="button" class="pri">' + t('open') + '</button></a></div></div>';
  out.innerHTML = h;
  document.getElementById('copy').onclick = function () { var b = this; try { navigator.clipboard.writeText(r.liteUrl).then(function () { b.textContent = t('copied'); }); } catch (e) { var s = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById('lurl')); s.removeAllRanges(); s.addRange(rg); } };
}
out.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-a]'); if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'correct' && document.getElementById('fix').hidden) { document.getElementById('fix').hidden = false; document.getElementById('c_month').focus(); return; }
  var body = { t: TOKEN, answer: a, shop: { name: val('s_name'), phone: val('s_phone'), city: val('s_city'), email: val('s_email'), showName: document.getElementById('s_show').checked } };
  if (a === 'correct') { body.boughtMonth = val('c_month'); body.warrantyMonths = val('c_months'); }
  var btns = out.querySelectorAll('button'); btns.forEach(function (x) { x.disabled = true; }); b.textContent = t('sending'); document.getElementById('err').textContent = '';
  fetch(API + '?pub=confirm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r.ok) { btns.forEach(function (x) { x.disabled = false; }); show(DATA); document.getElementById('err').textContent = r.error || t('net'); return; }
    showDone(r); window.scrollTo(0, 0);
  }, function () { btns.forEach(function (x) { x.disabled = false; }); show(DATA); document.getElementById('err').textContent = t('net'); });
});
paintLang();
if (!/^[A-Za-z0-9_-]{16,32}$/.test(TOKEN)) show({ ok: false, error: t('nolink') });
else fetch(API + '?pub=confirm&t=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(show, function () { show({ ok: false, error: t('net') }); });
</script>
</body>
</html>
