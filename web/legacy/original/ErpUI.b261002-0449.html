/** yyyy-MM, moved by a number of months. */
function shiftMonth(m, by) {
  var y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) + by;
  while (mo < 1) { mo += 12; y--; }
  while (mo > 12) { mo -= 12; y++; }
  return y + '-' + (mo < 10 ? '0' + mo : '' + mo);
}

function loadExpenses() {
  srv('erpExpenses', [{ month: EXP_MONTH }], function (e) {
    EXP = e; EXP_ERR = null; EXP_MONTH = e.month;
    if (VIEW === 'expenses') repaint();
  }, function (x) {
    EXP_ERR = (x && x.message) ? x.message : String(x);
    if (VIEW === 'expenses') repaint();
  });
}

function wireExpenses() {
  function reload() { EXP = null; repaint(); loadExpenses(); }
  function bad(x) { toast(esc(x && x.message ? x.message : x), true, 12000); }
  // every save answers with the month as it now stands, read back from the
  // sheet - so what is shown is what was really kept
  function show(msg) {
    return function (e) {
      EXP = e; EXP_ERR = null; EXP_MONTH = e.month; D = null;
      if (msg) toast(msg, false, 8000);
      if (VIEW === 'expenses') repaint();
    };
  }
  function each(sel, fn) {
    var n = el('view').querySelectorAll(sel);
    for (var i = 0; i < n.length; i++) n[i].addEventListener('click', fn);
  }

  var pv = el('ex_prev'), nx = el('ex_next');
  if (pv) pv.addEventListener('click', function () { EXP_MONTH = shiftMonth(EXP.month, -1); reload(); });
  if (nx) nx.addEventListener('click', function () { EXP_MONTH = shiftMonth(EXP.month, 1); reload(); });

  var add = el('ex_add');
  if (add) add.addEventListener('click', function () {
    var amt = num(el('ex_amt').value), what = (el('ex_what').value || '').trim();
    if (!what) { toast('Say what it was for.', true); return; }
    if (!(amt > 0)) { toast('Enter an amount.', true); return; }
    add.disabled = true; add.textContent = 'Saving…';
    srv('erpExpenseAdd', [{ month: EXP.month, category: el('ex_cat').value,
                            description: what, amount: amt }], show('Recorded.'),
        function (x) { add.disabled = false; add.textContent = 'Add'; bad(x); });
  });

  var fx = el('fx_add');
  if (fx) fx.addEventListener('click', function () {
    var nm = (el('fx_name').value || '').trim(), amt = num(el('fx_amt').value);
    if (!nm) { toast('Give it a name.', true); return; }
    if (!(amt > 0)) { toast('Enter the monthly amount.', true); return; }
    fx.disabled = true; fx.textContent = 'Saving…';
    srv('erpExpenseItemSave', [{ kind: 'fixed', name: nm, category: el('fx_cat').value,
                                 amount: amt, fromMonth: EXP.month, viewMonth: EXP.month }],
        show('Added. It will be recorded every month from ' + esc(EXP.label) + '.'),
        function (x) { fx.disabled = false; fx.textContent = 'Add'; bad(x); });
  });

  var rc = el('rc_add');
  if (rc) rc.addEventListener('click', function () {
    var nm = (el('rc_name').value || '').trim();
    if (!nm) { toast('Give it a name.', true); return; }
    rc.disabled = true; rc.textContent = 'Saving…';
    srv('erpExpenseItemSave', [{ kind: 'recurring', name: nm, category: el('rc_cat').value,
                                 amount: el('rc_amt') ? num(el('rc_amt').value) : 0,
                                 fromMonth: EXP.month, viewMonth: EXP.month }],
        show('Added. It will be on the list every month - just type that month\'s amount.'),
        function (x) { rc.disabled = false; rc.textContent = 'Add'; bad(x); });
  });

  each('button[data-rcsave]', function () {
    var id = this.getAttribute('data-rcsave'), nm = this.getAttribute('data-itname');
    var box = el('view').querySelector('input[data-rcamt="' + id + '"]');
    var amt = num(box ? box.value : '');
    if (!(amt > 0)) { toast('Type the amount for ' + esc(nm) + '.', true); return; }
    var b = this; b.disabled = true; b.textContent = 'Saving…';
    srv('erpExpenseRecurringSet', [{ itemId: id, amount: amt, month: EXP.month }],
        show(esc(nm) + ': ' + fmt(amt) + ' recorded for ' + esc(EXP.label) + '.'),
        function (x) { b.disabled = false; b.textContent = 'Save'; bad(x); });
  });

  each('button[data-fxchange]', function () {
    var id = this.getAttribute('data-fxchange'), nm = this.getAttribute('data-itname');
    var v = window.prompt('New monthly amount for "' + nm + '".\n\n' +
      'It applies from ' + EXP.label + ' onward. Earlier months keep the old figure.',
      this.getAttribute('data-fxamt'));
    if (v === null) return;
    var amt = num(v);
    if (!(amt > 0)) { toast('That is not an amount.', true); return; }
    srv('erpExpenseItemSave', [{ id: id, kind: 'fixed', name: nm, amount: amt,
                                 fromMonth: EXP.month, viewMonth: EXP.month }],
        show(esc(nm) + ' is ' + fmt(amt) + ' from ' + esc(EXP.label) + '.'), bad);
  });

  each('button[data-fxpay]', function () {
    var id = this.getAttribute('data-fxpay'), nm = this.getAttribute('data-itname'), b = this;
    if (!window.confirm('Mark "' + nm + '" as paid for ' + EXP.label + '?\n\n' + (OPT ? OPT.currency : 'BDT') + ' ' + fmt(num(this.getAttribute('data-fxamt'))) +
      ' goes into the book with the date of today.')) return;
    b.disabled = true; b.textContent = 'Saving…';
    srv('erpExpenseFixedPay', [{ id: id, month: EXP.month }], show(esc(nm) + ' marked as paid.'),
        function (x) { b.disabled = false; b.textContent = 'Paid'; bad(x); });
  });
  each('button[data-fxunpay]', function () {
    var id = this.getAttribute('data-fxunpay'), nm = this.getAttribute('data-itname');
    if (!window.confirm('"' + nm + '" was not paid after all?\n\nIts entry in the book is struck out, and it shows as not paid again.')) return;
    srv('erpExpenseFixedPay', [{ id: id, month: EXP.month, undo: true }], show(esc(nm) + ' is back to not paid.'), bad);
  });

  each('button[data-itend]', function () {
    var id = this.getAttribute('data-itend'), nm = this.getAttribute('data-itname');
    if (!window.confirm('Stop "' + nm + '"?\n\nIt will not appear for ' + EXP.label +
                        ' or after. Earlier months are left as they were.')) return;
    srv('erpExpenseItemEnd', [{ id: id, fromMonth: EXP.month }], show(esc(nm) + ' stopped.'), bad);
  });

  each('button[data-exvoid]', function () {
    var id = this.getAttribute('data-exvoid');
    var why = window.prompt('Why is this entry being struck out?\n\n' +
      'It stays on the page, crossed through, with your reason.', '');
    if (why === null) return;
    if (!why.trim()) { toast('A reason is needed.', true); return; }
    srv('erpExpenseVoid', [{ id: id, reason: why.trim() }], show('Struck out.'), bad);
  });

  var xl = el('ex_xls');
  if (xl) xl.addEventListener('click', function () {
    xl.disabled = true; xl.textContent = 'Building the file…';
    srv('erpExpenseExport', [{ month: EXP.month }], function (r) {
      xl.disabled = false; xl.textContent = 'Download as Excel';
      toast('<a href="https://drive.google.com/uc?export=download&amp;id=' + esc(r.id) +
            '" target="_blank" rel="noopener"><strong>Save ' + esc(r.name) + '</strong></a>' +
            ' · a copy is also kept in Drive', false, 30000);
    }, function (x) { xl.disabled = false; xl.textContent = 'Download as Excel'; bad(x); });
  });
}

/**
 * The profit and loss statement: one column per month, the lines every
 * accountant expects, newest month on the right.
 */
var PNL = null, PNL_ERR = null;

function pnlHtml() {
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section><div class="card"><h2>Profit &amp; loss statement</h2>' +
    '<div class="sub">Calendar months. The current month is so far only.</div>';
  if (PNL_ERR) return h + '<div class="note err"><div class="ico">✕</div><div>' + esc(PNL_ERR) + '</div></div></div></section>';
  if (!PNL) return h + '<div class="loading">Adding up the months&hellip;</div></div></section>';
  var M = PNL.months;
  function row(label, key, opt) {
    opt = opt || {};
    return '<tr' + (opt.strong ? ' style="font-weight:700"' : '') + '><td' + (opt.indent ? ' style="padding-left:22px"' : '') + '>' +
      label + '</td>' + M.map(function (m) {
        var v = typeof key === 'function' ? key(m) : m[key];
        var neg = opt.minus && v ? '(' + fmt(v) + ')' : fmt(v);
        return '<td class="num"' + (opt.color && v < 0 ? ' style="color:var(--critical)"' : '') + '>' +
          (v === null ? '—' : (opt.minus ? neg : fmt(v))) + (opt.pct ? '%' : '') + '</td>';
      }).join('') + '</tr>';
  }
  h += '<div class="scroll"><table><thead><tr><th>' + esc(cur) + '</th>' + M.map(function (m) {
    var p = m.month.split('-');
    return '<th class="num">' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1] +
      ' ' + p[0].slice(2) + (m.current ? '<br><span class="sku">so far</span>' : '') + '</th>';
  }).join('') + '</tr></thead><tbody>' +
    row('Sales, after discounts', 'sales') +
    row('Returns', 'returns', { minus: true, indent: true }) +
    row('Net sales', 'netSales', { strong: true }) +
    row('Cost of goods sold', 'cost', { minus: true, indent: true }) +
    row('Gross profit', 'gross', { strong: true, color: true }) +
    row('Gross margin', 'grossMargin', { pct: true, indent: true }) +
    row('Delivery charged to customers', 'delivery', { indent: true }) +
    (M.some(function (m) { return m.courierExtra; }) ? row('Courier collected more than invoiced', 'courierExtra', { indent: true }) : '') +
    (M.some(function (m) { return m.courierShort; }) ? row('Courier collected less (written off)', 'courierShort', { minus: true, indent: true }) : '') +
    row('Courier: delivery + COD fee', 'courier', { minus: true, indent: true });
  PNL.categories.forEach(function (c) {
    h += row(esc(c), function (m) { return m.byCat[c] || 0; }, { minus: true, indent: true });
  });
  h += row('Total operating expenses', 'expenses', { minus: true }) +
    row('Net profit', 'net', { strong: true, color: true }) +
    row('Net margin', 'netMargin', { pct: true, indent: true }) +
    '</tbody></table></div>' +
    '<div class="sub" style="margin-top:8px">Courier cost is what Steadfast kept from its payouts, in the month it paid out.' +
    (M.some(function (m) { return m.uncosted; })
      ? '<br>Some sales have no cost price, so their goods count as free: ' +
        M.map(function (m) { return fmt(m.uncosted); }).join(' · ') + '. Fill them in on Product cost.' : '') +
    '</div></div></section>';
  return h;
}

function loadPnl() {
  srv('erpPnl', [{ months: 6 }], function (r) { PNL = r; PNL_ERR = null; if (VIEW === 'profit') repaint(); },
      function (e) { PNL_ERR = (e && e.message) ? e.message : String(e); if (VIEW === 'profit') repaint(); });
}

function viewProfit() {
  var cur = OPT ? OPT.currency : 'BDT';
  var h = pnlHtml() + '<section>';

  h += '<div class="row" style="align-items:center;gap:8px;margin-bottom:12px">' +
    '<strong>Product profitability</strong>' +
    [[30, 'Last 30 days'], [90, 'Last 90 days'], [365, 'Last year'], [9999, 'All time']]
      .map(function (w) {
        return '<button class="chip' + (MONEY_DAYS === w[0] ? ' on' : '') +
               '" type="button" data-mwin="' + w[0] + '">' + w[1] + '</button>';
      }).join('') +
    '</div>';

  if (!MONEY) {
    h += '<div class="loading">Working out what was earned&hellip; this reads every ' +
         'sale, so give it a moment.</div></section>';
    return h;
  }

  h += '<div class="grid g-kpi" style="margin-bottom:14px">' +
    kpi('Sold', cur, fmt(MONEY.revenue), '<span class="delta">after discounts</span>') +
    kpi('The goods cost', cur, fmt(MONEY.cost), '<span class="delta">landed cost</span>') +
    kpi('Gross profit', cur, fmt(MONEY.profit),
        '<span class="delta">' + fmt(MONEY.margin) + '% margin</span>') +
    kpi('Asleep on the shelf', cur, fmt(MONEY.deadCash),
        '<span class="delta">' + fmt(MONEY.deadCount) + ' product(s), nothing sold in ' +
        fmt(MONEY.deadAfter) + ' days</span>') +
    '</div>';

  if (MONEY.unknownRevenue > 0) {
    h += '<div class="note warn" style="margin-bottom:12px"><div class="ico">!</div><div>' +
      '<strong>' + esc(cur) + ' ' + fmt(MONEY.unknownRevenue) + ' of these sales have no ' +
      'buying price on record</strong>, so their margin is left out rather than guessed. ' +
      'Fill the gap in the Costs screen and the figure above becomes complete.</div></div>';
  }

  h += moneyTable('Where the profit comes from', MONEY.brands, cur, 'Brand');
  h += moneyTable('By category', MONEY.categories, cur, 'Category');

  // ---- per product ----
  h += '<div class="card" style="margin-top:14px"><h2>Product by product</h2>' +
    '<div class="sub">Best earners first. Margin is blank where no buying price is known.</div>' +
    '<div class="scroll tall"><table><thead><tr><th>Product</th><th>Brand</th>' +
    '<th class="num">Units</th><th class="num">Sold</th><th class="num">Cost</th>' +
    '<th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
  if (!MONEY.products.length) {
    h += '<tr><td colspan="7"><div class="empty">Nothing was sold in this period.</div></td></tr>';
  }
  MONEY.products.forEach(function (p) {
    h += '<tr><td class="nm">' + esc(p.name || p.sku) + '<br><span class="sku">' +
      esc(p.sku) + '</span></td><td>' + esc(p.brand || '—') + '</td>' +
      '<td class="num">' + fmt(p.units) + '</td>' +
      '<td class="num">' + fmt(p.revenue) + '</td>' +
      '<td class="num">' + (p.unknown ? '—' : fmt(p.cost)) + '</td>' +
      '<td class="num"><strong>' + (p.unknown ? '—' : fmt(p.profit)) + '</strong></td>' +
      '<td class="num">' + (p.unknown
        ? '<span class="pill low">no cost</span>'
        : marginPill(p.margin)) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // ---- dead stock ----
  h += '<div class="card" style="margin-top:14px"><h2>Not moving</h2>' +
    '<div class="sub">On the shelf, nothing sold in ' + fmt(MONEY.deadAfter) +
    ' days. This is your money, and it is standing still.</div>';
  if (!MONEY.dead.length) {
    h += '<div class="empty">Everything on the shelf has sold recently.</div>';
  } else {
    h += '<div class="scroll tall"><table><thead><tr><th>Product</th><th>Brand</th>' +
      '<th class="num">On hand</th><th class="num">Cost each</th>' +
      '<th class="num">Cash in it</th><th class="num">Last sold</th></tr></thead><tbody>';
    MONEY.dead.forEach(function (d) {
      h += '<tr><td class="nm">' + esc(d.name || d.sku) + '<br><span class="sku">' +
        esc(d.sku) + '</span></td><td>' + esc(d.brand || '—') + '</td>' +
        '<td class="num">' + fmt(d.stock) + '</td>' +
        '<td class="num">' + fmt(d.unitCost) + '</td>' +
        '<td class="num"><strong>' + fmt(d.tied) + '</strong></td>' +
        '<td class="num">' + (d.lastSoldDays === null
          ? '<span class="pill out">never</span>'
          : fmt(d.lastSoldDays) + 'd') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="sub" style="margin-top:8px">All stock at cost: ' + esc(cur) + ' ' +
    fmt(MONEY.stockCash) + ' &middot; as of ' + esc(MONEY.generatedAt) + '</div>';
  h += '</div></section>';
  return h;
}

/** One rollup table - brands, or categories. */
function moneyTable(title, rows, cur, label) {
  if (!rows || !rows.length) return '';
  var h = '<div class="card" style="margin-top:14px"><h2>' + esc(title) + '</h2>' +
    '<div class="scroll"><table><thead><tr><th>' + esc(label) + '</th>' +
    '<th class="num">Units</th><th class="num">Sold</th><th class="num">Profit</th>' +
    '<th class="num">Margin</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr><td class="nm">' + esc(r.name) + '</td>' +
      '<td class="num">' + fmt(r.units) + '</td>' +
      '<td class="num">' + fmt(r.revenue) + '</td>' +
      '<td class="num"><strong>' + (r.unknown && !r.cost ? '—' : fmt(r.profit)) + '</strong></td>' +
      '<td class="num">' + (r.unknown && !r.cost ? '—' : marginPill(r.margin)) + '</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

/** A margin, coloured by whether it is worth the shelf space. */
function marginPill(m) {
  var cls = m >= 25 ? 'ok' : (m >= 10 ? 'low' : 'out');
  return '<span class="pill ' + cls + '">' + fmt(m) + '%</span>';
}

function wireProfit() {
  var chips = el('view').querySelectorAll('button[data-mwin]');
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener('click', function () {
      MONEY_DAYS = num(this.getAttribute('data-mwin'));
      MONEY = null; repaint(); loadMoney();
    });
  }
}

function loadMoney() {
  srv('erpMoney', [{ days: MONEY_DAYS }], function (m) {
    MONEY = m;
    if (VIEW === 'profit') repaint();
  }, function (e) {
    toast('Could not work out the profit: ' + esc(e && e.message ? e.message : e), true, 12000);
  });
}

function viewCustomers() {
  if (!CUST) return '<div class="loading">Loading customers&hellip;</div>';
  var q = custQ.trim().toLowerCase();
  var rows = CUST.filter(function (c) {
    if (custOrders === 'once' && Number(c.orders) !== 1) return false;
    if (custOrders === 'repeat' && Number(c.orders) < 2) return false;
    if (custContact === 'phone' && !hasMobile(c.phone)) return false;
    if (custContact === 'walkin' && hasMobile(c.phone)) return false;
    // "not bought in N days" deliberately excludes people who never bought at
    // all - those have their own option, because they are a different problem.
    if (custLapse === 'never') {
      if (c.daysSince !== null && c.daysSince !== undefined) return false;
    } else if (custLapse) {
      if (c.daysSince === null || c.daysSince === undefined) return false;
      if (c.daysSince < Number(custLapse)) return false;
    }
    if (!q) return true;
    return (c.name+' '+c.phone+' '+c.address).toLowerCase().indexOf(q) !== -1;
  });
  rows.sort(function (a, b) {
    if (custSort === 'units') return (b.units||0) - (a.units||0);
    if (custSort === 'recent') return (a.daysSince === null ? 1e9 : a.daysSince) -
                                     (b.daysSince === null ? 1e9 : b.daysSince);
    if (custSort === 'lapsed') return (b.daysSince === null ? -1 : b.daysSince) -
                                      (a.daysSince === null ? -1 : a.daysSince);
    return (b.spent||0) - (a.spent||0);
  });
  // the account box, when one is open
  var h = dueBoxHtml() + '<section><div class="card">';
  h += '<div class="row" style="align-items:flex-end; margin-bottom:12px">'+
       '<div style="flex:2 1 220px"><label class="f" for="cq">Search customers</label>'+
       '<input class="i" id="cq" type="search" placeholder="Name, phone or address" value="'+esc(custQ)+'"></div>'+
       '<div style="flex:1 1 200px"><label class="f" for="clapse">Last purchase</label>'+
       '<select class="i" id="clapse">'+
         '<option value=""'+(custLapse===''?' selected':'')+'>Everyone</option>'+
         '<option value="30"'+(custLapse==='30'?' selected':'')+'>Not bought in 1 month</option>'+
         '<option value="60"'+(custLapse==='60'?' selected':'')+'>Not bought in 2 months</option>'+
         '<option value="90"'+(custLapse==='90'?' selected':'')+'>Not bought in 3 months</option>'+
         '<option value="180"'+(custLapse==='180'?' selected':'')+'>Not bought in 6 months</option>'+
         '<option value="365"'+(custLapse==='365'?' selected':'')+'>Not bought in 1 year</option>'+
         '<option value="never"'+(custLapse==='never'?' selected':'')+'>Never bought anything</option>'+
       '</select></div>'+
       '<div style="flex:1 1 180px"><label class="f" for="corders">Buying pattern</label>'+
       '<select class="i" id="corders">'+
         '<option value=""'+(custOrders===''?' selected':'')+'>Everyone</option>'+
         '<option value="once"'+(custOrders==='once'?' selected':'')+'>Bought only once</option>'+
         '<option value="repeat"'+(custOrders==='repeat'?' selected':'')+'>Repeat buyers (2+)</option>'+
       '</select></div>'+
       '<div style="flex:1 1 180px"><label class="f" for="ccontact">Contact</label>'+
       '<select class="i" id="ccontact">'+
         '<option value=""'+(custContact===''?' selected':'')+'>Everyone</option>'+
         '<option value="phone"'+(custContact==='phone'?' selected':'')+'>Has a phone number</option>'+
         '<option value="walkin"'+(custContact==='walkin'?' selected':'')+'>Walk-in (no number)</option>'+
       '</select></div>'+
       '<div style="flex:1 1 170px"><label class="f" for="csort">Sort by</label>'+
       '<select class="i" id="csort">'+
         '<option value="spent"'+(custSort==='spent'?' selected':'')+'>Most spent</option>'+
         '<option value="units"'+(custSort==='units'?' selected':'')+'>Most units bought</option>'+
         '<option value="lapsed"'+(custSort==='lapsed'?' selected':'')+'>Gone longest</option>'+
         '<option value="recent"'+(custSort==='recent'?' selected':'')+'>Bought most recently</option>'+
       '</select></div>'+
       '<button class="btn primary" type="button" id="newCust">+ New customer</button></div>';
  h += customerFormHtml();
  h += '</div></section>' + custMoneyBoxes() + '<section><div class="card"><h2>All customers</h2>';
  h += '<div class="sub">'+fmt(rows.length)+' of '+fmt(CUST.length)+' customers</div>';
  h += '<div class="scroll tall"><table><thead><tr><th>Customer</th><th>Address</th>'+
       '<th class="num">Orders</th><th class="num">Units</th><th class="num">Spent</th>'+
    '<th>Last order</th><th></th></tr></thead><tbody>';
  if (CUST_ERR) h += '<tr><td colspan="7"><div class="note err" style="margin:10px 0"><div class="ico">✕</div><div>'+
    '<strong>Could not read CUSTOMERS.</strong><br>'+esc(CUST_ERR)+'</div></div></td></tr>';
  else if (!rows.length) h += '<tr><td colspan="7"><div class="empty">No customer matches that.</div></td></tr>';
  rows.slice(0, 300).forEach(function (c) {
    h += '<tr><td class="nm">'+esc(c.name||'—')+balBadge(c.phone, c.name)+
         '<br><span class="sku">'+(hasMobile(c.phone)
            ? esc(c.phone)
            : '<span class="pill low">walk-in</span>'+(c.phone?' '+esc(c.phone):''))+'</span></td>'+
         '<td>'+esc(c.address||'—')+'</td>'+
         '<td class="num">'+fmt(c.orders)+'</td>'+
         '<td class="num">'+fmt(c.units)+'</td>'+
         '<td class="num">'+fmt(c.spent)+'</td>'+
         '<td>'+(c.lastOrder
            ? esc(c.lastOrder)+'<br><span class="sku">'+
              (c.daysSince===0?'today':fmt(c.daysSince)+' days ago')+'</span>'
            : '<span class="pill out">never bought</span>')+'</td>'+
         '<td class="num" style="white-space:nowrap">'+
           '<button class="btn small" type="button" data-cinv="'+esc(c.row)+'">Invoice</button> '+
           (hasMobile(c.phone) || c.name ? '<button class="btn small" type="button" data-stmt="1" data-sphone="'+esc(c.phone||'')+'" data-sname="'+esc(c.name||'')+'">Statement</button> ' : '')+
           '<button class="btn small" type="button" data-cdue="'+esc(c.row)+'" '+
             'data-cphone="'+esc(c.phone||'')+'" data-cname="'+esc(c.name||'')+'">Due</button> '+
           '<button class="btn small" type="button" data-cedit="'+esc(c.row)+'">Edit</button></td></tr>';
  });
  h += '</tbody></table></div>';
  if (rows.length > 300) h += '<div class="sub" style="margin-top:10px">Showing the first 300 — narrow the search to see more.</div>';
  h += '</div></section>';
  return h;
}

/**
 * One customer's account, opened from the Due button.
 *
 * Everything that changes what they owe is here, and each choice says what
 * kind of thing happened - money in, goods back, or a debt forgiven. The
 * three are the same number and completely different facts.
 */
function dueBoxHtml() {
  if (!DUEBOX) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var a = DUEBOX.account;

  var h = '<section><div class="card" style="border-color:var(--series-1)">' +
    '<h2>' + esc(DUEBOX.name || 'Customer') + '</h2>';

  if (!a) {
    h += '<div class="loading">Reading their account&hellip;</div></div></section>';
    return h;
  }

  h += '<div class="grid g-kpi" style="margin-bottom:14px">' +
    kpi('Owed to you', cur, fmt(a.balance),
        '<span class="delta">' + fmt(a.count) + ' unpaid invoice(s)</span>') +
    kpi('Held in advance', cur, fmt(a.credit || 0),
        '<span class="delta">for goods not yet delivered</span>') +
    '</div>';

  if (a.invoices && a.invoices.length) {
    h += '<div class="scroll"><table><thead><tr><th>Invoice</th><th>When</th>' +
      '<th class="num">Total</th><th class="num">Owed</th><th class="num">Age</th>' +
      '</tr></thead><tbody>';
    a.invoices.forEach(function (i) {
      h += '<tr><td class="nm">' + esc(i.id) + '</td><td>' + esc(i.when) + '</td>' +
        '<td class="num">' + fmt(i.grand) + '</td>' +
        '<td class="num"><strong>' + fmt(i.due) + '</strong></td>' +
        '<td class="num">' + dueAge(i.days) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="empty">No unpaid invoices.</div>';
  }

  var reasons = DUEBOX.reasons || [{ id: 'payment', label: 'Payment received' }];
  h += '<div class="row" style="margin-top:14px;align-items:flex-end">' +
    '<div style="flex:1 1 160px"><label class="f" for="db_kind">What happened</label>' +
    '<select class="i" id="db_kind">' +
    reasons.map(function (r) {
      return '<option value="' + esc(r.id) + '">' + esc(r.label) + '</option>';
    }).join('') +
    '<option value="advance">Advance received (for goods not yet given)</option>' +
    '</select></div>' +
    '<div style="flex:1 1 120px"><label class="f" for="db_amt">Amount</label>' +
    '<input class="i" id="db_amt" inputmode="decimal" placeholder="0"></div>' +
    '<div style="flex:1 1 130px"><label class="f" for="db_method">Method</label>' +
    '<select class="i" id="db_method">' +
    ((OPT && OPT.paymentMethods) || ['Cash']).map(function (m) {
      return '<option value="' + esc(m) + '">' + esc(m) + '</option>';
    }).join('') + '</select></div>' +
    '<div style="flex:2 1 200px"><label class="f" for="db_note">Note</label>' +
    '<input class="i" id="db_note" placeholder="why — required unless money came in"></div>' +
    '<div style="flex:0 0 auto;align-self:flex-end">' +
    '<button class="btn primary" type="button" id="db_go">Save</button> ' +
    '<button class="btn" type="button" id="db_close">Close</button></div>' +
    '</div>' +
    '<div class="sub" style="margin-top:8px">' +
    '<strong>Payment received</strong> clears their oldest invoices first. ' +
    '<strong>Reduce the due</strong> is for a discount, a debt given up, or an ' +
    'amount typed too high — they owe less and no money came. ' +
    '<strong>Increase the due</strong> is the opposite: a payment was recorded ' +
    'that never arrived. An <strong>advance</strong> is held on their account ' +
    'and is never spent on older invoices.<br>' +
    'The two that move a debt without money need a note saying why, and neither ' +
    'types over the balance — the payment is put on or taken back, so the ' +
    'history still explains the number.</div>' +
    '</div></section>';
  return h;
}

/**
 * The panel that appears when a sale is saved.
 *
 * It sits above the page rather than inside it, so nothing that redraws the
 * screen can take it away, and it has no timer: it stays until the employee
 * closes it. Leave the tab, come back an hour later, it is still there with
 * the invoice on it - which is the point, because the copy they meant to
 * save is one click inside it.
 */
/** The parcel number, the way it is shown in a list: big, and one tap copies it. */
function cidHtml(cid) {
  return '<span class="cidlab">write on the parcel</span>' +
         '<span class="cid" data-cid="' + esc(cid) + '" title="Click to copy">' + esc(cid) + '</span>';
}

function copyCid(cid, node) {
  function done() { toast('Parcel number ' + esc(cid) + ' copied.'); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cid).then(done, function () {});
      return;
    }
  } catch (e) {}
  try {
    var r = document.createRange(); r.selectNodeContents(node);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    if (document.execCommand('copy')) done();
  } catch (e2) {}
}

document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && t.getAttribute && t.getAttribute('data-cid')) copyCid(t.getAttribute('data-cid'), t);
});

/**
 * Steadfast has taken the parcel. The number it gave has to go on the box
 * by hand, so it is shown large and stays until it is closed - a message
 * that fades after a few seconds is gone before the pen is found.

function parcelDone(res) {

    '<div class="card" style="max-width:460px;width:92%;text-align:center">' +
      '<div style="font-size:34px;line-height:1">&#10003;</div>' +
      '<h2 style="margin:6px 0 2px">Parcel booked with Steadfast</h2>' +
      '<div class="sub">Write this number on the parcel</div>' +
      '<div class="cid" data-cid="' + esc(res.consignment) + '" ' +
        'style="font-size:34px;padding:8px 18px;margin:10px 0">' + esc(res.consignment) + '</div>' +
      '<div class="sub" style="margin-bottom:4px">' + esc(res.customer || '') + ' · invoice ' +
        esc(res.invoiceNo) + '</div>' +
      '<div class="sub" style="margin-bottom:14px">Rider collects <strong>' + esc(cur) + ' ' +
        fmt(res.collect) + '</strong>' + (res.changed ? ' · sent to a one-off address' : '') +
        '.<br>The number stays on the sale, under Sales &rarr; Sent. This stays open until you close it.</div>' +

function invoiceDone(res) {

    '<div class="card" style="max-width:460px;width:92%;text-align:center">' +

        fmt(res.grandTotal) + (res.thisDue > 0
          ? ' · <strong>' + fmt(res.thisDue) + ' still due</strong>' : ' · paid') +
      '</div>' +
      '<div class="sub" style="margin-bottom:14px">A copy is already saved in ' +
        'Drive. This stays open until you close it.</div>' +
      (dl ? '<a class="btn primary" id="invdl" href="' + esc(dl) + '" ' +
              'target="_blank" rel="noopener">Save to this computer</a> ' : '') +

              'rel="noopener">Open PDF</a> ' : '') +
      (isCourier(res.source)
        ? '<button class="btn" type="button" id="invparcel">Send parcel</button> ' : '') +

function openDueBox(phone, name) {
  DUEBOX = { phone: phone, name: name, account: null, reasons: null };
  repaint();
  srv('erpCustomerAccount', [{ phone: phone, name: name }], function (res) {
    if (DUEBOX) { DUEBOX.account = res; repaint(); }
  }, function (e) {
    toast(esc(e && e.message ? e.message : e), true, 12000);
    DUEBOX = null; repaint();
  });
  srv('erpPayReasons', [], function (list) {
    if (DUEBOX) { DUEBOX.reasons = list; repaint(); }
  }, function () {});
}

function wireDueBox() {
  var open = el('view').querySelectorAll('button[data-cdue]');
  for (var i = 0; i < open.length; i++) {
    open[i].addEventListener('click', function () {
      openDueBox(this.getAttribute('data-cphone'), this.getAttribute('data-cname'));
    });
  }

  var close = el('db_close');
  if (close) close.addEventListener('click', function () { DUEBOX = null; repaint(); });

  var go = el('db_go');
  if (go) go.addEventListener('click', function () {
    var kind = el('db_kind').value;
    var amount = num(el('db_amt').value);
    var note = (el('db_note').value || '').trim();
    var method = el('db_method').value;
    if (!(amount > 0)) { toast('Enter an amount.', true); return; }
    go.disabled = true; go.textContent = 'Saving…';

    function done(res) {
      go.disabled = false; go.textContent = 'Save';
      if (res && res.dues) { DUES = res.dues; updateDueCount(); }
      openDueBox(DUEBOX.phone, DUEBOX.name);
      toast('Saved.');
    }
    function failed(e) {
      go.disabled = false; go.textContent = 'Save';
      toast(esc(e && e.message ? e.message : e), true, 15000);
    }

    if (kind === 'advance') {
      srv('erpTakeAdvance', [{ phone: DUEBOX.phone, name: DUEBOX.name,
                               amount: amount, method: method, note: note }],
          done, failed);
    } else {
      srv('erpSettleDue', [{ phone: DUEBOX.phone, name: DUEBOX.name,
                             amount: amount, reason: kind, method: method,
                             note: note }], done, failed);
    }
  });
}

/**
 * What this customer owes, or what you are holding for them.
 *
 * Nothing is drawn when both are zero, which is the normal case - a badge on
 * every row would be noise, and the point of this one is that it catches the
 * eye. Both can appear together: money owed on old invoices and money taken
 * for goods not yet delivered are different facts, and netting them would
 * hide one of them.
 */
/**
 * Two short lists above the customers: who owes money, and who has paid
 * for goods they have not had yet. The owe list is the chasing list: oldest
 * due first by default, with when each person was last reminded, a ready
 * WhatsApp message and their full statement one click away. Everyone here
 * is also in the full list below. A list with nobody in it is not drawn.
 */
var OWE_SORT = 'oldest';

function custMoneyBoxes() {
  if (!DUES || !DUES.byKey) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var known = {};
  (CUST || []).forEach(function (c) {
    var k = custKey(c.phone, c.name);
    if (k && !known[k]) known[k] = c;
  });
  var owe = [], adv = [];
  for (var k in DUES.byKey) {
    if (!DUES.byKey.hasOwnProperty(k)) continue;
    var b = DUES.byKey[k], c = known[k] || null;
    var who = { key: k, name: c ? c.name : (k.indexOf('n:') === 0 ? k.slice(2) : ''),
                phone: c ? c.phone : (k.indexOf('n:') === 0 ? '' : '0' + k),
                due: b.due || 0, credit: b.credit || 0, invoices: b.invoices || 0, oldest: b.oldest || 0,
                reminded: b.reminded || null };
    if (who.due > 0) owe.push(who);
    if (who.credit > 0) adv.push(who);
  }
  owe.sort(function (x, y) { return OWE_SORT === 'oldest' ? (y.oldest - x.oldest || y.due - x.due) : (y.due - x.due); });
  adv.sort(function (x, y) { return y.credit - x.credit; });
  var h = '';

  if (owe.length) {
    var total = 0;
    owe.forEach(function (w) { total += w.due; });
    h += '<section><div class="card" style="border:2px solid var(--critical)">' +
      '<div class="row" style="align-items:center;gap:8px"><h2 style="margin:0;flex:1">Customers who owe ' +
      '<span class="bal owed">' + fmt(total) + '</span></h2>' +
      '<button class="chip' + (OWE_SORT === 'oldest' ? ' on' : '') + '" type="button" data-owesort="oldest">Oldest first</button>' +
      '<button class="chip' + (OWE_SORT === 'largest' ? ' on' : '') + '" type="button" data-owesort="largest">Largest first</button></div>' +
      '<div class="sub">' + fmt(owe.length) + ' customer(s). Remind, then record the payment when it comes.</div>' +
      '<div class="scroll"><table><thead><tr><th>Customer</th><th class="num">Owes</th><th class="num">Invoices</th>' +
      '<th class="num">Oldest</th><th>Last reminded</th><th></th></tr></thead><tbody>';
    owe.forEach(function (w) {
      var wa = waLink(w.phone, dueMessage(w, cur));
      h += '<tr><td class="nm">' + esc(w.name || '—') + (w.phone ? '<br><span class="sku">' + esc(w.phone) + '</span>' : '') + '</td>' +
        '<td class="num"><span class="bal owed">' + fmt(w.due) + '</span></td><td class="num">' + fmt(w.invoices) + '</td>' +
        '<td class="num">' + (w.oldest ? fmt(w.oldest) + ' days' : 'today') + '</td>' +
        '<td>' + (w.reminded ? '<span class="pill' + (w.reminded.days < 3 ? ' ok' : '') + '">' + esc(w.reminded.at) +
          (w.reminded.days === 0 ? ' · today' : ' · ' + fmt(w.reminded.days) + 'd ago') + '</span>' : '<span class="pill low">never</span>') + '</td>' +
        '<td class="num" style="white-space:nowrap">' +
        (wa ? '<a class="btn small primary" href="' + esc(wa) + '" target="_blank" rel="noopener" data-remind="' + esc(w.key) +
          '" data-rphone="' + esc(w.phone) + '" data-rname="' + esc(w.name) + '" data-rdue="' + esc(w.due) + '">WhatsApp</a> ' : '') +
        '<button class="btn small" type="button" data-stmt="1" data-sphone="' + esc(w.phone) + '" data-sname="' + esc(w.name) + '">Statement</button> ' +
        '<button class="btn small" type="button" data-cdue="1" data-cphone="' + esc(w.phone) + '" data-cname="' + esc(w.name) + '">Receive payment</button>' +
        '</td></tr>';
    });
    h += '</tbody></table></div></div></section>';
  }

  if (adv.length) {
    var t2 = 0;
    adv.forEach(function (w) { t2 += w.credit; });
    h += '<section><div class="card" style="border:2px solid var(--good)"><h2>Paid in advance <span class="bal adv">' + fmt(t2) + '</span></h2>' +
      '<div class="sub">' + fmt(adv.length) + ' customer(s) · money held for goods not yet delivered</div>' +
      '<div class="scroll"><table><thead><tr><th>Customer</th><th class="num">In advance</th><th></th></tr></thead><tbody>' +
      adv.map(function (w) {
        return '<tr><td class="nm">' + esc(w.name || '—') + (w.phone ? '<br><span class="sku">' + esc(w.phone) + '</span>' : '') + '</td>' +
          '<td class="num"><span class="bal adv">' + fmt(w.credit) + '</span></td><td class="num">' +
          '<button class="btn small" type="button" data-stmt="1" data-sphone="' + esc(w.phone) + '" data-sname="' + esc(w.name) + '">Statement</button> ' +
          '<button class="btn small" type="button" data-cdue="1" data-cphone="' + esc(w.phone) + '" data-cname="' + esc(w.name) + '">Open account</button></td></tr>';
      }).join('') + '</tbody></table></div></div></section>';
  }
  return h;
}

/** A WhatsApp link that opens a chat with the message already typed. */
function waLink(phone, text) {
  var p = String(phone || '').replace(/\D/g, '');
  if (p.length < 10) return '';
  if (p.length === 11 && p.charAt(0) === '0') p = '88' + p;
  else if (p.length === 10) p = '880' + p;
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
}

function dueMessage(w, cur) {
  var biz = (BIZ && BIZ.businesses && BIZ.businesses[0] && BIZ.businesses[0].name) || 'Costareen';
  return 'Assalamu alaikum' + (w.name ? ' ' + w.name : '') + ',\n\n' +
    'This is ' + biz + '. Your balance with us is ' + cur + ' ' + fmt(w.due) +
    (w.invoices > 1 ? ' across ' + w.invoices + ' invoices' : '') +
    (w.oldest ? ', the oldest from ' + w.oldest + ' days ago' : '') + '.\n\n' +
    'Please pay at your convenience by bKash, Bangla QR or cash. If you have already paid, please let us know so we can update our records.\n\nThank you.';
}

/** The statement, in a box over the page, with a PDF and a WhatsApp button. */
function openStatement(phone, name) {
  var old = document.getElementById('stmtbox');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var w = document.createElement('div');
  w.id = 'stmtbox';
  w.style.cssText = 'position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;' +
    'background:rgba(0,0,0,.55);overflow:auto';
  document.body.appendChild(w);
  var days = 90;
  function shut() { if (w.parentNode) w.parentNode.removeChild(w); }
  function load() {
    w.innerHTML = '<div class="card" style="max-width:760px;width:94%"><div class="loading">Reading the account&hellip;</div></div>';
    srv('erpCustomerStatement', [{ phone: phone, name: name, days: days }], draw, function (e) {
      shut(); toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  }
  function draw(s) {
    var cur = OPT ? OPT.currency : 'BDT';
    var msg = 'Assalamu alaikum' + (s.customer ? ' ' + s.customer : '') + ',\n\nYour statement with ' + s.business +
      ' (' + s.from + ' – ' + s.to + '):\n' +
      s.rows.map(function (r) { return r.date + '  ' + r.text + (r.debit ? '  +' + fmt(r.debit) : '') + (r.credit ? '  −' + fmt(r.credit) : ''); }).join('\n') +
      '\n\nBalance due: ' + cur + ' ' + fmt(s.closing) + (s.advance > 0 ? '\nAdvance held for you: ' + cur + ' ' + fmt(s.advance) : '') + '\n\nThank you.';
    var wa = waLink(s.phone, msg);
    w.innerHTML = '<div class="card" style="max-width:760px;width:94%;max-height:92vh;overflow:auto">' +
      '<div class="row" style="align-items:center;gap:8px"><h2 style="margin:0;flex:1">Statement · ' + esc(s.customer || s.phone) + '</h2>' +
      [[90, '3 months'], [365, '1 year'], [3650, 'Everything']].map(function (d) {
        return '<button class="chip' + (days === d[0] ? ' on' : '') + '" type="button" data-stdays="' + d[0] + '">' + d[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sub">' + esc(s.from) + ' to ' + esc(s.to) + (s.phone ? ' · ' + esc(s.phone) : '') + '</div>' +
      '<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Date</th><th>Details</th><th class="num">Charged</th>' +
      '<th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>' +
      '<tr><td></td><td class="sku">Balance brought forward</td><td></td><td></td><td class="num">' + fmt(s.opening) + '</td></tr>' +
      s.rows.map(function (r) {
        return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.text) + (r.ref && r.text.indexOf(r.ref) < 0 ? ' <span class="sku">' + esc(r.ref) + '</span>' : '') +
          '</td><td class="num">' + (r.debit ? fmt(r.debit) : '') + '</td><td class="num">' + (r.credit ? fmt(r.credit) : '') +
          '</td><td class="num">' + fmt(r.balance) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div class="totals" style="margin-top:10px"><div class="due"><span>Balance due</span><span>' + esc(cur) + ' ' + fmt(s.closing) + '</span></div>' +
      (s.advance > 0 ? '<div><span>Advance held</span><span>' + fmt(s.advance) + '</span></div>' : '') + '</div>' +
      (s.open.length ? '<div class="sub" style="margin-top:6px">Unpaid: ' + s.open.map(function (o) {
        return esc(o.id) + ' ' + fmt(o.owed) + ' (' + fmt(o.days) + 'd)'; }).join(' · ') + '</div>' : '') +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="st_close">Close</button>' +
      '<button class="btn" type="button" id="st_pdf">Save as PDF</button>' +
      (wa ? '<a class="btn primary" href="' + esc(wa) + '" target="_blank" rel="noopener">Send on WhatsApp</a>' : '') +
      '</div></div>';
    document.getElementById('st_close').addEventListener('click', shut);
    var chips = w.querySelectorAll('button[data-stdays]');
    for (var i = 0; i < chips.length; i++) chips[i].addEventListener('click', function () { days = Number(this.getAttribute('data-stdays')); load(); });
    var pdf = document.getElementById('st_pdf');
    pdf.addEventListener('click', function () {
      pdf.disabled = true; pdf.textContent = 'Saving…';
      srv('erpStatementPdf', [{ phone: phone, name: name, days: days }], function (r) {
        pdf.disabled = false; pdf.textContent = 'Save as PDF';
        toast('<a href="' + esc(r.url) + '" target="_blank" rel="noopener"><strong>Open ' + esc(r.name) + '</strong></a> · saved in Drive', false, 30000);
      }, function (e) { pdf.disabled = false; pdf.textContent = 'Save as PDF'; toast(esc(e && e.message ? e.message : e), true, 12000); });
    });
  }
  load();
}

function wireStatements() {
  var st = el('view').querySelectorAll('button[data-stmt]');
  for (var i = 0; i < st.length; i++) st[i].addEventListener('click', function () {
    openStatement(this.getAttribute('data-sphone'), this.getAttribute('data-sname'));

  var so = el('view').querySelectorAll('button[data-owesort]');

}

function balBadge(phone, name) {
  if (!DUES || !DUES.byKey) return '';
  var key = custKey(phone, name);
  if (!key) return '';
  var b = DUES.byKey[key];
  if (!b) return '';

  var out = '';
  if (b.due > 0) {
    var when = b.oldest ? ', oldest ' + fmt(b.oldest) + ' days' : '';
    out += '<span class="bal owed" title="Owed to you: ' + esc(OPT ? OPT.currency : 'BDT') +
           ' ' + fmt(b.due) + ' across ' + fmt(b.invoices) + ' unpaid invoice(s)' + when +
           '">' + fmt(b.due) + '</span>';
  }
  if (b.credit > 0) {
    out += '<span class="bal adv" title="Held in advance for goods not yet ' +
           'delivered: ' + esc(OPT ? OPT.currency : 'BDT') + ' ' + fmt(b.credit) +
           '">' + fmt(b.credit) + '</span>';
  }
  return out;
}

/**
 * The phone, reduced to the part that identifies a person.
 *
 * Must match erpCustKey_ on the server exactly, or a customer's own balance
 * will not find them: 01728733979 and +8801728733979 are one person.
 */
function custKey(phone, name) {
  var p = String(phone || '').replace(/\D/g, '');
  if (p.length >= 10) return p.slice(-10);
  var n = String(name || '').trim().toLowerCase();
  return n ? 'n:' + n : '';
}

/**
 * A website order somebody already dealt with by hand. Ticking it off is
 * not enough: the courier's money has to find the invoice, so the box asks
 * which invoice it was - offering the likely ones - and ties the two
 * together. Only an order with no invoice at all is ticked off bare.
 */
function webHandledBox(no) {
  var w = document.createElement('div');
  w.className = 'gate';
  w.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px';
  w.innerHTML = '<div class="card" style="max-width:520px;width:100%"><h2 style="margin-top:0">Order #' + esc(no) + ' — which invoice is it?</h2>' +
    '<div class="loading" id="wh_body">Looking for the invoice…</div></div>';
  document.body.appendChild(w);
  function shut() { if (w.parentNode) w.parentNode.removeChild(w); }
  w.addEventListener('click', function (ev) { if (ev.target === w) shut(); });

  function paint(r) {
    var box = document.getElementById('wh_body');
    if (!box) return;
    box.className = '';
    var sg = r.suggest || [];
    box.innerHTML = '<div class="sub">' + esc(r.customer || '') + (r.phone ? ' · ' + esc(r.phone) : '') + ' · ' + fmt(r.total) +
      '. Tying it to its invoice is what lets Steadfast’s payout mark that invoice paid.</div>' +
      (sg.length ? '<div style="margin-top:10px">' + sg.map(function (s, i) {
        return '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="' + esc(s.id) + '"' + (i === 0 ? ' checked' : '') + '> <strong>' +
          esc(s.id) + '</strong> <span class="sku">' + esc(s.when) + ' · ' + esc(s.customer) + ' · ' + fmt(s.total) + '</span></label>';
      }).join('') + '</div>' : '<div class="note" style="margin-top:10px"><div class="ico">i</div><div>No invoice with this phone number was found near that date.</div></div>') +
      '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="__other"' + (sg.length ? '' : ' checked') + '> Another invoice: ' +
        '<input class="i" id="wh_other" placeholder="INV-YYYYMMDD-0000" style="max-width:220px;display:inline-block"></label>' +
      '<label class="chk" style="display:block;margin:6px 0"><input type="radio" name="wh_pick" value="__none"> There is no invoice — it was cancelled or never sold</label>' +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="wh_close">Cancel</button><button class="btn primary" type="button" id="wh_save">Save</button></div>';
    document.getElementById('wh_close').addEventListener('click', shut);
    var other = document.getElementById('wh_other');
    other.addEventListener('focus', function () { var o = w.querySelector('input[value="__other"]'); if (o) o.checked = true; });
    var sv = document.getElementById('wh_save');
    sv.addEventListener('click', function () {
      var pick = w.querySelector('input[name="wh_pick"]:checked'), v = pick ? pick.value : '';
      function done(msg) { shut(); toast(msg, false, 9000); WEB = null; COURIER = null; loadWeb(); loadCourier(); }
      function bad(e) { sv.disabled = false; sv.textContent = 'Save'; toast(esc(e && e.message ? e.message : e), true, 12000); }
      if (v === '__none') {
        if (!window.confirm('Tick order #' + no + ' off with no invoice?\n\nNothing is sold and no stock moves.')) return;
        sv.disabled = true; sv.textContent = 'Saving…';
        srv('erpMarkWebOrderEntered', [no], function (res) { done('Order #' + esc(res.orderNo) + ' ticked off — no invoice.'); }, bad);
        return;
      }
      var inv = v === '__other' ? String(other.value || '').trim() : v;
      if (!inv) { toast('Choose the invoice, or type its number.', true); return; }
      sv.disabled = true; sv.textContent = 'Saving…';
      srv('erpLinkWebOrder', [{ orderNo: no, invoiceNo: inv }], function () { done('Order #' + esc(no) + ' is tied to ' + esc(inv) + '.'); }, bad);
    });
  }
  srv('erpWebOrderInvoices', [{ orderNo: no }], function (r) {
    if (r.linked) { shut(); toast('Order #' + esc(no) + ' is already tied to ' + esc(r.linked) + '.', false, 9000); WEB = null; loadWeb(); return; }
    paint(r);
  }, function (e) { paint({ suggest: [], customer: '', phone: '', total: 0 }); toast(esc(e && e.message ? e.message : e), true, 10000); });
}

// =====================================================================
// on-screen status strip
//
// The app runs inside Apps Script's sandboxed iframe, which no external
// tool can read the console of. So the page reports its own state: what
// the queue is doing, how long the current call has been running, and the
// last error. This is how a stuck call becomes visible instead of silent.
// =====================================================================
// Show the mechanic's readout only when the link says ?debug=1.
var DBG_ON = (function () {
  try { return /[?&]debug=1/.test(String(location.search || '')); }
  catch (e) { return false; }
})();
var DBG_START = new Date().getTime();
var DBG_LAST = '';
var DBG_JOB = null;
var DBG_JOB_AT = 0;
var DBG_DONE = [];

function dbgSet(msg, bad) {
  DBG_LAST = (bad ? '!! ' : '') + msg;
}

function dbgPaint() {
  var el2 = document.getElementById('dbg');
  if (!el2) return;
  var now = new Date().getTime();
  var running = DBG_JOB
    ? DBG_JOB + ' running ' + Math.round((now - DBG_JOB_AT) / 1000) + 's'
    : 'idle';
  var state = {
    CAT: CAT === null ? 'null' : (CAT.length + ' products'),
    LISTS: LISTS === null ? 'null' : 'ok',
    CUST: CUST === null ? 'null' : (CUST.length + ''),
    ORDERS: ORDERS === null ? 'null' : (ORDERS.length + ''),
    HIST: HIST === null ? 'null' : (HIST.length + ''),
    WEB: WEB === null ? 'null' : (WEB.length + '')
  };
  // This is a mechanic's readout, not something to show a person selling
  // filament. It stays hidden unless the link asks for it (?debug=1), so it
  // is still one URL away when something needs diagnosing.
  var slow = DBG_JOB && (now - DBG_JOB_AT) > 12000;
  var bad = DBG_LAST && DBG_LAST.indexOf('!!') === 0;
  if (DBG_ON && (slow || bad)) el2.className = 'on'; else el2.className = '';
  if (!DBG_ON) return;

  el2.innerHTML =
    '<b>queue</b> ' + running + ' | waiting ' + SRV_Q.length + ' | busy ' + SRV_BUSY +
    '   <b>data</b> cat:' + state.CAT + ' lists:' + state.LISTS +
    ' cust:' + state.CUST + ' inv:' + state.ORDERS + ' hist:' + state.HIST +
    ' web:' + state.WEB +
    '   <b>done</b> ' + (DBG_DONE.join(', ') || '-') +
    (DBG_LAST ? '\n<span class="' + (DBG_LAST.indexOf('!!') === 0 ? 'bad' : '') + '">' +
       esc(DBG_LAST) + '</span>' : '');
}
setInterval(dbgPaint, 500);

// server calls: one at a time, with a watchdog
// =====================================================================
var SRV_Q = [], SRV_BUSY = false, SRV_TIMEOUT = 45000;
// Reading the sales history and the customer list is minutes of work for a
// big sheet; a button press is not. One watchdog for both meant the slow
// ones were killed while still working.
var SRV_SLOW = { erpPoCreate: 180000, erpPoArrive: 180000, erpPoDiffDecide: 120000, erpBackupRun: 300000, erpBackupStatus: 90000, erpCourier: 120000,
                 erpBookParcel: 120000, erpBookedParcels: 180000, erpCourierTest: 60000, erpBundle: 120000, erpAdmin: 90000, erpCustomers: 90000,
                 erpMergeCustomers: 300000, erpTool: 300000,
                 erpDeployBusiness: 300000, erpCreateBusiness: 300000,
                 erpSelfTest: 180000, erpApplyReorderLevels: 180000,
                 // Saving a sale writes the stock movements, the sales rows,
                 // the customer and a PDF. On a full sheet that is well past
                 // 45 seconds, and giving up on it was the worst kind of
                 // wrong: the sale WAS saved, and the screen said it failed
                 // and kept the last customer on the form.
                 erpMoney: 180000, erpReorderPlan: 180000,
                 erpExpenses: 120000, erpExpenseExport: 180000,
                 erpSales: 120000, erpFixInvoice: 90000, erpCancelInvoice: 180000, erpPoCreate: 90000, erpPnl: 180000, erpSfPayouts: 240000, erpStatementPdf: 120000, erpQuoteSave: 120000, erpQuoteAssetUpload: 120000, erpCampaignAudience: 120000, erpCampaignCreate: 120000, erpEvoSendBatch: 330000, erpEvoUpload: 120000, erpProductListShare: 120000, erpWaProductPdf: 120000, erpReturnGoods: 180000, erpInvoicePdf: 90000, erpReturnPreview: 90000,
                 erpCreateInvoice: 240000, erpEnterWebOrder: 240000,
                 erpVoidInvoice: 180000 };
function srvPatience(name) { return SRV_SLOW[name] || SRV_TIMEOUT; }

/**
 * A long random id for this browser, made once and kept.
 *
 * It is what ties a code to one phone: the same code from anywhere else is
 * refused until the owner allows that device.
 */
function erpDevice() {
  var k = 'erp_device_id';
  var v = '';
  try { v = window.localStorage.getItem(k) || ''; } catch (e) {}
  if (!v) {
    v = 'd' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) +
        new Date().getTime().toString(36);
    try { window.localStorage.setItem(k, v); } catch (e) {}
  }
  return v;
}

function erpCode() {
  try { return window.localStorage.getItem('erp_code') || ''; } catch (e) { return ''; }
}

function erpSetCode(c) {
  try {
    if (c) window.localStorage.setItem('erp_code', c);
    else window.localStorage.removeItem('erp_code');
  } catch (e) {}
}

/** What travels with every request so the server knows who is asking. */
function erpToken() {
  var label = '';
  try { label = (navigator.userAgent || '').slice(0, 60); } catch (e) {}
  return { code: erpCode(), device: erpDevice(), label: label };
}

function srv(name, args, ok, bad) {
  SRV_Q.push({ name: name, args: args || [], ok: ok, bad: bad });
  srvPump();
}

function srvPump() {
  if (SRV_BUSY || !SRV_Q.length) return;
  SRV_BUSY = true;
  var job = SRV_Q.shift();
  var settled = false;
  DBG_JOB = job.name + '(' + (job.args[0] || '') + ')';
  DBG_JOB_AT = new Date().getTime();
  dbgPaint();

  function finish(fn, arg) {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    SRV_BUSY = false;
    DBG_DONE.push(DBG_JOB + ' ' + Math.round((new Date().getTime() - DBG_JOB_AT) / 1000) + 's');
    if (DBG_DONE.length > 6) DBG_DONE.shift();
    if (arg instanceof Error) dbgSet(DBG_JOB + ' -> ' + arg.message, true);
    // an action the server no longer knows means this page is older than the server
    if (arg && arg.message && /Unknown action/.test(String(arg.message))) staleBanner();
    DBG_JOB = null;
    dbgPaint();
    try { if (fn) fn(arg); } catch (err) {
      try { toast('Display error: ' + esc(err && err.message ? err.message : err), true); } catch (e2) {}
    }
    srvPump();
  }

  var patience = srvPatience(job.name);
  var timer = setTimeout(function () {
    finish(job.bad, new Error('The sheet did not answer within ' +
      Math.round(patience / 1000) + ' seconds. It may be busy - press Refresh to try again.'));
  }, patience);

  var runner = google.script.run
    .withSuccessHandler(function (r) { finish(job.ok, r); })
    .withFailureHandler(function (e) { finish(job.bad, e); });

  try {
    // One door: the server identifies the caller and checks the role before
    // doing anything, so a screen that is hidden is also data that is never
    // sent. erpHello is the only exception - it is how you sign in.
    if (job.name === 'erpHello') {
      runner.erpHello(erpToken());
    } else {
      runner.erpCall(erpToken(), job.name, job.args || []);
    }
  } catch (e) {
    finish(job.bad, e);
  }
}

// view: settings - the lists every dropdown in the system reads from
// =====================================================================
var LIST_LABELS = {
  categories:     ['Categories',      'Product groups, e.g. Filaments'],
  brands:         ['Brands',          'Manufacturers you stock'],
  types:          ['Types',           'Material or model, e.g. PLA+'],
  colors:         ['Colours',         'Used in product names and SKUs'],
  units:          ['Units',           'Roll, Piece, Set\u2026'],
  suppliers:      ['Suppliers',       'Who you buy from'],
  payment_methods:['Payment methods', 'Offered on every invoice']
};

/**
 * The price book. Buy prices are typed in RMB because that is how the stock is
 * bought; the rate is the owner's real broker-inclusive rate, so it is typed
 * and never fetched from a currency feed. Landed cost and margin are read back
 * calculated by the sheet rather than being worked out again here, so the two
 * can never disagree.
 */
/**
 * Who owes money.
 *
 * Grouped by person first, because that is how it gets chased: one customer
 * with four unpaid invoices is one phone call, not four. The oldest debts
 * are the ones that go bad, so age is shown next to every amount.
 */
/** Age, coloured by how worried you should be. */
function dueAge(days) {
  days = Number(days || 0);
  if (days >= 60) return '<span class="pill out">' + fmt(days) + 'd</span>';
  if (days >= 30) return '<span class="pill low">' + fmt(days) + 'd</span>';
  return '<span class="sku">' + fmt(days) + 'd</span>';
}

/** Kept as a no-op: the Dues tab it updated is gone, but several places
 *  still call it after recording money, and losing the calls would be a
 *  bigger change than leaving one empty function. */
function updateDueCount() {}

function viewCosts() {
  if (COST_ERR) {
    return '<section><div class="note err"><div class="ico">✕</div><div>' +
      '<strong>Could not read the price book.</strong><br>' + esc(COST_ERR) +
      '</div></div></section>';
  }
  if (!COSTS) return '<div class="loading">Loading the price book&hellip;</div>';
  if (COSTS.missingTab) {
    return '<section><div class="note err"><div class="ico">✕</div><div>' +
      '<strong>This business has no COST_PRICES tab yet.</strong><br>' +
      'The price book lives in a tab called COST_PRICES. It has not been set up ' +
      'for this sheet.</div></div></section>';
  }

  var rate = Number(COSTS.rate || 0);
  var minM = Number(COSTS.minMargin || 0);
  var hnd = Number(COSTS.handling || 0);
  var rows = COSTS.rows || [];

  var h = '<section><div class="card"><h2>Your buying rate</h2>' +
    '<div class="sub">Your real rate including whatever the broker takes — not the ' +
    'market rate, which is why it is never fetched automatically. Set it once and every ' +
    'price below uses it. Changing it never alters stock you have already bought.</div>' +
    '<div class="row">' +
    '<div style="flex:1 1 150px"><label class="f" for="ck_rate">TK per RMB</label>' +
    '<input class="i" id="ck_rate" inputmode="decimal" placeholder="e.g. 17.5" value="' +
      (rate > 0 ? esc(String(rate)) : '') + '"></div>' +
    '<div style="flex:1 1 170px"><label class="f" for="ck_handling">Handling per unit (TK)</label>' +
    '<input class="i" id="ck_handling" inputmode="decimal" value="' + esc(String(hnd)) + '"></div>' +
    '<div style="flex:1 1 150px"><label class="f" for="ck_margin">Minimum margin %</label>' +
    '<input class="i" id="ck_margin" inputmode="decimal" value="' + esc(String(minM)) + '"></div>' +
    '<div style="flex:0 0 auto;align-self:flex-end">' +
    '<button class="btn primary" type="button" id="ck_saveset">Save</button></div>' +
    '</div></div></section>';

  if (!(rate > 0)) {
    h += '<section><div class="note err"><div class="ico">✕</div><div>' +
      '<strong>Set your rate first.</strong> Nothing can be costed until the ' +
      'TK-per-RMB rate above is filled in.</div></div></section>';
  }

  var priced = Number(COSTS.priced || 0);
  var under = 0, losing = 0;
  for (var i = 0; i < rows.length; i++) {
    var m = rows[i].margin;
    if (rows[i].landed > 0 && rows[i].sell > 0 && m !== null && m !== undefined) {
      if (Number(m) < 0) losing++;
      else if (Number(m) < minM) under++;
    }
  }

  h += '<section><div class="grid g-kpi">' +
    kpi('Rows priced', '', fmt(priced) + ' / ' + fmt(rows.length),
        '<span class="delta">' + (rows.length - priced > 0
          ? fmt(rows.length - priced) + ' still blank' : 'all filled in') + '</span>') +
    kpi('Losing money', '', fmt(losing),
        '<span class="delta">sold below what it costs</span>') +
    kpi('Under ' + fmt(minM) + '% margin', '', fmt(under),
        '<span class="delta">thin, worth a look</span>') +
    '</div></section>';

  // ---- filter: categories on one line, brands on the next ---------------
  // Both are multi-select and both are built from the data, so a new brand or
  // category shows up here the moment a product uses it. Nothing selected
  // means everything, which is why there is no "All" button.
  var cats = {}, brands = {};
  for (var ci = 0; ci < rows.length; ci++) {
    var cn = rows[ci].category || 'Other';
    cats[cn] = (cats[cn] || 0) + 1;
  }
  for (var bi = 0; bi < rows.length; bi++) {
    var br = rows[bi];
    if (COST_FILTER.cats.length && !inList(COST_FILTER.cats, br.category || 'Other')) continue;
    var bn = br.brand || 'Other';
    brands[bn] = (brands[bn] || 0) + 1;
  }
  var catNames = Object.keys(cats).sort();
  var brandNames = Object.keys(brands).sort();

  h += '<section><div class="card"><h2>Buying prices</h2>' +
    '<div class="sub">One row per brand and type \u2014 colours share a price, so they are ' +
    'not listed separately. Type the RMB price; use the taka column only for anything not ' +
    'bought in RMB. Leave handling blank to use the default above. Nothing is saved until ' +
    'you press Save changes.</div>';

  h += '<div style="margin-bottom:4px"><label class="f">Category</label><div class="chips">';
  for (var ck = 0; ck < catNames.length; ck++) {
    h += costChip('cat', catNames[ck], cats[catNames[ck]]);
  }
  h += '</div></div>';

  h += '<div style="margin-bottom:4px"><label class="f">Brand</label><div class="chips">';
  for (var bk = 0; bk < brandNames.length; bk++) {
    h += costChip('brand', brandNames[bk], brands[brandNames[bk]]);
  }
  h += '</div></div>';

  h += '<div class="row" style="margin-bottom:6px;align-items:flex-end">' +
    '<div style="flex:1 1 240px"><label class="f" for="ck_q">Search type</label>' +
    '<input class="i" id="ck_q" type="search" placeholder="e.g. ASA, PLA+, TPU, nozzle" value="' +
      esc(COST_FILTER.q) + '"></div>';
  if (COST_FILTER.cats.length || COST_FILTER.brands.length || COST_FILTER.q) {
    h += '<div style="flex:0 0 auto;align-self:flex-end">' +
         '<button class="btn" type="button" id="ck_clear">Clear filters</button></div>';
  }
  h += '</div>';

  var shown = [];
  var needle = String(COST_FILTER.q || '').trim().toLowerCase();
  for (var fi = 0; fi < rows.length; fi++) {
    var fr = rows[fi];
    if (COST_FILTER.cats.length && !inList(COST_FILTER.cats, fr.category || 'Other')) continue;
    if (COST_FILTER.brands.length && !inList(COST_FILTER.brands, fr.brand || 'Other')) continue;
    if (needle) {
      var hay = (fr.brand + ' ' + fr.type + ' ' + fr.category).toLowerCase();
      if (hay.indexOf(needle) < 0) continue;
    }
    shown.push(fr);
  }

  h += '<div class="scroll tall"><table><thead><tr>' +
    '<th>Brand</th><th>Type</th><th class="num">SKUs</th>' +
    '<th class="num">Buy RMB</th><th class="num">or TK</th><th class="num">Handling</th>' +
    '<th class="num">Lands at</th><th class="num">Sells at</th><th class="num">Margin</th>' +
    '</tr></thead><tbody>';

  if (!rows.length) {
    h += '<tr><td colspan="9" class="empty">The price book has no rows yet.</td></tr>';
  } else if (!shown.length) {
    h += '<tr><td colspan="9" class="empty">Nothing matches that filter.</td></tr>';
  }

  // Grouped under a category heading, so a long book stays readable. The
  // category column is dropped because the heading already carries it.
  var lastCat = null;
  for (var j = 0; j < shown.length; j++) {
    var r = shown[j];
    var ed = COST_EDIT[r.row] || {};
    var thisCat = r.category || 'Other';
    if (thisCat !== lastCat) {
      h += '<tr class="grp"><td colspan="9">' + esc(thisCat) + '</td></tr>';
      lastCat = thisCat;
    }
    h += '<tr>' +
      '<td>' + esc(r.brand) + '</td>' +
      '<td class="nm">' + esc(r.type) + '</td>' +
      '<td class="num"><span class="sku">' + fmt(r.products) + '</span></td>' +
      costInput(r, ed, 'rmb', '') +
      costInput(r, ed, 'bdt', '') +
      costHandling(r, ed, hnd) +
      '<td class="num">' + (r.landed > 0 ? fmt(r.landed) : '<span class="sku">\u2014</span>') + '</td>' +
      '<td class="num">' + (r.sell > 0 ? fmt(r.sell) : '<span class="sku">\u2014</span>') + '</td>' +
      '<td class="num">' + marginCell(r, minM) + '</td>' +
      '</tr>';
  }

  h += '</tbody></table></div>' +
    '<div class="row" style="margin-top:12px;align-items:center">' +
    '<button class="btn primary" type="button" id="ck_save">Save changes</button>' +
    '<button class="btn" type="button" id="ck_undo">Undo my edits</button>' +
    '<span class="sku" id="ck_dirty"></span>' +
    '</div></div></section>';

  return h;
}

/** Is this value one of the selected ones? */
function inList(list, val) {
  for (var i = 0; i < list.length; i++) if (list[i] === val) return true;
  return false;
}

/**
 * A filter button. Several can be on at once - picking Sunlu and Bambulab
 * shows both - and nothing selected means no filter rather than nothing shown.
 */
function costChip(kind, val, count) {
  var on = inList(kind === 'cat' ? COST_FILTER.cats : COST_FILTER.brands, val);
  return '<button type="button" class="chip ckcat' + (on ? ' on' : '') +
    '" data-ckkind="' + esc(kind) + '" data-ckcat="' + esc(val) + '">' + esc(val) +
    ' <span class="sku">' + fmt(count) + '</span></button>';
}

/** One editable price cell, showing the unsaved value if there is one. */
function costInput(r, ed, key, ph) {
  var v = (ed[key] !== undefined) ? ed[key]
        : ((r[key] === null || r[key] === undefined) ? '' : String(r[key]));
  return '<td class="num"><input class="i qty" inputmode="decimal" data-ck="' + key + '" ' +
         'data-row="' + r.row + '" value="' + esc(v) + '"' +
         (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></td>';
}

/**
 * Handling, which is the one column with two meanings: empty follows the
 * default above, a number overrides it for this row only. Without a hint,
 * a row holding its own copy of the default looks identical to one following
 * it - and then changing the default appears to do nothing.
 */
function costHandling(r, ed, dflt) {
  var td = costInput(r, ed, 'handling', String(dflt));
  var v = (ed.handling !== undefined) ? ed.handling
        : ((r.handling === null || r.handling === undefined) ? '' : String(r.handling));
  var title = String(v).trim() === ''
    ? 'Follows the default of ' + dflt + ' TK'
    : 'Set for this row only - the default does not apply here';
  return td.replace('<input class="i qty"',
    '<input class="i qty' + (String(v).trim() === '' ? '' : ' pinned') +
    '" title="' + esc(title) + '"');
}

/** Margin, with the two warnings that matter: below cost, or below your floor. */
function marginCell(r, minM) {
  if (!(r.landed > 0) || !(r.sell > 0)) return '<span class="sku">—</span>';
  var m = Number(r.margin || 0);
  var txt = (Math.round(m * 10) / 10) + '%';
  if (m < 0) {
    return '<span class="pill out" title="You are selling this for less than it costs you">' +
           txt + '</span>';
  }
  if (m < minM) {
    return '<span class="pill low" title="Below your minimum margin">' + txt + '</span>';
  }
  return '<span class="pill ok">' + txt + '</span>';
}

function wireCosts() {
  var v = el('view');

  // Every keystroke is remembered, so a background refresh cannot throw away
  // half-typed work.
  var ins = v.querySelectorAll('input[data-ck]');
  for (var i = 0; i < ins.length; i++) {
    ins[i].addEventListener('input', function () {
      var row = this.getAttribute('data-row');
      COST_EDIT[row] = COST_EDIT[row] || {};
      COST_EDIT[row][this.getAttribute('data-ck')] = this.value;
      costDirty();
    });
  }
  costDirty();

  var chips = v.querySelectorAll('button[data-ckcat]');
  for (var c = 0; c < chips.length; c++) {
    chips[c].addEventListener('click', function () {
      var kind = this.getAttribute('data-ckkind');
      var val = this.getAttribute('data-ckcat');
      var list = kind === 'cat' ? COST_FILTER.cats : COST_FILTER.brands;
      var at = -1;
      for (var k = 0; k < list.length; k++) if (list[k] === val) { at = k; break; }
      if (at >= 0) list.splice(at, 1); else list.push(val);
      // a brand that is no longer on screen should not keep filtering
      if (kind === 'cat') COST_FILTER.brands = [];
      repaint();
    });
  }

  // Repainting rebuilds the box, so the caret has to be put back or typing
  // a second character would jump to the start.
  var q = el('ck_q');
  if (q) q.addEventListener('input', function () {
    COST_FILTER.q = this.value;
    var at = this.selectionStart;
    repaint();
    var again = el('ck_q');
    if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
  });

  var cl = el('ck_clear');
  if (cl) cl.addEventListener('click', function () {
    COST_FILTER = { cats: [], brands: [], q: '' };
    repaint();
  });

  var ss = el('ck_saveset');
  if (ss) ss.addEventListener('click', function () {
    ss.disabled = true; ss.textContent = 'Saving…';
    srv('erpSaveCostSettings', [{
      rate: el('ck_rate').value.trim(),
      handling: el('ck_handling').value.trim(),
      minMargin: el('ck_margin').value.trim()
    }], function (res) {
      ss.disabled = false; ss.textContent = 'Save';
      COSTS = res; COST_ERR = null;
      toast('Rate saved. Every price below now uses it.');
      repaint();
    }, function (e) {
      ss.disabled = false; ss.textContent = 'Save';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  var sv = el('ck_save');
  if (sv) sv.addEventListener('click', function () {
    var byRow = {};
    (COSTS.rows || []).forEach(function (r) { byRow[String(r.row)] = r; });
    var list = [];
    Object.keys(COST_EDIT).forEach(function (row) {
      var r = byRow[row];
      if (!r) return;
      var ed = COST_EDIT[row];
      // Send ONLY what was typed. A field left alone is not included at all,
      // so the server never rewrites it from a stale copy in this browser.
      var item = { row: r.row, category: r.category, brand: r.brand, type: r.type };
      ['rmb', 'bdt', 'handling'].forEach(function (k) {
        if (ed[k] !== undefined) item[k] = ed[k];
      });
      if (item.rmb === undefined && item.bdt === undefined &&
          item.handling === undefined) return;
      list.push(item);
    });
    if (!list.length) { toast('Nothing has been changed yet.'); return; }
    sv.disabled = true; sv.textContent = 'Saving…';
    srv('erpSaveCostRows', [{ rows: list }], function (res) {
      sv.disabled = false; sv.textContent = 'Save changes';
      COSTS = res; COST_ERR = null; COST_EDIT = {};
      if (res.notFound && res.notFound.length) {
        toast('Saved ' + fmt(res.saved || 0) + ', but could not find: ' +
              esc(res.notFound.join(', ')) + '. Reload and try those again.', true, 15000);
      } else {
        toast('Saved ' + fmt(res.saved || list.length) + ' price(s).');
      }
      repaint();
    }, function (e) {
      sv.disabled = false; sv.textContent = 'Save changes';
      toast(esc(e && e.message ? e.message : e), true, 15000);
    });
  });

  var un = el('ck_undo');
  if (un) un.addEventListener('click', function () {
    COST_EDIT = {};
    toast('Unsaved edits dropped.');
    repaint();
  });
}

/** How many rows are waiting to be saved - on the button row and the tab. */
function costDirty() {
  var n = Object.keys(COST_EDIT).length;
  var s = el('ck_dirty');
  if (s) s.textContent = n ? (n + ' row(s) edited, not saved yet') : '';
  var c = el('cCosts');
  if (c) c.textContent = n ? String(n) : '';
}

/**
 * Who can open the business currently on screen.
 *
 * Access is Drive access to that business's sheet - add a partner here and
 * they can use the ERP for this business and nothing else. There is no
 * separate password list that could drift out of step.
 */
/**
 * One link per business.
 *
 * A shared link with a switcher is only as private as the switcher. A link
 * bound to one sheet cannot reach another business at all, which is what a
 * partner should be given.
 */
/**
 * The people who may use this ERP.
 *
 * Access is a code tied to one phone, so this list is the whole of it: add
 * someone here and they can work; revoke them here and they cannot, on the
 * next thing they try.
 */
/**
 * Devices waiting to be let in.
 *
 * This sits above everything else in Settings because it is the only thing
 * here that somebody is waiting on: until it is answered, a person standing
 * in the shop cannot work.
 */
function viewRequests() {
  var iAm = (ME && ME.role) || 'owner';
  if (iAm !== 'owner' && iAm !== 'shareholder') return '';
  if (!DEVS) return '';

  var waiting = DEVS.pending || [];
  if (!waiting.length) return '';

  var h = '<section><div class="card" style="border-color:var(--serious)">' +
    '<h2>' + fmt(waiting.length) + ' asking to use the ERP</h2>' +
    '<div class="sub">Someone entered their code on a device you have not allowed ' +
    'before. Check the name and the device look right, then let them in. ' +
    'Nothing works for them until you do.</div>' +
    '<div class="scroll"><table><thead><tr><th>Who</th><th>Role</th>' +
    '<th>Device</th><th>Asked</th><th></th></tr></thead><tbody>';

  waiting.forEach(function (d) {
    h += '<tr><td class="nm">' + esc(d.name) +
         (d.phone ? '<br><span class="sku">' + esc(d.phone) + '</span>' : '') + '</td>' +
         '<td>' + esc(d.roleLabel) + '</td>' +
         '<td>' + esc(d.label) + '</td>' +
         '<td><span class="sku">' + esc(d.requested) + '</span></td>' +
         '<td class="num">' +
         '<button class="btn small primary" type="button" data-allowdev="' + esc(d.id) + '">Let in</button> ' +
         '<button class="btn small danger" type="button" data-denydev="' + esc(d.id) + '">Refuse</button>' +
         '</td></tr>';
  });
  h += '</tbody></table></div></div></section>';
  return h;
}

/** The devices one person may work from, listed under their name. */
function deviceLines(p) {
  var ds = p.devices || [];
  if (!ds.length) return '<span class="sku">no device yet</span>';
  var out = [];
  ds.forEach(function (d) {
    var pill = d.status === 'approved' ? '<span class="pill ok">allowed</span>'
             : d.status === 'pending' ? '<span class="pill low">waiting</span>'
             : d.status === 'denied' ? '<span class="pill out">refused</span>'
             : '<span class="pill out">revoked</span>';
    out.push('<div style="margin:3px 0">' + esc(d.label) + ' ' + pill +
      (d.lastUsed ? ' <span class="sku">' + esc(d.lastUsed) + '</span>' : '') +
      (d.status === 'approved'
        ? ' <button class="btn small danger" type="button" data-revdev="' +
          esc(d.id) + '">Remove</button>' : '') +
      (d.status === 'pending'
        ? ' <button class="btn small primary" type="button" data-allowdev="' +
          esc(d.id) + '">Let in</button>' : '') +
      '</div>');
  });
  return out.join('');
}

function wireRequests() {
  var v = el('view');
  if (!v) return;
  function act(attr, fn, word) {
    var btns = v.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var id = this.getAttribute(attr);
        var b = this;
        if (word === 'Remove' && !window.confirm(
            'Stop this device working?\n\nThey can ask again from it later.')) return;
        b.disabled = true; b.textContent = '…';
        srv(fn, [id], function (res) {
          DEVS = res.devices;
          if (res.people) STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
          toast(word === 'Let in' ? 'Allowed. They can start now.'
               : word === 'Refuse' ? 'Refused.' : 'That device can no longer be used.');
          repaint();
        }, function (e) {
          b.disabled = false; b.textContent = word;
          toast(esc(e && e.message ? e.message : e), true, 12000);
        });
      });
    }
  }
  act('data-allowdev', 'erpAllowDevice', 'Let in');
