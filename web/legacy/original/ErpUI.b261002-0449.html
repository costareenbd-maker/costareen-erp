/**
 * Staff, links and people in one trip.
 *
 * Three separate calls queued ahead of the heavy customers/invoices bundle
 * and pushed it past its watchdog. One call cannot do that, and a section
 * that fails reports itself instead of taking the others down.
 */
var ADMIN_ASKED = false;

function loadAdmin(force) {
  if (ADMIN_ASKED && !force) return;
  ADMIN_ASKED = true;
  srv('erpAdmin', [], function (res) {
    STAFF = (res && res.staff) || null;
    STAFF_ERR = (res && res.staffError) || null;
    DEVS = (res && res.devices) || null;
    LINKS = (res && res.links) || null;
    LINKS_ERR = (res && res.linksError) || null;
    PEOPLE = (res && res.people) || null;
    PEOPLE_ERR = (res && res.peopleError) || null;
    if (PEOPLE && res.warning) PEOPLE.warning = res.warning;
    if (VIEW === 'settings') repaint();
  }, function (e) {
    var msg = (e && e.message) ? e.message : String(e);
    STAFF = LINKS = PEOPLE = null;
    STAFF_ERR = LINKS_ERR = PEOPLE_ERR = msg;
    ADMIN_ASKED = false;              // let it be tried again
    if (VIEW === 'settings') repaint();
  });
}

function wireStaff() {
  var v = el('view');
  if (!v) return;

  var add = el('st_add');
  if (add) add.addEventListener('click', function () {
    var name = (el('st_name').value || '').trim();
    if (!name) { toast('Type their name.', true); return; }
    add.disabled = true; add.textContent = 'Adding…';
    srv('erpAddPerson', [{ name: name,
                           phone: (el('st_phone').value || '').trim(),
                           role: el('st_role').value }], function (res) {
      add.disabled = false; add.textContent = 'Add person';
      NEWCODE = { name: res.name, code: res.code };
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      repaint();
    }, function (e) {
      add.disabled = false; add.textContent = 'Add person';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  var hide = el('st_hide');
  if (hide) hide.addEventListener('click', function () { NEWCODE = null; repaint(); });

  function act(attr, fn) {
    var btns = v.querySelectorAll('button[' + attr + ']');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { fn(this.getAttribute(attr), this); });
    }
  }

  act('data-allow', function (id, b) {
    b.disabled = true; b.textContent = 'Allowing…';
    srv('erpApproveDevice', [id], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Allowed. They can use the ERP now.');
      repaint();
    }, function (e) {
      b.disabled = false; b.textContent = 'Allow';
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  act('data-newphone', function (id, b) {
    if (!window.confirm('Let this person set up a new phone?\n\n' +
        'Their current phone stops working until you allow the new one.')) return;
    b.disabled = true;
    srv('erpResetCode', [{ id: id, newCode: false }], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Ready. Ask them to enter their code on the new phone.');
      repaint();
    }, function (e) {
      b.disabled = false;
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });

  act('data-revoke', function (id, b) {
    if (!window.confirm('Revoke this person?\n\nTheir code stops working straight away.')) return;
    b.disabled = true;
    srv('erpRevokePerson', [id], function (res) {
      STAFF = { people: res.people, roles: STAFF.roles, iAm: STAFF.iAm };
      toast('Revoked.');
      repaint();
    }, function (e) {
      b.disabled = false;
      toast(esc(e && e.message ? e.message : e), true, 12000);
    });
  });
}

function wireAiCard() {

    srv('erpAiKeyCreate', [{ name: name, role: role }], done, bad);
  });
  var cp = el('ai_copy');
  if (cp) cp.addEventListener('click', function () {
    var f = el('ai_fresh'); f.select();
    try { navigator.clipboard.writeText(f.value).then(function () { toast('Copied.'); }, function () { document.execCommand('copy'); toast('Copied.'); }); }
    catch (x) { try { document.execCommand('copy'); toast('Copied.'); } catch (y) { toast('Select it and copy by hand.', true); } }
  });
  var hd = el('ai_hide');

  for (var i = 0; i < sets.length; i++) sets[i].addEventListener('click', function () {

function repaint() {
  var h = VIEW === 'dash' ? viewDash()
        : VIEW === 'products' ? viewProducts()
        : VIEW === 'invoice' ? viewInvoice()
        : VIEW === 'stock' ? viewStock()
        : VIEW === 'customers' ? viewCustomers()
        : VIEW === 'profit' ? viewProfit()
        : VIEW === 'expenses' ? viewExpenses()
        : VIEW === 'sales' ? viewSales()
        : VIEW === 'quotes' ? viewQuotes()
        : VIEW === 'campaigns' ? viewCampaigns()
        : VIEW === 'weborders' ? viewWebOrders()
        : VIEW === 'costs' ? viewCosts()
        : VIEW === 'settings' ? viewSettings()
        : VIEW === 'tools' ? viewTools()
        : viewOrders();
  el('view').innerHTML = h;
  // One broken wiring call used to throw here AFTER the HTML was already on
  // screen, which killed whatever the caller meant to do next - that is how a
  // missing function turned into a panel that loaded forever with no error.
  // Wiring failures are now reported instead of silently aborting the caller.
  try {
    bindTips(el('view'));
    wirePhones();                 // before the view's own listeners, so they read the cleaned number
    if (VIEW === 'products') wireProducts();
    if (VIEW === 'invoice') wireInvoice();
    if (VIEW === 'stock') wireStock();
    if (VIEW === 'customers') { wireCustomers(); wireDueBox(); wireStatements(); }
    if (VIEW === 'profit') wireProfit();
    if (VIEW === 'expenses') wireExpenses();
    if (VIEW === 'sales') { wireSales(); wireDueBox(); wireSfp(); }
    if (VIEW === 'quotes') { wireQuotes(); if (QZ.sub === 'letter') wireLetter(); }
    if (VIEW === 'campaigns') wireCampaigns();
    // the parcel confirmation floats above whatever screen is open
    var pb = document.getElementById('parcelbox');
    if (pb && pb.parentNode) pb.parentNode.removeChild(pb);
    var box = parcelBox();
    if (box) {
      var w = document.createElement('div');
      w.id = 'parcelbox'; w.innerHTML = box;
      document.body.appendChild(w);
    }
    if (VIEW === 'weborders') { wireWebOrders(); wireCourier(); }
    sendCount();
    if (VIEW === 'settings') { wireCourierKeys(); wireEvoSettings(); }
    if (PARCEL || VIEW === 'orders' || VIEW === 'sales') wireParcel();
    if (VIEW === 'tools') wireTools();
    if (VIEW === 'settings') { wireSettings(); wireLinks(); wireStaff(); wireRequests(); }
    if (VIEW === 'costs') wireCosts();
    if (VIEW === 'dash') wireDash();
    if (PRODUCT_FORM) wireProductForm();
    if (CUST_FORM) wireCustomerForm();
  } catch (err) {
    var m = 'Screen wiring failed on "' + VIEW + '": ' + (err && err.message ? err.message : err);
    try { dbgSet(m, true); } catch (e2) {}
    try { toast(esc(m), true, 15000); } catch (e3) {}
  }
}

function go(view) {

  for (var i = 0; i < b.length; i++) {
    b[i].setAttribute('aria-selected', b[i].getAttribute('data-view') === view ? 'true' : 'false');
    if (b[i].getAttribute('data-view') === view) {
      var pt = el('pageTitle');

    }

  window.scrollTo(0, 0);
  repaint();
  if (view === 'orders' && !ORDERS) loadOrders();

  // also fetched at start-up WITHOUT them, so having customers is not
  // enough - that is how the badges went missing.

  }
  if (view === 'stock' && !PLAN && !PLAN_ERR) loadPlan();
  if (view === 'stock' && !PO) loadPo();
  if (view === 'settings' && !SFKEYS) loadKeyStatus();
  if (view === 'weborders' && !WEB) loadWeb();
  if (view === 'weborders' && !COURIER && !COURIER_ERR) loadCourier();
  if (view === 'stock' && !HIST) loadHistory();
  if (view === 'settings' && !SETTINGS) loadSettings();
  if (view === 'settings') loadAdmin(false);
  if (view === 'costs' && !COSTS) loadCosts();
  if ((view === 'products' || view === 'stock') && !LISTS) loadLists();
}

}

function loadOrders() {
  srv('erpRecentInvoices', [60], function (o) {
    ORDERS = o; ORDERS_ERR = null;
    if (VIEW === 'orders') repaint();
  }, function (e) {
    ORDERS = []; ORDERS_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'orders') repaint();
  });
}

function loadCustomers() {
  srv('erpCustomers', [], function (c) {
    CUST = c; CUST_ERR = null;
    if (VIEW === 'customers') repaint();
  }, function (e) {
    CUST = []; CUST_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'customers') repaint();
  });
}

function loadWeb() {
  srv('erpWebOrders', [], function (w) {
    WEB = w; updateCounts();
    if (VIEW === 'weborders') repaint();
  }, function (e) {
    WEB = [];
    toast('Could not read WEB_ORDERS: ' + esc(e && e.message ? e.message : e), true, 10000);
    if (VIEW === 'weborders') repaint();
  });
}

function loadHistory() {
  srv('erpStockHistory', [60], function (t) {
    HIST = t; HIST_ERR = null;
    if (VIEW === 'stock') repaint();
  }, function (e) {
    HIST = []; HIST_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'stock') repaint();
  });
}

function loadLists() {
  srv('erpSettingsLists', [], function (l) {
    LISTS = l; LISTS_ERR = null;
    if (VIEW === 'products' || VIEW === 'stock' || VIEW === 'invoice') repaint();
  }, function (e) {
    LISTS = {}; LISTS_ERR = (e && e.message) ? e.message : String(e);
    if (VIEW === 'products' || VIEW === 'stock' || VIEW === 'invoice') repaint();
  });
}

function loadAll() {
  srv('erpDashboardData', [], function (d) {
    D = d;
    el('stamp').textContent = 'as of ' + d.generatedAt + ' · ' + d.monthLabel + ' to date';
    if (VIEW === 'dash') repaint();
  }, function (e) {
    toast('Dashboard failed: ' + esc(e && e.message ? e.message : e), true, 10000);
  });

  srv('erpCatalog', [], function (c) {
    CAT = c; updateCounts();
    // Every screen that reads CAT must repaint, or it sits on "Loading..."
    // forever with the data already here.
    if (VIEW === 'products' || VIEW === 'invoice' || VIEW === 'stock') repaint();
  }, function (e) {
    CAT = [];
    toast('Product list failed: ' + esc(e && e.message ? e.message : e), true, 10000);
    repaint();
  });

  if (!OPT) {
    srvOpt();
  }
}

function srvOpt() {
  srv('erpFormOptions', [], function (o) {
      OPT = o;
      if (!FORM.source && o.sources.length) FORM.source = o.sources[0];
      if (!FORM.method && o.paymentMethods.length) FORM.method = o.paymentMethods[0];
      if (!FORM.status && o.paymentStatuses.length) FORM.status = o.paymentStatuses[0];
      if (VIEW === 'invoice') repaint();
  }, function (e) {
    toast('Could not read the invoice dropdowns: ' + esc(e && e.message ? e.message : e), true, 10000);
  });

  // The Web Orders badge is the main "something needs doing" signal, so it
  // loads on boot rather than waiting for the tab to be opened.
  if (!WEB) loadWeb();
  if (!LISTS) loadLists();
}

(function () {
  var sel = el('bizSel');
  if (!sel) return;
  sel.addEventListener('change', function () {
    var v = sel.value;
    if (v === '__new') {
      loadBusinesses(function () { go('settings'); window.scrollTo(0, 0); });
      toast('Add the new business at the bottom of Settings.');
      return;
    }
    switchBusiness(v);
  });
})();

el('reloadBtn').addEventListener('click', function () {
  D = null; CAT = null; ORDERS = null; CUST = null; WEB = null; HIST = null; LISTS = null;
  repaint(); loadAll();
  if (VIEW === 'customers') loadCustomers();
  if (VIEW === 'stock') loadHistory();
  if (VIEW === 'orders') loadOrders();
});

var menuBtn = el('menuBtn');
if (menuBtn) menuBtn.addEventListener('click', function () { el('app').classList.toggle('navopen'); });
var navBackdrop = el('navBackdrop');
if (navBackdrop) navBackdrop.addEventListener('click', function () { el('app').classList.remove('navopen'); });

var themeBtn = el('themeBtn');

function applyTheme(t) {
  var theme = (String(t || '').toLowerCase() === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  // the button offers the OTHER mode, so it says what clicking will do
  if (themeBtn) themeBtn.textContent = (theme === 'dark') ? 'Light' : 'Dark';
  try { localStorage.setItem('cz_theme', theme); } catch (e) {}
  return theme;
}

themeBtn.addEventListener('click', function () {
  var now = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(now);
  // Saved per person on the server too, so it follows them to another
  // computer or phone, not just this browser.
  srv('erpSetTheme', [now], function () {}, function () {});
  repaint();
});

applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

signIn();

// =====================================================================
// v3.5 - ONE server call instead of six
//
// These redefine the loaders above. Function declarations are hoisted and
// the last definition wins, so this block is what actually runs.
//
// Why: each google.script.run was a separate Apps Script execution, and
// Apps Script queues executions per user. A queued call that never runs
// fires neither handler, so the screen waited forever with nothing to
// report. erpBundle() returns every section in a single execution.
// =====================================================================

/** The code this page was loaded with. The server says which it is running; when they differ the page is old. */
var ERP_BUILD = 'b261002-0449';
function staleBanner() {
  if (document.getElementById('staleBar')) return;
  var d = document.createElement('div');
  d.id = 'staleBar';
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:500;background:#b3261e;color:#fff;padding:10px 16px;font-weight:600;text-align:center;font-size:14px';
  d.textContent = 'The ERP was updated while this page was open. Close this tab and open the ERP again (or press Ctrl+Shift+R) before you do anything else.';
  document.body.appendChild(d);
}

function applyBundle(b) {
  if (!b) return;
  if (b.build && b.build !== ERP_BUILD) staleBanner();
  var e = (b && b.errors) || {};

  if (b.dash) {
    D = b.dash;
    try {
      el('stamp').textContent = 'as of ' + D.generatedAt + ' \u00b7 ' + D.monthLabel + ' to date';
    } catch (x) {}
  }
  if (b.catalog)   CAT = b.catalog;
  if (b.lists)   { LISTS = b.lists; LISTS_ERR = null; }
  if (b.options) {
    OPT = b.options;
    if (OPT) {
      if (!FORM.source && OPT.sources && OPT.sources.length) FORM.source = OPT.sources[0];
      if (!FORM.method && OPT.paymentMethods && OPT.paymentMethods.length) FORM.method = OPT.paymentMethods[0];
      if (!FORM.status && OPT.paymentStatuses && OPT.paymentStatuses.length) FORM.status = OPT.paymentStatuses[0];
    }
  }
  if (b.customers) { CUST = b.customers; CUST_ERR = null; }
  if (b.invoices)  { ORDERS = b.invoices; ORDERS_ERR = null; }
  if (b.history)   { HIST = b.history; HIST_ERR = null; }
  if (b.weborders) WEB = b.weborders;
  if (b.settings) { SETTINGS = b.settings; SET_ERR = null; }
  if (b.today) TODAY_STR = b.today;
  if (b.costs) { COSTS = b.costs; COST_ERR = null; }
  if (b.dues) { DUES = b.dues; DUES_ERR = null; updateDueCount(); }
  if (e.costs) { COSTS = null; COST_ERR = e.costs; }

  // A section that failed reports itself, instead of leaving a panel spinning.
  if (e.catalog)   CAT = CAT || [];
  if (e.lists)   { LISTS = {}; LISTS_ERR = e.lists; }
  if (e.customers) { CUST = []; CUST_ERR = e.customers; }
  if (e.invoices)  { ORDERS = []; ORDERS_ERR = e.invoices; }
  if (e.history)   { HIST = []; HIST_ERR = e.history; }
  if (e.weborders) WEB = [];
  if (e.settings) { SETTINGS = null; SET_ERR = e.settings; }
  if (e.dash) toast('Dashboard: ' + esc(e.dash), true, 10000);

  updateCounts();
  repaint();
}

/** Any section still null after a load would spin forever - show why instead. */
function settleEmpties() {
  if (CAT === null) CAT = [];
  if (LISTS === null) LISTS = {};
  if (CUST === null)  { CUST = [];   CUST_ERR   = CUST_ERR   || 'No response for customers.'; }
  if (ORDERS === null){ ORDERS = []; ORDERS_ERR = ORDERS_ERR || 'No response for invoices.'; }
  if (HIST === null)  { HIST = [];   HIST_ERR   = HIST_ERR   || 'No response for stock movements.'; }
  if (WEB === null) WEB = [];
  updateCounts();
  repaint();
}

function bundleFail(e) {
  var msg = (e && e.message) ? e.message : String(e);
  settleEmpties();
  toast('Could not load from the sheet: ' + esc(msg) +
        ' &nbsp; <a href="#" id="tRetry">Retry</a>', true, 20000);
  var r = el('tRetry');
  if (r) r.addEventListener('click', function (ev) { ev.preventDefault(); loadAll(); });
}

/**
 * Nothing is drawn until we know who is here.
 *
 * The owner is let through without a code - losing a code must never lock
 * the business out of its own system.
 */
function gateScreen() {
  var busy = GATE_BUSY;
  return '<div class="gate"><div class="gatecard">' +
    '<div class="gatetitle">' + esc((BIZ && BIZ.businesses && BIZ.businesses.length
        ? BIZ.businesses[0].name : 'Costareen')) + '</div>' +
    '<div class="sub" style="margin-bottom:16px">Enter your code to start.</div>' +
    (ME_MSG ? '<div class="note err" style="margin-bottom:14px"><div class="ico">✕</div>' +
              '<div>' + esc(ME_MSG) + '</div></div>' : '') +
    '<input class="i gatein" id="gate_code" inputmode="numeric" maxlength="6" ' +
      'autocomplete="off" placeholder="000000"' + (busy ? ' disabled' : '') + '>' +
    '<button class="btn primary" style="width:100%;margin-top:12px" type="button" ' +
      'id="gate_go"' + (busy ? ' disabled' : '') + '>' +
      (busy ? 'Checking…' : 'Start') + '</button>' +
    '<div class="sub" style="margin-top:14px">Do not have a code? Ask the owner ' +
    'to add you in Settings.</div>' +
    '</div></div>';
}

function wireGate() {
  var box = el('gate_code');
  var go = el('gate_go');
  if (box) { try { box.focus(); } catch (e) {} }
  function submit() {
    if (GATE_BUSY) return;
    var c = (box && box.value || '').replace(/\D/g, '');
    if (c.length < 4) { ME_MSG = 'Type the code you were given.'; paintGate(); return; }
    GATE_BUSY = true; ME_MSG = ''; paintGate();
    erpSetCode(c);
    srv('erpHello', [], function (res) {
      GATE_BUSY = false;
      if (res && res.ok) {
        ME = res; ME_MSG = '';
        startApp();
      } else {
        erpSetCode('');
        ME_MSG = (res && res.message) || 'Could not sign you in.';
        paintGate();
      }
    }, function (e) {
      GATE_BUSY = false;
      erpSetCode('');
      ME_MSG = (e && e.message) ? e.message : String(e);
      paintGate();
    });
  }
  if (go) go.addEventListener('click', submit);
  if (box) box.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') submit();
  });
}

/** Forget the code on this device, and go back to the code screen. */
function signOut() {
  if (!window.confirm('Sign out on this device?')) return;
  erpSetCode('');
  ME = null; ME_MSG = '';
  paintGate();
}

function paintGate() {
  var v = el('view');
  if (v) { v.innerHTML = gateScreen(); wireGate(); }
  try { el('nav').style.display = 'none'; el('side').style.display = 'none'; } catch (e) {}
}

/** Ask the server who this is, then either open the app or show the gate. */
function signIn() {
  srv('erpHello', [], function (res) {
    if (res && res.ok) { ME = res; startApp(); }
    else { ME = null; ME_MSG = (res && res.message) || ''; paintGate(); }
  }, function (e) {
    ME = null;
    ME_MSG = (e && e.message) ? e.message : String(e);
    paintGate();
  });
}

function startApp() {
  try { el('nav').style.display = ''; el('side').style.display = ''; } catch (e) {}
  var so = el('signoutBtn');
  if (so && !so.__wired) { so.__wired = true; so.addEventListener('click', signOut); }
  applyRole();
  loadAll(true);
}

/** Hide what this role may not use. The server refuses it too. */
function applyRole() {
  var role = (ME && ME.role) || 'owner';
  var rank = { sales: 1, manager: 2, shareholder: 3, owner: 4 }[role] || 0;
  // The dashboard is the shape of the business - the month's revenue, what
  // the stock is worth, the trend. That is not a manager's to see, so the
  // screen goes rather than being emptied out.
  var need = { dash: 3, costs: 3, settings: 3, tools: 3, profit: 3, expenses: 3, campaigns: 2,
               weborders: 2, stock: 2 };
  var btns = document.querySelectorAll('#nav button[data-view]');
  for (var i = 0; i < btns.length; i++) {
    var v = btns[i].getAttribute('data-view');
    var min = need[v] || 0;
    btns[i].style.display = (rank >= min) ? '' : 'none';
  }
  var grps = document.querySelectorAll('#nav .navgrp');
  for (var g = 0; g < grps.length; g++) {
    var any = false, n = grps[g].nextElementSibling;
    while (n && !n.classList.contains('navgrp')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
    grps[g].style.display = any ? '' : 'none';
  }
  var who = el('whoami');
  if (who) {
    who.textContent = (ME && ME.name ? ME.name : '') +
      (ME && ME.roleLabel ? ' · ' + ME.roleLabel : '');
    who.style.display = (ME && ME.name) ? '' : 'none';
  }
  // a manager can run more than one business, so they get the switcher too;
  // the list they are given holds only the ones they were put in
  try { el('bizSel').style.display = (rank >= 2) ? '' : 'none'; } catch (e) {}
  // signing out is for people with a code; the owner has none to forget
  var so = el('signoutBtn');
  if (so) so.style.display = (ME && !ME.implicit) ? '' : 'none';
  // send them somewhere they are allowed to be, not to a screen they cannot open
  var home = rank >= 3 ? 'dash' : 'products';
  if (!ME || rank < (need[VIEW] || 0)) VIEW = home;
}

function loadBusinesses(done) {
  srv('erpBusinesses', [], function (b) {
    applyBusinesses(b);
    if (done) done();
  }, function (e) {
    toast('Could not read the business list: ' + esc(e && e.message ? e.message : e), true, 12000);
    if (done) done();
  });
}
/** Put the list of businesses on the page. The logo is fetched after, so it never holds the first screen up. */
function applyBusinesses(b) {
    BIZ = b;
    var sel = el('bizSel');
    if (sel) {
      if (!b.businesses.length) {
        sel.innerHTML = '<option>No business shared with you</option>';
      } else {
        sel.innerHTML = b.businesses.map(function (x) {
          return '<option value="' + esc(x.id) + '"' +
                 (x.id === b.active ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('') + (b.canAdd ? '<option value="__new">+ Add a business\u2026</option>' : '');
      }
    }
    var cur = null;
    for (var i = 0; i < b.businesses.length; i++) if (b.businesses[i].id === b.active) cur = b.businesses[i];
    var nm = el('bizName');
    if (nm && cur) nm.textContent = cur.name;
    if (cur) { brandLetter(cur.name); brandLoad(cur.id); }
    if (b.theme) applyTheme(b.theme);
}

function switchBusiness(id) {
  srv('erpSetBusiness', [id], function (res) {
    toast('Switched to <strong>' + esc(res.name) + '</strong>.');
    // everything on screen belongs to the previous business
    D = CAT = CUST = ORDERS = LISTS = HIST = WEB = SETTINGS = null;
    OPT = null; CART = []; RECV = { supplier:'', reference:'', notes:'', lines:[] };
    PRODUCT_FORM = null; CUST_FORM = null;
    var nm = el('bizName'); if (nm) nm.textContent = res.name;
    brandLetter(res.name); brandLoad(id);
    loadAll();
  }, function (e) {
    toast(esc(e && e.message ? e.message : e), true, 12000);
    loadBusinesses();
  });
}

function loadAll(first) {
  if (!BIZ_READY) return;
  el('view').innerHTML = '<div class="loading">Loading&hellip;</div>';
  // Core first so the screen becomes usable quickly, then the rest. On the
  // very first load the list of businesses rides along, instead of being a
  // trip of its own that everything else waited behind.
  var core = (first === true ? ['biz'] : []).concat(['dash', 'catalog', 'lists', 'options']);
  srv('erpBundle', [core], function (b) {
    if (b && b.biz) applyBusinesses(b.biz);
    applyBundle(b);
    srv('erpBundle', [['customers', 'invoices', 'history', 'weborders']], function (b2) {
      applyBundle(b2);
      settleEmpties();
    }, bundleFail);
  }, bundleFail);
}

function loadOrders()    { srv('erpBundle', [['invoices']],  applyBundle, bundleFail); }
function loadCustomers() {
  // dues ride along: the badge beside each name comes from the same answer,
  // so opening this screen costs one call, not one per customer
  srv('erpBundle', [['customers', 'dues']], applyBundle, bundleFail);
}
function loadHistory()   { srv('erpBundle', [['history']],   applyBundle, bundleFail); }
function loadWeb()       { srv('erpBundle', [['weborders']], applyBundle, bundleFail); }
function loadLists()     { srv('erpBundle', [['lists']],     applyBundle, bundleFail); }
function loadSettings()  { srv('erpBundle', [['settings']],  applyBundle, bundleFail); }
function loadCosts()     { srv('erpBundle', [['costs']],     applyBundle, bundleFail); }
function srvOpt()        { srv('erpBundle', [['options']],   applyBundle, bundleFail); }

/** Tools: time every section so a slow or broken sheet is visible, not guessed at. */
function runSelfTest() {
  toast('Running diagnostics\u2026');
  srv('erpSelfTest', [], function (rows) {
    var h = '<div class="scroll"><table><thead><tr><th>Section</th><th class="num">Time</th>' +
            '<th class="num">Rows</th><th>Result</th></tr></thead><tbody>';
    (rows || []).forEach(function (r) {
      h += '<tr><td class="nm">' + esc(r.part) + '</td>' +
           '<td class="num">' + fmt(r.ms) + ' ms</td>' +
           '<td class="num">' + fmt(r.size) + '</td>' +
           '<td>' + (r.error
              ? '<span class="pill out">\u2715 ' + esc(r.error) + '</span>'
              : '<span class="pill ok">\u2713 OK</span>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    var box = el('selfTestOut');
    if (box) box.innerHTML = h; else toast('Diagnostics finished.');
  }, function (e) {
    var box = el('selfTestOut');
    var msg = '<div class="note err"><div class="ico">\u2715</div><div>' +
              esc((e && e.message) ? e.message : String(e)) + '</div></div>';
    if (box) box.innerHTML = msg; else toast('Diagnostics failed.', true);
  });
}

</script>
