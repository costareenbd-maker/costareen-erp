  h += '<div style="flex:1 1 300px"><div class="totals">'+
       '<div><span>Subtotal</span><span>'+fmt(t.sub)+'</span></div>'+
       '<div><span>Discount</span><span>'+(t.disc?'− '+fmt(t.disc):'0')+'</span></div>'+
       (t.itemDisc && t.invDisc ? '<div><span class="sku">per piece '+fmt(t.itemDisc)+' + invoice '+fmt(t.invDisc)+'</span><span class="sku">'+(Math.round(t.pct*10)/10)+'%</span></div>' : '')+
       '<div><span>Delivery</span><span>'+fmt(t.delivery)+'</span></div>'+
       '<div class="grand"><span>Grand total</span><span>'+OPT.currency+' '+fmt(t.grand)+'</span></div>'+
       '<div><span>Paid now</span><span>'+fmt(paidNow)+'</span></div>'+
       '<div class="due"><span>This invoice due</span><span>'+OPT.currency+' '+fmt(thisDue)+'</span></div>'+
       // Old debt is shown, never added to the grand total: adding it would
       // count last month's goods again in this month's sales.
       (prior > 0
         ? '<div><span>Previous balance</span><span>'+fmt(prior)+'</span></div>'+
           '<div class="grand"><span>Total they owe</span><span>'+
           OPT.currency+' '+fmt(prior + thisDue)+'</span></div>'
         : '')+
       '</div></div></div>';

  if (probs.length) {
    h += '<div class="note err" style="margin-top:16px"><div class="ico">✕</div><div>'+
         probs.map(esc).join('<br>')+'</div></div>';
  }

  h += '<div class="row" style="margin-top:16px; justify-content:flex-end">'+
       '<button class="btn" type="button" id="clearInv">Clear</button>'+
       '<button class="btn primary" type="button" id="saveInv"'+(SAVING?' disabled':'')+'>'+
       (SAVING ? 'Saving…' : 'Save invoice &amp; make PDF')+'</button></div>';
  h += '</div></section>';

  return h;
}

function wireInvoice() {
  function bindVal(id, key, isNum) {
    var n = el(id);
    if (!n) return;
    n.addEventListener('input', function () { FORM[key] = isNum ? num(n.value) : n.value; });
    n.addEventListener('change', function () {
      FORM[key] = isNum ? num(n.value) : n.value;
      if (isNum) repaint();
    });
  }
  bindVal('cphone','phone'); bindVal('cname','name'); bindVal('caddr','address');

  // The address warning updates itself as it is typed. Repainting the whole
  // invoice on every keystroke would be unusable, so this one line redraws
  // on its own.
  (function () {
    var box = el('caddr'), hint = el('addrHint');
    if (!box || !hint) return;
    var sel = el('csource');
    function redraw() {
      hint.innerHTML = isCourier(sel ? sel.value : FORM.source) ? addrHintHtml(box.value) : '';
    }
    box.addEventListener('input', function () {
      // Typing an address is the customer asking for a delivery. Until the
      // employee has chosen a method themselves, follow that: an address
      // means the courier, no address means they are collecting it.
      if (sel && !FORM.touched) {
        var want = box.value.trim() ? 'Steadfast courier' : 'Customer pickup';
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === want) { sel.value = want; FORM.source = want; break; }
        }
      }
      redraw();
    });
    if (sel) sel.addEventListener('change', function () {
      FORM.touched = true; FORM.source = sel.value; redraw();
      repaint();                       // the delivery charge depends on the method
    });
    // leaving the address box: the zone, and so the charge, may have changed
    box.addEventListener('change', function () { FORM.address = box.value; repaint(); });
  })();

  // A figure typed by a person is theirs; the suggestion stops overwriting it.
  var fd = el('fdel');
  if (fd) fd.addEventListener('input', function () { FORM.delTouched = true; FORM.delAuto = false; });
  var fz = el('fzone');
  if (fz) fz.addEventListener('change', function () { FORM.zone = fz.value; if (!fz.value) FORM.zoneEdit = false; repaint(); });
  var fzc = el('fzonechg');
  if (fzc) fzc.addEventListener('click', function () { FORM.zoneEdit = true; repaint(); });
  var fu = el('fdeluse');
  if (fu) fu.addEventListener('click', function () { FORM.delTouched = false; repaint(); });

  // A date the same as today is left blank, so the sheet keeps its live
  // =TODAY() formula and nothing has to be thought about for a normal sale.
  var dt = el('cdate');
  if (dt) dt.addEventListener('change', function () {
    FORM.date = (dt.value && dt.value !== TODAY_STR) ? dt.value : '';
    if (dt.value && TODAY_STR && dt.value > TODAY_STR) {
      dt.value = TODAY_STR; FORM.date = '';
      toast('An invoice cannot be dated in the future.', true);
    }
  });
  bindVal('csource','source'); bindVal('fmethod','method');
  bindVal('fdel','delivery', true);
  bindVal('finvdisc','invDisc', true);
  bindVal('fpaid','paidNow', true);

  var modes = el('view').querySelectorAll('button[data-paymode]');
  for (var pm = 0; pm < modes.length; pm++) {
    modes[pm].addEventListener('click', function () {
      FORM.payMode = this.getAttribute('data-paymode');
      if (FORM.payMode !== 'part') FORM.paidNow = 0;
      repaint();
    });
  }

  // collecting old money is done here because this is when it happens
  var take = el('acct_take');
  if (take) take.addEventListener('click', function () {
    if (!ACCT) return;
    var typed = window.prompt('How much did ' + ACCT.customer + ' pay?\n\n' +
                              'They owe ' + fmt(ACCT.balance) +
                              '. It clears their oldest invoices first.',
                              String(ACCT.balance));
    if (typed === null) return;
    var amount = num(typed);
    if (!(amount > 0)) { toast('Enter an amount.', true); return; }
    take.disabled = true; take.textContent = 'Saving…';
    srv('erpSettleDue', [{ phone: FORM.phone, name: FORM.name, amount: amount,
                           reason: 'payment', method: FORM.method || 'Cash' }],
      function (res) {
        ACCT = { customer: ACCT.customer, balance: res.balance,
                 count: (res.dues && res.dues.count) || 0,
                 invoices: (ACCT.invoices || []) };
        DUES = res.dues; if (typeof updateDueCount === 'function') updateDueCount();
        toast(res.balance > 0
          ? 'Recorded. ' + fmt(res.balance) + ' still owed.'
          : 'Settled in full.');
        loadAccount(FORM.phone, FORM.name);
      },
      function (e) {
        take.disabled = false; take.textContent = 'Take payment';
        toast(esc(e && e.message ? e.message : e), true, 12000);
      });
  });

  // name is required, so re-render on change to clear the blocking message
  var nm = el('cname');
  if (nm) nm.addEventListener('blur', repaint);

  var ph = el('cphone');
  if (ph) ph.addEventListener('blur', function () {
    var v = ph.value.trim();
    if (!v) return;
    if (phoneProblem(v)) { FORM.phone = v; repaint(); return; }   // say so now, not at Save
    var hint = el('custHint');
    if (hint) hint.innerHTML = '<div class="sub" style="margin:10px 0 0">Looking up&hellip;</div>';
    // Whatever the lookup finds, ask what this person owes: a customer with
    // an unpaid invoice needs showing even if nothing else about them changes.
    loadAccount(v, FORM.name);

    srv('erpLookupCustomer', [v],
        function (c) {
      if (!c) {
        if (hint) hint.innerHTML = '<div class="sub" style="margin:10px 0 0">New customer — they will be created on save.</div>';
        ACCT = null;
        return;
      }
      FORM.name = c.name; FORM.address = c.address;
      // how THIS order goes out is decided now, not inherited from last time
      if (c.phone) FORM.phone = c.phone;
      repaint();
      loadAccount(c.phone || v, c.name);
      var h2 = el('custHint');
      if (h2) h2.innerHTML = '<div class="note ok" style="margin-top:12px"><div class="ico">✓</div><div>'+
        'Existing customer — <strong>'+esc(c.name)+'</strong>, '+fmt(c.orders)+
        ' previous order(s), '+fmt(c.spent)+' spent.</div></div>';
    },
        function (e) {
      if (hint) hint.innerHTML = '<div class="note err" style="margin-top:12px"><div class="ico">✕</div><div>'+
        esc(e && e.message ? e.message : e)+'</div></div>';
    });
  });

  var npi = el('newProductInv');
  if (npi) npi.addEventListener('click', function () { quickStart('invoice', ''); });

  var s = el('isearch');
  if (s) {
    s.addEventListener('input', function () { iSearch = s.value; paintResults(); });
    paintResults();
  }

  var q = el('view').querySelectorAll('[data-qty]');
  for (var i = 0; i < q.length; i++) (function (n) {
    n.addEventListener('change', function () {
      CART[Number(n.getAttribute('data-qty'))].qty = Math.max(1, Math.round(num(n.value)));
      repaint();
    });
  })(q[i]);

  var dd = el('view').querySelectorAll('[data-disc]');
  for (var j = 0; j < dd.length; j++) (function (n) {
    n.addEventListener('change', function () {
      CART[Number(n.getAttribute('data-disc'))].discEach = Math.max(0, num(n.value));
      repaint();
    });
  })(dd[j]);

  var del = el('view').querySelectorAll('[data-del]');
  for (var d = 0; d < del.length; d++) (function (n) {
    n.addEventListener('click', function () {
      CART.splice(Number(n.getAttribute('data-del')), 1);
      updateCounts(); repaint();
    });
  })(del[d]);

  var c = el('clearInv');
  if (c) c.addEventListener('click', function () {
    CART = [];
    FORM.delivery = 0; FORM.advance = 0; FORM.invDisc = 0; FORM.delTouched = false; FORM.delAuto = false; FORM.zone = ''; FORM.zoneEdit = false;
    updateCounts(); repaint();
  });

  var sv = el('saveInv');
  if (sv) {
    sv.addEventListener('click', saveInvoice);
    sv.addEventListener('pointerdown', function () { SAVE_WANTED = new Date().getTime(); });
  }
  // the form was redrawn between the press and the release: finish what the press meant
  if (SAVE_WANTED && new Date().getTime() - SAVE_WANTED < 1500) {
    setTimeout(function () { if (SAVE_WANTED) saveInvoice(); }, 0);
  }
}
var SAVE_WANTED = 0;

function paintResults() {
  var box = el('iresults');
  if (!box) return;
  var q = iSearch.trim().toLowerCase();
  if (!q) { box.innerHTML = '<div class="empty">Start typing to find a product.</div>'; return; }
  var rows = CAT.filter(function (p) {
    if (String(p.status||'').toLowerCase() === 'discontinued') return false;
    return (p.name+' '+p.sku+' '+p.brand+' '+p.color).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 40);
  var newRow = '<div class="r" data-newp="1"><div><div class="nm" style="color:var(--series-1)">' +
    '+ Create new product' + (q ? ' \u201c' + esc(iSearch.trim()) + '\u201d' : '') + '</div>' +
    '<div class="sku">Not in the product list yet</div></div><div></div></div>';
  if (!rows.length) { box.innerHTML = newRow; wireInvPicks(box); return; }
  var h = '';
  rows.forEach(function (p) {
    var can = p.stock > 0 && p.sell > 0;
    h += '<div class="r'+(can?'':' dis')+'"'+(can?' data-pick="'+esc(p.sku)+'"':'')+'>'+
         '<div><div class="nm">'+esc(p.name)+'</div><div class="sku">'+esc(p.sku)+
         (p.brand?' · '+esc(p.brand):'')+' · '+fmt(p.stock)+' in stock</div></div>'+
         '<div style="text-align:right; white-space:nowrap">'+
         (p.sell ? '<strong>'+fmt(p.sell)+'</strong>' : '<span class="sku">no price</span>')+
         '<div>'+stateBadge(p.state)+'</div></div></div>';
  });
  box.innerHTML = h + newRow;
  wireInvPicks(box);
}

function wireInvPicks(box) {
  var picks = box.querySelectorAll('[data-pick]');
  for (var i = 0; i < picks.length; i++) (function (n) {
    n.addEventListener('click', function () { addToCart(n.getAttribute('data-pick')); repaint(); });
  })(picks[i]);
  var np = box.querySelector('[data-newp]');
  if (np) np.addEventListener('click', function () { quickStart('invoice', iSearch.trim()); });
}

function addToCart(sku) {
  var p = null;
  for (var i = 0; i < CAT.length; i++) if (CAT[i].sku === sku) { p = CAT[i]; break; }
  if (!p) return;
  for (var j = 0; j < CART.length; j++) {
    if (CART[j].sku === sku) { CART[j].qty += 1; updateCounts(); return; }
  }
  CART.push({ sku:p.sku, name:p.name, price:p.sell, qty:1, discEach:0, stock:p.stock, cat:p.cat });
  updateCounts();
}

function saveInvoice() {
  SAVE_WANTED = 0;
  if (SAVING) return;
  var probs = cartProblems();
  if (probs.length) { toast(probs.map(esc).join('<br>'), true); return; }
  var t = cartTotals();
  var msg = 'Save this invoice?\n\n' +
            FORM.name.trim() + '\n' +
            CART.length + ' product line(s), ' +
            CART.reduce(function (a, l) { return a + l.qty; }, 0) + ' unit(s)\n' +
            'Grand total: ' + OPT.currency + ' ' + fmt(t.grand) +
            (t.due > 0 ? '\nDue: ' + OPT.currency + ' ' + fmt(t.due) : '') +
            '\n\nStock will be deducted and a PDF saved to Drive.';
  if (!window.confirm(msg)) return;

  SAVING = true; repaint();
  srv('erpCreateInvoice', [{
      customer: { name:FORM.name.trim(), phone:FORM.phone.trim(),
                  address:FORM.address.trim(), source:FORM.source },
      items: CART.map(function (l) {
        return { sku:l.sku, qty:l.qty, discEach:num(l.discEach) };
      }),
      invoiceDiscount: Math.max(0, Math.round(num(FORM.invDisc))),
      deliveryCharge: num(FORM.delivery),
      payMode: FORM.payMode || 'full',
      paidNow: num(FORM.paidNow),
      advancePaid: num(FORM.advance),
      paymentMethod: FORM.method,
      paymentStatus: FORM.status,
      date: FORM.date || ''
    }],
      function (res) {
      SAVING = false;
      CART = [];
      // date goes back to blank, so a backdated invoice does not silently
      // set the date for every sale after it
      ACCT = null;
      FORM = { payMode:'full', paidNow:0, phone:'', name:'', address:'', source:(OPT.sources[0] || 'Customer pickup'),
               touched:false, method:FORM.method,
               status:FORM.status, delivery:0, advance:0, date:'' };
      iSearch = '';
      invoiceDone(res);
      updateCounts();
      // Stock moved, so the catalogue is refetched - that is what the next
      // sale reads. The dashboard, invoice list and history are only marked
      // stale: reloading all of them here made the employee wait another
      // half minute before they could start the next customer.
      D = null; ORDERS = null; HIST = null; PLAN = null; DUES = null;
      srv('erpBundle', [['catalog']], applyBundle, function () {});
    },
      function (e) {
      SAVING = false; repaint();
      toast('Could not save: ' + esc(e && e.message ? e.message : e), true, 12000);
    });
}

// =====================================================================
// view: invoices
// =====================================================================
/**
 * Every sale, in one place.
 *
 * The invoice number opens the PDF that was saved when the sale was made.
 * Nothing here edits a sale: what can be done to one - take goods back,
 * take a payment, send the parcel - is a button that records a new event
 * beside it.
 */
/**
 * Courier money: every Steadfast payout, what it held, and what is still
 * with them. Filled from Steadfast's own records - nothing is typed.
 */
var SFP = null, SFP_ERR = null, SFP_OPEN = false, SFP_LINES = {};

function courierMoneyHtml() {
  if (!ME || !(ME.role === 'manager' || ME.role === 'shareholder' || ME.role === 'owner')) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section><div class="card"><div class="row" style="align-items:center;gap:8px">' +
    '<h2 style="margin:0;flex:1">Steadfast money</h2>' +
    '<button class="btn small" type="button" id="sfp_toggle">' + (SFP_OPEN ? 'Close' : 'Open') + '</button></div>';
  if (!SFP_OPEN) {
    return h + '<div class="sub">Every payout Steadfast made, parcel by parcel, and what they are still holding. Checked against your invoices by itself every night \u2014 the dashboard tells you only when you are needed.</div></div></section>';
  }
  if (SFP_ERR) return h + '<div class="note err"><div class="ico">✕</div><div>' + esc(SFP_ERR) + '</div></div></div></section>';

  h += sfpCheckHtml(cur);

  }

      '<div class="scroll" style="margin-top:6px"><table><tbody>' + SFP.pending.map(function (p) {
        return '<tr><td><input type="checkbox" data-sfpc="' + esc(p.consignment) + '" checked></td><td>' + esc(p.invoice) +

      fmt(SFP.waiting.length) + ')</summary><div class="scroll"><table><tbody>' + SFP.waiting.map(function (w) {
        return '<tr><td>' + esc(w.invoice) + '</td><td>' + esc(w.customer) + '</td><td>' + cidHtml(w.consignment) +
          '</td><td class="num">' + fmt(w.cod) + '</td><td class="sku">' + esc(w.booked) + '</td></tr>';

    '<th>Matched</th></tr></thead><tbody>';
  SFP.payouts.forEach(function (p) {

      '</td><td class="num">' + fmt(p.delivery) +
      (dgap === null ? '' : '<br><span class="sku"' + (dgap < -0.5 ? ' style="color:var(--critical)"' : '') + '>you charged ' + fmt(p.charged) +

      '</td><td class="num">' + fmt(p.fee) + '</td><td class="num"><strong>' +
      fmt(p.paid) + '</strong></td><td class="sku">' + fmt(m.exact || 0) + ' exact · ' + fmt(m.phone || 0) + ' by phone · ' +

      }).join('') + '</tbody></table></div></td></tr>';
    }
  });
  return h + '</tbody></table></div></div></section>';

/** One parcel's verdict, as a word a person understands. */
function sfpCheckPill(x) {
  var a = x.check || x.action || '';
  if (a === 'ok') return '<span class="pill ok">✓ matches</span>';
  if (a === 'writeoff') return '<span class="pill low">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' less — written off</span>';
  if (a === 'extra') return '<span class="pill ok">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' more — delivery income</span>';
  if (a === 'review') return '<span class="pill out">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' less — your decision</span>';
  if (a === 'kept') return '<span class="pill low">' + fmt(x.gap !== undefined ? x.gap : x.amount) + ' still due</span>';
  if (a === 'settled') return '<span class="sku">closed earlier</span>';
  return '<span class="sku">not checked</span>';
}

/**
 * Every delivered parcel set against its invoice. Steadfast's figure is the
 * true one: small shortfalls are written off, extras are income, and only a
 * large shortfall is put in front of the owner.
 */
function sfpCheckHtml(cur) {
  var c = SFP.recon;
  if (!c) return '';
  var n = c.ok + c.writeoff + c.extra + c.kept + c.review.length;
  var h = '';
  if (c.review.length) {
    h += '<div class="note err" style="margin-bottom:10px"><div class="ico">!</div><div><strong>' + fmt(c.review.length) +
      ' parcel(s): Steadfast collected much less than the invoice.</strong> Over ' + fmt(c.limit) + ' is not written off without you.' +
      '<div class="scroll" style="margin-top:6px"><table><thead><tr><th>Invoice</th><th>Customer</th><th class="num">Invoice expected</th>' +
      '<th class="num">Steadfast collected</th><th class="num">Short</th><th></th></tr></thead><tbody>' + c.review.map(function (r) {
        return '<tr><td>' + esc(r.invoice) + '<br><span class="sku">' + esc(r.consignment) + '</span></td><td>' + esc(r.customer) + '</td><td class="num">' +
          fmt(r.expected) + '</td><td class="num">' + fmt(r.collected) + '</td><td class="num"><strong>' + fmt(r.amount) + '</strong></td>' +
          '<td class="num"><button class="btn small" type="button" data-sfrv="' + esc(r.consignment) + '" data-act="writeoff">Write off</button> ' +
          '<button class="btn small" type="button" data-sfrv="' + esc(r.consignment) + '" data-act="keep">Customer still owes</button></td></tr>';
      }).join('') + '</tbody></table></div></div></div>';
  }
  if (!n) return h;
  h += '<div class="note" style="margin-bottom:10px"><div class="ico">✓</div><div><strong>' + fmt(n) + ' delivered parcel(s) checked against their invoices.</strong> ' +
    fmt(c.ok) + ' matched exactly' +
    (c.writeoff ? ' · ' + fmt(c.writeoff) + ' came up short and were written off (' + esc(cur) + ' ' + fmt(c.writeoffSum) + ')' : '') +
    (c.extra ? ' · ' + fmt(c.extra) + ' brought more than invoiced, counted as delivery income (' + esc(cur) + ' ' + fmt(c.extraSum) + ')' : '') +
    (c.kept ? ' · ' + fmt(c.kept) + ' kept as due' : '') + '. Steadfast’s figure is always the one that stands.';
  if (c.list.length) {
    h += '<details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Show the ones that did not match (' + fmt(c.list.length) + ')</summary>' +
      '<div class="scroll" style="max-height:300px"><table><thead><tr><th>Invoice</th><th>Customer</th><th class="num">Invoice expected</th>' +
      '<th class="num">Steadfast collected</th><th>Result</th></tr></thead><tbody>' + c.list.map(function (r) {
        return '<tr><td>' + esc(r.invoice) + '</td><td>' + esc(r.customer) + '</td><td class="num">' + fmt(r.expected) + '</td><td class="num">' +
          fmt(r.collected) + '</td><td>' + sfpCheckPill(r) + '</td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }
  return h + '</div></div>';
}

function loadSfp() {
  srv('erpSfPayouts', [{}], function (r) { SFP = r; SFP_ERR = null; if (VIEW === 'sales') repaint();
    if (r && r.autoRecorded) { SALES = null; DUES = null; loadSales(); } },
    function (e) { SFP_ERR = (e && e.message) ? e.message : String(e); if (VIEW === 'sales') repaint(); });
}

function wireSfp() {
  var t = el('sfp_toggle');
  if (t) t.addEventListener('click', function () {
    SFP_OPEN = !SFP_OPEN;
    if (SFP_OPEN && !SFP) loadSfp();
    repaint();
  });
  var ls = el('view').querySelectorAll('button[data-sfpl]');
  for (var i = 0; i < ls.length; i++) ls[i].addEventListener('click', function () {
    var id = this.getAttribute('data-sfpl');
    if (SFP_LINES[id]) { delete SFP_LINES[id]; repaint(); return; }
    srv('erpSfPayoutLines', [{ payoutId: id }], function (r) { SFP_LINES[id] = r.lines; repaint(); },
        function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
  var rv = el('view').querySelectorAll('button[data-sfrv]');
  for (var q = 0; q < rv.length; q++) rv[q].addEventListener('click', function () {
    var b = this, cid = b.getAttribute('data-sfrv'), act = b.getAttribute('data-act');
    if (!window.confirm(act === 'writeoff'
        ? 'Write off the shortfall on this parcel? The invoice will be closed at what Steadfast collected.'
        : 'Keep the shortfall as due? The customer will show as still owing it.')) return;
    b.disabled = true;
    srv('erpSfReconDecide', [{ consignment: cid, decision: act }], function () {
      toast(act === 'writeoff' ? 'Written off.' : 'Kept as due.');
      SFP = null; SALES = null; DUES = null; loadSfp(); loadSales();
    }, function (e) { b.disabled = false; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var cf = el('sfp_confirm');
  if (cf) cf.addEventListener('click', function () {
    var ticks = el('view').querySelectorAll('input[data-sfpc]'), ids = [];
    for (var j = 0; j < ticks.length; j++) if (ticks[j].checked) ids.push(ticks[j].getAttribute('data-sfpc'));
    if (!ids.length) { toast('Tick at least one.', true); return; }
    cf.disabled = true; cf.textContent = 'Saving…';
    srv('erpSfConfirmMatches', [{ consignments: ids }], function (r) {
      toast(fmt(r.recorded) + ' invoice(s) marked paid.', false, 8000);
      SFP = null; SALES = null; DUES = null; loadSfp(); loadSales();
    }, function (e) { cf.disabled = false; cf.textContent = 'Mark the ticked ones paid'; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
}

 * QUOTATIONS
 * ---------------------------------------------------------------------
 * A price offer, made on this screen and printed to PDF. Four steps:
 * details, items, terms, review - with the A4 page drawn beside them as
 * it is typed. Nothing here moves stock or money.
 *
 * The business identity on the page comes from Quotations -> Settings of
 * the business that is open; nothing about any company is written into
 * this code. A saved quotation keeps the identity it was made with.
 *
 * Every change is kept in this browser as it is typed, so a refresh or a
 * failed save loses nothing - but that is a browser copy, and the screen
 * never calls it saved until the server has it.
 * ===================================================================== */
var QZ = { boot: null, err: '', sub: 'dash', quote: null, version: 0, dirty: false, step: 1, saving: false,
           list: null, listQ: { search: '', status: 'All' }, assets: {}, restored: false,
           setDraft: null, profDraft: null, snipDraft: null, pendingEdit: false };

  { catalogKey: 'item-002', name: 'Raptor Pro 3D Scanner', description: '', kind: 'Product', unit: 'unit', historicalRate: 250000, provenance: 'Original quotation' },
  { catalogKey: 'item-003', name: 'Bambu Lab Filament', description: '', kind: 'Product', unit: 'unit', historicalRate: 1700, provenance: 'Original quotation' },
  { catalogKey: 'item-004', name: 'Bambu Lab P1S global Ver.', description: '', kind: 'Product', unit: 'unit', historicalRate: 90000, provenance: 'Saved item; original unit "project" changed to unit - review' },

/** Totals: the same arithmetic as the server, line for line. */
function qzRound(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }
function qzTotals(q) {
  var items = q.items || [];
  var subtotal = qzRound(items.reduce(function (s, i) { return s + qzRound(Number(i.qty) * Number(i.rate)); }, 0));
  var discount = qzRound(Math.min(subtotal, q.discountType === 'Percent' ? subtotal * Number(q.discount) / 100 : Number(q.discount)));
  var tax = qzRound((subtotal - discount) * Number(q.vat) / 100);
  var total = qzRound(subtotal - discount + tax + Number(q.shipping));
  var advance = qzRound(total * Number(q.advance) / 100);
  return { subtotal: subtotal, discount: discount, tax: tax, total: total, advance: advance, balance: qzRound(total - advance) };
}
function qzMoney(n, cur) {
  return (cur || 'BDT') + ' ' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function qzAddDays(date, n) { var d = new Date(date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function qzUuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function qzReadiness(q) {
  var e = [];
  if (!String(q.title || '').trim()) e.push('Project title is required.');
  if (!q.items.length) e.push('Add at least one item.');
  if (q.items.some(function (i) { return !String(i.name).trim() || !(Number(i.qty) > 0); })) e.push('Each item needs a name and a quantity above zero.');
  if (q.validUntil < q.date) e.push('Validity date must not be earlier than the issue date.');
  if (!q.autoNumber && !String(q.number || '').trim()) e.push('Enter a quotation number.');
  if (q.discountType === 'Percent' && Number(q.discount) > 100) e.push('Discount cannot exceed 100%.');
  if (!QZ.boot || !String(QZ.boot.profile.name || '').trim()) e.push('Set the business name in Quotations → Settings.');
  return e;
}
function qzTermsFor(kind) {
  var s = QZ.boot.settings;
  return kind === 'Products' ? s.productTerms : kind === 'Services' ? s.serviceTerms : s.mixedTerms;
}
function qzNew() {
  var s = QZ.boot.settings, today = QZ.boot.today;
  return { id: qzUuid(), number: '', kind: 'Mixed', title: '', customer: '', contact: '', email: '', phone: '', address: '',
           date: today, validUntil: qzAddDays(today, s.validDays), currency: s.currency, items: [],
           discountType: 'Percent', discount: 0, vat: 0, shipping: 0, advance: 0, terms: s.mixedTerms, notes: '',
           showBank: true, showSignature: true, useSignature: false,
           bankIds: (QZ.boot.profile.banks || []).map(function (b) { return b.id; }),
           theme: s.theme, accent: s.accent, dark: s.dark || '#303030', font: s.font || 'Arial', fontSize: s.fontSize,
           autoNumber: s.autoNumber, status: 'Draft', company: null };
}

function qzCompany(q) {
  // a saved quotation shows the identity it was saved with; a new one, today's
  return q.company || QZ.boot.profile;

/**
 * A logo file usually carries a wide empty border, and on the page that
 * border makes the mark itself look small. Find the box that actually has
 * ink in it (not transparent, not near-white) and keep a cropped copy for
 * the quotation header. The stored file is never changed, and anything
 * that cannot be measured is simply shown as it is.
 */
function qzTrimLogo(id) {
  var src = QZ.assets[id];
  if (!src || !/^data:image\//.test(src)) return;
  if (!QZ.trim) QZ.trim = {};
  imgTrim(src, 700, function (out) {
    if (!out) return;
    QZ.trim[id] = out;
    if (VIEW === 'quotes') qzRefreshPreview();
  });
}
/**
 * Cut the empty border off an image and hand back a copy no larger than
 * `maxOut` pixels on its long side. cb(null) when there is nothing to cut
 * or the picture cannot be measured - the caller then shows it as it is.
 * `always` asks for the scaled copy even when no border was found.
 */
function imgTrim(src, maxOut, cb, always) {
  var im = new Image();
  im.onerror = function () { cb(null); };
  im.onload = function () {
    try {
      var W = im.naturalWidth, H = im.naturalHeight;
      if (!W || !H) { cb(null); return; }
      var k = Math.min(1, 400 / Math.max(W, H)), w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var g = cv.getContext('2d'); g.drawImage(im, 0, 0, w, h);
      var px = g.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var p = (y * w + x) * 4;
        if (px[p + 3] < 24 || (px[p] > 242 && px[p + 1] > 242 && px[p + 2] > 242)) continue;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      if (x1 < 0) { cb(null); return; }
      var pad = Math.round(Math.max(w, h) * 0.015);
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
      var whole = (x1 - x0 + 1) > w * 0.94 && (y1 - y0 + 1) > h * 0.94;      // no border worth cutting
      if (whole && !always) { cb(null); return; }
      if (whole) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
      var sx = x0 / k, sy = y0 / k, sw = (x1 - x0 + 1) / k, sh = (y1 - y0 + 1) / k;
      var o = Math.min(1, maxOut / Math.max(sw, sh));
      var out = document.createElement('canvas'); out.width = Math.max(1, Math.round(sw * o)); out.height = Math.max(1, Math.round(sh * o));
      out.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, out.width, out.height);
      cb(out.toDataURL('image/png'));
    } catch (e) { cb(null); }
  };
  im.src = src;
}

var BRAND = { id: '', src: '', letter: 'C', biz: '' };

/** A full-size logo just came from the server (or the upload box): keep a small copy and show it. */
function brandSet(id, full) {

function qzChunks(text, size) {
  size = size || 480;
  var out = [];
  String(text || '').split('\n').forEach(function (line) {

      out.push(line.slice(0, n)); line = line.slice(n).replace(/^\s+/, '');

    out.push(line);
  });
  while (out.length && !out[out.length - 1].trim()) out.pop();
  return out;
}

/**
 * Lay the blocks out on A4 pages: header and footer repeated, the item
 * heading repeated when a table carries on, a heading never left alone at
 * the bottom of a page. Measured at full size, off screen.
 */
function qzPaginate(q, target) {
  var src = document.createElement('div');
  src.className = 'qz-src';
  src.style.cssText = 'position:fixed;left:-20000px;top:0;width:794px';
  src.innerHTML = qzHeaderHtml(q) + '<div class="doc-blocks">' + qzBlocksHtml(q) + '</div>' + qzFooterHtml(q);
  document.body.appendChild(src);
  target.innerHTML = '';
  var page, body, count = 0;
  function addPage() {
    page = document.createElement('section');
    page.className = 'quote-page ' + String(q.theme || 'Signature').toLowerCase();
    page.style.setProperty('--quote-accent', q.accent || '#dda51c');
    page.style.setProperty('--quote-dark', q.dark || '#303030');
    page.style.setProperty('--quote-font', q.font || 'Arial');
    page.style.fontSize = q.fontSize === 'Compact' ? '13px' : '14px';
    page.appendChild(src.querySelector('.doc-header').cloneNode(true));
    body = document.createElement('div'); body.className = 'doc-body'; page.appendChild(body);
    page.appendChild(src.querySelector('.doc-footer').cloneNode(true));
    target.appendChild(page); count++;
  }
  addPage();
  Array.prototype.slice.call(src.querySelector('.doc-blocks').children).forEach(function (block) {
    var clone = block.cloneNode(true);
    body.appendChild(clone);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) {
      clone.parentNode.removeChild(clone);
      var prev = body.lastElementChild;
      var carry = prev && (prev.classList.contains('doc-section-label') || prev.classList.contains('doc-table-head')) ? prev : null;
      if (carry) carry.parentNode.removeChild(carry);
      addPage();
      if (carry) body.appendChild(carry);
      else if (clone.classList.contains('doc-row') && !clone.classList.contains('doc-table-head')) {
        body.appendChild(src.querySelector('.doc-table-head').cloneNode(true));
      }
      body.appendChild(clone);
    }
  });
  Array.prototype.slice.call(target.querySelectorAll('.page-number')).forEach(function (n, i) { n.textContent = (i + 1) + ' / ' + count; });
  src.parentNode.removeChild(src);
  return count;
}
function qzRefreshPreview() {
  var host = el('qz_pages'), wrap = el('qz_preview');
  if (!host || !wrap || !QZ.quote) return;
  var n = qzPaginate(QZ.quote, host);
  var scale = Math.min(1, (wrap.clientWidth - 2) / 794);
  host.style.transform = 'scale(' + scale + ')';
  host.style.transformOrigin = 'top left';
  host.parentNode.style.height = Math.ceil(n * 1123 * scale + (n - 1) * 20 * scale) + 'px';
  var cap = el('qz_pagecount');
  if (cap) cap.textContent = n + (n === 1 ? ' page' : ' pages') + ' · A4 · ' + QZ.quote.theme;
  var tot = el('qz_total');
  if (tot) tot.textContent = qzMoney(qzTotals(QZ.quote).total, QZ.quote.currency);
}

// ---- wiring --------------------------------------------------------------------
function qzEdited(full) {
  QZ.dirty = true; QZ.restored = false;
  if (QZ.quote.status === 'Ready') QZ.quote.status = 'Draft';        // an edit takes it back to draft
  if (QZ.saving) QZ.pendingEdit = true;
  qzKeep();
  var st = el('qz_state'); if (st) st.textContent = qzStateText();
  if (full) repaint(); else qzRefreshPreview();
}
function qzNum(v) { var n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; }

function qzSave(status, then) {
  if (QZ.saving) return;
  var q = JSON.parse(JSON.stringify(QZ.quote));
  q.status = status || 'Draft';
  q.items.forEach(function (it) { delete it.hint; });
  var refresh = !!(el('qz_refreshid') && el('qz_refreshid').checked);
  QZ.saving = true; QZ.pendingEdit = false;
  var st = el('qz_state'); if (st) st.textContent = 'Saving…';
  var key = qzUuid();
  function attempt(n) {
    srv('erpQuoteSave', [{ quote: q, expectedVersion: QZ.version, saveKey: key, refreshIdentity: refresh }], function (r) {
      QZ.saving = false;
      var saved = r.quote;
      if (QZ.pendingEdit) {
        // typed while saving: keep what was typed, take only what the server decided
        QZ.quote.number = saved.number; QZ.quote.company = saved.company; QZ.quote.createdAt = saved.createdAt;
        QZ.version = saved.version; QZ.dirty = true; qzKeep();
        toast('Saved as ' + esc(saved.number) + '. You kept typing, so save again to keep the latest changes.', false, 9000);
        repaint(); return;
      }
      QZ.quote = saved; QZ.version = saved.version; QZ.dirty = false; qzKeep(); qzForget();
      qzLoadAssets(saved.company || {});
      QZ.list = null;
      toast((status === 'Ready' ? 'Ready · ' : 'Saved · ') + esc(saved.number), false, 6000);
      repaint();
      if (then) then(saved);
    }, function (e) {
      var m = String(e && e.message ? e.message : e);
      if (n < 2 && /timed out|network|unavailable|busy/i.test(m)) { attempt(n + 1); return; }   // same key: cannot save twice
      QZ.saving = false; qzKeep();
      var s2 = el('qz_state'); if (s2) s2.textContent = qzStateText();
      toast(esc(m.replace(/^CONFLICT:\s*/, '')) + '<br>Your changes are still here and kept in this browser.', true, 20000);
    });
  }
  attempt(0);
}

/** Print the pages at full size. The print window's "Save as PDF" makes the file; text stays text. */
function qzPrint(q) {
  var box = el('qz_print');
  if (!box) { box = document.createElement('div'); box.id = 'qz_print'; document.body.appendChild(box); }
  qzPaginate(q, box);
  var old = document.title;
  document.title = (q.number || 'Quotation') + (q.title ? ' - ' + q.title : '');
  setTimeout(function () { window.print(); document.title = old; }, 150);
}

function wireQuotes() {
  function each(sel, ev, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener(ev, fn); }
  each('button[data-qzsub]', 'click', function () {

/* =====================================================================
 * LETTERHEAD DOCUMENTS
 * ---------------------------------------------------------------------
 * A Word letter, put on this business's letterhead. The letter's own
 * text is kept as written - including any address typed inside it; only
 * the header and footer come from the business profile.
 *
 * The design is the business's own: its style, its two colours, its font
 * and which side the logo sits on are set in Quotations -> Settings, and
 * stored in that business's sheet. Two businesses never share a look.
 *
 * The Word file is untrusted: it is read in this browser only, its markup
 * is rebuilt from a short list of safe tags, no external file is fetched,
 * and oversized or malformed archives are refused. Nothing is uploaded.
 * ===================================================================== */
var LZ = { html: '', name: '', warnings: [], size: 14, busy: false, err: '' };
var LZ_LIBS = {
  fflate: 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js',
  docx: 'https://cdn.jsdelivr.net/npm/docx@9.6.0/dist/index.iife.js'
};
var LZ_FONTS = ['Arial', 'Georgia', 'Times New Roman', 'Verdana', 'Trebuchet MS', 'Tahoma'];

function lzLoad(names, done, fail) {
  var i = 0;
  (function next() {
    if (i >= names.length) { done(); return; }
    var n = names[i++];
    if (window[n]) { next(); return; }
    var s = document.createElement('script');
    s.src = LZ_LIBS[n];
    s.onload = next;
    s.onerror = function () { fail('Could not load ' + n + '. Check the internet connection and try again.'); };
    document.head.appendChild(s);
  })();
}
function lzKey() { return 'czl:' + ((BIZ && BIZ.active) || '') + ':' + ((ME && ME.name) || '') + ':v1'; }
function lzKeep() {
  try { sessionStorage.setItem(lzKey(), JSON.stringify({ html: LZ.html, name: LZ.name, warnings: LZ.warnings, size: LZ.size })); }
  catch (e) { /* a letter with large images may not fit - it is simply not kept */ }
}
function lzRecall() {
  try { var k = JSON.parse(sessionStorage.getItem(lzKey()) || 'null'); if (k) { LZ.html = k.html; LZ.name = k.name; LZ.warnings = k.warnings || []; LZ.size = k.size || 14; } } catch (e) {}
}
function lzDesign() {
  var d = (QZ.boot && QZ.boot.letterhead) || {};
  return { style: d.style || 'Signature', accent: d.accent || '#dda51c', dark: d.dark || '#303030',
           font: d.font || 'Arial', logoSide: d.logoSide === 'right' ? 'right' : 'left' };
}

// ---- reading the Word file ------------------------------------------------------
var LZ_SAFE = { P: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, S: 1, DEL: 1, SUB: 1, SUP: 1, BR: 1,
                TABLE: 1, THEAD: 1, TBODY: 1, TR: 1, TD: 1, TH: 1, UL: 1, OL: 1, LI: 1, BLOCKQUOTE: 1, IMG: 1, SPAN: 1 };
/** Build a fresh DOM from the converted markup: no scripts, handlers, styles or outside URLs survive. */
function lzSanitize(html, warn) {
  var src = new DOMParser().parseFromString(html, 'text/html'), out = document.createElement('div'), dropped = {};
  function copy(node, parent) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(node.textContent || '')); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName;
    if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|FORM|LINK|META)$/.test(tag)) { dropped[tag] = 1; return; }
    if (!LZ_SAFE[tag]) { for (var i = 0; i < node.childNodes.length; i++) copy(node.childNodes[i], parent); return; }
    var el2 = document.createElement(tag.toLowerCase());
    if (tag === 'IMG') {
      var s = node.getAttribute('src') || '';
      if (!/^data:image\/(png|jpeg|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(s)) { dropped['an image that is not embedded'] = 1; return; }
      el2.setAttribute('src', s); el2.setAttribute('alt', node.getAttribute('alt') || 'Document image');
      ['width', 'height'].forEach(function (a) { var v = Number(node.getAttribute(a)); if (isFinite(v) && v > 0 && v <= 760) el2.setAttribute(a, String(v)); });
    }
    ['colspan', 'rowspan', 'start'].forEach(function (a) { var v = Number(node.getAttribute(a)); if (Math.floor(v) === v && v > 0 && v < 1000) el2.setAttribute(a, String(v)); });
    for (var j = 0; j < node.childNodes.length; j++) copy(node.childNodes[j], el2);
    parent.appendChild(el2);
  }
  for (var k = 0; k < src.body.childNodes.length; k++) copy(src.body.childNodes[k], out);
  Object.keys(dropped).forEach(function (t) { warn.push('Removed from the file: ' + t.toLowerCase() + '.'); });
  if (out.querySelector('ul ul, ol ol, ul ol, ol ul')) warn.push('The letter has lists inside lists. They show here, but the Word download flattens them into one level.');
  if (out.querySelector('td[colspan], td[rowspan], th[colspan], th[rowspan]')) warn.push('The letter has merged table cells. Check them in the Word download.');
  return out.innerHTML;
}
/** Image sizes as Word stored them, so pictures come back at their size and not the page width. */
function lzImageSizes(buf) {
  var total = 0, count = 0;
  var files = fflate.unzipSync(new Uint8Array(buf), { filter: function (f) {
    total += f.originalSize; count++;
    if (total > 40 * 1024 * 1024 || count > 1500) throw new Error('The document expands to more than 40 MB or 1,500 parts. It was not opened.');
    return f.name === 'word/document.xml';
  } });
  if (!files['word/document.xml']) throw new Error('This is not a valid Word (.docx) document.');
  var xml = new DOMParser().parseFromString(fflate.strFromU8(files['word/document.xml']), 'application/xml');
  var ext = xml.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing', 'extent');
  var out = [];
  for (var i = 0; i < ext.length; i++) out.push({ w: Math.round(Number(ext[i].getAttribute('cx')) / 9525), h: Math.round(Number(ext[i].getAttribute('cy')) / 9525) });
  return out;
}
function lzRestoreSizes(html, sizes) {
  var dom = new DOMParser().parseFromString(html, 'text/html'), imgs = dom.querySelectorAll('img');
  if (imgs.length === sizes.length) {
    for (var i = 0; i < imgs.length; i++) {
      var s = sizes[i];
      if (s.w > 0 && s.h > 0) { var k = Math.min(1, 690 / s.w, 760 / s.h); imgs[i].setAttribute('width', Math.round(s.w * k)); imgs[i].setAttribute('height', Math.round(s.h * k)); }
    }
  }
  return dom.body.innerHTML;
}
function lzImport(file) {
  LZ.err = '';
  if (/\.doc$/i.test(file.name)) {
    LZ.err = 'That is an old Word .doc file. Open it in Word (or LibreOffice / Google Docs), choose File → Save As → Word Document (.docx), then upload the .docx.';
    repaint(); return;
  }
  if (!/\.docx$/i.test(file.name)) { LZ.err = 'Only Word .docx files can be opened here.'; repaint(); return; }
  if (file.size > 10 * 1024 * 1024) { LZ.err = 'The file is over 10 MB. Reduce the images in Word and try again.'; repaint(); return; }
  LZ.busy = true; repaint();
  lzLoad(['fflate', 'mammoth'], function () {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var buf = fr.result, warn = [];
        var sizes = lzImageSizes(buf);
        mammoth.convertToHtml({ arrayBuffer: buf }, { includeEmbeddedStyleMap: false, externalFileAccess: false }).then(function (res) {
          (res.messages || []).forEach(function (m) { if (m.type !== 'info') warn.push('Word note: ' + m.message); });
          LZ.html = lzSanitize(lzRestoreSizes(res.value, sizes), warn);
          LZ.name = file.name; LZ.warnings = warn.slice(0, 20); LZ.busy = false;
          if (!LZ.html.replace(/<[^>]+>/g, '').trim() && LZ.html.indexOf('<img') < 0) LZ.err = 'The document looks empty.';
          lzKeep(); repaint();
        }, function (e) { LZ.busy = false; LZ.err = 'The Word file could not be read: ' + (e && e.message ? e.message : e); repaint(); });
      } catch (e2) { LZ.busy = false; LZ.err = e2 && e2.message ? e2.message : String(e2); repaint(); }
    };
    fr.readAsArrayBuffer(file);
  }, function (m) { LZ.busy = false; LZ.err = m; repaint(); });
}

// ---- the letterhead ---------------------------------------------------------------

/** Lay the letter out on pages; a paragraph too long for one page continues on the next. */
function lzPaginate(target) {
  var d = lzDesign();
  var src = document.createElement('div');
  src.style.cssText = 'position:fixed;left:-20000px;top:0;width:794px';
  src.innerHTML = lzHeaderHtml() + '<div class="letter-content">' + LZ.html + '</div>' + lzFooterHtml();
  document.body.appendChild(src);
  target.innerHTML = '';
  var body, pages = 0;
  function addPage() {
    var page = document.createElement('section');
    page.className = 'quote-page letter-page lh-' + d.style.toLowerCase();
    page.style.setProperty('--quote-accent', d.accent); page.style.setProperty('--quote-dark', d.dark);
    page.style.fontFamily = d.font + ', Arial, sans-serif'; page.style.fontSize = LZ.size + 'px';
    page.appendChild(src.querySelector('.letter-header').cloneNode(true));
    body = document.createElement('div'); body.className = 'letter-body'; page.appendChild(body);
    page.appendChild(src.querySelector('.letter-footer').cloneNode(true));
    target.appendChild(page); pages++;
  }
  function fits() { return body.scrollHeight <= body.clientHeight + 1; }
  function appendBlock(block) {
    body.appendChild(block); if (fits()) return;
    block.parentNode.removeChild(block);
    if (body.children.length) { addPage(); body.appendChild(block); if (fits()) return; block.parentNode.removeChild(block); }
    if (/^(P|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|LI)$/.test(block.tagName) && !block.querySelector('img,table')) {
      var text = block.textContent || '';
      if (text.length < 2) throw new Error('A block in the letter is too tall for a page. Reduce the text size.');
      function part(end, tail) {
        var w = document.createTreeWalker(block, NodeFilter.SHOW_TEXT), n, last = null, rem = end;
        while ((n = w.nextNode())) { last = n; if (rem <= (n.textContent || '').length) break; rem -= (n.textContent || '').length; }
        var r = document.createRange(); r.selectNodeContents(block);
        if (last) { if (tail) r.setStart(last, rem); else r.setEnd(last, rem); }
        var c = block.cloneNode(false); c.appendChild(r.cloneContents()); return c;
      }
      var lo = 1, hi = text.length, best = 0;
      while (lo <= hi) { var mid = Math.floor((lo + hi) / 2), t = part(mid); body.appendChild(t); var ok = fits(); body.removeChild(t); if (ok) { best = mid; lo = mid + 1; } else hi = mid - 1; }
      if (!best) throw new Error('The letter does not fit the letterhead. Reduce the text size.');
      if (best < text.length) { var sp = text.lastIndexOf(' ', best); if (sp > best / 2) best = sp + 1; }
      body.appendChild(part(best));
      if (best < text.length) { addPage(); appendBlock(part(best, true)); }
      return;
    }
    throw new Error('A table row or picture is taller than one page. Shorten that row or make the picture smaller in Word, then upload again.');
  }
  addPage();
  Array.prototype.slice.call(src.querySelector('.letter-content').children).forEach(function (elm) {
    if (elm.tagName === 'TABLE') {
      var table = document.createElement('table'), header = null;
      var rows = elm.querySelectorAll(':scope > tbody > tr, :scope > thead > tr, :scope > tr');
      Array.prototype.forEach.call(rows, function (row, ri) {
        var clone = row.cloneNode(true);
        if (!header && row.querySelector('th')) header = clone.cloneNode(true);
        if (!table.parentNode) body.appendChild(table);
        table.appendChild(clone);
        if (!fits()) {
          table.removeChild(clone); if (!table.children.length) table.parentNode.removeChild(table);
          addPage(); table = document.createElement('table'); body.appendChild(table);
          if (header && ri > 0) table.appendChild(header.cloneNode(true));
          table.appendChild(clone);
          if (!fits()) throw new Error('A table row is taller than a page. Shorten it in Word before exporting.');
        }
      });
    } else if (elm.tagName === 'UL' || elm.tagName === 'OL') {
      var idx = Number(elm.getAttribute('start') || 1);
      Array.prototype.forEach.call(elm.children, function (li) {
        var p = document.createElement('p');
        p.appendChild(document.createTextNode(elm.tagName === 'OL' ? (idx++) + '. ' : '• '));
        Array.prototype.forEach.call(li.cloneNode(true).childNodes, function (c) { p.appendChild(c); });
        appendBlock(p);
      });
    } else appendBlock(elm.cloneNode(true));
  });
  Array.prototype.forEach.call(target.querySelectorAll('.letter-page-number'), function (n, i) { n.textContent = (i + 1) + ' / ' + pages; });
  src.parentNode.removeChild(src);
  return pages;
}

/** A picture's bytes, turned into PNG when Word cannot take its format. */
function lzImageBytes(src) {
  return new Promise(function (resolve) {
    var m = /^data:image\/(png|jpeg|gif|webp);base64,([\s\S]*)$/.exec(src || '');
    if (!m) { resolve(null); return; }
    if (m[1] !== 'webp') {
      var bin = atob(m[2].replace(/\s+/g, '')), u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      resolve({ type: m[1] === 'jpeg' ? 'jpg' : m[1], data: u }); return;
    }
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      lzImageBytes(c.toDataURL('image/png')).then(resolve);
    };
    img.onerror = function () { resolve(null); };
    img.src = src;
  });
}
function lzDocx() {

    var logoSrc = p.logoId && QZ.assets[p.logoId];
    Promise.all(imgs.map(function (im) { return lzImageBytes(im.getAttribute('src')); }).concat([lzImageBytes(logoSrc)])).then(function (bytes) {
      var logo = bytes.pop(), map = new Map();
      imgs.forEach(function (im, i) { map.set(im, bytes[i]); });
      var half = LZ.size * 1.5, hex = function (c) { return String(c || '').replace('#', ''); };
      function runs(node, bold, ital) {
        if (node.nodeType === 3) return [new D.TextRun({ text: node.textContent || '', bold: bold, italics: ital })];
        if (node.nodeType !== 1) return [];
        if (node.tagName === 'BR') return [new D.TextRun({ break: 1 })];
        if (node.tagName === 'IMG') {
          var b = map.get(node);

          return [new D.ImageRun({ type: b.type, data: b.data, transformation: { width: Number(node.getAttribute('width')) || 160, height: Number(node.getAttribute('height')) || 80 } })];
        }
        var out = [];

        });

      function para(elm, prefix) {

          spacing: { after: 75, line: 270 }, keepNext: /^H[1-6]$/.test(elm.tagName),
          heading: elm.tagName === 'H1' ? D.HeadingLevel.HEADING_1 : elm.tagName === 'H2' ? D.HeadingLevel.HEADING_2 : undefined });

      function blocks(parent) {

              return new D.TableRow({ cantSplit: true, children: Array.prototype.map.call(row.children, function (cell) {
                var inner = blocks(cell);
                return new D.TableCell({ columnSpan: Number(cell.getAttribute('colspan')) || 1, rowSpan: Number(cell.getAttribute('rowspan')) || 1,
                  margins: { top: 60, bottom: 60, left: 100, right: 100 }, children: inner.length ? inner : [para(cell)] });
              }) });
            }) }));
            out.push(new D.Paragraph({ spacing: { after: 50 } }));
          } else if (elm.tagName === 'UL' || elm.tagName === 'OL') {
            var n = Number(elm.getAttribute('start')) || 1;
            // nested lists are flattened into one level, as the screen warns
            Array.prototype.forEach.call(elm.querySelectorAll('li'), function (li) { out.push(para(li, elm.tagName === 'OL' ? (n++) + '. ' : '• ')); });
          } else out.push(para(elm));
        });
        return out;
      }
      var centered = d.style === 'Centered', band = d.style === 'Band';
      var nameRun = new D.TextRun({ text: (logo ? '   ' : '') + (p.name || ''), bold: true, size: 36, color: band ? 'FFFFFF' : hex(d.dark),
                                    font: d.font });
      var headKids = [new D.Paragraph({ alignment: centered ? D.AlignmentType.CENTER : d.logoSide === 'right' ? D.AlignmentType.RIGHT : D.AlignmentType.LEFT,
        shading: band ? { type: D.ShadingType.SOLID, color: hex(d.dark), fill: hex(d.dark) } : undefined,
        children: (logo ? [new D.ImageRun({ type: logo.type, data: logo.data, transformation: { width: 52, height: 52 } })] : []).concat([nameRun]),
        spacing: { after: 80 } })];
      [p.address, [p.email, p.phone, p.website].filter(Boolean).join(' · ')].filter(Boolean).forEach(function (t) {
        headKids.push(new D.Paragraph({ alignment: centered ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
          children: [new D.TextRun({ text: t, size: 17, color: '59636F', font: d.font })], spacing: { after: 35 } }));
      });
      headKids.push(new D.Paragraph({ border: { bottom: { color: hex(d.accent), style: D.BorderStyle.SINGLE, size: 12 } }, spacing: { after: 80 } }));
      var doc = new D.Document({ creator: p.name || 'ERP', title: LZ.name.replace(/\.docx$/i, ''),
        styles: { default: { document: { run: { font: d.font, size: half, color: '20252B' }, paragraph: { spacing: { after: 75, line: 270 } } } } },
        sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 2700, bottom: 900, left: 780, right: 780, header: 450, footer: 400 } } },
          headers: { default: new D.Header({ children: headKids }) },
          footers: { default: new D.Footer({ children: [new D.Paragraph({ alignment: D.AlignmentType.RIGHT, children: [

          children: blocks(dom.body) }] });
      return D.Packer.toBlob(doc);
    }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (LZ.name.replace(/\.docx$/i, '') || 'letter') + ' - letterhead.docx';

/* =====================================================================
 * CAMPAIGNS
 * ---------------------------------------------------------------------
 * Choose customers with filters, write one message, then go down the list:
 * the ERP opens each customer's chat in YOUR WhatsApp with the message
 * already typed, you press send, and it moves to the next. The message
 * goes from your real number into the chat you already have with them.
 *
 * Nothing sends by itself - that is deliberate. A program that logs into
 * WhatsApp and sends for you is against WhatsApp's rules and gets numbers
 * banned; a person pressing send is simply you using WhatsApp.
 * ===================================================================== */
var CP = { aud: null, err: '', list: null, camp: null, openMode: 'app', copied: '',
           f: { q: '', last: '', pattern: '', due: '', cats: [], minSpent: '', skipRecent: '7', who: 'cust' },
           spread: true, leadText: '', leadSrc: '', leadRes: null, leadBusy: false,
           picked: {}, name: '',
           msg: 'Assalamu alaikum {name},\n\n{business} has fresh stock this month — please see the attached product list.\n\nReply here to order. Thank you!',
           // the product list, when it is attached or written into the message
           prod: { cats: [], stockOnly: true, prices: true, max: 80 },
           // what travels with the message: none, the list as a PDF, the list as a Google Sheet, or a file of your own
           attach: { src: 'pdf', file: null } };

// what the page is showing: which of the four places, and how far a new campaign has got
CP.msg0 = CP.msg;
CP.tab = 'list'; CP.step = 1; CP.when = 'spread'; CP.startOn = ''; CP.ctab = 'leads'; CP.leadQ = ''; CP.editLead = null; CP.msgEdit = null;
CP.connOpen = false; CP.testBusy = false; CP.testPhone = ''; CP.lead1 = { name: '', code: '+880', phone: '' };
try { CP.testPhone = localStorage.getItem('czcp_testphone') || ''; } catch (eTp) {}

function cpBusinessName() {
  var b = BIZ && BIZ.businesses ? BIZ.businesses.filter(function (x) { return x.id === BIZ.active; })[0] : null;
  return (QZ.boot && QZ.boot.profile && QZ.boot.profile.name) || (b && b.name) || '';
}
/** The customers the filters let through. */
function cpFiltered() {
  var f = CP.f, q = f.q.trim().toLowerCase();
  return (CP.aud ? CP.aud.customers : []).filter(function (c) {
    if (c.optedOut) return false;
    if (f.who === 'cust' && c.lead) return false;
    if (f.who === 'lead' && !c.lead) return false;
    if (q && (c.name + ' ' + c.phone + ' ' + (c.source || '')).toLowerCase().indexOf(q) < 0) return false;
    if (f.last === 'never' && c.orders) return false;
    if (/^in\d+$/.test(f.last) && (c.daysSince === null || c.daysSince > Number(f.last.slice(2)))) return false;
    if (/^out\d+$/.test(f.last) && (c.daysSince === null || c.daysSince <= Number(f.last.slice(3)))) return false;
    if (f.pattern === 'once' && c.orders !== 1) return false;
    if (f.pattern === 'repeat' && c.orders < 2) return false;
    if (f.due === 'yes' && !(c.due > 0)) return false;
    if (f.due === 'no' && c.due > 0) return false;
    if (f.minSpent && c.spent < Number(f.minSpent)) return false;
    if (f.cats.length && !f.cats.some(function (x) { return c.cats.indexOf(x) >= 0; })) return false;
    if (f.skipRecent && c.lastMessagedDays !== null && c.lastMessagedDays < Number(f.skipRecent)) return false;
    return true;
  });
}
/** The product list, as WhatsApp text: bold categories, one line per product. */
function cpProducts() {
  var p = CP.prod, by = {}, n = 0;
  (CAT || []).forEach(function (x) {
    if (String(x.status || '').toLowerCase() === 'discontinued') return;
    if (p.stockOnly && !(x.stock > 0)) return;
    if (p.cats.length && p.cats.indexOf(x.cat) < 0) return;
    (by[x.cat || 'Other'] = by[x.cat || 'Other'] || []).push(x);
  });
  var out = [];
  Object.keys(by).sort().forEach(function (c) {
    if (n >= p.max) return;
    out.push('*' + c + '*');
    by[c].sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); }).forEach(function (x) {
      if (n >= p.max) return;
      out.push('• ' + x.name + (p.prices && x.sell ? ' — ৳' + fmt(x.sell) : ''));
      n++;
    });
    out.push('');
  });
  return { text: out.join('\n').replace(/\n+$/, ''), count: n };
}

/**
 * Make the attachment ready for the chosen way of sending, then hand back
 * what to do with it: a link to add to the message, a file to attach, or
 * nothing.  mode: 'hand' (a link, since a chat link cannot carry a file),
 * 'evo' (a real attachment where the server can send one).
 */
function cpResolveAttach(mode, done, fail) {
  var a = CP.attach;
  if (a.src === 'none') { done({}); return; }
  if (a.src === 'file') {
    if (!a.file) { fail('Attach the file first.'); return; }
    if (mode === 'evo') { done({ file: a.file }); return; }

    return;

/** The chosen people, as the audience rows. */
function cpPicked() { return (CP.aud ? CP.aud.customers : []).filter(function (c) { return CP.picked[c.key] && !c.optedOut; }); }

    localStorage.setItem('czcp_draft', JSON.stringify({ name: CP.name, msg: CP.msg, att: CP.attach.src, f: CP.f, picked: keys.slice(0, 2500), when: CP.when, startOn: CP.startOn, step: CP.step, at: new Date().getTime() }));

}
function cpDraftRead() { try { return JSON.parse(localStorage.getItem('czcp_draft') || 'null'); } catch (e) { return null; } }

  CP.name = d.name || ''; CP.msg = d.msg || CP.msg0; CP.attach.src = /^(none|pdf|sheet)$/.test(d.att) ? d.att : 'none';
  CP.f = Object.assign({ q: '', last: '', pattern: '', due: '', cats: [], minSpent: '', skipRecent: '7', who: 'cust' }, d.f || {});
  CP.picked = {}; (d.picked || []).forEach(function (k) { CP.picked[k] = true; });

}

function cpFresh() {

  CP.f = { q: '', last: '', pattern: '', due: '', cats: [], minSpent: '', skipRecent: '7', who: 'cust' };
}

/** Where a campaign stands, in one word and a colour. */
function cpStatus(c) {
  var n = c.counts;

    if (c.startOn && c.startOn > todayISO()) return { word: 'Starts ' + c.startOn, cls: 'low' };

// ---- 2. a new campaign, four steps -------------------------------------------------
function cpStepProblem(step) {
  if (step === 1 && !cpPicked().length) return 'Choose at least one person.';
  if (step === 2 && !String(CP.msg || '').trim()) return 'Write the message.';
  if (step === 2 && cpMessageFor({ name: 'Karim' }, CP.msg, cpProducts().text).length > 4000) return 'The message is too long. Move the product list to the attachment.';
  if (step === 2 && CP.attach.src === 'file' && !CP.attach.file) return 'Attach the file, or choose another attachment.';
  if (step === 3 && CP.when === 'date' && !(CP.startOn > todayISO())) return 'Choose a date after today.';
  if (step === 3 && CP.when !== 'hand' && !(EVO.status && EVO.status.connected)) return 'WhatsApp is not linked, so only "by hand" can be used.';
  if (step === 3 && CP.when === 'now' && cpPicked().some(function (c) { return c.lead; })) return 'Leads are never sent all at once. Choose another way.';
  return '';
}

    var have = {}; CP.aud.customers.forEach(function (x) { if (!x.optedOut) have[x.key] = x; });
    c.recipients.forEach(function (r) { if (have[r.key]) CP.picked[r.key] = true; });
    CP.f.who = 'both'; CP.f.skipRecent = ''; CP.camp = null; CP.tab = 'new'; CP.step = 1; cpDraftSave(); repaint(); window.scrollTo(0, 0);
    toast('Copied. ' + fmt(Object.keys(CP.picked).length) + ' of ' + fmt(c.recipients.length) + ' people are still on your lists. Choose the attachment again in step 2.', false, 9000);
  }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
}

function cpExport(c) {
  var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = 'Name,Phone,Status,When,Note\r\n' + c.recipients.map(function (r) {
    return [q(r.name), q('="' + r.phone + '"'), q(r.status), q(r.at), q(String(r.by || '').split(' · ').slice(1).join(' · '))].join(','); }).join('\r\n');
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF) + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = String(c.name || 'campaign').replace(/[^\w\- ]+/g, '') + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Saved as a spreadsheet file (CSV).');
  } catch (e) { toast('This browser would not save the file.', true); }
}

function wireCampaigns() {
  function each(sel, ev, fn) { var n = el('view').querySelectorAll(sel); for (var i = 0; i < n.length; i++) n[i].addEventListener(ev, fn); }

  function savedOf(kind, id) { return ((CP.aud.saved && CP.aud.saved[kind]) || []).filter(function (x) { return x.id === id; })[0]; }

  each('button[data-go]', 'click', function () { go(this.getAttribute('data-go')); window.scrollTo(0, 0); });

  });
  var conn = el('cp_conn'); if (conn) conn.addEventListener('click', function () { keepMsg(); CP.connOpen = !CP.connOpen; repaint(); });
  var lk = el('cp_link'); if (lk) lk.addEventListener('click', function () { lk.disabled = true; evoLinkStart(); });

  });
  each('button[data-cpopen]', 'click', function () {
    srv('erpCampaignGet', [{ id: this.getAttribute('data-cpopen') }], function (c) { CP.camp = c; repaint(); window.scrollTo(0, 0); }, bad);
  });
  each('button[data-cpdup]', 'click', function () { cpDuplicate(this.getAttribute('data-cpdup')); });
  var dg = el('cp_draftgo'); if (dg) dg.addEventListener('click', function () { var d = cpDraftRead(); if (d) cpDraftOpen(d); repaint(); });
  var dd = el('cp_draftdel'); if (dd) dd.addEventListener('click', function () { cpDraftClear(); cpFresh(); repaint(); });

  // ---- one campaign, opened ----
  if (CP.camp) {

    var ex = el('cp_export'); if (ex) ex.addEventListener('click', function () { cpExport(CP.camp); });
    var pz = el('cp_pause');
    if (pz) pz.addEventListener('click', function () {
      pz.disabled = true;
      srv('erpCampaignPause', [{ id: CP.camp.id, pause: pz.getAttribute('data-pause') === '1' }], function (full) { CP.camp = full; repaint(); }, bad);
    });
    var rf = el('cp_refresh');
    if (rf) rf.addEventListener('click', function () { srv('erpCampaignGet', [{ id: CP.camp.id }], function (full) { CP.camp = full; repaint(); }, function () {}); });
    var rt = el('cp_retry');
    if (rt) rt.addEventListener('click', function () {
      rt.disabled = true;
      srv('erpCampaignRetry', [{ id: CP.camp.id }], function (full) { CP.camp = full; toast('Put back in the queue.'); repaint(); }, bad);
    });
    var rest = el('wa_rest');
    if (rest) rest.addEventListener('click', function () {
      if (!window.confirm('Send to everyone still waiting?')) return;

        WA.busy = false;

    each('button[data-cpmode]', 'click', function () { CP.openMode = this.getAttribute('data-cpmode'); try { localStorage.setItem('czwa_mode', CP.openMode); } catch (e) {} repaint(); });
    each('button[data-cpmark]', 'click', function () {

  // who
  each('button[data-cpwho]', 'click', function () { CP.f.who = this.getAttribute('data-cpwho'); repaint(); });
  var q = el('cp_q'); if (q) q.addEventListener('change', function () { CP.f.q = q.value; repaint(); });
  each('[data-cpf]', 'change', function () { CP.f[this.getAttribute('data-cpf')] = this.value; repaint(); });

  each('button[data-cppc]', 'click', function () { keepMsg(); var c = this.getAttribute('data-cppc'), i = CP.prod.cats.indexOf(c); if (i >= 0) CP.prod.cats.splice(i, 1); else CP.prod.cats.push(c); repaint(); });
  var stk = el('cp_stock'); if (stk) stk.addEventListener('change', function () { keepMsg(); CP.prod.stockOnly = stk.checked; repaint(); });

  var fi = el('cp_file');

  var go2 = el('cp_go');

          WA.busy = false; WA.prog = null; CP.camp = c; cpDraftClear(); cpFresh(); repaint(); window.scrollTo(0, 0);
        }, function (e) { WA.busy = false; WA.prog = null; bad(e); });

      return;
    }
    var spread = CP.when !== 'now';
    if (!window.confirm((CP.when === 'date' ? 'Schedule "' + name + '" for ' + CP.startOn + ', ' + list.length + ' people?' : spread ? 'Start sending "' + name + '" to ' + list.length + ' people, spread through the day?'
      : 'Send "' + name + '" to ' + list.length + ' people now, all at once?') + '\n\n' + EVO_WARN)) return;
    WA.busy = true; WA.sent = 0; WA.failed = 0; WA.prog = 'Preparing…'; repaint();
    cpResolveAttach('evo', function (res) {
      var text = cpWithLink(cpMessageFor({ name: '{name}' }, CP.msg, cpProducts().text), res);

        campRun('erpEvoSendBatch', c.id, function () {

          srv('erpCampaignGet', [{ id: c.id }], function (full) { CP.camp = full; WA.prog = null; repaint(); }, function () {});
        });
      }, function (e) { WA.busy = false; WA.prog = null; bad(e); });

      CP.lead1[k] = box.value;

  var l1 = el('cp_l1add');
  if (l1) l1.addEventListener('click', function () {
    var L = CP.lead1, digits = String(L.phone).replace(/\D/g, ''), code = String(L.code || '+880').replace(/\D/g, '') || '880';

      toast('A Bangladeshi number is 11 digits starting with 01. This one has ' + digits.length + '.', true, 9000); return;

    srv('erpLeadsAdd', [{ one: { name: L.name, phone: digits, code: code }, source: CP.leadSrc }], function (r) {
      CP.leadBusy = false; CP.leadRes = r; CP.lead1 = { name: '', code: L.code, phone: '' };

    if (!CP.leadText.trim()) { toast('Paste at least one number.', true); return; }
    CP.leadBusy = true; repaint();

      r.bulk = true;

      reloadAud(); repaint();
    }, function (e) { CP.leadBusy = false; bad(e); });

  each('button[data-cpleadedit]', 'click', function () { CP.editLead = this.getAttribute('data-cpleadedit'); repaint(); });
  var lc = el('cp_le_cancel'); if (lc) lc.addEventListener('click', function () { CP.editLead = null; repaint(); });

  if (lsv) lsv.addEventListener('click', function () {

    lsv.disabled = true;
    srv('erpLeadSave', [{ key: key, name: name, source: src }], function () {
      CP.aud.customers.forEach(function (c) { if (c.lead && c.key === key) { c.name = name; c.source = src; } }); CP.editLead = null; repaint();
    }, bad);
  });
  each('button[data-cpleadrm]', 'click', function () {

    }, bad);
  });
  each('button[data-cpgroupuse]', 'click', function () { cpFresh(); useGroup(this.getAttribute('data-cpgroupuse')); CP.tab = 'new'; CP.step = 1; cpDraftSave(); repaint(); window.scrollTo(0, 0); });
  each('button[data-cpgroupdel]', 'click', function () {

    srv('erpCampGroupSave', [{ id: this.getAttribute('data-cpgroupdel'), remove: true }], function (s) { CP.aud.saved = s; repaint(); }, bad);
  });
  each('button[data-cpstop]', 'click', function () {
    var key = this.getAttribute('data-cpstop'), n = this.getAttribute('data-cpn');
    if (!window.confirm((n || 'This person') + ' asked not to get messages?\n\nThey will never be in a campaign again unless you take them off this list.')) return;
    srv('erpCampaignOptOut', [{ key: key, name: n, phone: this.getAttribute('data-cpp') }], function () {

/* ---- Evolution API: the owner's own WhatsApp server ------------------------- */
var WA = { mode: 'hand', busy: false, prog: null, sent: 0, failed: 0 };   // how a campaign is being sent, and how far it has got
var EVO = { status: null, qr: null, qrTimer: null };
var EVO_WARN = 'If your Evolution server is connected by scanning a QR code (WhatsApp Web), this is not an official WhatsApp connection. ' +
  'WhatsApp can restrict or ban that number, especially for offers sent to many people. Use a second number, not the one you chat with customers on.';

function evoSettingsHtml() {
  if (!ME || ME.role !== 'owner') return '';
  var s = EVO.status || {};
  return '<section><div class="card"><h2>WhatsApp (Evolution API server)</h2>' +

/** Ask the server for a fresh QR code every few seconds until the phone has scanned it. */
function evoLinkStart() {
  clearTimeout(EVO.qrTimer);
  var here = VIEW;
  (function poll(n) {
    srv('erpEvoQr', [], function (r) {
      if (r.connected) {
        EVO.qr = null; clearTimeout(EVO.qrTimer);
        srv('erpEvoStatus', [], function (s) { EVO.status = s; toast('WhatsApp linked.'); if (VIEW === here) repaint(); }, function () {});
        return;
      }
      EVO.qr = r.qr; if (VIEW === here) repaint();
      if (n < 20 && VIEW === here) EVO.qrTimer = setTimeout(function () { poll(n + 1); }, 15000);
      else { EVO.qr = null; if (VIEW === here) repaint(); }
    }, function (e) { EVO.qr = null; toast(esc(e && e.message ? e.message : e), true, 12000); if (VIEW === here) repaint(); });
  })(0);
}
function wireEvoSettings() {
  if (!EVO.status && ME && ME.role === 'owner') {
    EVO.status = {};
    srv('erpEvoStatus', [], function (s) { EVO.status = s; if (VIEW === 'settings') repaint(); }, function () {});
  }
  var sv = el('evo_save');
  if (sv) sv.addEventListener('click', function () {
    sv.disabled = true; sv.textContent = 'Testing…';
    srv('erpEvoSetup', [{ url: el('evo_url').value, instance: el('evo_inst').value, key: el('evo_key').value }], function (s) {
      EVO.status = s; toast(s.connected ? 'WhatsApp connected.' : s.needsLink ? 'Saved. Now press Link a WhatsApp number and scan the QR code.' : esc(s.error || 'Saved, but not ready yet.'), !s.connected && !s.needsLink, 12000); repaint();
    }, function (e) { sv.disabled = false; sv.textContent = 'Save and test'; toast(esc(e && e.message ? e.message : e), true, 12000); });
  });
  var qb = el('evo_qr'); if (qb) qb.addEventListener('click', function () { qb.disabled = true; evoLinkStart(); });
  var lo = el('evo_logout');
  if (lo) lo.addEventListener('click', function () {
    if (!window.confirm('Log this WhatsApp number out of the server? Campaigns cannot be sent until it is linked again.')) return;
    srv('erpEvoLogout', [], function (s) { EVO.status = s; repaint(); }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
  var cl = el('evo_clear');
  if (cl) cl.addEventListener('click', function () {
    if (!window.confirm('Disconnect the Evolution server for this business?')) return;
    srv('erpEvoSetup', [{ clear: true }], function () { EVO.status = null; repaint(); }, function (e) { toast(esc(e && e.message ? e.message : e), true); });
  });
}

/** Send a started campaign a batch at a time until nobody is left or it must stop. */
function campRun(fn, id, done) {
  srv(fn, [{ id: id, max: 25 }], function (r) {
    WA.sent = (WA.sent || 0) + r.sent; WA.failed = (WA.failed || 0) + r.failed;
    WA.prog = 'Sent ' + fmt(WA.sent) + (WA.failed ? ' · failed ' + fmt(WA.failed) : '') + ' · ' + fmt(r.left) + ' left';
    if (r.errors.length) toast(esc(r.errors.join(' · ')), true, 15000);
    if (VIEW === 'campaigns') repaint();
    if (r.left > 0 && !r.stopped) campRun(fn, id, done); else done(r);
  }, function (e) { WA.busy = false; toast(esc(e && e.message ? e.message : e), true, 15000); done(null); });
}

/**
 * The waiting room: orders that still have to be entered with Steadfast.
 *
 * It sits above everything else on the Sales screen and holds nothing but
 * those. Booking one - or setting it aside - takes it out of here; the sale
 * itself stays in the list below, where it now shows as sent. When nothing
 * is waiting the room is not drawn at all, so an empty box never trains the
 * eye to skip it.

function salesWaitingHtml() {
  var list = (SALES && SALES.toSend) || [];
  if (!list.length) return '';
  var cur = OPT ? OPT.currency : 'BDT';
  var h = '<section><div class="card" style="border:2px solid var(--serious)">' +
    '<h2>Waiting for Steadfast <span class="pill low">' + fmt(list.length) + '</span></h2>' +

    'Oldest first. Once sent, an order leaves this box and stays in the list below.</div>' +
    '<div class="scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th>' +
    '<th>Address</th><th class="num">Rider collects</th><th></th></tr></thead><tbody>';
  list.forEach(function (o) {
    h += '<tr><td class="nm">' + esc(o.id) + '</td><td>' + esc(o.date) + '</td>' +
      '<td class="nm">' + esc(o.customer || '—') +

      '<td>' + (o.address ? esc(o.address) : '<span class="pill out">no address</span>') + '</td>' +

/** The parcel cell of a sale: what is to be done, or that it is done. */
function salesParcelHtml(o) {
  if (o.consignment) {
    return '<span class="pill ok">✓ Sent' + (o.fromSite ? ' by website' : '') + '</span>' + cidHtml(o.consignment);
  }
  if (o.handled) {
    return '<span class="pill">Set aside</span>' +
      (o.byHand ? ' <button class="btn small" type="button" data-putback="' + esc(o.id) + '">Put back</button>' : '');
  }
  if (o.fromSite) return '<span class="sku">website books it · no parcel number yet</span>';
  if (o.canSend) return '<span class="pill low">waiting to be sent ↑</span>';

    w.innerHTML = '<div class="card" style="max-width:520px;width:94%">' +
      '<h2 style="margin:0 0 2px">Cancel ' + esc(id) + '</h2>' +

          '. What happens to it?</label><div class="chips" style="margin:4px 0 0">' +
          '<button class="chip' + (money === 'advance' ? ' on' : '') + '" type="button" data-cxm="advance">Keep as advance</button>' +
          '<button class="chip' + (money === 'refund' ? ' on' : '') + '" type="button" data-cxm="refund"' +

          (canRefund ? '' : '<div class="sub" style="margin-top:4px">Only the owner or a shareholder can hand money back.</div>') +
          (money === 'refund' ? '<div style="margin-top:8px;max-width:240px"><label class="f" for="cx_method">Refunded by</label>' +
            '<select class="i" id="cx_method">' + ((OPT && OPT.paymentMethods) || ['Cash']).map(function (m) {

          '</div>'
        : '') +
      '<div class="row" style="margin-top:14px;gap:8px;justify-content:flex-end">' +
      '<button class="btn" type="button" id="cx_close">Keep the sale</button>' +
      '<button class="btn primary" type="button" id="cx_go" style="background:var(--critical);border-color:var(--critical)">Cancel the sale</button></div></div>';
    var reasonNow = '';
    var ms = w.querySelectorAll('button[data-cxm]');
    for (var i = 0; i < ms.length; i++) ms[i].addEventListener('click', function () {
      reasonNow = document.getElementById('cx_reason').value;
      var cond = document.getElementById('cx_cond').value;
      money = this.getAttribute('data-cxm'); draw();
      document.getElementById('cx_reason').value = reasonNow;

              (r.advance ? ' · ' + fmt(r.advance) + ' kept as advance' : '') +

      }, function (e) {

        toast(esc(e && e.message ? e.message : e), true, 15000);
      });
    });
  }
  document.body.appendChild(w);
  draw();
}

function loadSales() {
